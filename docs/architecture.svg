<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A component map of the ShopLedger browser UI, Express server, routers, library modules, configuration, and JSON storage, with a numbered order placement path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #536176; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: .3px; fill: #334155; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .panel-head { font-size: 15px; font-weight: 700; }
      .file-title { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; fill: #334155; }
      .muted { font-size: 12px; fill: #64748b; }
      .flow-title { font-size: 13px; font-weight: 700; }
      .step-no { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-arrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow-flow); }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f4f7fb"/>
  <text x="24" y="34" class="title">ShopLedger · Architecture</text>
  <text x="24" y="55" class="subtitle">Browser POS → Express routers → business modules → JSON file storage</text>
  <rect x="956" y="22" width="18" height="18" rx="4" fill="#fff0cf" stroke="#c87916" stroke-width="2"/>
  <text x="984" y="36" class="body" font-weight="700">Ticket focus</text>
  <text x="984" y="54" class="muted">lib/invoice.js</text>

  <text x="24" y="81" class="section">ORDER PLACEMENT · NUMBERED RUNTIME PATH</text>

  <g>
    <rect x="24" y="94" width="180" height="108" rx="10" fill="#eef5ff" stroke="#9bb9e8" stroke-width="1.4"/>
    <circle cx="43" cy="115" r="12" fill="#2563eb"/><text x="43" y="120" class="step-no">1</text>
    <text x="61" y="120" class="flow-title">Browser UI</text>
    <text x="36" y="145" class="body">getSelectedCartItems()</text>
    <text x="36" y="161" class="body">place handler</text>
    <text x="36" y="177" class="body">POST /api/orders</text>
  </g>
  <path d="M 205 148 L 214 148" class="flow-arrow"/>
  <g>
    <rect x="216" y="94" width="180" height="108" rx="10" fill="#eff8f7" stroke="#9bcac3" stroke-width="1.4"/>
    <circle cx="235" cy="115" r="12" fill="#0f766e"/><text x="235" y="120" class="step-no">2</text>
    <text x="253" y="120" class="flow-title">Resolve request</text>
    <text x="228" y="145" class="body">store.read()</text>
    <text x="228" y="161" class="body">inventory.find()</text>
    <text x="228" y="177" class="body">catalog lines + quantity</text>
  </g>
  <path d="M 397 148 L 406 148" class="flow-arrow"/>
  <g>
    <rect x="408" y="94" width="180" height="108" rx="10" fill="#f1f5f9" stroke="#b7c3d2" stroke-width="1.4"/>
    <circle cx="427" cy="115" r="12" fill="#475569"/><text x="427" y="120" class="step-no">3</text>
    <text x="445" y="120" class="flow-title">Check cart</text>
    <text x="420" y="145" class="body">inventory.check()</text>
    <text x="420" y="161" class="body">pricing.subtotal()</text>
    <text x="420" y="177" class="body">coupons.validate()</text>
  </g>
  <path d="M 589 148 L 598 148" class="flow-arrow"/>
  <g>
    <rect x="600" y="94" width="180" height="108" rx="10" fill="#f1f5f9" stroke="#b7c3d2" stroke-width="1.4"/>
    <circle cx="619" cy="115" r="12" fill="#475569"/><text x="619" y="120" class="step-no">4</text>
    <text x="637" y="120" class="flow-title">Calculate totals</text>
    <text x="612" y="145" class="body">pricing.computeTotals()</text>
    <text x="612" y="161" class="body">tax.getRateForItem()</text>
    <text x="612" y="177" class="body">discounted taxable lines</text>
  </g>
  <path d="M 781 148 L 790 148" class="flow-arrow"/>
  <g>
    <rect x="792" y="94" width="180" height="108" rx="10" fill="#f1f5f9" stroke="#b7c3d2" stroke-width="1.4"/>
    <circle cx="811" cy="115" r="12" fill="#475569"/><text x="811" y="120" class="step-no">5</text>
    <text x="829" y="120" class="flow-title">Commit order</text>
    <text x="804" y="145" class="body">ledger.chargeOrderToKhata()</text>
    <text x="804" y="161" class="body">(Khata only)</text>
    <text x="804" y="177" class="body">inventory.reserve()</text>
    <text x="804" y="193" class="body">orders.add()</text>
  </g>
  <path d="M 973 148 L 982 148" class="flow-arrow"/>
  <g>
    <rect x="984" y="94" width="180" height="108" rx="10" fill="#f1f5f9" stroke="#b7c3d2" stroke-width="1.4"/>
    <circle cx="1003" cy="115" r="12" fill="#475569"/><text x="1003" y="120" class="step-no">6</text>
    <text x="1021" y="120" class="flow-title">Persist &amp; respond</text>
    <text x="996" y="145" class="body">store.appendAudit()</text>
    <text x="996" y="161" class="body">store.write() → db.json</text>
    <text x="996" y="177" class="body">HTTP 201</text>
  </g>

  <rect x="20" y="220" width="180" height="546" rx="12" class="panel"/>
  <rect x="20" y="220" width="180" height="38" rx="12" fill="#e8f0ff"/>
  <path d="M 20 246 L 20 258 L 200 258 L 200 246" fill="#e8f0ff"/>
  <text x="34" y="245" class="panel-head">Browser · public/</text>
  <text x="34" y="286" class="file-title">Files</text>
  <text x="34" y="309" class="body">index.html</text>
  <text x="34" y="329" class="body">js/app.js</text>
  <text x="34" y="349" class="body">css/style.css</text>
  <line x1="34" y1="367" x2="186" y2="367" class="divider"/>
  <text x="34" y="391" class="file-title">Browser actions</text>
  <text x="34" y="414" class="body">GET /api/products</text>
  <text x="34" y="434" class="body">POST /api/pricing/preview</text>
  <text x="34" y="454" class="body">POST /api/orders</text>
  <text x="34" y="487" class="muted">The UI sends JSON and</text>
  <text x="34" y="504" class="muted">renders returned totals,</text>
  <text x="34" y="521" class="muted">orders, and customer views.</text>

  <rect x="220" y="220" width="170" height="546" rx="12" class="panel"/>
  <rect x="220" y="220" width="170" height="38" rx="12" fill="#e6f5f2"/>
  <path d="M 220 246 L 220 258 L 390 258 L 390 246" fill="#e6f5f2"/>
  <text x="234" y="245" class="panel-head">Server · server.js</text>
  <text x="234" y="286" class="file-title">Express app</text>
  <text x="234" y="309" class="body">bodyParser.json()</text>
  <text x="234" y="329" class="body">express.static(public/)</text>
  <text x="234" y="349" class="body">mounts 4 routers at /api</text>
  <line x1="234" y1="367" x2="376" y2="367" class="divider"/>
  <text x="234" y="391" class="file-title">Invoice route</text>
  <text x="234" y="414" class="body">GET /orders/:id/invoice</text>
  <text x="234" y="434" class="body">orders.get()</text>
  <text x="234" y="454" class="body">invoice.render()</text>
  <line x1="234" y1="473" x2="376" y2="473" class="divider"/>
  <text x="234" y="497" class="muted">The invoice page is</text>
  <text x="234" y="514" class="muted">served outside the /api</text>
  <text x="234" y="531" class="muted">router mount.</text>

  <rect x="410" y="220" width="220" height="546" rx="12" class="panel"/>
  <rect x="410" y="220" width="220" height="38" rx="12" fill="#edf2f8"/>
  <path d="M 410 246 L 410 258 L 630 258 L 630 246" fill="#edf2f8"/>
  <text x="424" y="245" class="panel-head">Routers · mounted at /api</text>

  <rect x="420" y="268" width="200" height="96" rx="8" fill="#ffffff" stroke="#d5dee9"/>
  <text x="430" y="288" class="file-title">products.js</text>
  <text x="430" y="307" class="body">GET /products</text>
  <text x="430" y="323" class="body">GET /coupons</text>
  <text x="430" y="339" class="body">uses store · inventory · tax</text>
  <text x="430" y="355" class="body">coupons</text>

  <rect x="420" y="373" width="200" height="126" rx="8" fill="#ffffff" stroke="#d5dee9"/>
  <text x="430" y="393" class="file-title">orders.js</text>
  <text x="430" y="412" class="body">GET/POST /orders</text>
  <text x="430" y="428" class="body">GET /orders/:id</text>
  <text x="430" y="444" class="body">POST /orders/:id/cancel</text>
  <text x="430" y="460" class="body">uses store · inventory · pricing</text>
  <text x="430" y="476" class="body">coupons · orders · ledger</text>

  <rect x="420" y="508" width="200" height="88" rx="8" fill="#ffffff" stroke="#d5dee9"/>
  <text x="430" y="528" class="file-title">customers.js</text>
  <text x="430" y="547" class="body">GET /customers</text>
  <text x="430" y="563" class="body">POST /customers/:id/settle</text>
  <text x="430" y="579" class="body">uses store · ledger</text>

  <rect x="420" y="605" width="200" height="153" rx="8" fill="#ffffff" stroke="#d5dee9"/>
  <text x="430" y="625" class="file-title">reports.js</text>
  <text x="430" y="644" class="body">GET /reports/dashboard</text>
  <text x="430" y="660" class="body">GET /reports/gst-reconciliation</text>
  <text x="430" y="676" class="body">POST /pricing/preview</text>
  <text x="430" y="692" class="body">GET /admin/export</text>
  <text x="430" y="713" class="body">uses store · reports</text>
  <text x="430" y="731" class="body">pricing · coupons · config</text>

  <rect x="650" y="220" width="350" height="546" rx="12" class="panel"/>
  <rect x="650" y="220" width="350" height="38" rx="12" fill="#edf2f8"/>
  <path d="M 650 246 L 650 258 L 1000 258 L 1000 246" fill="#edf2f8"/>
  <text x="664" y="245" class="panel-head">Business modules · lib/</text>

  <rect x="660" y="268" width="166" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="670" y="288" class="file-title">pricing.js</text>
  <text x="670" y="307" class="body">round2 · subtotal</text>
  <text x="670" y="323" class="body">discount · computeTotals</text>
  <text x="670" y="339" class="muted">uses tax · coupons</text>

  <rect x="834" y="268" width="156" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="844" y="288" class="file-title">tax.js</text>
  <text x="844" y="307" class="body">round2 · getRateForItem</text>
  <text x="844" y="323" class="body">getSlabPercent</text>
  <text x="844" y="339" class="body">splitCgstSgst · config</text>

  <rect x="660" y="364" width="166" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="670" y="384" class="file-title">coupons.js</text>
  <text x="670" y="401" class="body">normalizeCode</text>
  <text x="670" y="413" class="body">getCoupon</text>
  <text x="670" y="425" class="body">validate</text>
  <text x="670" y="437" class="body">calculateDiscount</text>
  <text x="670" y="449" class="body">listActive · config</text>

  <rect x="834" y="364" width="156" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="844" y="384" class="file-title">inventory.js</text>
  <text x="844" y="403" class="body">find · getSellableStock</text>
  <text x="844" y="419" class="body">check · reserve · release</text>
  <text x="844" y="435" class="body">summarize · config</text>

  <rect x="660" y="460" width="166" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="670" y="480" class="file-title">orders.js</text>
  <text x="670" y="499" class="body">add · get · cancel · list</text>
  <text x="670" y="515" class="body">uses dates · inventory</text>
  <text x="670" y="531" class="body">ledger</text>

  <rect x="834" y="460" width="156" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="844" y="480" class="file-title">ledger.js</text>
  <text x="844" y="496" class="body">findCustomer</text>
  <text x="844" y="508" class="body">listCustomers</text>
  <text x="844" y="520" class="body">chargeOrderToKhata</text>
  <text x="844" y="532" class="body">reverseOrderDebit</text>
  <text x="844" y="544" class="body">recordSettlement</text>

  <rect x="660" y="556" width="166" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="670" y="576" class="file-title">reports.js</text>
  <text x="670" y="595" class="body">getDashboardSummary</text>
  <text x="670" y="609" class="body">getGstReconciliation</text>
  <text x="670" y="623" class="muted">uses inventory · ledger</text>
  <text x="670" y="637" class="muted">uses invoice.js</text>

  <rect x="834" y="556" width="156" height="88" rx="8" fill="#fff0cf" stroke="#c87916" stroke-width="2.2"/>
  <text x="844" y="576" class="file-title">invoice.js</text>
  <text x="844" y="595" class="body">computeInvoiceFigures</text>
  <text x="844" y="611" class="body">render</text>
  <text x="844" y="627" class="muted">uses pricing · ticket focus</text>

  <rect x="660" y="652" width="166" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="670" y="672" class="file-title">dates.js</text>
  <text x="670" y="691" class="body">today</text>
  <text x="670" y="707" class="body">normalizeDateKey</text>
  <text x="670" y="723" class="body">getFiscalYear</text>

  <rect x="834" y="652" width="156" height="88" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="844" y="672" class="file-title">store.js</text>
  <text x="844" y="691" class="body">read · write</text>
  <text x="844" y="707" class="body">appendAudit</text>

  <rect x="1010" y="220" width="170" height="546" rx="12" class="panel"/>
  <rect x="1010" y="220" width="170" height="38" rx="12" fill="#f1edff"/>
  <path d="M 1010 246 L 1010 258 L 1180 258 L 1180 246" fill="#f1edff"/>
  <text x="1024" y="245" class="panel-head">Config &amp; data</text>

  <rect x="1020" y="268" width="150" height="174" rx="8" fill="#faf8ff" stroke="#d7c9f3"/>
  <text x="1030" y="290" class="file-title">config.js</text>
  <text x="1030" y="313" class="body">port · shop identity</text>
  <text x="1030" y="331" class="body">tax.defaultRate</text>
  <text x="1030" y="349" class="body">tax.hsnSlabs</text>
  <text x="1030" y="367" class="body">coupons · inventory</text>
  <text x="1030" y="385" class="body">adminKey</text>
  <text x="1030" y="413" class="muted">shared app config</text>

  <rect x="1020" y="468" width="150" height="156" rx="8" fill="#f8fafc" stroke="#d5dee9"/>
  <text x="1030" y="490" class="file-title">Invoice entry points</text>
  <text x="1030" y="512" class="body">GET /orders/:id/invoice</text>
  <text x="1030" y="532" class="body">orders.get()</text>
  <text x="1030" y="550" class="body">invoice.render()</text>
  <text x="1030" y="575" class="body">GST reconciliation</text>
  <text x="1030" y="593" class="body">reports.js → invoice.js</text>

  <rect x="1020" y="652" width="150" height="88" rx="8" fill="#eef8f2" stroke="#a6d2b5"/>
  <text x="1030" y="672" class="file-title">data/db.json</text>
  <text x="1030" y="691" class="body">products · customers</text>
  <text x="1030" y="707" class="body">orders · settlements</text>
  <text x="1030" y="723" class="body">auditLog</text>

  <path d="M 200 500 L 220 500" class="arrow"/>
  <path d="M 390 500 L 410 500" class="arrow"/>
  <path d="M 630 500 L 650 500" class="arrow"/>
  <path d="M 990 696 L 1020 696" class="arrow"/>
</svg>
