<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI connects to Express server, four API routers, ten library modules, configuration, and JSON storage. A six-step sequence shows order placement. Invoice and tax modules are highlighted for GST work.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17233a; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52637b; }
      .section { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 16px; font-weight: 700; }
      .cardText { font-size: 12.5px; fill: #475569; }
      .small { font-size: 12px; fill: #52637b; }
      .flowTitle { font-size: 13px; font-weight: 700; }
      .flowText { font-size: 12px; fill: #475569; }
      .number { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .normal { fill: #ffffff; stroke: #a8b8cc; stroke-width: 1.5; }
      .focus { fill: #fff3e3; stroke: #dc7b15; stroke-width: 2; }
      .zone { fill: #edf3fa; stroke: #cbd8e6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text class="title" x="36" y="43">ShopLedger architecture</text>
  <text class="subtitle" x="37" y="67">Node / Express POS · Khata credit ledger · GST invoicing</text>

  <rect x="913" y="26" width="251" height="45" rx="8" fill="#ffffff" stroke="#d1dbe8"/>
  <rect x="927" y="39" width="19" height="19" rx="4" class="focus"/>
  <text x="957" y="53" font-size="13">Ticket focus: invoice.js, tax.js</text>

  <!-- Entry points, configuration, and persistent data -->
  <rect class="normal" x="36" y="99" width="240" height="112" rx="10"/>
  <text class="cardTitle" x="53" y="129">Browser UI · public/</text>
  <text class="cardText" x="53" y="153">index.html · css/style.css</text>
  <text class="cardText" x="53" y="173">js/app.js: get(), post()</text>
  <text class="cardText" x="53" y="193">POS, orders, Khata, audit</text>

  <rect class="normal" x="335" y="99" width="240" height="112" rx="10"/>
  <text class="cardTitle" x="352" y="129">server.js</text>
  <text class="cardText" x="352" y="153">Express JSON + static UI</text>
  <text class="cardText" x="352" y="173">Mounts routers at /api</text>
  <text class="cardText" x="352" y="193">GET /orders/:id/invoice</text>

  <rect class="normal" x="634" y="99" width="240" height="112" rx="10"/>
  <text class="cardTitle" x="651" y="129">config.js</text>
  <text class="cardText" x="651" y="153">Shop identity · port · admin key</text>
  <text class="cardText" x="651" y="173">HSN GST slabs + default rate</text>
  <text class="cardText" x="651" y="193">Coupon rules</text>

  <rect class="normal" x="923" y="99" width="241" height="112" rx="10"/>
  <text class="cardTitle" x="940" y="129">data/db.json</text>
  <text class="cardText" x="940" y="153">Products · customers · orders</text>
  <text class="cardText" x="940" y="173">Settlements · auditLog · IDs</text>
  <text class="cardText" x="940" y="193">Read / written by lib/store.js</text>

  <path d="M276 155 H327" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="286" y="142">HTTP</text>
  <path d="M575 155 H626" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="582" y="142">reads</text>

  <!-- API routers -->
  <rect class="zone" x="36" y="233" width="1128" height="169" rx="11"/>
  <text class="section" x="53" y="261">routes/</text>
  <text class="small" x="143" y="260">All paths below are mounted under /api</text>
  <path d="M455 211 V227" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="normal" x="53" y="280" width="258" height="101" rx="8"/>
  <text class="cardTitle" x="69" y="305">products.js</text>
  <text class="cardText" x="69" y="329">GET /products</text>
  <text class="cardText" x="69" y="350">GET /coupons</text>

  <rect x="330" y="280" width="258" height="101" rx="8" fill="#e8f4f3" stroke="#61a9a0" stroke-width="1.8"/>
  <text class="cardTitle" x="346" y="305">orders.js</text>
  <text class="cardText" x="346" y="329">GET /orders, /orders/:id</text>
  <text class="cardText" x="346" y="350">POST /orders, /orders/:id/cancel</text>

  <rect class="normal" x="607" y="280" width="258" height="101" rx="8"/>
  <text class="cardTitle" x="623" y="305">customers.js</text>
  <text class="cardText" x="623" y="329">GET /customers</text>
  <text class="cardText" x="623" y="350">POST /customers/:id/settle</text>

  <rect class="normal" x="884" y="280" width="263" height="101" rx="8"/>
  <text class="cardTitle" x="900" y="305">reports.js</text>
  <text class="cardText" x="900" y="324">GET /reports/dashboard</text>
  <text class="cardText" x="900" y="340">GET /reports/gst-reconciliation</text>
  <text class="cardText" x="900" y="356">POST /pricing/preview</text>
  <text class="cardText" x="900" y="372">GET /admin/export</text>

  <!-- Library modules -->
  <rect class="zone" x="36" y="420" width="1128" height="220" rx="11"/>
  <text class="section" x="53" y="448">lib/</text>
  <text class="small" x="112" y="447">Checkout uses tax.js for HSN GST; invoice.js calculates invoice figures separately.</text>
  <path d="M459 402 V414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="normal" x="53" y="464" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="67" y="488">inventory.js</text>
  <text class="cardText" x="67" y="511">find · check · reserve · release</text>

  <rect class="normal" x="277" y="464" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="291" y="488">pricing.js</text>
  <text class="cardText" x="291" y="511">subtotal · computeTotals</text>

  <rect class="normal" x="501" y="464" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="515" y="488">coupons.js</text>
  <text class="cardText" x="515" y="511">normalizeCode · validate</text>

  <rect class="focus" x="725" y="464" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="739" y="488">tax.js</text>
  <text class="cardText" x="739" y="511">getRateForItem · splitCgstSgst</text>

  <rect class="normal" x="949" y="464" width="198" height="68" rx="8"/>
  <text class="cardTitle" x="963" y="488">ledger.js</text>
  <text class="cardText" x="963" y="509">chargeOrderToKhata</text>
  <text class="cardText" x="963" y="524">recordSettlement</text>

  <rect class="normal" x="53" y="547" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="67" y="571">orders.js</text>
  <text class="cardText" x="67" y="594">add · get · cancel · list</text>

  <rect class="normal" x="277" y="547" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="291" y="571">store.js</text>
  <text class="cardText" x="291" y="594">read · write · appendAudit</text>

  <rect class="normal" x="501" y="547" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="515" y="571">dates.js</text>
  <text class="cardText" x="515" y="594">today · normalizeDateKey</text>

  <rect class="focus" x="725" y="547" width="211" height="68" rx="8"/>
  <text class="cardTitle" x="739" y="571">invoice.js</text>
  <text class="cardText" x="739" y="594">computeInvoiceFigures · render</text>

  <rect class="normal" x="949" y="547" width="198" height="68" rx="8"/>
  <text class="cardTitle" x="963" y="571">reports.js</text>
  <text class="cardText" x="963" y="590">getDashboardSummary</text>
  <text class="cardText" x="963" y="606">getGstReconciliation</text>

  <!-- Numbered order placement flow -->
  <rect x="36" y="655" width="1128" height="127" rx="11" fill="#e5f3f1" stroke="#a9d4ce" stroke-width="1.5"/>
  <text class="section" x="53" y="682">Placing an order</text>
  <text class="small" x="222" y="681">The invoice GET is separate and happens after an order is saved.</text>

  <rect class="normal" x="52" y="696" width="173" height="70" rx="7"/>
  <circle cx="70" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="66" y="719">1</text>
  <text class="flowTitle" x="89" y="718">Browser posts</text>
  <text class="flowText" x="65" y="743">POST /api/orders</text>
  <text class="flowText" x="65" y="759">via public/js/app.js</text>

  <rect class="normal" x="238" y="696" width="173" height="70" rx="7"/>
  <circle cx="256" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="252" y="719">2</text>
  <text class="flowTitle" x="275" y="718">Router receives</text>
  <text class="flowText" x="251" y="743">server.js →</text>
  <text class="flowText" x="251" y="759">routes/orders.js</text>

  <rect class="normal" x="424" y="696" width="173" height="70" rx="7"/>
  <circle cx="442" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="438" y="719">3</text>
  <text class="flowTitle" x="461" y="718">Read + check</text>
  <text class="flowText" x="437" y="743">store.read</text>
  <text class="flowText" x="437" y="759">inventory.find / check</text>

  <rect class="normal" x="610" y="696" width="173" height="70" rx="7"/>
  <circle cx="628" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="624" y="719">4</text>
  <text class="flowTitle" x="647" y="718">Price + GST</text>
  <text class="flowText" x="623" y="743">pricing.computeTotals</text>
  <text class="flowText" x="623" y="759">coupons + tax slabs</text>

  <rect class="normal" x="796" y="696" width="173" height="70" rx="7"/>
  <circle cx="814" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="810" y="719">5</text>
  <text class="flowTitle" x="833" y="718">Khata if selected</text>
  <text class="flowText" x="809" y="743">chargeOrderToKhata</text>
  <text class="flowText" x="809" y="759">inventory.reserve</text>

  <rect class="normal" x="982" y="696" width="166" height="70" rx="7"/>
  <circle cx="1000" cy="714" r="12" fill="#0f766e"/>
  <text class="number" x="996" y="719">6</text>
  <text class="flowTitle" x="1019" y="718">Save order</text>
  <text class="flowText" x="995" y="743">orders.add · appendAudit</text>
  <text class="flowText" x="995" y="759">store.write → db.json</text>

  <path d="M225 731 H231" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M411 731 H417" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M597 731 H603" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M783 731 H789" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M969 731 H975" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flowArrow)"/>
</svg>
