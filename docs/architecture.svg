<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram showing the browser UI, Express server, routers, library modules, configuration, JSON data store, and a numbered checkout flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3b82f6"/></marker>
    <marker id="dataArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#0f172a}.sub{font:13px Arial,sans-serif;fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.box{fill:#fff;stroke:#64748b;stroke-width:1.3}.router{fill:#eff6ff;stroke:#2563eb;stroke-width:1.4}.focus{fill:#faf5ff;stroke:#9333ea;stroke-width:2}.config{fill:#fffbeb;stroke:#d97706;stroke-width:1.4}.data{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.7}.flow{fill:none;stroke:#3b82f6;stroke-width:2;marker-end:url(#arrow)}.dataflow{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#dataArrow)}.label{font:700 14px Arial,sans-serif;fill:#0f172a}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:12px Arial,sans-serif;fill:#475569}.step{fill:#dbeafe;stroke:#2563eb;stroke-width:1}.steptext{font:700 12px Arial,sans-serif;fill:#1d4ed8}.legend{font:12px Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="36" y="38" class="title">ShopLedger architecture and order placement</text>
  <text x="36" y="60" class="sub">Node / Express POS, Khata ledger, inventory and GST invoice app</text>

  <!-- Browser UI -->
  <rect x="36" y="100" width="178" height="150" rx="10" class="group"/>
  <text x="52" y="126" class="label">Browser UI</text>
  <rect x="52" y="143" width="146" height="82" rx="6" class="box"/>
  <text x="66" y="167" class="label">public/</text>
  <text x="66" y="187" class="small">index.html</text>
  <text x="66" y="205" class="small">js/app.js · css/style.css</text>
  <text x="52" y="241" class="tiny">POS, orders, Khata, audit views</text>

  <!-- Server -->
  <rect x="270" y="98" width="202" height="154" rx="10" class="group"/>
  <text x="287" y="124" class="label">Application entry</text>
  <rect x="287" y="141" width="168" height="86" rx="6" class="box"/>
  <text x="305" y="166" class="label">server.js</text>
  <text x="305" y="187" class="small">Express + body-parser</text>
  <text x="305" y="205" class="small">static public/</text>
  <text x="287" y="244" class="tiny">/api routers · /orders/:id/invoice</text>
  <path d="M214 181 H270" class="flow"/>
  <text x="221" y="170" class="steptext">HTTP</text>

  <!-- Routers -->
  <rect x="522" y="88" width="270" height="212" rx="10" class="group"/>
  <text x="539" y="114" class="label">routes/</text>
  <rect x="539" y="130" width="108" height="55" rx="6" class="router"/><text x="551" y="153" class="label">products.js</text><text x="551" y="171" class="small">/products, /coupons</text>
  <rect x="662" y="130" width="112" height="55" rx="6" class="router"/><text x="674" y="153" class="label">orders.js</text><text x="674" y="171" class="small">/orders</text>
  <rect x="539" y="201" width="108" height="55" rx="6" class="router"/><text x="550" y="224" class="label">customers.js</text><text x="550" y="242" class="small">/customers</text>
  <rect x="662" y="201" width="112" height="55" rx="6" class="router"/><text x="674" y="224" class="label">reports.js</text><text x="674" y="242" class="small">/reports, /pricing</text>
  <path d="M472 181 H522" class="flow"/>

  <!-- Config -->
  <rect x="858" y="100" width="150" height="104" rx="8" class="config"/>
  <text x="874" y="127" class="label">config.js</text>
  <text x="874" y="150" class="small">shop · GST slabs</text>
  <text x="874" y="168" class="small">coupons · inventory</text>
  <text x="874" y="186" class="small">port · adminKey</text>

  <!-- Lib modules -->
  <rect x="36" y="326" width="972" height="274" rx="10" class="group"/>
  <text x="52" y="352" class="label">lib/ — business and persistence modules</text>
  <rect x="52" y="371" width="139" height="57" rx="6" class="box"/><text x="65" y="394" class="label">store.js</text><text x="65" y="414" class="small">read · write · appendAudit</text>
  <rect x="204" y="371" width="139" height="57" rx="6" class="box"/><text x="217" y="394" class="label">inventory.js</text><text x="217" y="414" class="small">find · check · reserve</text>
  <rect x="356" y="371" width="139" height="57" rx="6" class="box"/><text x="369" y="394" class="label">ledger.js</text><text x="369" y="414" class="small">Khata · settlements</text>
  <rect x="508" y="371" width="139" height="57" rx="6" class="box"/><text x="521" y="394" class="label">orders.js</text><text x="521" y="414" class="small">add · get · cancel · list</text>
  <rect x="660" y="371" width="139" height="57" rx="6" class="box"/><text x="673" y="394" class="label">pricing.js</text><text x="673" y="414" class="small">subtotal · computeTotals</text>
  <rect x="812" y="371" width="179" height="57" rx="6" class="box"/><text x="825" y="394" class="label">coupons.js</text><text x="825" y="414" class="small">validate · calculateDiscount</text>
  <rect x="52" y="449" width="139" height="57" rx="6" class="focus"/><text x="65" y="472" class="label">tax.js</text><text x="65" y="492" class="small">getRateForItem · splitCgstSgst</text>
  <rect x="204" y="449" width="139" height="57" rx="6" class="focus"/><text x="217" y="472" class="label">invoice.js</text><text x="217" y="492" class="small">computeInvoiceFigures · render</text>
  <rect x="356" y="449" width="139" height="57" rx="6" class="box"/><text x="369" y="472" class="label">reports.js</text><text x="369" y="492" class="small">dashboard · reconciliation</text>
  <rect x="508" y="449" width="139" height="57" rx="6" class="box"/><text x="521" y="472" class="label">dates.js</text><text x="521" y="492" class="small">today · normalizeDateKey</text>
  <text x="52" y="538" class="tiny">orders.js route calls store, inventory, pricing, coupons, ledger and orders. reports.js route calls reports, pricing and coupons.</text>
  <text x="52" y="561" class="tiny">server.js invoice endpoint calls store, orders.get and invoice.render.</text>
  <path d="M717 185 V326" class="flow"/>

  <!-- Data -->
  <rect x="1038" y="340" width="140" height="176" rx="10" class="data"/>
  <text x="1051" y="369" class="label">data/db.json</text>
  <text x="1051" y="394" class="small">products</text><text x="1051" y="414" class="small">customers</text><text x="1051" y="434" class="small">orders</text><text x="1051" y="454" class="small">settlements</text><text x="1051" y="474" class="small">auditLog</text><text x="1051" y="496" class="tiny">next IDs</text>
  <path d="M1008 399 H1038" class="dataflow"/>
  <text x="1015" y="387" class="steptext">read/write</text>

  <!-- Config relationships -->
  <path d="M908 204 V350 H868" class="flow"/><text x="884" y="287" class="steptext">config</text>
  <path d="M934 204 V448 H343" class="flow"/>

  <!-- Numbered checkout sequence -->
  <rect x="36" y="628" width="1142" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="654" class="label">Numbered order placement flow — POST /api/orders</text>
  <circle cx="68" cy="686" r="13" class="step"/><text x="64" y="690" class="steptext">1</text><text x="88" y="690" class="small">public/js/app.js → routes/orders.js</text>
  <circle cx="320" cy="686" r="13" class="step"/><text x="316" y="690" class="steptext">2</text><text x="340" y="690" class="small">store.read → inventory.find/check</text>
  <circle cx="610" cy="686" r="13" class="step"/><text x="606" y="690" class="steptext">3</text><text x="630" y="690" class="small">pricing.subtotal → coupons.validate</text>
  <circle cx="68" cy="727" r="13" class="step"/><text x="64" y="731" class="steptext">4</text><text x="88" y="731" class="small">pricing.computeTotals → tax.getRateForItem</text>
  <circle cx="420" cy="727" r="13" class="step"/><text x="416" y="731" class="steptext">5</text><text x="440" y="731" class="small">ledger.chargeOrderToKhata (Khata only)</text>
  <circle cx="760" cy="727" r="13" class="step"/><text x="756" y="731" class="steptext">6</text><text x="780" y="731" class="small">inventory.reserve → orders.add</text>
  <circle cx="68" cy="754" r="13" class="step"/><text x="64" y="758" class="steptext">7</text><text x="88" y="758" class="small">store.appendAudit → store.write → data/db.json</text>

  <!-- Legend -->
  <rect x="1022" y="98" width="156" height="142" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="1036" y="122" class="label">Legend</text>
  <rect x="1036" y="136" width="14" height="14" class="router"/><text x="1058" y="148" class="legend">router</text>
  <rect x="1036" y="158" width="14" height="14" class="box"/><text x="1058" y="170" class="legend">module</text>
  <rect x="1036" y="180" width="14" height="14" class="focus"/><text x="1058" y="192" class="legend">ticket focus</text>
  <rect x="1036" y="202" width="14" height="14" class="data"/><text x="1058" y="214" class="legend">persistent data</text>
</svg>
