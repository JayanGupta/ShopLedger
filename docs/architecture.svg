<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Verified ShopLedger browser, Express server, routes, library modules, configuration, JSON database, and numbered order placement flow. The invoice module is highlighted for Ticket 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#475569}
      .panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.head{font-size:16px;font-weight:700}
      .body{font-size:12px}.small{font-size:12px;fill:#475569}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .ticket{fill:#fff2e8;stroke:#ea580c;stroke-width:2}.ticketText{fill:#9a3412}
      .flow{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.8;marker-end:url(#arrow)}
      .flowline{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#arrowBlue)}
      .dashed{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="38" class="title">ShopLedger — verified architecture</text>
  <text x="28" y="63" class="subtitle">Files and exported functions checked in the repository · Ticket 1 highlights lib/invoice.js and its shared GST helper</text>

  <!-- Main application components -->
  <rect x="24" y="88" width="184" height="342" rx="10" class="panel"/>
  <text x="40" y="116" class="head">Browser UI · public/</text>
  <rect x="38" y="132" width="156" height="52" rx="6" class="node"/>
  <text x="50" y="154" class="body">index.html</text><text x="50" y="172" class="small">app shell and views</text>
  <rect x="38" y="194" width="156" height="52" rx="6" class="node"/>
  <text x="50" y="216" class="body">css/style.css</text><text x="50" y="234" class="small">presentation</text>
  <rect x="38" y="256" width="156" height="75" rx="6" class="node"/>
  <text x="50" y="278" class="body">js/app.js</text><text x="50" y="296" class="small">XHR API calls · cart</text><text x="50" y="314" class="small">POST /api/orders</text>
  <text x="40" y="365" class="small">Displays orders, stock,</text><text x="40" y="383" class="small">Khata and GST reports.</text>

  <rect x="228" y="88" width="190" height="342" rx="10" class="panel"/>
  <text x="244" y="116" class="head">Express · server.js</text>
  <rect x="242" y="132" width="162" height="62" rx="6" class="node"/>
  <text x="254" y="154" class="body">Static public/</text><text x="254" y="174" class="small">express.static(...)</text>
  <rect x="242" y="204" width="162" height="78" rx="6" class="node"/>
  <text x="254" y="226" class="body">Mounts four routers</text><text x="254" y="246" class="small">under /api</text><text x="254" y="266" class="small">JSON request parsing</text>
  <rect x="242" y="292" width="162" height="76" rx="6" class="node"/>
  <text x="254" y="314" class="body">GET invoice page</text><text x="254" y="334" class="small">/orders/:id/invoice</text><text x="254" y="354" class="small">invoice.render(order)</text>
  <text x="244" y="401" class="small">Listens on config.port</text>

  <rect x="438" y="88" width="322" height="342" rx="10" class="panel"/>
  <text x="454" y="116" class="head">API routers · routes/</text>
  <rect x="452" y="132" width="294" height="62" rx="6" class="node"/>
  <text x="464" y="154" class="body">products.js</text><text x="464" y="176" class="small">GET /products · GET /coupons</text>
  <rect x="452" y="202" width="294" height="72" rx="6" class="node"/>
  <text x="464" y="224" class="body">orders.js</text><text x="464" y="244" class="small">POST /orders · list/get · cancel</text><text x="464" y="262" class="small">Uses pricing, inventory, ledger, orders, store</text>
  <rect x="452" y="282" width="294" height="62" rx="6" class="node"/>
  <text x="464" y="304" class="body">customers.js</text><text x="464" y="326" class="small">GET /customers · POST settlement</text>
  <rect x="452" y="352" width="294" height="62" rx="6" class="node"/>
  <text x="464" y="374" class="body">reports.js</text><text x="464" y="396" class="small">dashboard · GST reconciliation · pricing preview</text>

  <rect x="780" y="88" width="396" height="432" rx="10" class="panel"/>
  <text x="796" y="116" class="head">Business modules · lib/</text>
  <!-- Every file in lib/ is represented separately -->
  <rect x="794" y="132" width="176" height="64" rx="6" class="node"/>
  <text x="806" y="154" class="body">pricing.js</text><text x="806" y="176" class="small">computeTotals()</text>
  <rect x="982" y="132" width="180" height="64" rx="6" class="node"/>
  <text x="994" y="154" class="body">coupons.js</text><text x="994" y="176" class="small">validate() · calculateDiscount()</text>
  <rect x="794" y="204" width="176" height="64" rx="6" class="ticket"/>
  <text x="806" y="226" class="body ticketText" font-weight="700">tax.js · GST helper</text><text x="806" y="248" class="small ticketText">getRateForItem()</text>
  <rect x="982" y="204" width="180" height="64" rx="6" class="ticket"/>
  <text x="994" y="226" class="body ticketText" font-weight="700">invoice.js · TICKET 1</text><text x="994" y="248" class="small ticketText">computeInvoiceFigures() · render()</text>
  <rect x="794" y="276" width="176" height="64" rx="6" class="node"/>
  <text x="806" y="298" class="body">inventory.js</text><text x="806" y="320" class="small">check() · reserve() · release()</text>
  <rect x="982" y="276" width="180" height="64" rx="6" class="node"/>
  <text x="994" y="298" class="body">orders.js</text><text x="994" y="320" class="small">add() · get() · cancel() · list()</text>
  <rect x="794" y="348" width="176" height="64" rx="6" class="node"/>
  <text x="806" y="370" class="body">ledger.js</text><text x="806" y="392" class="small">chargeOrderToKhata()</text>
  <rect x="982" y="348" width="180" height="64" rx="6" class="node"/>
  <text x="994" y="370" class="body">reports.js</text><text x="994" y="392" class="small">getGstReconciliation()</text>
  <rect x="794" y="420" width="176" height="64" rx="6" class="node"/>
  <text x="806" y="442" class="body">dates.js</text><text x="806" y="464" class="small">today() · normalizeDateKey()</text>
  <rect x="982" y="420" width="180" height="64" rx="6" class="node"/>
  <text x="994" y="442" class="body">store.js</text><text x="994" y="464" class="small">read() · appendAudit() · write()</text>

  <!-- Connections between main components -->
  <path d="M208 258 H226" class="line"/>
  <path d="M418 245 H436" class="line"/>
  <path d="M760 246 H778" class="line"/>
  <text x="208" y="238" class="small">HTTP</text>
  <text x="418" y="226" class="small">dispatch</text>
  <text x="760" y="226" class="small">calls</text>

  <!-- Configuration and persistent data -->
  <rect x="24" y="448" width="356" height="92" rx="9" class="panel"/>
  <text x="42" y="476" class="head">config.js</text>
  <text x="42" y="499" class="small">Port · shop details · HSN GST slabs · coupons</text>
  <text x="42" y="520" class="small">Used by server, tax, coupons, inventory, invoice</text>
  <rect x="398" y="448" width="362" height="92" rx="9" class="panel"/>
  <text x="416" y="476" class="head">data/db.json</text>
  <text x="416" y="499" class="small">Products · orders · customers · settlements · audit log</text>
  <text x="416" y="520" class="small">lib/store.js reads/writes this tracked JSON file</text>
  <path d="M360 448 V436 H326 V430" class="line dashed"/>
  <path d="M720 448 V436 H1072 V486" class="line dashed"/>
  <text x="800" y="536" class="small">Configuration feeds business rules; store persists DB</text>

  <!-- Numbered order flow -->
  <text x="24" y="580" class="head">Numbered flow · placing an order</text>
  <rect x="24" y="596" width="176" height="166" rx="9" class="flow"/>
  <circle cx="46" cy="620" r="13" fill="#2563eb"/><text x="42" y="625" font-size="12" fill="#fff" font-weight="700">1</text>
  <text x="66" y="624" class="body" font-weight="700">UI sends cart</text>
  <text x="40" y="654" class="small">public/js/app.js</text><text x="40" y="676" class="small">POST /api/orders</text>
  <text x="40" y="710" class="small">items · coupon · payment</text>

  <rect x="220" y="596" width="176" height="166" rx="9" class="flow"/>
  <circle cx="242" cy="620" r="13" fill="#2563eb"/><text x="238" y="625" font-size="12" fill="#fff" font-weight="700">2</text>
  <text x="262" y="624" class="body" font-weight="700">Route loads DB</text>
  <text x="236" y="654" class="small">routes/orders.js</text><text x="236" y="676" class="small">store.read()</text>
  <text x="236" y="710" class="small">resolve products</text>

  <rect x="416" y="596" width="176" height="166" rx="9" class="flow"/>
  <circle cx="438" cy="620" r="13" fill="#2563eb"/><text x="434" y="625" font-size="12" fill="#fff" font-weight="700">3</text>
  <text x="458" y="624" class="body" font-weight="700">Check &amp; price</text>
  <text x="432" y="654" class="small">inventory.check()</text><text x="432" y="676" class="small">coupons.validate()</text>
  <text x="432" y="710" class="small">pricing.computeTotals()</text>

  <rect x="612" y="596" width="176" height="166" rx="9" class="flow"/>
  <circle cx="634" cy="620" r="13" fill="#2563eb"/><text x="630" y="625" font-size="12" fill="#fff" font-weight="700">4</text>
  <text x="654" y="624" class="body" font-weight="700">Apply business rules</text>
  <text x="628" y="654" class="small">ledger.chargeOrderToKhata()</text><text x="628" y="676" class="small">inventory.reserve()</text>
  <text x="628" y="710" class="small">orders.add()</text>

  <rect x="808" y="596" width="176" height="166" rx="9" class="flow"/>
  <circle cx="830" cy="620" r="13" fill="#2563eb"/><text x="826" y="625" font-size="12" fill="#fff" font-weight="700">5</text>
  <text x="850" y="624" class="body" font-weight="700">Save changes</text>
  <text x="824" y="654" class="small">store.appendAudit()</text><text x="824" y="676" class="small">store.write(db)</text>
  <text x="824" y="710" class="small">updates data/db.json</text>

  <rect x="1004" y="596" width="172" height="166" rx="9" class="flow"/>
  <circle cx="1026" cy="620" r="13" fill="#2563eb"/><text x="1022" y="625" font-size="12" fill="#fff" font-weight="700">6</text>
  <text x="1046" y="624" class="body" font-weight="700">Return result</text>
  <text x="1020" y="654" class="small">201 + order JSON</text><text x="1020" y="676" class="small">UI refreshes stock</text>
  <text x="1020" y="710" class="small">invoice link available</text>

  <path d="M200 679 H217" class="flowline"/><path d="M396 679 H413" class="flowline"/>
  <path d="M592 679 H609" class="flowline"/><path d="M788 679 H805" class="flowline"/>
  <path d="M984 679 H1001" class="flowline"/>

  <!-- Legend -->
  <rect x="936" y="42" width="16" height="16" rx="3" class="ticket"/>
  <text x="960" y="55" class="small">Ticket 1 module / helper</text>
  <line x1="1085" y1="50" x2="1114" y2="50" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="55" class="small">calls / flow</text>
</svg>
