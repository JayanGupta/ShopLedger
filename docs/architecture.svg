<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order flow</title>
  <desc id="desc">Architecture map of ShopLedger files and numbered order placement steps. The invoice module is highlighted as the ticket focus.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182638}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526579}
      .head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px}
      .box{fill:#f5f8fb;stroke:#8495a8;stroke-width:1.4;rx:9}
      .focus{fill:#fff0d9;stroke:#d97706;stroke-width:2.4;rx:9}
      .flow{fill:none;stroke:#526579;stroke-width:1.8;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#8998a8;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
      .num{fill:#176b87;stroke:#fff;stroke-width:1.5}.numtext{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
      .muted{fill:#526579}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="38" class="title">ShopLedger · application architecture</text>
  <text x="28" y="61" class="sub">Node / Express POS · Khata ledger · GST invoicing · numbered path shows POST /api/orders</text>

  <!-- main request and order pipeline -->
  <rect x="28" y="88" width="180" height="100" class="box"/>
  <text x="44" y="113" class="head">Browser UI</text>
  <text x="44" y="136" class="body">public/index.html</text>
  <text x="44" y="155" class="body">public/js/app.js</text>
  <text x="44" y="174" class="body">public/css/style.css</text>

  <rect x="260" y="88" width="205" height="100" class="box"/>
  <text x="276" y="113" class="head">server.js</text>
  <text x="276" y="136" class="body">Express setup + JSON parser</text>
  <text x="276" y="155" class="body">mounts routers at /api</text>
  <text x="276" y="174" class="body">invoice endpoint</text>

  <rect x="520" y="88" width="240" height="100" class="box"/>
  <text x="536" y="113" class="head">routes/orders.js</text>
  <text x="536" y="136" class="body">router.post('/orders')</text>
  <text x="536" y="155" class="body">router.get('/orders')</text>
  <text x="536" y="174" class="body">router.post('/orders/:id/cancel')</text>

  <rect x="820" y="88" width="330" height="100" class="box"/>
  <text x="838" y="113" class="head">data/db.json</text>
  <text x="838" y="136" class="body">products · orders · customers</text>
  <text x="838" y="155" class="body">settlements · auditLog · ID counters</text>
  <text x="838" y="174" class="body">read/write via lib/store.js</text>

  <path d="M208 137 H258" class="flow"/><circle cx="232" cy="124" r="12" class="num"/><text x="232" y="129" class="numtext">1</text>
  <path d="M465 137 H518" class="flow"/><circle cx="490" cy="124" r="12" class="num"/><text x="490" y="129" class="numtext">2</text>
  <path d="M760 137 H818" class="flow"/><circle cx="789" cy="124" r="12" class="num"/><text x="789" y="129" class="numtext">8</text>

  <!-- order flow details -->
  <text x="28" y="229" class="head">Order placement · numbered call sequence</text>
  <rect x="28" y="246" width="200" height="105" class="box"/>
  <circle cx="48" cy="266" r="12" class="num"/><text x="48" y="271" class="numtext">3</text>
  <text x="68" y="271" class="head">Load + resolve items</text>
  <text x="44" y="296" class="body">store.read()</text>
  <text x="44" y="316" class="body">inventory.find() · product prices</text>
  <text x="44" y="336" class="body">inventory.check()</text>

  <rect x="252" y="246" width="215" height="105" class="box"/>
  <circle cx="272" cy="266" r="12" class="num"/><text x="272" y="271" class="numtext">4</text>
  <text x="292" y="271" class="head">Validate coupon</text>
  <text x="268" y="296" class="body">coupons.normalizeCode()</text>
  <text x="268" y="316" class="body">coupons.validate(subtotal)</text>
  <text x="268" y="336" class="body">config.js coupon rules</text>

  <rect x="491" y="246" width="250" height="105" class="box"/>
  <circle cx="511" cy="266" r="12" class="num"/><text x="511" y="271" class="numtext">5</text>
  <text x="531" y="271" class="head">Compute checkout totals</text>
  <text x="507" y="296" class="body">pricing.subtotal() / computeTotals()</text>
  <text x="507" y="316" class="body">tax.getRateForItem() · HSN slab</text>
  <text x="507" y="336" class="body">discount apportion · GST · total</text>

  <rect x="765" y="246" width="190" height="105" class="box"/>
  <circle cx="785" cy="266" r="12" class="num"/><text x="785" y="271" class="numtext">6</text>
  <text x="805" y="271" class="head">Apply Khata</text>
  <text x="781" y="296" class="body">if paymentMode=khata:</text>
  <text x="781" y="316" class="body">ledger.chargeOrderToKhata()</text>
  <text x="781" y="336" class="body">checks limit + adds billed total</text>

  <rect x="979" y="246" width="171" height="105" class="box"/>
  <circle cx="999" cy="266" r="12" class="num"/><text x="999" y="271" class="numtext">7</text>
  <text x="1019" y="271" class="head">Commit order</text>
  <text x="995" y="296" class="body">inventory.reserve()</text>
  <text x="995" y="316" class="body">orders.add()</text>
  <text x="995" y="336" class="body">appendAudit()</text>

  <path d="M228 299 H250" class="flow"/><path d="M467 299 H489" class="flow"/><path d="M741 299 H763" class="flow"/><path d="M955 299 H977" class="flow"/>
  <text x="979" y="371" class="small muted">Then store.write(db) → data/db.json · response 201 order JSON</text>

  <!-- file map -->
  <text x="28" y="410" class="head">Application files and responsibilities</text>
  <rect x="28" y="427" width="236" height="142" class="box"/>
  <text x="44" y="451" class="head">Other routers · routes/</text>
  <text x="44" y="475" class="body">products.js — products, coupons</text>
  <text x="44" y="497" class="body">customers.js — Khata, settlements</text>
  <text x="44" y="519" class="body">reports.js — dashboard, GST audit,</text>
  <text x="44" y="539" class="body">pricing preview, admin export</text>

  <rect x="282" y="427" width="412" height="142" class="box"/>
  <text x="298" y="451" class="head">lib/ · shared modules</text>
  <text x="298" y="475" class="body">pricing.js · coupons.js · tax.js · inventory.js · orders.js</text>
  <text x="298" y="497" class="body">ledger.js · store.js · dates.js · reports.js</text>
  <text x="298" y="519" class="body">invoice.js — computeInvoiceFigures(), render()</text>
  <text x="298" y="543" class="small muted">Order route uses the first group plus ledger, store, orders.</text>

  <rect x="712" y="427" width="240" height="142" class="focus"/>
  <text x="730" y="451" class="head">Ticket focus · lib/invoice.js</text>
  <text x="730" y="476" class="body">computeInvoiceFigures(order)</text>
  <text x="730" y="498" class="body">render(order) builds printable HTML</text>
  <text x="730" y="520" class="body">Called by server.js invoice route</text>
  <text x="730" y="542" class="small">Recalculates rather than reusing saved totals</text>

  <rect x="970" y="427" width="180" height="142" class="box"/>
  <text x="986" y="451" class="head">config.js</text>
  <text x="986" y="476" class="body">shop + GST details</text>
  <text x="986" y="498" class="body">HSN slabs + default</text>
  <text x="986" y="520" class="body">coupon definitions</text>

  <!-- reporting / invoice side path -->
  <rect x="28" y="601" width="320" height="112" class="box"/>
  <text x="46" y="627" class="head">GST reconciliation path</text>
  <text x="46" y="651" class="body">routes/reports.js → reports.getGstReconciliation()</text>
  <text x="46" y="673" class="body">lib/reports.js compares saved order totals with</text>
  <text x="46" y="695" class="body">invoice.computeInvoiceFigures() for each order</text>

  <rect x="381" y="601" width="352" height="112" class="box"/>
  <text x="399" y="627" class="head">Printable invoice path</text>
  <text x="399" y="651" class="body">GET /orders/:id/invoice in server.js</text>
  <text x="399" y="673" class="body">store.read() → orders.get() → invoice.render()</text>
  <text x="399" y="695" class="body">invoice figures use item gstRate or default GST</text>

  <path d="M674 188 V204 H1159 V601" class="soft"/>
  <text x="815" y="207" class="small muted">GET invoice uses server.js route; GET report invokes comparison</text>

  <rect x="765" y="601" width="385" height="112" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="8"/>
  <text x="783" y="627" class="head">Legend</text>
  <line x1="785" y1="652" x2="840" y2="652" class="flow"/><text x="852" y="657" class="body">request / data flow</text>
  <line x1="785" y1="678" x2="840" y2="678" class="soft"/><text x="852" y="683" class="body">report / invoice path</text>
  <rect x="1002" y="644" width="22" height="19" class="focus"/><text x="1033" y="659" class="body">ticket module</text>

  <text x="28" y="764" class="small muted">Numbered order sequence: 1 browser → 2 server/router → 3 resolve + stock → 4 coupon → 5 pricing/GST → 6 Khata → 7 commit → 8 persist.</text>
</svg>
