<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser calls Express, which mounts four API routers and handles printable invoices. Ten library modules provide application logic. Configuration and the JSON database sit alongside them. Six numbered steps show how the order route saves a sale. The invoice module is highlighted.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b39; }
    .title { font-size: 35px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #435b6c; }
    .section { font-size: 13px; font-weight: 700; letter-spacing: 1.25px; fill: #385367; }
    .label { font-size: 15px; font-weight: 700; }
    .detail { font-size: 13px; fill: #435b6c; }
    .small { font-size: 12px; fill: #435b6c; }
    .panel { fill: #eff4f7; stroke: #d8e2e9; }
    .card { fill: #ffffff; stroke: #c3d1db; }
    .order { fill: #e2f4f0; stroke: #429582; }
    .ticket { fill: #f0e7ff; stroke: #8858bb; }
    .ticket-text { fill: #552e80; }
    .arrow { fill: none; stroke: #547083; stroke-width: 1.5; marker-end: url(#arrow); }
    .two-way { marker-start: url(#arrow); }
    .step-number { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#547083"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#fafcfd"/>
  <text class="title" x="32" y="51">ShopLedger architecture</text>
  <text class="subtitle" x="33" y="78">Point of sale, Khata credit ledger and printable GST invoices</text>
  <g aria-label="Legend">
    <rect class="ticket" x="862" y="32" width="17" height="17" rx="4"/>
    <text class="detail ticket-text" x="887" y="45">Invoice ticket</text>
    <rect class="order" x="994" y="32" width="17" height="17" rx="4"/>
    <text class="detail" x="1019" y="45">Order placement</text>
  </g>

  <rect class="panel" x="32" y="108" width="248" height="441" rx="15"/>
  <rect class="panel" x="306" y="108" width="562" height="441" rx="15"/>
  <rect class="panel" x="894" y="108" width="274" height="441" rx="15"/>
  <text class="section" x="48" y="134">BROWSER &amp; HTTP</text>
  <text class="section" x="322" y="134">APPLICATION MODULES · lib/</text>
  <text class="section" x="910" y="134">CONFIGURATION &amp; STORAGE</text>

  <path class="arrow two-way" d="M156 208V223"/>
  <path class="arrow" d="M156 285V300"/>
  <path class="arrow" d="M264 326H306"/>
  <path class="arrow two-way" d="M852 179H909"/>
  <path class="arrow" d="M852 251H909"/>
  <path class="arrow" d="M910 465H853"/>
  <path class="arrow" d="M579 251H594"/>
  <path class="arrow" d="M451 283V291"/>
  <path class="arrow" d="M579 395H594"/>
  <path class="arrow" d="M579 467H594"/>

  <g aria-label="Browser and Express">
    <rect class="card" x="48" y="148" width="216" height="60" rx="8"/>
    <text class="label" x="61" y="172">Browser UI · public/</text>
    <text class="detail" x="61" y="192">Cart, orders, Khata and reports</text>

    <rect class="card" x="48" y="224" width="216" height="61" rx="8"/>
    <text class="label" x="61" y="249">server.js</text>
    <text class="detail" x="61" y="269">Static UI, /api and invoice route</text>

    <rect class="order" x="48" y="304" width="216" height="46" rx="7"/>
    <text class="label" x="61" y="323">routes/orders.js</text>
    <text class="small" x="61" y="340">Place, list, view and cancel orders</text>

    <rect class="card" x="48" y="357" width="216" height="46" rx="7"/>
    <text class="label" x="61" y="376">routes/products.js</text>
    <text class="small" x="61" y="393">Catalog and active coupons</text>

    <rect class="card" x="48" y="410" width="216" height="46" rx="7"/>
    <text class="label" x="61" y="429">routes/customers.js</text>
    <text class="small" x="61" y="446">Customer accounts and settlements</text>

    <rect class="card" x="48" y="463" width="216" height="46" rx="7"/>
    <text class="label" x="61" y="482">routes/reports.js</text>
    <text class="small" x="61" y="499">Reports, pricing preview and export</text>
  </g>

  <g aria-label="Library modules">
    <rect class="card" x="322" y="148" width="257" height="63" rx="8"/>
    <text class="label" x="335" y="171">lib/inventory.js</text>
    <text class="detail" x="335" y="192">Product lookup and stock updates</text>

    <rect class="card" x="595" y="148" width="257" height="63" rx="8"/>
    <text class="label" x="608" y="171">lib/store.js</text>
    <text class="detail" x="608" y="192">JSON reads, writes and audit entries</text>

    <rect class="card" x="322" y="220" width="257" height="63" rx="8"/>
    <text class="label" x="335" y="243">lib/pricing.js</text>
    <text class="detail" x="335" y="264">Checkout totals and line discounts</text>

    <rect class="card" x="595" y="220" width="257" height="63" rx="8"/>
    <text class="label" x="608" y="243">lib/tax.js</text>
    <text class="detail" x="608" y="264">HSN rates and CGST/SGST split</text>

    <rect class="card" x="322" y="292" width="257" height="63" rx="8"/>
    <text class="label" x="335" y="315">lib/coupons.js</text>
    <text class="detail" x="335" y="336">Coupon eligibility and amounts</text>

    <rect class="card" x="595" y="292" width="257" height="63" rx="8"/>
    <text class="label" x="608" y="315">lib/ledger.js</text>
    <text class="detail" x="608" y="336">Khata charges and settlements</text>

    <rect class="card" x="322" y="364" width="257" height="63" rx="8"/>
    <text class="label" x="335" y="387">lib/orders.js</text>
    <text class="detail" x="335" y="408">Order records and cancellation</text>

    <rect class="card" x="595" y="364" width="257" height="63" rx="8"/>
    <text class="label" x="608" y="387">lib/dates.js</text>
    <text class="detail" x="608" y="408">Dates and date-filter formatting</text>

    <rect class="card" x="322" y="436" width="257" height="63" rx="8"/>
    <text class="label" x="335" y="459">lib/reports.js</text>
    <text class="detail" x="335" y="480">Dashboard and GST reconciliation</text>

    <rect class="ticket" x="595" y="436" width="257" height="63" rx="8"/>
    <text class="label ticket-text" x="608" y="459">lib/invoice.js</text>
    <text class="detail ticket-text" x="608" y="480">Recalculates figures and renders HTML</text>
  </g>

  <g aria-label="Database, configuration and invoice route">
    <rect class="card" x="910" y="148" width="242" height="76" rx="8"/>
    <text class="label" x="924" y="172">data/db.json</text>
    <text class="detail" x="924" y="193">Orders, stock, customers, settlements</text>
    <text class="detail" x="924" y="211">Audit log and ID counters</text>

    <rect class="card" x="910" y="240" width="242" height="94" rx="8"/>
    <text class="label" x="924" y="264">config.js</text>
    <text class="detail" x="924" y="285">Shop details, GST slabs and fallback</text>
    <text class="detail" x="924" y="303">Coupon rules and inventory defaults</text>
    <text class="detail" x="924" y="321">Server port and admin export key</text>

    <rect class="card" x="910" y="387" width="242" height="112" rx="8"/>
    <text class="label" x="924" y="411">Printable invoice · server.js</text>
    <text class="detail" x="924" y="432">GET /orders/:id/invoice</text>
    <text class="detail" x="924" y="453">store.read() → orders.get()</text>
    <text class="detail" x="924" y="474">invoice.render() → HTML to browser</text>
  </g>

  <rect class="panel" x="32" y="572" width="1136" height="196" rx="15"/>
  <text class="section" x="48" y="600">PLACING AN ORDER · SUCCESS PATH</text>
  <path class="arrow" d="M221 669H233"/>
  <path class="arrow" d="M407 669H419"/>
  <path class="arrow" d="M593 669H605"/>
  <path class="arrow" d="M779 669H791"/>
  <path class="arrow" d="M965 669H977"/>

  <g aria-label="1. Submit">
    <rect class="order" x="48" y="616" width="173" height="111" rx="8"/>
    <circle cx="65" cy="638" r="10" fill="#22705e"/><text class="step-number" x="65" y="643">1</text>
    <text class="label" x="81" y="643">Submit</text>
    <text class="detail" x="60" y="669">Browser sends</text>
    <text class="detail" x="60" y="688">POST /api/orders.</text>
  </g>
  <g aria-label="2. Load and check">
    <rect class="card" x="234" y="616" width="173" height="111" rx="8"/>
    <circle cx="251" cy="638" r="10" fill="#22705e"/><text class="step-number" x="251" y="643">2</text>
    <text class="label" x="267" y="643">Load &amp; check</text>
    <text class="detail" x="246" y="669">store.read()</text>
    <text class="detail" x="246" y="688">inventory.find()</text>
    <text class="detail" x="246" y="707">inventory.check()</text>
  </g>
  <g aria-label="3. Price the sale">
    <rect class="card" x="420" y="616" width="173" height="111" rx="8"/>
    <circle cx="437" cy="638" r="10" fill="#22705e"/><text class="step-number" x="437" y="643">3</text>
    <text class="label" x="453" y="643">Price the sale</text>
    <text class="detail" x="432" y="669">coupons.validate()</text>
    <text class="detail" x="432" y="688">pricing.computeTotals()</text>
    <text class="detail" x="432" y="707">Discount, then HSN GST</text>
  </g>
  <g aria-label="4. Charge Khata if selected">
    <rect class="card" x="606" y="616" width="173" height="111" rx="8"/>
    <circle cx="623" cy="638" r="10" fill="#22705e"/><text class="step-number" x="623" y="643">4</text>
    <text class="label" x="639" y="643">Charge Khata</text>
    <text class="detail" x="618" y="669">If Khata is selected</text>
    <text class="small" x="612" y="688">ledger.chargeOrderToKhata()</text>
    <text class="detail" x="618" y="707">Checks credit limit</text>
  </g>
  <g aria-label="5. Record the sale">
    <rect class="card" x="792" y="616" width="173" height="111" rx="8"/>
    <circle cx="809" cy="638" r="10" fill="#22705e"/><text class="step-number" x="809" y="643">5</text>
    <text class="label" x="825" y="643">Record the sale</text>
    <text class="detail" x="804" y="669">inventory.reserve()</text>
    <text class="detail" x="804" y="688">orders.add()</text>
    <text class="detail" x="804" y="707">store.appendAudit()</text>
  </g>
  <g aria-label="6. Save and reply">
    <rect class="card" x="978" y="616" width="173" height="111" rx="8"/>
    <circle cx="995" cy="638" r="10" fill="#22705e"/><text class="step-number" x="995" y="643">6</text>
    <text class="label" x="1011" y="643">Save &amp; reply</text>
    <text class="detail" x="990" y="669">store.write() → db.json</text>
    <text class="detail" x="990" y="688">HTTP 201 with order</text>
  </g>
  <text class="detail" x="48" y="750">One write saves the order lines and totals, stock, audit entry, next order ID and any Khata balance change.</text>
</svg>
