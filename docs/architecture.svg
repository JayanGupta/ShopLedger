<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">The browser, Express server, routers, application modules, configuration, and JSON database appear on the left. Seven numbered steps on the right trace a successful order. Purple identifies the printable invoice module, which runs on a separate request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font: 14px system-ui, sans-serif; fill: #1e293b; }
      .heading { font-size: 36px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 13px; font-weight: 750; letter-spacing: 1.4px; fill: #334155; }
      .file { font: 700 15px ui-monospace, monospace; }
      .detail { font-size: 13px; fill: #475569; }
      .code { font: 13px ui-monospace, monospace; fill: #334155; }
      .box { fill: #fff; stroke: #cbd5e1; }
      .flow { fill: #e8f3ff; stroke: #9bc2eb; }
      .ticket { fill: #f3eaff; stroke: #b596da; }
      .ticket-text { fill: #5b308a; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .step { font-size: 15px; font-weight: 750; }
      .number { font-size: 13px; font-weight: 750; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f4f7fb"/>
  <text x="40" y="56" class="heading">ShopLedger architecture</text>
  <text x="42" y="84" class="subtitle">Point of sale · Inventory · Khata credit · GST invoices</text>
  <rect x="838" y="38" width="16" height="16" rx="4" class="flow"/>
  <text x="862" y="51" class="detail">Order placement</text>
  <rect x="994" y="38" width="16" height="16" rx="4" class="ticket"/>
  <text x="1018" y="51" class="detail">Ticket module</text>
  <path d="M40 106 H1160" stroke="#cbd5e1"/>

  <text x="40" y="132" class="section">APPLICATION COMPONENTS</text>

  <rect x="40" y="146" width="688" height="54" rx="9" class="box"/>
  <text x="56" y="168" class="file">public/</text>
  <text x="56" y="187" class="detail">Browser UI · POS, order history, Khata, inventory and GST audit</text>
  <text x="405" y="168" class="code">index.html · js/app.js · css/style.css</text>
  <path d="M384 200 V215" class="edge"/>

  <rect x="40" y="216" width="688" height="66" rx="9" class="box"/>
  <text x="56" y="241" class="file">server.js</text>
  <text x="56" y="263" class="detail">Express · Serves public/ and mounts all routers at /api</text>
  <path d="M392 228 V270" stroke="#cbd5e1"/>
  <text x="408" y="241" class="code">GET /orders/:id/invoice</text>
  <text x="408" y="263" class="detail">Reads saved order and calls <tspan class="ticket-text">invoice.render()</tspan></text>
  <path d="M384 282 V296 M121 296 H646 M121 296 V310 M297 296 V310 M471 296 V310 M646 296 V310" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="40" y="304" class="section">routes/</text>
  <g>
    <rect x="40" y="312" width="163" height="62" rx="9" class="box"/>
    <text x="52" y="337" class="file">products.js</text>
    <text x="52" y="359" class="detail">Catalog and coupons</text>
    <rect x="215" y="312" width="163" height="62" rx="9" class="flow"/>
    <text x="227" y="337" class="file">orders.js</text>
    <text x="227" y="359" class="detail">Create, list and cancel</text>
    <rect x="390" y="312" width="163" height="62" rx="9" class="box"/>
    <text x="402" y="337" class="file">customers.js</text>
    <text x="402" y="359" class="detail">Khata and settlements</text>
    <rect x="565" y="312" width="163" height="62" rx="9" class="box"/>
    <text x="577" y="337" class="file">reports.js</text>
    <text x="577" y="359" class="detail">Reports and preview</text>
  </g>
  <path d="M121 374 V385 H646 V374 M297 374 V385 M471 374 V385" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M384 385 V414" class="edge"/>

  <text x="40" y="411" class="section">lib/</text>
  <g>
    <rect x="40" y="419" width="338" height="49" rx="8" class="flow"/>
    <text x="54" y="439" class="file">store.js</text>
    <text x="54" y="457" class="detail">Reads and writes db.json · Audit entries</text>
    <rect x="390" y="419" width="338" height="49" rx="8" class="flow"/>
    <text x="404" y="439" class="file">inventory.js</text>
    <text x="404" y="457" class="detail">Product lookup, sellable stock and deductions</text>

    <rect x="40" y="476" width="338" height="49" rx="8" class="flow"/>
    <text x="54" y="496" class="file">pricing.js</text>
    <text x="54" y="514" class="detail">Totals via coupons.js and tax.js</text>
    <rect x="390" y="476" width="338" height="49" rx="8" class="flow"/>
    <text x="404" y="496" class="file">coupons.js</text>
    <text x="404" y="514" class="detail">Coupon eligibility and discount amounts</text>

    <rect x="40" y="533" width="338" height="49" rx="8" class="flow"/>
    <text x="54" y="553" class="file">tax.js</text>
    <text x="54" y="571" class="detail">HSN slab lookup and CGST/SGST split</text>
    <rect x="390" y="533" width="338" height="49" rx="8" class="flow"/>
    <text x="404" y="553" class="file">ledger.js</text>
    <text x="404" y="571" class="detail">Khata charges, credit limits and settlements</text>

    <rect x="40" y="590" width="338" height="49" rx="8" class="flow"/>
    <text x="54" y="610" class="file">orders.js</text>
    <text x="54" y="628" class="detail">Order records and cancellation · Uses dates.js</text>
    <rect x="390" y="590" width="338" height="49" rx="8" class="flow"/>
    <text x="404" y="610" class="file">dates.js</text>
    <text x="404" y="628" class="detail">Order and settlement dates</text>

    <rect x="40" y="647" width="338" height="49" rx="8" class="box"/>
    <text x="54" y="667" class="file">reports.js</text>
    <text x="54" y="685" class="detail">Dashboard and GST audit · Calls invoice.js</text>
    <rect x="390" y="647" width="338" height="49" rx="8" class="ticket"/>
    <text x="404" y="667" class="file ticket-text">invoice.js</text>
    <text x="404" y="685" class="detail">Recalculates totals and renders printable HTML</text>
  </g>

  <rect x="40" y="719" width="338" height="59" rx="9" class="box"/>
  <text x="54" y="743" class="file">config.js</text>
  <text x="54" y="763" class="detail">Shop details, GST slabs, coupons and settings</text>
  <rect x="390" y="719" width="338" height="59" rx="9" class="flow"/>
  <text x="404" y="743" class="file">data/db.json</text>
  <text x="404" y="763" class="detail">Products, customers, orders, settlements, audit</text>

  <rect x="756" y="146" width="404" height="632" rx="12" class="box"/>
  <text x="778" y="174" class="section">PLACING AN ORDER</text>
  <path d="M791 205 V635" stroke="#9bc2eb" stroke-width="2"/>

  <g>
    <circle cx="791" cy="205" r="13" fill="#24588c"/><text x="791" y="205" class="number">1</text>
    <text x="816" y="209" class="step">Submit the cart</text>
    <text x="816" y="230" class="code">POST /api/orders</text>
    <text x="816" y="249" class="detail">public/ → server.js → routes/orders.js</text>

    <circle cx="791" cy="276" r="13" fill="#24588c"/><text x="791" y="276" class="number">2</text>
    <text x="816" y="280" class="step">Load products and check stock</text>
    <text x="816" y="301" class="code">store.read() → inventory.find()</text>
    <text x="816" y="320" class="code">→ inventory.check()</text>

    <circle cx="791" cy="347" r="13" fill="#24588c"/><text x="791" y="347" class="number">3</text>
    <text x="816" y="351" class="step">Validate coupon and price the order</text>
    <text x="816" y="372" class="code">coupons.validate() → computeTotals()</text>
    <text x="816" y="391" class="detail">pricing.js discounts lines, then applies HSN GST</text>

    <circle cx="791" cy="418" r="13" fill="#24588c"/><text x="791" y="418" class="number">4</text>
    <text x="816" y="422" class="step">Charge the Khata account</text>
    <text x="816" y="443" class="code">ledger.chargeOrderToKhata()</text>
    <text x="816" y="462" class="detail">Checks credit limit and updates the balance</text>

    <circle cx="791" cy="489" r="13" fill="#24588c"/><text x="791" y="489" class="number">5</text>
    <text x="816" y="493" class="step">Deduct stock and add the order</text>
    <text x="816" y="514" class="code">inventory.reserve() → orders.add()</text>
    <text x="816" y="533" class="detail">Assigns an ID and records items and totals</text>

    <circle cx="791" cy="560" r="13" fill="#24588c"/><text x="791" y="560" class="number">6</text>
    <text x="816" y="564" class="step">Write the changes</text>
    <text x="816" y="585" class="code">store.appendAudit() → store.write()</text>
    <text x="816" y="604" class="detail">Order, stock, Khata and audit → db.json</text>

    <circle cx="791" cy="631" r="13" fill="#24588c"/><text x="791" y="631" class="number">7</text>
    <text x="816" y="635" class="step">Return HTTP 201 and the saved order</text>
    <text x="816" y="656" class="detail">Browser shows the ledger total and invoice link</text>
  </g>

  <rect x="778" y="684" width="360" height="73" rx="8" class="ticket"/>
  <text x="792" y="706" class="step ticket-text">Printing uses a separate request</text>
  <text x="792" y="727" class="code ticket-text">GET /orders/:id/invoice → invoice.render()</text>
  <text x="792" y="745" class="detail">Uses saved items and config.js to recalculate totals</text>
</svg>
