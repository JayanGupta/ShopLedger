<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser connects to an Express server with four API routers. The diagram shows ten library modules, app configuration and the JSON store. A numbered sequence follows a sale from browser submission to persistence and response. The printable invoice module is highlighted.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #142b3e; font-size: 14px; }
      .title { font-size: 40px; font-weight: 740; letter-spacing: -1px; }
      .section { font-size: 18px; font-weight: 700; }
      .name { font-size: 15px; font-weight: 700; }
      .router { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; fill: #425a6b; }
      .detail { font-size: 13px; fill: #334d60; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; fill: #2b5d54; }
      .box { fill: #fff; stroke: #c9d8dc; }
      .entry { fill: #e5f1ef; stroke: #9abfb7; }
      .support { fill: #edf2f6; stroke: #c3d1db; }
      .order { fill: #e0f0ec; stroke: #76aa9e; }
      .ticket { fill: #ffeed8; stroke: #ba6a2d; stroke-width: 1.5; }
      .ticket-text { fill: #7a401b; }
      .wire { fill: none; stroke: #5c7b82; stroke-width: 1.5; }
      .step { fill: #235e52; }
      .number { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .divider { stroke: #e0e9ec; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5c7b82"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#f5f8f8"/>
  <rect width="1200" height="7" fill="#235e52"/>
  <text x="36" y="57" class="title">ShopLedger architecture</text>
  <text x="38" y="84" class="detail">Point of sale, Khata credit and GST invoicing</text>
  <rect x="1005" y="43" width="17" height="17" rx="4" class="ticket"/>
  <text x="1031" y="56" class="small">Ticket module</text>
  <path d="M36 105 H1164" stroke="#c9d8dc"/>

  <text x="36" y="135" class="label">BROWSER AND SERVER</text>
  <rect x="36" y="148" width="303" height="74" rx="10" class="entry"/>
  <text x="52" y="173" class="name">Browser UI · public/</text>
  <text x="52" y="193" class="detail">index.html · js/app.js · css/style.css</text>
  <text x="52" y="211" class="small">POS, order history, Khata and audit views</text>
  <path d="M339 185 H366" class="wire" marker-end="url(#arrow)"/>
  <rect x="367" y="148" width="383" height="74" rx="10" class="entry"/>
  <text x="383" y="173" class="name">server.js</text>
  <text x="383" y="193" class="detail">Express serves public/ and mounts the /api routers</text>
  <text x="383" y="211" class="small">Also serves GET /orders/:id/invoice</text>

  <text x="36" y="247" class="label">API ROUTERS</text>
  <path d="M558 222 V246 M120 246 H666" class="wire"/>
  <g class="wire" marker-end="url(#arrow)">
    <path d="M120 246 V259"/>
    <path d="M302 246 V259"/>
    <path d="M484 246 V259"/>
    <path d="M666 246 V259"/>
  </g>
  <rect x="36" y="259" width="168" height="62" rx="8" class="order"/>
  <text x="48" y="283" class="router">routes/orders.js</text>
  <text x="48" y="303" class="small">Place and cancel orders</text>
  <rect x="218" y="259" width="168" height="62" rx="8" class="box"/>
  <text x="230" y="283" class="router">routes/products.js</text>
  <text x="230" y="303" class="small">Catalog and coupons</text>
  <rect x="400" y="259" width="168" height="62" rx="8" class="box"/>
  <text x="412" y="283" class="router">routes/customers.js</text>
  <text x="412" y="303" class="small">Accounts and settlements</text>
  <rect x="582" y="259" width="168" height="62" rx="8" class="box"/>
  <text x="594" y="283" class="router">routes/reports.js</text>
  <text x="594" y="303" class="small">Reports, preview, export</text>

  <text x="36" y="348" class="label">LIBRARY MODULES AND DATA</text>
  <rect x="36" y="360" width="228" height="58" rx="8" class="box"/>
  <text x="50" y="384" class="name">lib/pricing.js</text>
  <text x="50" y="404" class="small">Checkout discounts, GST and totals</text>
  <rect x="279" y="360" width="228" height="58" rx="8" class="box"/>
  <text x="293" y="384" class="name">lib/coupons.js</text>
  <text x="293" y="404" class="small">Coupon validation and discounts</text>
  <rect x="522" y="360" width="228" height="58" rx="8" class="box"/>
  <text x="536" y="384" class="name">lib/tax.js</text>
  <text x="536" y="404" class="small">HSN rates and CGST/SGST split</text>

  <rect x="36" y="426" width="228" height="58" rx="8" class="box"/>
  <text x="50" y="450" class="name">lib/inventory.js</text>
  <text x="50" y="470" class="small">Sellable stock and deductions</text>
  <rect x="279" y="426" width="228" height="58" rx="8" class="box"/>
  <text x="293" y="450" class="name">lib/ledger.js</text>
  <text x="293" y="470" class="small">Khata balances and settlements</text>
  <rect x="522" y="426" width="228" height="58" rx="8" class="box"/>
  <text x="536" y="450" class="name">lib/orders.js</text>
  <text x="536" y="470" class="small">Order records and cancellation</text>

  <rect x="36" y="492" width="228" height="58" rx="8" class="box"/>
  <text x="50" y="516" class="name">lib/dates.js</text>
  <text x="50" y="536" class="small">Date helpers for orders and Khata</text>
  <rect x="279" y="492" width="228" height="58" rx="8" class="box"/>
  <text x="293" y="516" class="name">lib/reports.js</text>
  <text x="293" y="536" class="small">Dashboard and GST reconciliation</text>
  <rect x="522" y="492" width="228" height="58" rx="8" class="ticket"/>
  <text x="536" y="516" class="name ticket-text">lib/invoice.js</text>
  <text x="536" y="536" class="small ticket-text">Invoice figures and printable HTML</text>

  <rect x="36" y="558" width="228" height="58" rx="8" class="box"/>
  <text x="50" y="582" class="name">lib/store.js</text>
  <text x="50" y="602" class="small">JSON reads, writes and audit entries</text>
  <path d="M265 587 H278" class="wire" marker-end="url(#arrow)"/>
  <rect x="279" y="558" width="228" height="58" rx="8" class="support"/>
  <text x="293" y="582" class="name">data/db.json</text>
  <text x="293" y="602" class="small">Stock, orders, Khata, audits and IDs</text>
  <rect x="522" y="558" width="228" height="58" rx="8" class="support"/>
  <text x="536" y="582" class="name">config.js</text>
  <text x="536" y="602" class="small">Shop, GST and coupon settings</text>

  <rect x="36" y="635" width="714" height="122" rx="10" class="box"/>
  <text x="52" y="660" class="section">Printable invoice and reconciliation</text>
  <text x="52" y="682" class="detail">server.js calls store.read() and orders.get(), then invoice.render().</text>
  <text x="52" y="701" class="detail">invoice.computeInvoiceFigures() taxes gross lines using saved gstRate or the 18% fallback.</text>
  <text x="52" y="720" class="detail">It applies current coupon values, with percent discounts based on subtotal plus GST.</text>
  <text x="52" y="739" class="detail">lib/reports.js compares those figures with the stored checkout tax and total.</text>

  <rect x="778" y="120" width="386" height="637" rx="12" fill="#fff" stroke="#c9d8dc"/>
  <text x="799" y="151" class="section">Placing an order</text>
  <path d="M812 182 V681" stroke="#a8c8bf" stroke-width="2"/>
  <path d="M835 241 H1144 M835 320 H1144 M835 399 H1144 M835 478 H1144 M835 557 H1144 M835 636 H1144" class="divider"/>

  <circle cx="812" cy="182" r="13" class="step"/><text x="812" y="187" class="number">1</text>
  <text x="835" y="187" class="name">Submit the cart</text>
  <text x="835" y="208" class="detail">The browser sends POST /api/orders.</text>
  <text x="835" y="225" class="detail">server.js dispatches it to routes/orders.js.</text>

  <circle cx="812" cy="261" r="13" class="step"/><text x="812" y="266" class="number">2</text>
  <text x="835" y="266" class="name">Read the database and check stock</text>
  <text x="835" y="287" class="detail">store.read() loads data. inventory.find() gets</text>
  <text x="835" y="304" class="detail">products. inventory.check() checks stock.</text>

  <circle cx="812" cy="340" r="13" class="step"/><text x="812" y="345" class="number">3</text>
  <text x="835" y="345" class="name">Calculate the checkout total</text>
  <text x="835" y="365" class="detail">coupons.validate() checks the pre-tax subtotal.</text>
  <text x="835" y="382" class="detail">pricing.computeTotals() allocates the discount</text>
  <text x="835" y="397" class="small">across lines and applies GST by HSN after discount.</text>

  <circle cx="812" cy="419" r="13" class="step"/><text x="812" y="424" class="number">4</text>
  <text x="835" y="424" class="name">Charge Khata if selected</text>
  <text x="835" y="445" class="detail">ledger.chargeOrderToKhata() checks the credit</text>
  <text x="835" y="462" class="detail">limit and updates the customer balance.</text>

  <circle cx="812" cy="498" r="13" class="step"/><text x="812" y="503" class="number">5</text>
  <text x="835" y="503" class="name">Deduct stock and add the order</text>
  <text x="835" y="524" class="detail">inventory.reserve() deducts physical stock.</text>
  <text x="835" y="541" class="detail">orders.add() records line items and bill totals.</text>

  <circle cx="812" cy="577" r="13" class="step"/><text x="812" y="582" class="number">6</text>
  <text x="835" y="582" class="name">Audit and persist</text>
  <text x="835" y="603" class="detail">store.appendAudit() records ORDER_CREATED.</text>
  <text x="835" y="620" class="detail">store.write() rewrites data/db.json.</text>

  <circle cx="812" cy="656" r="13" class="step"/><text x="812" y="661" class="number">7</text>
  <text x="835" y="661" class="name">Return the saved order</text>
  <text x="835" y="682" class="detail">HTTP 201 returns the order as JSON. The browser</text>
  <text x="835" y="699" class="detail">shows the ledger total and the invoice link.</text>
</svg>
