<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">ShopLedger connects its browser UI to four Express routers, ten library modules, configuration and JSON storage. A numbered sequence follows checkout from the browser to the saved order. Purple marks the printable invoice module and the server route that calls it.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526680"/>
    </marker>
    <marker id="invoice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8546af"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #182943; }
    .title { font-size: 32px; font-weight: bold; }
    .section { font-size: 18px; font-weight: bold; }
    .name { font-size: 15px; font-weight: bold; }
    .detail { font-size: 13px; fill: #40546e; }
    .box { fill: #fff; stroke: #c4d1e1; stroke-width: 1.5; rx: 8; }
    .ticket { fill: #f4eaff; stroke: #8546af; }
    .focus { fill: #5a267c; }
    .edge { fill: none; stroke: #526680; stroke-width: 1.5; }
    .arrow { marker-end: url(#arrow); }
    .invoice-edge { stroke: #8546af; marker-end: url(#invoice-arrow); }
    .step { fill: #245c91; }
    .number { fill: #fff; font-weight: bold; text-anchor: middle; }
  </style>
  <rect width="1200" height="800" fill="#f3f7fb"/>
  <text class="title" x="32" y="53">ShopLedger architecture</text>
  <text class="section" x="32" y="93">Application structure</text>
  <rect class="box ticket" x="923" y="33" width="18" height="18"/>
  <text x="951" y="47">Ticket module</text>
  <circle class="step" cx="1071" cy="42" r="10"/>
  <text class="number" x="1071" y="47">1</text>
  <text x="1088" y="47">Order step</text>

  <g class="edge">
    <path class="arrow" d="M236 142 H278"/>
    <path d="M440 181 V210 M127 210 H721"/>
    <path class="arrow" d="M127 210 V224"/>
    <path class="arrow" d="M325 210 V224"/>
    <path class="arrow" d="M523 210 V224"/>
    <path class="arrow" d="M721 210 V224"/>
    <path class="arrow" d="M604 142 H646"/>
    <path class="invoice-edge" d="M584 181 V192 H830 V461 H818"/>
    <path class="arrow" d="M127 303 V352"/>
    <path class="arrow" d="M721 303 V352"/>
    <path class="arrow" d="M721 417 V428"/>
  </g>

  <rect class="box" x="32" y="104" width="204" height="77"/>
  <text class="name" x="46" y="128">public/ · Browser UI</text>
  <text class="detail" x="46" y="151">index.html · js/app.js</text>
  <text class="detail" x="46" y="169">css/style.css</text>

  <rect class="box" x="280" y="104" width="324" height="77"/>
  <text class="name" x="294" y="128">server.js · Express</text>
  <text class="detail" x="294" y="151">Serves UI, parses JSON, mounts /api</text>
  <text class="detail focus" x="294" y="169">GET /orders/:id/invoice</text>

  <rect class="box" x="648" y="104" width="168" height="77"/>
  <text class="name" x="662" y="128">config.js</text>
  <text class="detail" x="662" y="151">Port, shop, GST,</text>
  <text class="detail" x="662" y="169">coupons, inventory, key</text>
  <text class="detail" x="607" y="132">reads</text>
  <text class="section" x="32" y="217">routes/</text>

  <g>
    <rect class="box" x="32" y="226" width="190" height="77"/>
    <text class="name" x="45" y="250">orders.js</text>
    <text class="detail" x="45" y="272">List, place, look up, cancel</text>
    <text class="detail" x="45" y="290">POST /api/orders</text>
    <rect class="box" x="230" y="226" width="190" height="77"/>
    <text class="name" x="243" y="250">products.js</text>
    <text class="detail" x="243" y="272">Catalog and active coupons</text>
    <text class="detail" x="243" y="290">Inventory, tax, coupons</text>
    <rect class="box" x="428" y="226" width="190" height="77"/>
    <text class="name" x="441" y="250">customers.js</text>
    <text class="detail" x="441" y="272">Customers and settlements</text>
    <text class="detail" x="441" y="290">Ledger and store</text>
    <rect class="box" x="626" y="226" width="190" height="77"/>
    <text class="name" x="639" y="250">reports.js</text>
    <text class="detail" x="639" y="272">Dashboard and GST checks</text>
    <text class="detail" x="639" y="290">Pricing preview and export</text>
  </g>

  <text class="section" x="32" y="339">lib/</text>
  <g>
    <rect class="box" x="32" y="354" width="252" height="63"/>
    <text class="name" x="46" y="378">inventory.js</text>
    <text class="detail" x="46" y="400">Availability and stock changes</text>
    <rect class="box" x="298" y="354" width="252" height="63"/>
    <text class="name" x="312" y="378">pricing.js</text>
    <text class="detail" x="312" y="400">Checkout totals via coupons and tax</text>
    <rect class="box" x="564" y="354" width="252" height="63"/>
    <text class="name" x="578" y="378">reports.js</text>
    <text class="detail" x="578" y="400">Dashboard and invoice reconciliation</text>

    <rect class="box" x="32" y="430" width="252" height="63"/>
    <text class="name" x="46" y="454">orders.js</text>
    <text class="detail" x="46" y="476">Order records, lookup and cancellation</text>
    <rect class="box" x="298" y="430" width="252" height="63"/>
    <text class="name" x="312" y="454">coupons.js</text>
    <text class="detail" x="312" y="476">Validation and discount amounts</text>
    <rect class="box ticket" x="564" y="430" width="252" height="139"/>
    <text class="name focus" x="578" y="454">invoice.js</text>
    <text class="detail" x="578" y="475">render() → computeInvoiceFigures()</text>
    <text class="detail focus" x="578" y="499">Uses saved subtotal, discount,</text>
    <text class="detail focus" x="578" y="517">GST and total when present.</text>
    <text class="detail focus" x="578" y="541">Recalculates row GST using</text>
    <text class="detail focus" x="578" y="559">current rate rules in tax.js.</text>

    <rect class="box" x="32" y="506" width="252" height="63"/>
    <text class="name" x="46" y="530">ledger.js</text>
    <text class="detail" x="46" y="552">Khata balances and settlements</text>
    <rect class="box" x="298" y="506" width="252" height="63"/>
    <text class="name" x="312" y="530">tax.js</text>
    <text class="detail" x="312" y="552">GST rate lookup and CGST/SGST split</text>

    <rect class="box" x="32" y="582" width="252" height="63"/>
    <text class="name" x="46" y="606">dates.js</text>
    <text class="detail" x="46" y="628">Order and settlement date helpers</text>
    <rect class="box" x="298" y="582" width="252" height="63"/>
    <text class="name" x="312" y="606">store.js</text>
    <text class="detail" x="312" y="628">JSON reads, writes and audit entries</text>
  </g>
  <path class="edge arrow" d="M424 645 V678"/>
  <rect class="box" x="32" y="680" width="784" height="76"/>
  <text class="name" x="46" y="706">data/db.json</text>
  <text x="46" y="733">Products, customers, orders, settlements, audit entries and ID counters</text>

  <rect class="box" x="844" y="76" width="324" height="680"/>
  <text class="section" x="866" y="111">Placing an order</text>
  <path d="M877 149 V699" stroke="#afc4d9" stroke-width="2"/>
  <g>
    <circle class="step" cx="877" cy="151" r="12"/><text class="number" x="877" y="156">1</text>
    <text class="name" x="899" y="156">Submit cart</text>
    <text class="detail" x="899" y="178">Browser posts to /api/orders.</text>
    <text class="detail" x="899" y="196">server.js dispatches to routes/orders.js.</text>

    <circle class="step" cx="877" cy="228" r="12"/><text class="number" x="877" y="233">2</text>
    <text class="name" x="899" y="233">Load catalog and check stock</text>
    <text class="detail" x="899" y="255">store.read() loads data/db.json.</text>
    <text class="detail" x="899" y="273">inventory.find() and inventory.check()</text>

    <circle class="step" cx="877" cy="305" r="12"/><text class="number" x="877" y="310">3</text>
    <text class="name" x="899" y="310">Validate coupon and price order</text>
    <text class="detail" x="899" y="332">coupons.validate() checks the code.</text>
    <text class="detail" x="899" y="350">pricing.computeTotals() allocates the</text>
    <text class="detail" x="899" y="368">discount and adds GST using tax.js.</text>

    <circle class="step" cx="877" cy="400" r="12"/><text class="number" x="877" y="405">4</text>
    <text class="name" x="899" y="405">Apply credit if paying by Khata</text>
    <text class="detail" x="899" y="427">ledger.chargeOrderToKhata() checks</text>
    <text class="detail" x="899" y="445">the limit and updates the balance.</text>

    <circle class="step" cx="877" cy="477" r="12"/><text class="number" x="877" y="482">5</text>
    <text class="name" x="899" y="482">Deduct stock and add order</text>
    <text class="detail" x="899" y="504">inventory.reserve() reduces stock.</text>
    <text class="detail" x="899" y="522">orders.add() saves line details and</text>
    <text class="detail" x="899" y="540">billed totals in memory.</text>

    <circle class="step" cx="877" cy="572" r="12"/><text class="number" x="877" y="577">6</text>
    <text class="name" x="899" y="577">Persist the sale</text>
    <text class="detail" x="899" y="599">store.appendAudit() logs the sale.</text>
    <text class="detail" x="899" y="617">store.write() saves the order, stock and</text>
    <text class="detail" x="899" y="635">any Khata changes to data/db.json.</text>

    <circle class="step" cx="877" cy="669" r="12"/><text class="number" x="877" y="674">7</text>
    <text class="name" x="899" y="674">Return the saved order</text>
    <text class="detail" x="899" y="696">HTTP 201 returns the saved order.</text>
    <text class="detail" x="899" y="714">The UI shows the total and an invoice link.</text>
  </g>
</svg>
