<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger browser UI, Express server, routers, libraries, configuration and JSON database. Numbered arrows trace order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowarrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
      .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#475569}
      .head{font-size:15px;font-weight:700}.small{font-size:12px}.tiny{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:14}
      .highlight{fill:#fff1f2;stroke:#e11d48;stroke-width:2}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowarrow)}
      .dep{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}
      .step{fill:#2563eb;stroke:#fff;stroke-width:2}
      .steptext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="30" y="40" class="title">ShopLedger — application architecture</text>
  <text x="30" y="63" class="sub">Node / Express POS · Khata credit ledger · GST invoicing · numbered arrows show POST /api/orders</text>

  <!-- order flow arrows behind the modules -->
  <path class="flow" d="M205 176 H263"/>
  <path class="flow" d="M435 176 H493"/>
  <path class="flow" d="M680 176 H742"/>
  <path class="flow" d="M930 176 H995"/>
  <path class="flow" d="M1084 211 V286 H896 V314"/>
  <path class="flow" d="M816 390 V438 H574 V478"/>
  <path class="flow" d="M678 525 H754"/>
  <path class="flow" d="M931 525 H994"/>

  <!-- order path nodes -->
  <rect class="box" x="30" y="130" width="175" height="92"/>
  <text x="48" y="157" class="head">Browser UI</text><text x="48" y="180">public/</text><text x="48" y="202" class="tiny">app.js submits cart</text>
  <rect class="box" x="263" y="130" width="172" height="92"/>
  <text x="280" y="157" class="head">Express entry</text><text x="280" y="181">server.js</text><text x="280" y="203" class="tiny">body parser · static UI</text>
  <rect class="box" x="493" y="130" width="187" height="92"/>
  <text x="510" y="157" class="head">Order route</text><text x="510" y="181">routes/orders.js</text><text x="510" y="203" class="tiny">POST /api/orders</text>
  <rect class="box" x="742" y="130" width="188" height="92"/>
  <text x="759" y="157" class="head">Validate &amp; price</text><text x="759" y="181">inventory · coupons</text><text x="759" y="203" class="tiny">pricing → tax</text>
  <rect class="box" x="995" y="130" width="178" height="81"/>
  <text x="1012" y="157" class="head">Khata (if credit)</text><text x="1012" y="181">ledger.chargeOrderToKhata</text><text x="1012" y="201" class="tiny">checks limit; updates balance</text>
  <rect class="box" x="785" y="314" width="222" height="76"/>
  <text x="804" y="342" class="head">Build order</text><text x="804" y="365">orders.add · inventory.reserve</text><text x="804" y="384" class="tiny">assign ID; append order in memory</text>
  <rect class="box" x="478" y="478" width="200" height="94"/>
  <text x="497" y="505" class="head">Audit + persist</text><text x="497" y="529">store.appendAudit</text><text x="497" y="552">store.write(db)</text>
  <rect class="box" x="754" y="478" width="177" height="94"/>
  <text x="772" y="505" class="head">JSON file</text><text x="772" y="529">data/db.json</text><text x="772" y="552" class="tiny">orders · products · ledger</text>
  <rect class="box" x="994" y="478" width="179" height="94"/>
  <text x="1012" y="505" class="head">Response</text><text x="1012" y="529">201 JSON order</text><text x="1012" y="552" class="tiny">back to browser UI</text>
  <path class="flow" d="M931 525 H994"/>
  <path class="flow" d="M931 550 C980 620 150 620 115 222"/>
  <circle class="step" cx="232" cy="176" r="13"/><text class="steptext" x="232" y="181">1</text>
  <circle class="step" cx="464" cy="176" r="13"/><text class="steptext" x="464" y="181">2</text>
  <circle class="step" cx="711" cy="176" r="13"/><text class="steptext" x="711" y="181">3</text>
  <circle class="step" cx="964" cy="176" r="13"/><text class="steptext" x="964" y="181">4</text>
  <circle class="step" cx="906" cy="286" r="13"/><text class="steptext" x="906" y="291">5</text>
  <circle class="step" cx="574" cy="456" r="13"/><text class="steptext" x="574" y="461">6</text>
  <circle class="step" cx="711" cy="525" r="13"/><text class="steptext" x="711" y="530">7</text>

  <!-- module map -->
  <rect class="group" x="25" y="645" width="1150" height="125"/>
  <text x="45" y="670" class="head">Module map</text>
  <rect class="box" x="45" y="685" width="100" height="58"/><text x="57" y="710" class="head">routes/</text><text x="57" y="731" class="small">4 routers</text>
  <text x="162" y="701" class="small">products.js · orders.js · customers.js · reports.js</text>
  <rect class="box" x="410" y="685" width="350" height="58"/><text x="425" y="708" class="head">lib/</text><text x="425" y="730" class="small">store · orders · inventory · pricing · tax · coupons · ledger · invoice · reports · dates</text>
  <rect class="box" x="780" y="685" width="160" height="58"/><text x="797" y="710" class="head">config.js</text><text x="797" y="731" class="small">shop · GST · coupons</text>
  <rect class="box highlight" x="960" y="685" width="190" height="58"/><text x="975" y="709" class="head">public/ + invoice</text><text x="975" y="731" class="small">UI · printable HTML</text>

  <!-- explicit ticket focus callout and legend -->
  <rect class="group" x="25" y="250" width="680" height="350"/>
  <text x="48" y="280" class="head">Supporting modules and data dependencies</text>
  <rect class="box" x="55" y="312" width="150" height="75"/><text x="72" y="340" class="head">routes/</text><text x="72" y="365" class="small">products · customers</text><text x="72" y="382" class="small">reports · orders</text>
  <rect class="box" x="270" y="312" width="175" height="75"/><text x="287" y="340" class="head">lib/pricing.js</text><text x="287" y="365" class="small">subtotal · discounts</text><text x="287" y="382" class="small">uses lib/tax.js</text>
  <rect class="box highlight" x="505" y="312" width="170" height="75"/><text x="522" y="340" class="head">lib/invoice.js</text><text x="522" y="365" class="small">computeInvoiceFigures</text><text x="522" y="382" class="small">render printable HTML</text>
  <rect class="box" x="55" y="430" width="150" height="65"/><text x="72" y="457" class="head">lib/store.js</text><text x="72" y="480" class="small">read · write · audit</text>
  <rect class="box" x="270" y="430" width="175" height="65"/><text x="287" y="457" class="head">lib/tax.js</text><text x="287" y="480" class="small">HSN slab · split GST</text>
  <rect class="box" x="505" y="430" width="170" height="65"/><text x="522" y="457" class="head">data/db.json</text><text x="522" y="480" class="small">local JSON persistence</text>
  <path class="dep" d="M205 348 H270"/><path class="dep" d="M445 348 H505"/>
  <path class="dep" d="M355 387 V430"/><path class="dep" d="M205 462 H505"/>
  <text x="55" y="535" class="small">server.js also serves /orders/:id/invoice → orders.get → invoice.render</text>
  <text x="55" y="558" class="small">invoice.js reads config.js; reports.js calls invoice.computeInvoiceFigures</text>
  <path class="dep dash" d="M550 387 C550 410 600 410 600 430"/>

  <rect x="963" y="594" width="212" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <circle class="step" cx="982" cy="611" r="11"/><text class="steptext" x="982" y="615">1</text><text x="1000" y="616" class="small">Order placement sequence</text>
  <rect x="963" y="634" width="212" height="34" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="980" y="656" class="small">Highlighted: ticket focus</text>
  <text x="963" y="788" class="tiny">Blue arrows = numbered order flow · gray arrows = module/data relationship · rose = lib/invoice.js</text>
</svg>
