<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI, Express server, routes, libraries, configuration, JSON storage, and the numbered order creation flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 600 24px Arial, sans-serif; fill: #0f172a; }
      .sub { font: 14px Arial, sans-serif; fill: #475569; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .group-title { font: 600 15px Arial, sans-serif; fill: #334155; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .node-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .node-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .node-purple { fill: #faf5ff; stroke: #9333ea; stroke-width: 2; }
      .node-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .label { font: 600 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#flowArrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .badge { fill: #2563eb; }
      .badge-text { font: 600 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <text x="28" y="35" class="title">ShopLedger architecture</text>
  <text x="28" y="57" class="sub">Node/Express POS, Khata ledger, GST checkout, and printable invoice</text>

  <!-- Browser -->
  <rect x="28" y="91" width="210" height="218" rx="8" class="group"/>
  <text x="44" y="118" class="group-title">Browser</text>
  <rect x="44" y="138" width="178" height="68" rx="6" class="node-green"/>
  <text x="133" y="164" text-anchor="middle" class="label">public/</text>
  <text x="133" y="184" text-anchor="middle" class="small">index.html · css/ · js/app.js</text>
  <rect x="44" y="224" width="178" height="62" rx="6" class="node"/>
  <text x="133" y="250" text-anchor="middle" class="label">POS &amp; dashboard UI</text>
  <text x="133" y="270" text-anchor="middle" class="small">fetches /api/*</text>

  <!-- Server -->
  <rect x="284" y="112" width="205" height="155" rx="8" class="group"/>
  <text x="302" y="139" class="group-title">Express application</text>
  <rect x="302" y="154" width="169" height="88" rx="6" class="node-blue"/>
  <text x="386" y="180" text-anchor="middle" class="label">server.js</text>
  <text x="386" y="200" text-anchor="middle" class="small">JSON middleware · static public/</text>
  <text x="386" y="220" text-anchor="middle" class="small">mounts /api routers</text>

  <!-- Configuration -->
  <rect x="533" y="72" width="183" height="73" rx="6" class="node-orange"/>
  <text x="624" y="100" text-anchor="middle" class="label">config.js</text>
  <text x="624" y="120" text-anchor="middle" class="small">shop · HSN slabs · coupons</text>

  <!-- Routers -->
  <rect x="525" y="165" width="205" height="275" rx="8" class="group"/>
  <text x="542" y="191" class="group-title">routes/</text>
  <rect x="542" y="205" width="171" height="43" rx="5" class="node"/>
  <text x="627" y="232" text-anchor="middle" class="label">products.js</text>
  <rect x="542" y="260" width="171" height="43" rx="5" class="node-blue"/>
  <text x="627" y="287" text-anchor="middle" class="label">orders.js</text>
  <rect x="542" y="315" width="171" height="43" rx="5" class="node"/>
  <text x="627" y="342" text-anchor="middle" class="label">customers.js</text>
  <rect x="542" y="370" width="171" height="43" rx="5" class="node"/>
  <text x="627" y="397" text-anchor="middle" class="label">reports.js</text>

  <!-- Libraries -->
  <rect x="760" y="72" width="218" height="641" rx="8" class="group"/>
  <text x="778" y="99" class="group-title">lib/</text>
  <rect x="778" y="113" width="182" height="43" rx="5" class="node"/><text x="869" y="140" text-anchor="middle" class="label">store.js</text>
  <rect x="778" y="168" width="182" height="43" rx="5" class="node"/><text x="869" y="195" text-anchor="middle" class="label">inventory.js</text>
  <rect x="778" y="223" width="182" height="43" rx="5" class="node"/><text x="869" y="250" text-anchor="middle" class="label">pricing.js</text>
  <rect x="778" y="278" width="182" height="43" rx="5" class="node"/><text x="869" y="305" text-anchor="middle" class="label">coupons.js</text>
  <rect x="778" y="333" width="182" height="43" rx="5" class="node-purple"/><text x="869" y="360" text-anchor="middle" class="label">tax.js</text>
  <rect x="778" y="388" width="182" height="43" rx="5" class="node"/><text x="869" y="415" text-anchor="middle" class="label">orders.js</text>
  <rect x="778" y="443" width="182" height="43" rx="5" class="node"/><text x="869" y="470" text-anchor="middle" class="label">ledger.js</text>
  <rect x="778" y="498" width="182" height="43" rx="5" class="node-purple"/><text x="869" y="525" text-anchor="middle" class="label">invoice.js</text>
  <rect x="778" y="553" width="182" height="43" rx="5" class="node"/><text x="869" y="580" text-anchor="middle" class="label">reports.js</text>
  <rect x="778" y="608" width="182" height="43" rx="5" class="node"/><text x="869" y="635" text-anchor="middle" class="label">dates.js</text>

  <!-- Database -->
  <rect x="1014" y="276" width="158" height="156" rx="8" class="group"/>
  <text x="1030" y="303" class="group-title">Persistent data</text>
  <path d="M1035 324 C1035 315 1151 315 1151 324 L1151 383 C1151 392 1035 392 1035 383 Z" class="node-orange"/>
  <ellipse cx="1093" cy="324" rx="58" ry="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1093" y="350" text-anchor="middle" class="label">data/db.json</text>
  <text x="1093" y="371" text-anchor="middle" class="small">products · orders</text>
  <text x="1093" y="388" text-anchor="middle" class="small">customers · audit log</text>

  <!-- General wiring -->
  <path d="M238 172 H302" class="line"/>
  <text x="247" y="157" class="tiny">static UI + HTTP</text>
  <path d="M471 198 H542" class="line"/>
  <path d="M624 145 V205" class="dashed"/>
  <path d="M716 108 H778" class="dashed"/>
  <path d="M960 135 H1000 V350 H1035" class="line"/>
  <text x="985" y="326" class="tiny">JSON read/write</text>
  <path d="M960 520 H991 V400 H1014" class="line"/>
  <path d="M716 108 H746 V300 H778" class="dashed"/>
  <path d="M716 108 H734 V355 H778" class="dashed"/>
  <path d="M716 108 H722 V520 H778" class="dashed"/>
  <text x="674" y="156" class="tiny">configuration</text>

  <!-- Numbered order flow -->
  <path d="M133 286 V470 H386 V242" class="flow"/>
  <circle cx="270" cy="470" r="11" class="badge"/><text x="270" y="470" class="badge-text">1</text>
  <text x="286" y="464" class="tiny">POST /api/orders</text>
  <path d="M471 242 H520 V281 H542" class="flow"/>
  <circle cx="510" cy="281" r="11" class="badge"/><text x="510" y="281" class="badge-text">2</text>
  <text x="433" y="270" class="tiny">dispatch</text>
  <path d="M713 281 H748 V135 H778" class="flow"/>
  <circle cx="748" cy="212" r="11" class="badge"/><text x="748" y="212" class="badge-text">3</text>
  <text x="685" y="198" class="tiny">read DB</text>
  <path d="M713 281 H745 V190 H778" class="flow"/>
  <circle cx="735" cy="260" r="11" class="badge"/><text x="735" y="260" class="badge-text">4</text>
  <text x="681" y="252" class="tiny">stock check</text>
  <path d="M713 281 H778" class="flow"/>
  <circle cx="746" cy="281" r="11" class="badge"/><text x="746" y="281" class="badge-text">5</text>
  <text x="683" y="304" class="tiny">compute totals</text>
  <path d="M869 266 V278" class="flow"/>
  <path d="M869 266 V333" class="flow"/>
  <text x="879" y="324" class="tiny">coupon + HSN GST</text>
  <path d="M713 281 H730 V465 H778" class="flow"/>
  <circle cx="730" cy="400" r="11" class="badge"/><text x="730" y="400" class="badge-text">6</text>
  <text x="663" y="421" class="tiny">Khata only</text>
  <path d="M713 281 H742 V465 H760 V190 H778" class="flow"/>
  <circle cx="742" cy="448" r="11" class="badge"/><text x="742" y="448" class="badge-text">7</text>
  <text x="660" y="442" class="tiny">decrement stock</text>
  <path d="M713 281 H750 V410 H778" class="flow"/>
  <circle cx="750" cy="370" r="11" class="badge"/><text x="750" y="370" class="badge-text">8</text>
  <text x="688" y="390" class="tiny">create order</text>
  <path d="M869 431 V690 H990 V401 H1035" class="flow"/>
  <circle cx="947" cy="690" r="11" class="badge"/><text x="947" y="690" class="badge-text">9</text>
  <text x="789" y="681" class="tiny">audit + store.write()</text>

  <!-- Invoice relation -->
  <path d="M489 225 H740 V520 H778" class="dashed"/>
  <text x="545" y="510" class="tiny">GET /orders/:id/invoice → render()</text>

  <!-- Legend -->
  <rect x="28" y="650" width="675" height="112" rx="8" class="group"/>
  <text x="44" y="678" class="group-title">Legend</text>
  <rect x="44" y="694" width="18" height="18" rx="3" class="node-blue"/><text x="72" y="708" class="small">order endpoint / numbered order flow</text>
  <rect x="282" y="694" width="18" height="18" rx="3" class="node-purple"/><text x="310" y="708" class="small">ticket focus: invoice.js and tax.js</text>
  <rect x="44" y="727" width="18" height="18" rx="3" class="node-orange"/><text x="72" y="741" class="small">configuration or persisted JSON</text>
  <path d="M282 736 H324" class="dashed"/><text x="334" y="741" class="small">dependency / non-order path</text>
</svg>
