<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Browser, server, routers, ten library modules, and the JSON data store above the five steps of placing an order. The library modules changed for the three workshop issues are highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#516e78"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172e38; }
      .title { font-size: 40px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 17px; fill: #d4e6eb; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #45616c; }
      .label { font-size: 16px; font-weight: 700; }
      .file { font-family: Consolas, monospace; font-size: 15px; font-weight: 700; }
      .small { font-size: 14px; fill: #415a64; }
      .step { font-size: 19px; font-weight: 700; }
      .number { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .panel { fill: #fff; stroke: #c3d3da; stroke-width: 1.2; }
      .tile { fill: #edf4f6; }
      .highlight { fill: #fff2d3; stroke: #ab6c17; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #516e78; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f5f8f9"/>
  <rect width="1200" height="116" fill="#163744"/>
  <text x="40" y="56" class="title">ShopLedger architecture</text>
  <text x="42" y="86" class="subtitle">Checkout, Khata and GST invoicing</text>

  <text x="40" y="146" class="section">REQUESTS AND DATA</text>

  <path class="arrow" d="M256 197 H293"/>
  <path class="arrow" d="M420 220 V239"/>
  <path class="arrow" d="M320 220 V228 H275 V258 H258"/>
  <path class="arrow" d="M548 305 H582"/>
  <path class="arrow" d="M548 197 H582"/>
  <path class="arrow" d="M872 420 V442"/>

  <rect x="40" y="170" width="216" height="50" rx="8" class="panel"/>
  <text x="55" y="192" class="file">public/</text>
  <text x="55" y="211" class="small">Browser UI</text>

  <rect x="40" y="230" width="216" height="60" rx="8" class="panel"/>
  <text x="55" y="254" class="file">config.js</text>
  <text x="55" y="274" class="small">Port, shop, tax, coupons</text>

  <rect x="294" y="170" width="254" height="50" rx="8" class="panel"/>
  <text x="310" y="192" class="file">server.js</text>
  <text x="310" y="211" class="small">Static UI, API and print route</text>

  <rect x="294" y="242" width="254" height="178" rx="8" class="panel"/>
  <text x="310" y="267" class="label">API routers</text>
  <text x="310" y="292" class="file">routes/products.js</text>
  <text x="310" y="322" class="file">routes/orders.js</text>
  <text x="310" y="352" class="file">routes/customers.js</text>
  <text x="310" y="382" class="file">routes/reports.js</text>

  <rect x="585" y="163" width="575" height="257" rx="8" class="panel"/>
  <text x="603" y="190" class="label">Library modules</text>
  <rect x="603" y="201" width="170" height="30" rx="6" class="tile"/>
  <rect x="785" y="201" width="170" height="30" rx="6" class="tile"/>
  <rect x="967" y="201" width="175" height="30" rx="6" class="highlight"/>
  <text x="614" y="221" class="file">lib/pricing.js</text>
  <text x="796" y="221" class="file">lib/tax.js</text>
  <text x="978" y="221" class="file">lib/invoice.js</text>
  <rect x="603" y="240" width="170" height="30" rx="6" class="tile"/>
  <rect x="785" y="240" width="170" height="30" rx="6" class="highlight"/>
  <rect x="967" y="240" width="175" height="30" rx="6" class="tile"/>
  <text x="614" y="260" class="file">lib/coupons.js</text>
  <text x="796" y="260" class="file">lib/inventory.js</text>
  <text x="978" y="260" class="file">lib/reports.js</text>
  <rect x="603" y="279" width="170" height="30" rx="6" class="highlight"/>
  <rect x="785" y="279" width="170" height="30" rx="6" class="highlight"/>
  <rect x="967" y="279" width="175" height="30" rx="6" class="highlight"/>
  <text x="614" y="299" class="file">lib/orders.js</text>
  <text x="796" y="299" class="file">lib/dates.js</text>
  <text x="978" y="299" class="file">lib/ledger.js</text>
  <rect x="603" y="318" width="170" height="30" rx="6" class="tile"/>
  <text x="614" y="338" class="file">lib/store.js</text>
  <text x="603" y="374" class="small">The print route and GST audit both use the invoice calculation.</text>
  <text x="603" y="397" class="small">Checkout calculates its totals through pricing.js.</text>

  <rect x="585" y="445" width="575" height="54" rx="8" class="panel"/>
  <text x="603" y="478" class="file">data/db.json</text>
  <text x="757" y="478" class="small">Products, orders, Khata balances and audit log</text>

  <rect x="40" y="371" width="18" height="16" rx="4" class="highlight"/>
  <text x="68" y="384" class="small">Workshop issue modules</text>
  <path class="arrow" d="M40 410 H57"/>
  <text x="68" y="414" class="small">Request or data dependency</text>

  <text x="40" y="541" class="section">PLACING AN ORDER</text>
  <g transform="translate(40 563)">
    <rect width="212" height="155" rx="8" class="panel"/>
    <circle cx="27" cy="28" r="13" fill="#176979"/>
    <text x="27" y="34" class="number">1</text>
    <text x="47" y="35" class="step">Send order</text>
    <text x="15" y="68" class="small">POST /api/orders</text>
    <text x="15" y="92" class="small">Browser sends items,</text>
    <text x="15" y="116" class="small">coupon and payment mode.</text>
  </g>
  <g transform="translate(267 563)">
    <rect width="212" height="155" rx="8" class="panel"/>
    <circle cx="27" cy="28" r="13" fill="#176979"/>
    <text x="27" y="34" class="number">2</text>
    <text x="47" y="35" class="step">Read &amp; check</text>
    <text x="15" y="68" class="small">store.read()</text>
    <text x="15" y="92" class="small">inventory.find()</text>
    <text x="15" y="116" class="small">inventory.check()</text>
  </g>
  <g transform="translate(494 563)">
    <rect width="212" height="155" rx="8" class="panel"/>
    <circle cx="27" cy="28" r="13" fill="#176979"/>
    <text x="27" y="34" class="number">3</text>
    <text x="47" y="35" class="step">Calculate bill</text>
    <text x="15" y="68" class="small">coupons.validate()</text>
    <text x="15" y="92" class="small">pricing.computeTotals()</text>
    <text x="15" y="116" class="small">Coupon cap and HSN GST</text>
  </g>
  <g transform="translate(721 563)">
    <rect width="212" height="155" rx="8" class="panel"/>
    <circle cx="27" cy="28" r="13" fill="#176979"/>
    <text x="27" y="34" class="number">4</text>
    <text x="47" y="35" class="step">Apply updates</text>
    <text x="15" y="68" class="small">ledger.chargeOrderToKhata()</text>
    <text x="15" y="92" class="small">inventory.reserve()</text>
    <text x="15" y="116" class="small">orders.add()</text>
  </g>
  <g transform="translate(948 563)">
    <rect width="212" height="155" rx="8" class="panel"/>
    <circle cx="27" cy="28" r="13" fill="#176979"/>
    <text x="27" y="34" class="number">5</text>
    <text x="47" y="35" class="step">Save &amp; respond</text>
    <text x="15" y="68" class="small">store.appendAudit()</text>
    <text x="15" y="92" class="small">store.write()</text>
    <text x="15" y="116" class="small">HTTP 201 with saved order</text>
  </g>
  <text x="40" y="763" class="small">Abishek M. · Workshop notes</text>
</svg>
