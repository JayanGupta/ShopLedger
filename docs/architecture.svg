<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>ShopLedger architecture and order flow</title><desc>Browser to Express to routers and library modules, with numbered order placement flow. Invoice is highlighted.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.t{font-size:25px;font-weight:bold}.s{font-size:13px;fill:#526176}.l{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.h{font-size:14px;font-weight:bold;fill:#475569}.c{fill:#fff;stroke:#94a3b8;stroke-width:1.3}.f{fill:#fff1f2;stroke:#e11d48;stroke-width:2.4}.ct{font-size:15px;font-weight:bold}.ft{font-size:15px;font-weight:bold;fill:#9f1239}.x{font-size:12px;fill:#334155}.sm{font-size:12px;fill:#475569}.fb{fill:#eff6ff;stroke:#93c5fd}.n{fill:#2563eb}.nt{font-size:13px;font-weight:bold;fill:white;text-anchor:middle;dominant-baseline:middle}.ar{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#a)}.fl{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#b)}</style></defs><rect width="1200" height="800" fill="white"/><text x="28" y="38" class="t">ShopLedger | application architecture</text><text x="29" y="59" class="s">Browser POS · Express routes · business modules · JSON persistence</text><rect x="905" y="20" width="266" height="43" rx="8" class="f"/><text x="922" y="47" class="sm">Ticket focus: lib/invoice.js</text><text x="28" y="91" class="h">ORDER PLACEMENT · NUMBERED FLOW</text>
<g><rect x="28" y="103" width="180" height="62" rx="8" class="fb"/><circle cx="47" cy="122" r="13" class="n"/><text x="47" y="122" class="nt">1</text><text x="68" y="126" class="ct">Browser UI</text><text x="42" y="149" class="sm">POST /api/orders</text><path d="M210 134H231" class="fl"/><rect x="238" y="103" width="170" height="62" rx="8" class="fb"/><circle cx="257" cy="122" r="13" class="n"/><text x="257" y="122" class="nt">2</text><text x="279" y="126" class="ct">orders router</text><text x="252" y="149" class="sm">resolve and validate</text><path d="M410 134H431" class="fl"/><rect x="438" y="103" width="245" height="62" rx="8" class="fb"/><circle cx="457" cy="122" r="13" class="n"/><text x="457" y="122" class="nt">3</text><text x="479" y="126" class="ct">pricing + coupons + tax</text><text x="452" y="149" class="sm">subtotal · discount · GST · total</text><path d="M685 134H706" class="fl"/><rect x="713" y="103" width="206" height="62" rx="8" class="fb"/><circle cx="732" cy="122" r="13" class="n"/><text x="732" y="122" class="nt">4</text><text x="754" y="126" class="ct">commit business state</text><text x="727" y="149" class="sm">Khata · stock · order · audit</text><path d="M921 134H942" class="fl"/><rect x="949" y="103" width="222" height="62" rx="8" class="fb"/><circle cx="968" cy="122" r="13" class="n"/><text x="968" y="122" class="nt">5</text><text x="990" y="126" class="ct">store.write(db)</text><text x="963" y="149" class="sm">data/db.json</text></g>
