<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger app architecture and order flow</title>
  <desc id="desc">A map of the browser UI, Express server, routes, library modules, configuration, JSON storage, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#475569}
      .head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .ticket{fill:#fff0db;stroke:#d97706;stroke-width:2}.flow{fill:#e8f2ff;stroke:#3b82f6;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .badge{fill:#2563eb}.badgeText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text class="title" x="30" y="38">ShopLedger | Architecture &amp; order placement</text>
  <text class="subtitle" x="30" y="62">Express POS, Khata ledger, inventory, GST pricing, reports, and printable invoices</text>

  <!-- Runtime entry points -->
  <rect class="box" x="30" y="88" width="245" height="100" rx="10"/>
  <text class="head" x="48" y="116">Browser UI — public/</text>
  <text class="body" x="48" y="140">index.html · js/app.js · css/style.css</text>
  <text class="body" x="48" y="162">POS, orders, Khata, GST audit</text>

  <rect class="box" x="355" y="88" width="260" height="100" rx="10"/>
  <text class="head" x="375" y="116">server.js</text>
  <text class="body" x="375" y="140">Express app · static public/ · /api</text>
  <text class="body" x="375" y="162">/orders/:id/invoice HTML endpoint</text>

  <path class="line" d="M275 138 H348"/>
  <text class="small" x="290" y="127">HTTP</text>

  <rect class="group" x="685" y="80" width="485" height="174" rx="12"/>
  <text class="head" x="705" y="105">Routes — mounted under /api</text>
  <rect class="box" x="705" y="119" width="210" height="52" rx="8"/>
  <text class="body" x="718" y="141">routes/orders.js</text><text class="small" x="718" y="159">orders · cancellation</text>
  <rect class="box" x="935" y="119" width="215" height="52" rx="8"/>
  <text class="body" x="948" y="141">routes/products.js</text><text class="small" x="948" y="159">catalog · coupons</text>
  <rect class="box" x="705" y="184" width="210" height="52" rx="8"/>
  <text class="body" x="718" y="206">routes/customers.js</text><text class="small" x="718" y="224">Khata · settlements</text>
  <rect class="box" x="935" y="184" width="215" height="52" rx="8"/>
  <text class="body" x="948" y="206">routes/reports.js</text><text class="small" x="948" y="224">reports · preview · export</text>
  <path class="line" d="M615 138 H675"/>

  <!-- Order trace -->
  <rect class="group" x="30" y="275" width="1140" height="126" rx="12"/>
  <text class="head" x="50" y="301">Order placement flow — POST /api/orders (routes/orders.js)</text>
  <rect class="flow" x="50" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="64" cy="330" r="12"/><text class="badgeText" x="64" y="334">1</text>
  <text class="body" x="82" y="339">Browser submits</text><text class="small" x="64" y="363">items, qty, coupon, customer</text>
  <rect class="flow" x="237" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="251" cy="330" r="12"/><text class="badgeText" x="251" y="334">2</text>
  <text class="body" x="269" y="339">Read &amp; resolve</text><text class="small" x="251" y="363">store.read · inventory.find</text>
  <rect class="flow" x="424" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="438" cy="330" r="12"/><text class="badgeText" x="438" y="334">3</text>
  <text class="body" x="456" y="339">Check stock</text><text class="small" x="438" y="363">inventory.check</text>
  <rect class="flow" x="611" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="625" cy="330" r="12"/><text class="badgeText" x="625" y="334">4</text>
  <text class="body" x="643" y="339">Price &amp; validate</text><text class="small" x="625" y="363">pricing · coupons · tax</text>
  <rect class="flow" x="798" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="812" cy="330" r="12"/><text class="badgeText" x="812" y="334">5</text>
  <text class="body" x="830" y="339">Khata if needed</text><text class="small" x="812" y="363">ledger.chargeOrderToKhata</text>
  <rect class="flow" x="985" y="316" width="166" height="66" rx="8"/>
  <circle class="badge" cx="999" cy="330" r="12"/><text class="badgeText" x="999" y="334">6</text>
  <text class="body" x="1017" y="339">Save order</text><text class="small" x="999" y="363">reserve · orders.add · write</text>
  <path class="line" d="M216 349 H230"/><path class="line" d="M403 349 H417"/><path class="line" d="M590 349 H604"/><path class="line" d="M777 349 H791"/><path class="line" d="M964 349 H978"/>

  <!-- Libraries -->
  <rect class="group" x="30" y="423" width="760" height="304" rx="12"/>
  <text class="head" x="50" y="450">lib/ — application modules</text>
  <rect class="box" x="50" y="468" width="168" height="70" rx="8"/><text class="body" x="64" y="493">lib/store.js</text><text class="small" x="64" y="516">read · write · audit</text>
  <rect class="box" x="230" y="468" width="168" height="70" rx="8"/><text class="body" x="244" y="493">lib/orders.js</text><text class="small" x="244" y="516">add · get · cancel · list</text>
  <rect class="box" x="410" y="468" width="168" height="70" rx="8"/><text class="body" x="424" y="493">lib/inventory.js</text><text class="small" x="424" y="516">find · check · reserve</text>
  <rect class="ticket" x="590" y="468" width="178" height="70" rx="8"/><text class="body" x="604" y="493">lib/invoice.js</text><text class="small" x="604" y="516">computeInvoiceFigures · render</text>
  <rect class="box" x="50" y="552" width="168" height="70" rx="8"/><text class="body" x="64" y="577">lib/pricing.js</text><text class="small" x="64" y="600">subtotal · computeTotals</text>
  <rect class="box" x="230" y="552" width="168" height="70" rx="8"/><text class="body" x="244" y="577">lib/coupons.js</text><text class="small" x="244" y="600">validate · calculateDiscount</text>
  <rect class="box" x="410" y="552" width="168" height="70" rx="8"/><text class="body" x="424" y="577">lib/tax.js</text><text class="small" x="424" y="600">HSN rate · CGST/SGST split</text>
  <rect class="box" x="590" y="552" width="178" height="70" rx="8"/><text class="body" x="604" y="577">lib/ledger.js</text><text class="small" x="604" y="600">Khata · settlement</text>
  <rect class="box" x="50" y="636" width="168" height="70" rx="8"/><text class="body" x="64" y="661">lib/reports.js</text><text class="small" x="64" y="684">dashboard · GST reconciliation</text>
  <rect class="box" x="230" y="636" width="168" height="70" rx="8"/><text class="body" x="244" y="661">lib/dates.js</text><text class="small" x="244" y="684">today · date normalization</text>
  <path class="dashed" d="M705 254 V460 H679 V461"/>
  <text class="small" x="715" y="278">invoice endpoint → render()</text>

  <!-- Persistent data and configuration -->
  <rect class="box" x="830" y="439" width="320" height="92" rx="10"/>
  <text class="head" x="850" y="468">data/db.json</text>
  <text class="body" x="850" y="492">Products/stock · customers · orders</text>
  <text class="body" x="850" y="514">settlements · audit log</text>
  <path class="line" d="M790 503 H822"/>
  <text class="small" x="790" y="490">store.read/write</text>

  <rect class="box" x="830" y="555" width="320" height="86" rx="10"/>
  <text class="head" x="850" y="584">config.js</text>
  <text class="body" x="850" y="608">Shop metadata · tax slabs · coupons</text>
  <text class="body" x="850" y="629">defaults · port · admin key</text>
  <path class="dashed" d="M830 590 H800 V604 H777"/>
  <text class="small" x="785" y="630">used by pricing, tax, coupons, invoice</text>

  <!-- Legend -->
  <rect class="group" x="830" y="662" width="320" height="65" rx="10"/>
  <rect class="ticket" x="850" y="679" width="28" height="24" rx="4"/>
  <text class="body" x="891" y="697">Ticket focus (invoice calculations)</text>
  <text class="small" x="850" y="718">lib/tax.js stays standard: invoice.js does not call it.</text>

  <text class="small" x="30" y="771">Solid arrows: app flow / storage access · Dashed arrows: supporting dependency or invoice path</text>
</svg>
