<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#80bcb2"/></marker></defs><rect width="1200" height="800" fill="#0b201c"/><g font-family="Arial,sans-serif" fill="#edf8f5"><text x="30" y="39" font-size="28" fill="#edf8f5">ShopLedger / architecture</text><text x="30" y="65" font-size="16" fill="#8cbbb0">Ticket 1: Invoice &amp; GST mismatch | verified from repository source</text><rect x="30" y="90" width="330" height="92" rx="10" fill="#14342e" stroke="#396358"/><text x="45" y="116" font-size="18" fill="#ffffff">public/ browser UI</text><text x="45" y="140" font-size="14" fill="#c0d8d1">index.html · js/app.js · css/style.css</text><text x="45" y="161" font-size="14" fill="#c0d8d1">1  POST /api/orders; view invoice</text><rect x="420" y="90" width="345" height="92" rx="10" fill="#14342e" stroke="#396358"/><text x="435" y="116" font-size="18" fill="#ffffff">server.js</text><text x="435" y="140" font-size="14" fill="#c0d8d1">Express + body-parser + static UI</text><text x="435" y="161" font-size="14" fill="#c0d8d1">Mounts all four routers at /api</text><rect x="825" y="90" width="345" height="92" rx="10" fill="#14342e" stroke="#396358"/><text x="840" y="116" font-size="18" fill="#ffffff">config.js</text><text x="840" y="140" font-size="14" fill="#c0d8d1">Shop, port, coupons, GST slabs, stock</text><text x="840" y="161" font-size="14" fill="#c0d8d1">Used by tax, coupons and invoice</text><path d="M360 135L420 135" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="220" width="255" height="120" rx="10" fill="#14342e" stroke="#396358"/><text x="45" y="246" font-size="18" fill="#ffffff">routes/products.js</text><text x="45" y="270" font-size="14" fill="#c0d8d1">GET /products, /coupons</text><text x="45" y="291" font-size="14" fill="#c0d8d1">inventory + tax + coupons</text><text x="45" y="312" font-size="14" fill="#c0d8d1">store.read</text><rect x="315" y="220" width="255" height="120" rx="10" fill="#14342e" stroke="#396358"/><text x="330" y="246" font-size="18" fill="#ffffff">routes/orders.js</text><text x="330" y="270" font-size="14" fill="#c0d8d1">2  Resolve items; check stock</text><text x="330" y="291" font-size="14" fill="#c0d8d1">3  Validate coupon; price order</text><text x="330" y="312" font-size="14" fill="#c0d8d1">4  Khata debit; reserve; save</text><rect x="600" y="220" width="255" height="120" rx="10" fill="#14342e" stroke="#396358"/><text x="615" y="246" font-size="18" fill="#ffffff">routes/customers.js</text><text x="615" y="270" font-size="14" fill="#c0d8d1">GET /customers</text><text x="615" y="291" font-size="14" fill="#c0d8d1">POST /customers/:id/settle</text><text x="615" y="312" font-size="14" fill="#c0d8d1">ledger + store</text><rect x="885" y="220" width="285" height="120" rx="10" fill="#14342e" stroke="#396358"/><text x="900" y="246" font-size="18" fill="#ffffff">routes/reports.js</text><text x="900" y="270" font-size="14" fill="#c0d8d1">Dashboard, GST reconciliation</text><text x="900" y="291" font-size="14" fill="#c0d8d1">Pricing preview, admin export</text><text x="900" y="312" font-size="14" fill="#c0d8d1">reports + pricing + coupons + store</text><path d="M590 182L590 204" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><path d="M155 204H1020M155 204V218M442 204V218M727 204V218M1020 204V218" fill="none" stroke="#80bcb2" stroke-width="2"/><rect x="30" y="380" width="345" height="130" rx="10" fill="#14342e" stroke="#396358"/><text x="45" y="406" font-size="18" fill="#ffffff">lib/pricing.js</text><text x="45" y="430" font-size="14" fill="#c0d8d1">computeTotals: capped discount first</text><text x="45" y="451" font-size="14" fill="#c0d8d1">Per-line GST and rounding</text><text x="45" y="472" font-size="14" fill="#c0d8d1">Uses lib/coupons.js + lib/tax.js</text><text x="45" y="493" font-size="14" fill="#c0d8d1">Invoice now reuses this calculation</text><rect x="420" y="380" width="345" height="130" rx="10" fill="#224f40" stroke="#73efac"/><text x="435" y="406" font-size="18" fill="#73efac">lib/invoice.js  /  TICKET 1</text><text x="435" y="430" font-size="14" fill="#c0d8d1">computeInvoiceFigures → pricing</text><text x="435" y="451" font-size="14" fill="#c0d8d1">render → printable HTML</text><text x="435" y="472" font-size="14" fill="#c0d8d1">server: GET /orders/:id/invoice</text><text x="435" y="493" font-size="14" fill="#c0d8d1">lib/reports.js compares ledger vs invoice</text><rect x="825" y="380" width="345" height="130" rx="10" fill="#14342e" stroke="#396358"/><text x="840" y="406" font-size="18" fill="#ffffff">lib/inventory.js + lib/ledger.js</text><text x="840" y="430" font-size="14" fill="#c0d8d1">check / reserve / release stock</text><text x="840" y="451" font-size="14" fill="#c0d8d1">Khata charge / reverse / settlement</text><text x="840" y="472" font-size="14" fill="#c0d8d1">Both called from order workflows</text><path d="M442 340L200 378" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><path d="M420 445L377 445" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 340L990 378" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="550" width="345" height="105" rx="10" fill="#14342e" stroke="#396358"/><text x="45" y="576" font-size="18" fill="#ffffff">lib/orders.js + lib/dates.js</text><text x="45" y="600" font-size="14" fill="#c0d8d1">5  orders.add records totals + items</text><text x="45" y="621" font-size="14" fill="#c0d8d1">dates.today supplies order date</text><text x="45" y="642" font-size="14" fill="#c0d8d1">Also list, get and cancel orders</text><rect x="420" y="550" width="345" height="105" rx="10" fill="#14342e" stroke="#396358"/><text x="435" y="576" font-size="18" fill="#ffffff">lib/reports.js</text><text x="435" y="600" font-size="14" fill="#c0d8d1">Dashboard aggregation</text><text x="435" y="621" font-size="14" fill="#c0d8d1">GST reconciliation calls invoice</text><text x="435" y="642" font-size="14" fill="#c0d8d1">Uses inventory + ledger summaries</text><rect x="825" y="550" width="345" height="105" rx="10" fill="#14342e" stroke="#396358"/><text x="840" y="576" font-size="18" fill="#ffffff">lib/store.js</text><text x="840" y="600" font-size="14" fill="#c0d8d1">6  appendAudit + write(db)</text><text x="840" y="621" font-size="14" fill="#c0d8d1">read/write synchronous JSON</text><text x="840" y="642" font-size="14" fill="#c0d8d1">Shared by routers and invoice route</text><path d="M200 510L200 548" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><path d="M990 510L990 548" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><rect x="825" y="693" width="345" height="78" rx="10" fill="#14342e" stroke="#396358"/><text x="840" y="719" font-size="18" fill="#ffffff">data/db.json</text><text x="840" y="743" font-size="14" fill="#c0d8d1">Products, orders, customers, settlements</text><path d="M990 655L990 691" stroke="#80bcb2" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="704" font-size="14" fill="#73efac">ORDER FLOW</text><text x="30" y="732" font-size="16" fill="#edf8f5">1 Browser → 2 Resolve → 3 Price → 4 Debit/reserve → 5 Add → 6 Persist</text><text x="30" y="764" font-size="14" fill="#8cbbb0">Green: changed application module. Arrows: selected call/data paths, not exhaustive imports.</text></g></svg>