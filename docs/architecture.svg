<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger application architecture</title>
  <desc id="description">ShopLedger's browser, Express server, four routers, ten library modules, configuration and JSON database. An eight-step sequence follows order placement from the browser to storage and back. The printable invoice module is highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#687b90"/>
    </marker>
    <marker id="invoice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#a45121"/>
    </marker>
  </defs>
  <style>
    svg { font-family: "Segoe UI", Arial, sans-serif; }
    text { fill: #182c40; font-size: 13px; }
    .title { font-size: 34px; font-weight: 700; }
    .section { font-size: 20px; font-weight: 700; }
    .subhead { font-size: 14px; font-weight: 700; }
    .muted { fill: #475d72; }
    .mono, .file { font-family: Consolas, "Liberation Mono", monospace; }
    .mono { font-size: 12px; }
    .file { font-size: 13px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #ccd8e2; }
    .entry { fill: #e9f1f8; stroke: #aabbce; }
    .library { fill: #f3f6f9; stroke: #d8e1ea; }
    .card { fill: #ffffff; stroke: #c2cfdb; }
    .storage { fill: #e9f1f8; stroke: #aabbce; }
    .wire { fill: none; stroke: #687b90; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { marker-end: url(#arrow); }
    .invoice-wire { stroke: #a45121; marker-end: url(#invoice-arrow); }
    .invoice { fill: #fff0e2; stroke: #a45121; stroke-width: 1.5; }
    .invoice-text { fill: #793911; }
    .step { fill: #126b62; }
    .number { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .step-title { font-size: 15px; font-weight: 700; }
    .track { stroke: #89b7b0; stroke-width: 2; }
  </style>

  <rect width="1200" height="800" fill="#edf2f6"/>
  <text class="title" x="32" y="59">ShopLedger application architecture</text>
  <text class="muted" x="34" y="86">Express point of sale, Khata credit ledger, and printable GST invoices</text>

  <g aria-label="Legend">
    <circle class="step" cx="854" cy="55" r="11"/>
    <text class="number" x="854" y="60">1</text>
    <text x="873" y="60">Order placement</text>
    <rect class="invoice" x="1008" y="45" width="22" height="20" rx="4"/>
    <text x="1039" y="60">Ticket module</text>
  </g>

  <rect class="panel" x="32" y="110" width="762" height="658" rx="14"/>
  <rect class="panel" x="812" y="110" width="356" height="658" rx="14"/>

  <g aria-label="Application components">
    <text class="section" x="52" y="140">Application components</text>

    <path class="wire arrow" d="M352 189H380"/>
    <path class="wire" d="M539 227V269M137 269H689"/>
    <path class="wire arrow" d="M137 269V283"/>
    <path class="wire arrow" d="M321 269V283"/>
    <path class="wire arrow" d="M505 269V283"/>
    <path class="wire arrow" d="M689 269V283"/>
    <path class="wire arrow" d="M137 350V373"/>
    <path class="wire arrow" d="M321 350V373"/>
    <path class="wire arrow" d="M505 350V373"/>
    <path class="wire arrow" d="M689 350V373"/>

    <rect class="entry" x="52" y="154" width="300" height="73" rx="8"/>
    <text class="file" x="64" y="175">public/</text>
    <text x="64" y="195">Checkout, orders, Khata, and audit screens</text>
    <text class="mono muted" x="64" y="214">index.html · js/app.js · css/style.css</text>

    <rect class="entry" x="380" y="154" width="394" height="73" rx="8"/>
    <text class="file" x="392" y="175">server.js</text>
    <text x="392" y="195">Serves static files and mounts the four Express routers</text>
    <text class="mono invoice-text" x="392" y="214">GET /orders/:id/invoice</text>

    <text class="subhead" x="52" y="254">Express routers mounted under /api</text>

    <rect class="card" x="52" y="283" width="170" height="67" rx="7"/>
    <text class="file" x="63" y="304">routes/products.js</text>
    <text class="mono muted" x="63" y="323">GET /products</text>
    <text class="mono muted" x="63" y="340">GET /coupons</text>

    <rect class="card" x="236" y="283" width="170" height="67" rx="7"/>
    <text class="file" x="247" y="304">routes/orders.js</text>
    <text class="mono muted" x="247" y="323">POST /orders</text>
    <text class="muted" x="247" y="340">Order lookup and cancel</text>

    <rect class="card" x="420" y="283" width="170" height="67" rx="7"/>
    <text class="file" x="431" y="304">routes/customers.js</text>
    <text class="mono muted" x="431" y="323">GET /customers</text>
    <text class="muted" x="431" y="340">Khata settlements</text>

    <rect class="card" x="604" y="283" width="170" height="67" rx="7"/>
    <text class="file" x="615" y="304">routes/reports.js</text>
    <text class="muted" x="615" y="323">Dashboard, GST report</text>
    <text class="muted" x="615" y="340">Pricing preview, export</text>

    <rect class="library" x="44" y="374" width="734" height="261" rx="8"/>
    <text class="subhead" x="53" y="394">Application libraries</text>

    <rect class="card" x="52" y="404" width="170" height="64" rx="7"/>
    <text class="file" x="63" y="425">lib/inventory.js</text>
    <text class="muted" x="63" y="446">Find, check, and deduct</text>
    <text class="muted" x="63" y="462">stock</text>

    <rect class="card" x="236" y="404" width="170" height="64" rx="7"/>
    <text class="file" x="247" y="425">lib/pricing.js</text>
    <text class="mono muted" x="247" y="446">computeTotals()</text>
    <text class="muted" x="247" y="462">Uses coupons and tax</text>

    <rect class="card" x="420" y="404" width="170" height="64" rx="7"/>
    <text class="file" x="431" y="425">lib/coupons.js</text>
    <text class="muted" x="431" y="446">Coupon eligibility</text>
    <text class="muted" x="431" y="462">and discount amount</text>

    <rect class="card" x="604" y="404" width="170" height="64" rx="7"/>
    <text class="file" x="615" y="425">lib/tax.js</text>
    <text class="mono muted" x="615" y="446">getRateForItem()</text>
    <text class="muted" x="615" y="462">HSN slabs and GST split</text>

    <rect class="card" x="52" y="480" width="170" height="64" rx="7"/>
    <text class="file" x="63" y="501">lib/orders.js</text>
    <text class="mono muted" x="63" y="522">add() · get()</text>
    <text class="mono muted" x="63" y="538">list() · cancel()</text>

    <rect class="card" x="236" y="480" width="170" height="64" rx="7"/>
    <text class="file" x="247" y="501">lib/ledger.js</text>
    <text class="muted" x="247" y="522">Khata charges, balances,</text>
    <text class="muted" x="247" y="538">and settlements</text>

    <rect class="card" x="420" y="480" width="170" height="64" rx="7"/>
    <text class="file" x="431" y="501">lib/dates.js</text>
    <text class="mono muted" x="431" y="522">today()</text>
    <text class="mono muted" x="431" y="538">normalizeDateKey()</text>

    <rect class="card" x="604" y="480" width="170" height="64" rx="7"/>
    <text class="file" x="615" y="501">lib/reports.js</text>
    <text class="muted" x="615" y="522">Compares ledger totals</text>
    <text class="muted" x="615" y="538">with invoice figures</text>
    <path class="wire arrow" d="M689 544V557"/>

    <path class="wire arrow" d="M137 621V671"/>
    <path class="wire invoice-wire" d="M774 202H784V584H774"/>
    <path class="wire arrow" d="M505 635V671"/>
    <rect class="card" x="52" y="557" width="170" height="64" rx="7"/>
    <text class="file" x="63" y="578">lib/store.js</text>
    <text class="mono muted" x="63" y="599">read() · write()</text>
    <text class="mono muted" x="63" y="615">appendAudit()</text>

    <text class="muted" x="574" y="579" text-anchor="end">Invoice recalculates from saved item lines.</text>
    <text class="muted" x="574" y="598" text-anchor="end">The server loads the order with <tspan class="mono">orders.get()</tspan>.</text>
    <rect class="invoice" x="590" y="557" width="184" height="64" rx="7"/>
    <text class="file invoice-text" x="601" y="578">lib/invoice.js</text>
    <text class="mono invoice-text" x="601" y="599">render()</text>
    <text class="mono invoice-text" x="601" y="615">computeInvoiceFigures()</text>

    <text class="muted" x="149" y="656">Read and write JSON</text>
    <text class="muted" x="517" y="656">Shared settings</text>
    <rect class="storage" x="52" y="671" width="326" height="72" rx="8"/>
    <text class="file" x="64" y="694">data/db.json</text>
    <text x="64" y="715">Products, orders, customers, settlements,</text>
    <text x="64" y="733">audit log, and ID counters</text>

    <rect class="entry" x="392" y="671" width="382" height="72" rx="8"/>
    <text class="file" x="404" y="694">config.js</text>
    <text x="404" y="715">Server port, shop details, GST slabs and fallback,</text>
    <text x="404" y="733">inventory defaults, coupon rules, and export key</text>
  </g>

  <g aria-label="Order placement sequence">
    <text class="section" x="832" y="140">Placing an order</text>
    <text class="muted" x="832" y="164">Successful checkout request</text>
    <line class="track" x1="843" y1="198" x2="843" y2="695"/>

    <circle class="step" cx="843" cy="198" r="12"/>
    <text class="number" x="843" y="203">1</text>
    <text class="step-title" x="865" y="202">Submit the cart</text>
    <text class="mono muted" x="865" y="222">getSelectedCartItems()</text>
    <text class="mono muted" x="865" y="239">POST /api/orders</text>

    <circle class="step" cx="843" cy="269" r="12"/>
    <text class="number" x="843" y="274">2</text>
    <text class="step-title" x="865" y="273">Load data and check stock</text>
    <text class="mono muted" x="865" y="293">store.read()</text>
    <text class="mono muted" x="865" y="310">inventory.find() → inventory.check()</text>

    <circle class="step" cx="843" cy="340" r="12"/>
    <text class="number" x="843" y="345">3</text>
    <text class="step-title" x="865" y="344">Validate the coupon if supplied</text>
    <text class="mono muted" x="865" y="364">pricing.subtotal()</text>
    <text class="mono muted" x="865" y="381">coupons.validate()</text>

    <circle class="step" cx="843" cy="411" r="12"/>
    <text class="number" x="843" y="416">4</text>
    <text class="step-title" x="865" y="415">Calculate the amount due</text>
    <text class="mono muted" x="865" y="435">pricing.computeTotals()</text>
    <text class="muted" x="865" y="452">Apportion coupon, then apply HSN GST</text>

    <circle class="step" cx="843" cy="482" r="12"/>
    <text class="number" x="843" y="487">5</text>
    <text class="step-title" x="865" y="486">Charge Khata if selected</text>
    <text class="mono muted" x="865" y="506">ledger.chargeOrderToKhata()</text>
    <text class="muted" x="865" y="523">Check the credit limit and update the balance</text>

    <circle class="step" cx="843" cy="553" r="12"/>
    <text class="number" x="843" y="558">6</text>
    <text class="step-title" x="865" y="557">Deduct stock and add the order</text>
    <text class="mono muted" x="865" y="577">inventory.reserve() → orders.add()</text>
    <text class="muted" x="865" y="594">Record item snapshots and checkout totals</text>

    <circle class="step" cx="843" cy="624" r="12"/>
    <text class="number" x="843" y="629">7</text>
    <text class="step-title" x="865" y="628">Append audit and write the database</text>
    <text class="mono muted" x="865" y="648">store.appendAudit() → store.write()</text>
    <text class="muted" x="865" y="665">Persist stock, order, and any Khata debit</text>

    <circle class="step" cx="843" cy="695" r="12"/>
    <text class="number" x="843" y="700">8</text>
    <text class="step-title" x="865" y="699">Return the order</text>
    <text class="mono muted" x="865" y="719">HTTP 201 + order JSON</text>
    <text class="muted" x="865" y="736">Browser shows ledger total and invoice link</text>
  </g>
</svg>
