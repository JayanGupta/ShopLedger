<text x="347" y="164" class="s">JSON parser • static public/</text><text x="347" y="185" class="s">mounts /api routers</text><text x="347" y="206" class="c">GET /orders/:id/invoice</text>
<rect x="640" y="85" width="210" height="135" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
