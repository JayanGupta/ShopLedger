<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and Ticket 1 invoice-GST path</title><desc id="desc">Express entry points, one box per route and library module, a numbered order flow, and accurately drawn require dependencies.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker><marker id="hotArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#c2410c"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.section{font-size:17px;font-weight:700;fill:#334155}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.hot{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.data{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.t{font-size:15px;font-weight:700}.s{font-size:12px;fill:#526174}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.hotedge{stroke:#c2410c;stroke-width:3;fill:none;marker-end:url(#hotArrow)}.n{fill:#0f766e}.nt{font-size:13px;font-weight:700;fill:#fff}</style></defs>
  <rect width="1500" height="1020" fill="#f8fafc"/><text x="50" y="52" class="h">ShopLedger · module architecture</text><text x="50" y="78" class="s">Orange boxes and arrows show the Ticket 1 invoice / GST reconciliation path.</text>
  <text x="50" y="118" class="section">Entry points and configuration</text>
  <rect x="50" y="138" width="185" height="65" rx="8" class="box"/><text x="72" y="166" class="t">public/index.html</text><text x="72" y="188" class="s">browser SPA</text>
  <rect x="290" y="138" width="165" height="65" rx="8" class="box"/><text x="312" y="166" class="t">server.js</text><text x="312" y="188" class="s">Express setup</text>
  <rect x="510" y="138" width="165" height="65" rx="8" class="box"/><text x="532" y="166" class="t">config.js</text><text x="532" y="188" class="s">shop, coupon, tax config</text>
  <path d="M235 170H290" class="edge"/><path d="M455 170H510" class="edge"/>
  <text x="50" y="253" class="section">HTTP routes</text>
  <rect x="50" y="273" width="180" height="68" rx="8" class="box"/><text x="72" y="302" class="t">routes/orders.js</text><text x="72" y="323" class="s">orders API</text>
  <rect x="270" y="273" width="180" height="68" rx="8" class="box"/><text x="292" y="302" class="t">routes/products.js</text><text x="292" y="323" class="s">products API</text>
  <rect x="490" y="273" width="180" height="68" rx="8" class="box"/><text x="512" y="302" class="t">routes/customers.js</text><text x="512" y="323" class="s">Khata API</text>
  <rect x="710" y="273" width="180" height="68" rx="8" class="hot"/><text x="732" y="302" class="t">routes/reports.js</text><text x="732" y="323" class="s">GST reconciliation</text>
  <rect x="930" y="273" width="230" height="68" rx="8" class="hot"/><text x="952" y="302" class="t">GET /orders/:id/invoice</text><text x="952" y="323" class="s">server.js printable route</text>
  <text x="50" y="391" class="section">Domain modules</text>
  <rect x="50" y="415" width="150" height="66" rx="8" class="data"/><text x="72" y="443" class="t">lib/store.js</text><text x="72" y="464" class="s">JSON persistence</text>
  <rect x="240" y="415" width="150" height="66" rx="8" class="box"/><text x="262" y="443" class="t">lib/orders.js</text><text x="262" y="464" class="s">order lifecycle</text>
  <rect x="430" y="415" width="150" height="66" rx="8" class="box"/><text x="452" y="443" class="t">lib/inventory.js</text><text x="452" y="464" class="s">stock controls</text>
  <rect x="620" y="415" width="150" height="66" rx="8" class="box"/><text x="642" y="443" class="t">lib/ledger.js</text><text x="642" y="464" class="s">Khata ledger</text>
  <rect x="810" y="415" width="150" height="66" rx="8" class="hot"/><text x="832" y="443" class="t">lib/pricing.js</text><text x="832" y="464" class="s">canonical totals</text>
  <rect x="1000" y="415" width="150" height="66" rx="8" class="hot"/><text x="1022" y="443" class="t">lib/invoice.js</text><text x="1022" y="464" class="s">print figures</text>
  <rect x="1190" y="415" width="150" height="66" rx="8" class="hot"/><text x="1212" y="443" class="t">lib/reports.js</text><text x="1212" y="464" class="s">GST comparison</text>
  <rect x="240" y="550" width="150" height="60" rx="8" class="box"/><text x="262" y="576" class="t">lib/dates.js</text><text x="262" y="596" class="s">date helpers</text>
  <rect x="810" y="550" width="150" height="60" rx="8" class="box"/><text x="832" y="576" class="t">lib/tax.js</text><text x="832" y="596" class="s">HSN GST slabs</text>
  <rect x="1000" y="550" width="150" height="60" rx="8" class="box"/><text x="1022" y="576" class="t">lib/coupons.js</text><text x="1022" y="596" class="s">coupon rules</text>
  <rect x="50" y="550" width="150" height="60" rx="8" class="data"/><text x="72" y="576" class="t">data/db.json</text><text x="72" y="596" class="s">runtime data</text>
  <path d="M800 341V370H1265V415" class="hotedge"/><path d="M1265 415H1150" class="hotedge"/><path d="M1000 448H960" class="hotedge"/><path d="M885 481V550" class="hotedge"/><path d="M960 448H980V550H1000" class="hotedge"/><path d="M315 481V550" class="edge"/><path d="M695 481V520H390V580" class="edge"/><path d="M125 481V550" class="edge"/>
  <text x="50" y="675" class="section">Numbered new-order flow</text>
  <circle cx="70" cy="720" r="16" class="n"/><text x="66" y="725" class="nt">1</text><text x="98" y="725" class="s">routes/orders validates request</text><circle cx="360" cy="720" r="16" class="n"/><text x="356" y="725" class="nt">2</text><text x="388" y="725" class="s">inventory.check</text><circle cx="600" cy="720" r="16" class="n"/><text x="596" y="725" class="nt">3</text><text x="628" y="725" class="s">pricing.computeTotals</text><circle cx="900" cy="720" r="16" class="n"/><text x="896" y="725" class="nt">4</text><text x="928" y="725" class="s">ledger.chargeOrderToKhata</text>
  <circle cx="70" cy="770" r="16" class="n"/><text x="66" y="775" class="nt">5</text><text x="98" y="775" class="s">inventory.reserve</text><circle cx="360" cy="770" r="16" class="n"/><text x="356" y="775" class="nt">6</text><text x="388" y="775" class="s">orders.add</text><circle cx="600" cy="770" r="16" class="n"/><text x="596" y="775" class="nt">7</text><text x="628" y="775" class="s">store.write → data/db.json</text>
  <text x="50" y="850" class="section">Legend</text><rect x="50" y="870" width="26" height="18" class="box"/><text x="88" y="885" class="s">standard module / route</text><rect x="330" y="870" width="26" height="18" class="hot"/><text x="368" y="885" class="s">Ticket 1 invoice-GST dependency</text><rect x="690" y="870" width="26" height="18" class="data"/><text x="728" y="885" class="s">persistent JSON data boundary</text><text x="50" y="935" class="s">Arrows represent real local require() dependencies only; the numbered flow is a runtime call sequence.</text>
</svg>
