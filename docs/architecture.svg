<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">Browser, Express entry point, four routers, ten library modules, configuration and JSON storage. The numbered sequence below traces order creation. Invoice is highlighted as ticket scope; tax is a checkout dependency, not an invoice dependency.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b45; font-size: 12px; }
      .heading { font-size: 25px; font-weight: bold; }
      .name { font-size: 15px; font-weight: bold; }
      .section { font-size: 13px; font-weight: bold; fill: #52647a; }
      .box { fill: #ffffff; stroke: #9eafc1; stroke-width: 1.5; rx: 9; }
      .router { fill: #edf5ff; stroke: #5080b6; stroke-width: 1.5; rx: 9; }
      .ticket { fill: #fff0dd; stroke: #bb6416; stroke-width: 2; rx: 9; }
      .wire { fill: none; stroke: #72859b; stroke-width: 1.5; marker-end: url(#arrow); }
      .invoiceWire { fill: none; stroke: #bb6416; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#orangeArrow); }
      .num { fill: #ffffff; font-size: 13px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#72859b"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bb6416"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <text x="24" y="34" class="heading">ShopLedger · architecture</text>
  <text x="24" y="56">Node / Express POS, Khata ledger and printable GST invoices · source-derived module map</text>
  <rect x="821" y="17" width="15" height="15" class="ticket"/><text x="844" y="29">Ticket: invoice.js</text>
  <path d="M977 25H1006" class="wire"/><text x="1013" y="29">Request / data path</text>
  <path d="M821 48H851" class="invoiceWire"/><text x="860" y="52">Separate invoice request</text>

  <rect x="24" y="82" width="320" height="105" class="box"/>
  <text x="40" y="106" class="name">Browser UI · public/</text>
  <text x="40" y="126">index.html · css/style.css · js/app.js</text>
  <text x="40" y="146">POS, orders, Khata, inventory and GST audit</text>
  <text x="40" y="169">getSelectedCartItems() → post()</text>
  <path d="M344 131H400" class="wire"/>
  <text x="351" y="120">HTTP</text>
  <rect x="400" y="82" width="390" height="105" class="box"/>
  <text x="416" y="106" class="name">server.js · Express app</text>
  <text x="416" y="126">JSON parser · static public/ · /api routers</text>
  <text x="416" y="146">GET /orders/:id/invoice:</text>
  <text x="416" y="166">store.read() → orders.get() → invoice.render()</text>
  <rect x="870" y="82" width="306" height="105" class="box"/>
  <text x="886" y="106" class="name">config.js</text>
  <text x="886" y="126">Shop, port, coupons, HSN slabs, inventory</text>
  <text x="886" y="146">Read by server; routes/reports;</text>
  <text x="886" y="166">lib/{coupons, tax, inventory, invoice}</text>

  <text x="24" y="210" class="section">ROUTERS · all mounted under /api · “uses” lists direct library dependencies</text>
  <path d="M595 187V220H160V231M595 220H451V231M595 220H742V231M595 220H1033V231" class="wire"/>
  <rect x="24" y="232" width="279" height="89" class="router"/>
  <text x="38" y="254" class="name">routes/products.js</text>
  <text x="38" y="274">GET /products · GET /coupons</text>
  <text x="38" y="294">uses store, inventory, tax, coupons</text>
  <rect x="315" y="232" width="279" height="89" class="router"/>
  <text x="329" y="254" class="name">routes/orders.js</text>
  <text x="329" y="274">GET/POST /orders · get/cancel by ID</text>
  <text x="329" y="294">uses store, inventory, pricing, coupons,</text>
  <text x="329" y="310">orders, ledger</text>
  <rect x="606" y="232" width="279" height="89" class="router"/>
  <text x="620" y="254" class="name">routes/customers.js</text>
  <text x="620" y="274">GET /customers · POST /customers/:id/settle</text>
  <text x="620" y="294">uses store, ledger</text>
  <rect x="897" y="232" width="279" height="89" class="router"/>
  <text x="911" y="254" class="name">routes/reports.js</text>
  <text x="911" y="274">Dashboard, GST reconciliation,</text>
  <text x="911" y="290">POST /pricing/preview · GET /admin/export</text>
  <text x="911" y="310">uses store, reports, pricing, coupons</text>

  <text x="24" y="345" class="section">LIBRARIES · function names below are exported · “uses” lists local library dependencies</text>
  <rect x="24" y="358" width="220" height="78" class="box"/>
  <text x="36" y="379" class="name">lib/pricing.js</text>
  <text x="36" y="398">subtotal(), discount(), computeTotals()</text>
  <text x="36" y="419">uses tax, coupons</text>
  <rect x="257" y="358" width="220" height="78" class="box"/>
  <text x="269" y="379" class="name">lib/tax.js</text>
  <text x="269" y="398">getRateForItem(), getSlabPercent()</text>
  <text x="269" y="419">splitCgstSgst() · HSN / default rate</text>
  <rect x="490" y="358" width="220" height="78" class="box"/>
  <text x="502" y="379" class="name">lib/coupons.js</text>
  <text x="502" y="398">normalizeCode(), validate()</text>
  <text x="502" y="419">calculateDiscount(), listActive()</text>
  <rect x="723" y="358" width="220" height="78" class="box"/>
  <text x="735" y="379" class="name">lib/inventory.js</text>
  <text x="735" y="398">find(), check(), reserve(), release()</text>
  <text x="735" y="419">getSellableStock(), summarize()</text>
  <rect x="956" y="358" width="220" height="78" class="ticket"/>
  <text x="968" y="379" class="name">lib/invoice.js · TICKET</text>
  <text x="968" y="398">render(), computeInvoiceFigures()</text>
  <text x="968" y="419">Uses config directly; does not call tax</text>
  <path d="M790 148H1190V397H1177" class="invoiceWire"/>

  <rect x="24" y="449" width="220" height="78" class="box"/>
  <text x="36" y="470" class="name">lib/orders.js</text>
  <text x="36" y="489">add(), get(), list(), cancel()</text>
  <text x="36" y="510">uses dates, inventory, ledger</text>
  <rect x="257" y="449" width="220" height="78" class="box"/>
  <text x="269" y="470" class="name">lib/ledger.js</text>
  <text x="269" y="489">chargeOrderToKhata(), findCustomer()</text>
  <text x="269" y="510">recordSettlement() · uses dates</text>
  <rect x="490" y="449" width="220" height="78" class="box"/>
  <text x="502" y="470" class="name">lib/store.js</text>
  <text x="502" y="489">read(), write(), appendAudit()</text>
  <text x="502" y="510">Synchronous whole-file JSON I/O</text>
  <rect x="723" y="449" width="220" height="78" class="box"/>
  <text x="735" y="470" class="name">lib/dates.js</text>
  <text x="735" y="489">today(), normalizeDateKey()</text>
  <text x="735" y="510">getFiscalYear()</text>
  <rect x="956" y="449" width="220" height="78" class="box"/>
  <text x="968" y="470" class="name">lib/reports.js</text>
  <text x="968" y="489">getDashboardSummary()</text>
  <text x="968" y="506">getGstReconciliation()</text>
  <text x="968" y="521">uses inventory, ledger, invoice</text>
  <path d="M600 527V545" class="wire"/>
  <rect x="490" y="547" width="220" height="40" class="box"/>
  <text x="600" y="572" class="name" text-anchor="middle">data/db.json</text>
  <text x="24" y="553">Saved: products, customers, orders, settlements,</text>
  <text x="24" y="573">auditLog, nextOrderId, nextSettlementId</text>
  <text x="735" y="553">Checkout: discounted lines → HSN GST.</text>
  <text x="735" y="573">Invoice: full-price GST → separate coupon math.</text>

  <rect x="24" y="606" width="1152" height="174" rx="10" fill="#e6eef8"/>
  <text x="40" y="629" class="name">Placing an order · sequence inside POST /api/orders</text>
  <circle cx="48" cy="652" r="11" fill="#315f92"/><text x="48" y="657" class="num">1</text>
  <text x="67" y="657">public/js/app.js: place onclick → post('/api/orders', payload)</text>
  <circle cx="618" cy="652" r="11" fill="#315f92"/><text x="618" y="657" class="num">2</text>
  <text x="637" y="657">server.js → routes/orders.js handler → store.read()</text>
  <circle cx="48" cy="680" r="11" fill="#315f92"/><text x="48" y="685" class="num">3</text>
  <text x="67" y="685">inventory.find() → copy product fields → inventory.check()</text>
  <circle cx="618" cy="680" r="11" fill="#315f92"/><text x="618" y="685" class="num">4</text>
  <text x="637" y="685">pricing.subtotal() → coupons.normalizeCode() / validate()</text>
  <circle cx="48" cy="708" r="11" fill="#315f92"/><text x="48" y="713" class="num">5</text>
  <text x="67" y="713">pricing.computeTotals() → coupons + tax → total</text>
  <circle cx="618" cy="708" r="11" fill="#315f92"/><text x="618" y="713" class="num">6</text>
  <text x="637" y="713">ledger.findCustomer(); Khata: chargeOrderToKhata()</text>
  <circle cx="48" cy="736" r="11" fill="#315f92"/><text x="48" y="741" class="num">7</text>
  <text x="67" y="741">inventory.reserve() → orders.add() [dates.today()]</text>
  <circle cx="618" cy="736" r="11" fill="#315f92"/><text x="618" y="741" class="num">8</text>
  <text x="637" y="741">store.appendAudit() → store.write(db) → 201 order JSON</text>
  <text x="40" y="765">Saved together: stock deductions, optional Khata debit, order + item snapshots + monetary totals, incremented ID and audit entry.</text>
</svg>
