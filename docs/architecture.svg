<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI connects to Express server and routers. Routers use library modules, configuration, and JSON storage. A numbered highlighted flow explains order placement.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 25px Arial,sans-serif;fill:#0f172a}.sub{font:13px Arial,sans-serif;fill:#475569}.h{font:700 15px Arial,sans-serif;fill:#0f172a}.t{font:12px Arial,sans-serif;fill:#1e293b}.small{font:11px Arial,sans-serif;fill:#334155}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.group{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.route{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.2}.lib{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.1}.ticket{fill:#fff7ed;stroke:#f97316;stroke-width:2}.data{fill:#fdf4ff;stroke:#d946ef;stroke-width:1.5}.note{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}.arrow{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#bluearrow)}.dash{fill:none;stroke:#f97316;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#orangeArrow)}.n{fill:#2563eb}.nt{font:700 11px Arial,sans-serif;fill:#fff}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b"/></marker>
    <marker id="bluearrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#2563eb"/></marker>
    <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#f97316"/></marker>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text x="34" y="38" class="title">ShopLedger — Node/Express POS, Khata &amp; GST architecture</text>
  <text x="34" y="60" class="sub">Verified source map and order-placement path · highlighted orange modules are the invoice/tax focus</text>

  <!-- UI and server -->
  <rect x="35" y="92" width="200" height="136" rx="8" class="group"/>
  <text x="50" y="118" class="h">Browser UI · public/</text>
  <text x="50" y="140" class="t">index.html</text><text x="50" y="158" class="t">js/app.js</text><text x="50" y="176" class="t">css/style.css</text>
  <text x="50" y="205" class="small">POS · Orders · Khata · Audit</text>

  <rect x="290" y="92" width="205" height="136" rx="8" class="box"/>
  <text x="307" y="118" class="h">server.js · Express</text>
  <text x="307" y="141" class="t">bodyParser.json()</text>
  <text x="307" y="160" class="t">static public/</text>
  <text x="307" y="179" class="t">mounts /api routers</text>
  <text x="307" y="207" class="small">GET /orders/:id/invoice</text>
  <path d="M235 160 H290" class="arrow"/>

  <!-- routers -->
  <rect x="545" y="82" width="300" height="170" rx="8" class="group"/>
  <text x="560" y="107" class="h">routes/ · mounted at /api</text>
  <rect x="560" y="120" width="125" height="48" rx="5" class="route"/><text x="570" y="140" class="t">products.js</text><text x="570" y="157" class="small">products, coupons</text>
  <rect x="700" y="120" width="130" height="48" rx="5" class="route"/><text x="710" y="140" class="t">orders.js</text><text x="710" y="157" class="small">orders, cancel</text>
  <rect x="560" y="184" width="125" height="48" rx="5" class="route"/><text x="570" y="204" class="t">customers.js</text><text x="570" y="221" class="small">customers, settle</text>
  <rect x="700" y="184" width="130" height="48" rx="5" class="route"/><text x="710" y="204" class="t">reports.js</text><text x="710" y="221" class="small">dashboard, preview, GST</text>
  <path d="M495 160 H545" class="arrow"/>

  <!-- config and data -->
  <rect x="905" y="92" width="255" height="72" rx="8" class="note"/>
  <text x="920" y="116" class="h">config.js</text><text x="920" y="136" class="t">shop · HSN GST slabs · coupons</text><text x="920" y="151" class="small">inventory defaults · admin key</text>
  <rect x="905" y="184" width="255" height="68" rx="8" class="data"/>
  <text x="920" y="208" class="h">data/db.json</text><text x="920" y="228" class="t">products · customers · orders</text><text x="920" y="243" class="small">settlements · audit log · counters</text>

  <!-- libraries -->
  <rect x="35" y="278" width="1125" height="262" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="52" y="305" class="h">lib/ · domain and persistence modules</text>
  <g>
    <rect x="52" y="322" width="164" height="68" rx="6" class="lib"/><text x="63" y="344" class="h">store.js</text><text x="63" y="363" class="small">read() · write()</text><text x="63" y="379" class="small">appendAudit()</text>
    <rect x="230" y="322" width="164" height="68" rx="6" class="lib"/><text x="241" y="344" class="h">inventory.js</text><text x="241" y="363" class="small">find() · check()</text><text x="241" y="379" class="small">reserve() · release()</text>
    <rect x="408" y="322" width="164" height="68" rx="6" class="lib"/><text x="419" y="344" class="h">pricing.js</text><text x="419" y="363" class="small">subtotal() · discount()</text><text x="419" y="379" class="small">computeTotals()</text>
    <rect x="586" y="322" width="164" height="68" rx="6" class="lib"/><text x="597" y="344" class="h">coupons.js</text><text x="597" y="363" class="small">normalizeCode() · validate()</text><text x="597" y="379" class="small">calculateDiscount()</text>
    <rect x="764" y="322" width="164" height="68" rx="6" class="lib"/><text x="775" y="344" class="h">orders.js</text><text x="775" y="363" class="small">add() · get() · cancel()</text><text x="775" y="379" class="small">list()</text>
    <rect x="942" y="322" width="200" height="68" rx="6" class="lib"/><text x="953" y="344" class="h">ledger.js</text><text x="953" y="363" class="small">findCustomer() · chargeOrderToKhata()</text><text x="953" y="379" class="small">recordSettlement()</text>
    <rect x="52" y="410" width="164" height="68" rx="6" class="ticket"/><text x="63" y="432" class="h">invoice.js ★</text><text x="63" y="451" class="small">computeInvoiceFigures()</text><text x="63" y="467" class="small">render()</text>
    <rect x="230" y="410" width="164" height="68" rx="6" class="ticket"/><text x="241" y="432" class="h">tax.js ★</text><text x="241" y="451" class="small">getRateForItem()</text><text x="241" y="467" class="small">splitCgstSgst()</text>
    <rect x="408" y="410" width="164" height="68" rx="6" class="lib"/><text x="419" y="432" class="h">reports.js</text><text x="419" y="451" class="small">getDashboardSummary()</text><text x="419" y="467" class="small">getGstReconciliation()</text>
    <rect x="586" y="410" width="164" height="68" rx="6" class="lib"/><text x="597" y="432" class="h">dates.js</text><text x="597" y="451" class="small">today()</text><text x="597" y="467" class="small">normalizeDateKey()</text>
  </g>
  <path d="M700 252 V290 H490" class="arrow"/><path d="M1032 164 V322" class="arrow"/><path d="M1032 252 V290 H135" class="arrow"/>
  <path d="M216 444 H230" class="dash"/><text x="285" y="502" class="small" fill="#c2410c">Invoice renderer uses config default GST, not tax.js</text>

  <!-- numbered flow -->
  <rect x="35" y="570" width="1125" height="188" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="52" y="596" class="h">Numbered flow: POST /api/orders</text>
  <g>
    <circle cx="72" cy="624" r="12" class="n"/><text x="68" y="628" class="nt">1</text><text x="91" y="628" class="t">UI posts items, customer, payment, coupon</text>
    <circle cx="370" cy="624" r="12" class="n"/><text x="366" y="628" class="nt">2</text><text x="389" y="628" class="t">routes/orders.js resolves products</text>
    <circle cx="700" cy="624" r="12" class="n"/><text x="696" y="628" class="nt">3</text><text x="719" y="628" class="t">inventory.check() verifies stock</text>
    <circle cx="72" cy="680" r="12" class="n"/><text x="68" y="684" class="nt">4</text><text x="91" y="684" class="t">coupons.validate() + pricing.computeTotals()</text>
    <circle cx="470" cy="680" r="12" class="n"/><text x="466" y="684" class="nt">5</text><text x="489" y="684" class="t">optional ledger.chargeOrderToKhata()</text>
    <circle cx="820" cy="680" r="12" class="n"/><text x="816" y="684" class="nt">6</text><text x="839" y="684" class="t">inventory.reserve() + orders.add()</text>
    <circle cx="72" cy="730" r="12" class="n"/><text x="68" y="734" class="nt">7</text><text x="91" y="734" class="t">store.appendAudit() + store.write(db.json) → 201 order response</text>
  </g>
  <path d="M325 624 H355" class="flow"/><path d="M655 624 H685" class="flow"/><path d="M950 624 V660 H90" class="flow"/><path d="M420 680 H455" class="flow"/><path d="M770 680 H805" class="flow"/><path d="M1040 680 V715 H90" class="flow"/>

  <rect x="887" y="704" width="255" height="36" rx="5" fill="#fff" stroke="#cbd5e1"/><rect x="900" y="715" width="14" height="14" class="ticket"/><text x="922" y="727" class="small">orange = ticket focus · ★ = highlighted</text>
</svg>
