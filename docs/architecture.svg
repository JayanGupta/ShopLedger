<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram of the browser UI, Express server, route files, library modules, configuration, JSON data store, and the numbered order flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#52657a"/>
    </marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#126782"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 24px Arial, sans-serif; fill: #172b3a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #516575; }
      .group { fill: #ffffff; stroke: #9db0bd; stroke-width: 1.5; rx: 10; }
      .groupTitle { font: 700 15px Arial, sans-serif; fill: #234255; }
      .box { fill: #edf5f8; stroke: #7e9cac; stroke-width: 1.2; rx: 7; }
      .route { fill: #eef2ff; stroke: #8897c8; stroke-width: 1.2; rx: 7; }
      .lib { fill: #f3f6f7; stroke: #94a7ae; stroke-width: 1.1; rx: 6; }
      .focus { fill: #fff0d9; stroke: #d46b08; stroke-width: 2; rx: 6; }
      .data { fill: #edf8ed; stroke: #72a77a; stroke-width: 1.3; rx: 7; }
      .label { font: 700 12px Arial, sans-serif; fill: #1f3847; }
      .small { font: 12px Arial, sans-serif; fill: #455d6c; }
      .tiny { font: 12px Arial, sans-serif; fill: #586e7b; }
      .edge { fill: none; stroke: #52657a; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #126782; stroke-width: 2.2; marker-end: url(#flowArrow); }
      .num { fill: #126782; stroke: #ffffff; stroke-width: 1.5; }
      .numText { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .note { font: 12px Arial, sans-serif; fill: #126782; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="28" y="34">ShopLedger — architecture and order placement flow</text>
  <text class="subtitle" x="28" y="56">Node/Express POS, Khata ledger, inventory, GST checkout, and printable invoice</text>

  <!-- Browser UI -->
  <rect class="group" x="25" y="82" width="220" height="560"/>
  <text class="groupTitle" x="40" y="108">Browser UI — public/</text>
  <rect class="box" x="42" y="128" width="186" height="65"/>
  <text class="label" x="56" y="151">index.html</text>
  <text class="small" x="56" y="174">POS, orders, Khata, audit views</text>
  <rect class="box" x="42" y="211" width="186" height="90"/>
  <text class="label" x="56" y="234">js/app.js</text>
  <text class="small" x="56" y="255">POST /api/orders</text>
  <text class="small" x="56" y="276">POST /api/pricing/preview</text>
  <rect class="box" x="42" y="319" width="186" height="48"/>
  <text class="label" x="56" y="342">css/style.css</text>
  <text class="small" x="56" y="359">presentation only</text>
  <text class="small" x="42" y="407">UI also requests products, customers,</text>
  <text class="small" x="42" y="426">reports, orders and invoice pages.</text>

  <!-- Server -->
  <rect class="group" x="283" y="82" width="255" height="560"/>
  <text class="groupTitle" x="299" y="108">Express application</text>
  <rect class="box" x="300" y="128" width="221" height="113"/>
  <text class="label" x="315" y="151">server.js</text>
  <text class="small" x="315" y="174">express + bodyParser + static public/</text>
  <text class="small" x="315" y="195">mounts /api route modules</text>
  <text class="small" x="315" y="216">GET /orders/:id/invoice → invoice.render()</text>
  <rect class="data" x="300" y="273" width="221" height="77"/>
  <text class="label" x="315" y="296">config.js</text>
  <text class="small" x="315" y="317">port, shop, GST slabs, coupons,</text>
  <text class="small" x="315" y="336">inventory defaults, admin key</text>
  <rect class="data" x="300" y="382" width="221" height="77"/>
  <text class="label" x="315" y="405">data/db.json</text>
  <text class="small" x="315" y="426">products, customers, orders,</text>
  <text class="small" x="315" y="445">settlements, audit log, counters</text>

  <!-- Routes -->
  <rect class="group" x="570" y="82" width="250" height="560"/>
  <text class="groupTitle" x="586" y="108">HTTP routes — routes/</text>
  <rect class="route" x="588" y="128" width="214" height="76"/>
  <text class="label" x="602" y="151">products.js</text>
  <text class="small" x="602" y="173">GET /products, GET /coupons</text>
  <rect class="route" x="588" y="220" width="214" height="98"/>
  <text class="label" x="602" y="243">orders.js</text>
  <text class="small" x="602" y="264">POST /orders (checkout)</text>
  <text class="small" x="602" y="285">GET /orders; POST cancel</text>
  <rect class="route" x="588" y="334" width="214" height="76"/>
  <text class="label" x="602" y="357">customers.js</text>
  <text class="small" x="602" y="379">GET customers; POST settle</text>
  <rect class="route" x="588" y="426" width="214" height="98"/>
  <text class="label" x="602" y="449">reports.js</text>
  <text class="small" x="602" y="470">dashboard, GST reconciliation,</text>
  <text class="small" x="602" y="491">pricing preview, admin export</text>

  <!-- Library modules -->
  <rect class="group" x="852" y="82" width="323" height="560"/>
  <text class="groupTitle" x="868" y="108">Domain modules — lib/</text>
  <rect class="lib" x="868" y="128" width="140" height="64"/>
  <text class="label" x="879" y="150">store.js</text><text class="tiny" x="879" y="172">read, write, audit</text>
  <rect class="lib" x="1020" y="128" width="140" height="64"/>
  <text class="label" x="1031" y="150">orders.js</text><text class="tiny" x="1031" y="172">add, get, cancel, list</text>
  <rect class="lib" x="868" y="204" width="140" height="64"/>
  <text class="label" x="879" y="226">inventory.js</text><text class="tiny" x="879" y="248">find, check, reserve</text>
  <rect class="lib" x="1020" y="204" width="140" height="64"/>
  <text class="label" x="1031" y="226">pricing.js</text><text class="tiny" x="1031" y="248">subtotal, computeTotals</text>
  <rect class="lib" x="868" y="280" width="140" height="64"/>
  <text class="label" x="879" y="302">coupons.js</text><text class="tiny" x="879" y="324">validate, calculateDiscount</text>
  <rect class="lib" x="1020" y="280" width="140" height="64"/>
  <text class="label" x="1031" y="302">tax.js</text><text class="tiny" x="1031" y="324">getRateForItem, split GST</text>
  <rect class="lib" x="868" y="356" width="140" height="64"/>
  <text class="label" x="879" y="378">ledger.js</text><text class="tiny" x="879" y="400">Khata charge, settlement</text>
  <rect class="focus" x="1020" y="356" width="140" height="64"/>
  <text class="label" x="1031" y="378">invoice.js</text><text class="tiny" x="1031" y="400">compute figures, render</text>
  <rect class="lib" x="868" y="432" width="140" height="64"/>
  <text class="label" x="879" y="454">reports.js</text><text class="tiny" x="879" y="476">dashboard, reconciliation</text>
  <rect class="lib" x="1020" y="432" width="140" height="64"/>
  <text class="label" x="1031" y="454">dates.js</text><text class="tiny" x="1031" y="476">today, date normalization</text>

  <!-- Architecture edges -->
  <path class="edge" d="M245 175 H300"/>
  <path class="edge" d="M521 180 H570"/>
  <path class="edge" d="M521 196 H555 V166 H570"/>
  <path class="edge" d="M521 212 H548 V258 H570"/>
  <path class="edge" d="M521 228 H542 V372 H570"/>
  <path class="edge" d="M521 235 H536 V470 H570"/>
  <path class="edge" d="M802 258 H868"/>
  <path class="edge" d="M802 275 H840 V236 H868"/>
  <path class="edge" d="M802 290 H834 V312 H868"/>
  <path class="edge" d="M802 305 H828 V388 H868"/>
  <path class="edge" d="M802 320 H822 V464 H868"/>
  <path class="edge" d="M410 241 V273"/>
  <path class="edge" d="M410 350 V382"/>
  <path class="edge" d="M521 420 H855 V160 H868"/>
  <path class="edge" d="M521 436 H845 V388 H1020"/>

  <!-- Numbered order flow -->
  <text class="groupTitle" x="28" y="677">Numbered order placement flow</text>
  <path class="flow" d="M148 301 C148 555, 420 575, 695 318"/>
  <circle class="num" cx="211" cy="520" r="13"/><text class="numText" x="211" y="520">1</text>
  <text class="note" x="229" y="524">app.js posts cart payload to POST /api/orders</text>
  <path class="flow" d="M695 318 V365 H938 V236"/>
  <circle class="num" cx="720" cy="365" r="13"/><text class="numText" x="720" y="365">2</text>
  <text class="note" x="739" y="369">orders.js resolves products and checks inventory</text>
  <path class="flow" d="M938 268 V312 H1090"/>
  <circle class="num" cx="974" cy="312" r="13"/><text class="numText" x="974" y="312">3</text>
  <text class="note" x="990" y="336">pricing + coupons + tax compute checkout total</text>
  <path class="flow" d="M938 268 V388"/>
  <circle class="num" cx="955" cy="351" r="13"/><text class="numText" x="955" y="351">4</text>
  <text class="note" x="972" y="354">Khata payment updates ledger when selected</text>
  <path class="flow" d="M938 268 V160"/>
  <circle class="num" cx="956" cy="185" r="13"/><text class="numText" x="956" y="185">5</text>
  <text class="note" x="975" y="189">reserve stock; add order; write JSON and audit</text>

  <!-- Legend -->
  <rect x="28" y="714" width="1144" height="58" fill="#ffffff" stroke="#c8d4da" rx="7"/>
  <rect class="route" x="45" y="731" width="22" height="20"/><text class="small" x="76" y="746">HTTP router</text>
  <rect class="lib" x="190" y="731" width="22" height="20"/><text class="small" x="221" y="746">shared domain module</text>
  <rect class="data" x="410" y="731" width="22" height="20"/><text class="small" x="441" y="746">configuration or persistent JSON data</text>
  <rect class="focus" x="718" y="731" width="22" height="20"/><text class="small" x="749" y="746">ticket focus: invoice.js</text>
  <path class="flow" d="M946 741 H990"/><text class="small" x="1000" y="746">numbered checkout flow</text>
</svg>
