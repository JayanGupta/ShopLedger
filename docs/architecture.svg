<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of the browser UI, Express server, routers, libraries, configuration and JSON database, with a numbered order placement trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#718096"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d;font-size:13px}
      .title{font-size:23px;font-weight:700}.sub{font-size:13px;fill:#526581}
      .section{font-size:14px;font-weight:700;letter-spacing:.5px;fill:#405673}
      .card{fill:#fff;stroke:#bdc9d8;stroke-width:1.4;rx:9}
      .head{font-size:16px;font-weight:700}.small{font-size:12px;fill:#526581}
      .mono{font-family:Consolas,monospace;font-size:12px;fill:#314766}
      .accent{fill:#fff4e6;stroke:#d6812b;stroke-width:2}
      .accentHead{fill:#8c4c0d}
      .line{fill:none;stroke:#8a99ad;stroke-width:1.7;marker-end:url(#arrow)}
      .step{fill:#f7f9fc;stroke:#c7d1df;stroke-width:1.2;rx:8}
      .stepText{font-size:12px;fill:#314766}
      .num{fill:#2563a6}.numText{fill:#fff;font-weight:700;font-size:13px;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f3f6fa"/>
  <text class="title" x="30" y="35">ShopLedger · application architecture</text>
  <text class="sub" x="30" y="56">Node / Express POS · Khata ledger · GST invoicing · local JSON persistence</text>
  <rect x="895" y="20" width="16" height="16" rx="3" fill="#fff4e6" stroke="#d6812b" stroke-width="2"/>
  <text x="920" y="33">Ticket focus: invoice.js + tax.js</text>

  <text class="section" x="30" y="82">RUNTIME AND PERSISTENCE</text>
  <rect class="card" x="30" y="94" width="215" height="116"/>
  <text class="head" x="48" y="121">Browser UI · public/</text>
  <text class="mono" x="48" y="145">index.html · css/style.css</text>
  <text class="mono" x="48" y="165">js/app.js</text>
  <text class="small" x="48" y="190">catalog · cart · orders · Khata</text>

  <rect class="card" x="275" y="94" width="260" height="116"/>
  <text class="head" x="293" y="121">server.js · Express</text>
  <text class="small" x="293" y="145">JSON body parser · static public/</text>
  <text class="small" x="293" y="165">mounts four routers at /api</text>
  <text class="small" x="293" y="190">also serves /orders/:id/invoice</text>

  <rect class="card" x="565" y="94" width="205" height="116"/>
  <text class="head" x="583" y="121">config.js</text>
  <text class="small" x="583" y="145">shop + port + admin key</text>
  <text class="small" x="583" y="165">HSN GST slabs + defaults</text>
  <text class="small" x="583" y="190">coupon definitions</text>

  <rect class="card" x="800" y="94" width="370" height="116"/>
  <text class="head" x="818" y="121">data/db.json</text>
  <text class="small" x="818" y="145">products · orders · customers · settlements</text>
  <text class="small" x="818" y="165">ID counters · capped auditLog</text>
  <text class="small" x="818" y="190">read / write through lib/store.js</text>

  <path class="line" d="M245 151 H270"/>
  <path class="line" d="M535 151 H560"/>
  <path class="line" d="M770 151 H795"/>

  <text class="section" x="30" y="244">HTTP ROUTERS · mounted by server.js under /api</text>
  <path class="line" d="M405 210 V226 H153 V258"/>
  <path class="line" d="M405 226 H443 V258"/>
  <path class="line" d="M405 226 H733 V258"/>
  <path class="line" d="M405 226 H1023 V258"/>
  <rect class="card" x="30" y="260" width="245" height="115"/>
  <text class="head" x="47" y="287">routes/products.js</text>
  <text class="small" x="47" y="311">GET /products · GET /coupons</text>
  <text class="small" x="47" y="337">catalog and active promotions</text>
  <rect class="card" x="320" y="260" width="245" height="115"/>
  <text class="head" x="337" y="287">routes/orders.js</text>
  <text class="small" x="337" y="311">GET /orders · GET /orders/:id</text>
  <text class="small" x="337" y="333">POST /orders · POST cancel</text>
  <text class="small" x="337" y="355">order placement and cancellation</text>
  <rect class="card" x="610" y="260" width="245" height="115"/>
  <text class="head" x="627" y="287">routes/customers.js</text>
  <text class="small" x="627" y="311">GET /customers</text>
  <text class="small" x="627" y="333">POST /customers/:id/settle</text>
  <text class="small" x="627" y="355">Khata customer / settlement API</text>
  <rect class="card" x="900" y="260" width="270" height="115"/>
  <text class="head" x="917" y="287">routes/reports.js</text>
  <text class="small" x="917" y="311">dashboard · GST reconciliation</text>
  <text class="small" x="917" y="333">pricing preview · admin export</text>
  <text class="small" x="917" y="355">reports and POS preview API</text>

  <text class="section" x="30" y="410">LIBRARY MODULES · shared application logic</text>
  <path class="line" d="M443 375 V393 H137 V418"/>
  <path class="line" d="M443 393 H373 V418"/>
  <path class="line" d="M443 393 H609 V418"/>
  <path class="line" d="M443 393 H845 V418"/>
  <path class="line" d="M443 393 H1081 V418"/>

  <rect class="card" x="30" y="420" width="215" height="78"/>
  <text class="head" x="45" y="446">lib/coupons.js</text>
  <text class="small" x="45" y="470">normalizeCode · validate · calculateDiscount</text>
  <rect class="card" x="266" y="420" width="215" height="78"/>
  <text class="head" x="281" y="446">lib/dates.js</text>
  <text class="small" x="281" y="470">today · normalizeDateKey · getFiscalYear</text>
  <rect class="card" x="502" y="420" width="215" height="78"/>
  <text class="head" x="517" y="446">lib/inventory.js</text>
  <text class="small" x="517" y="470">find · check · reserve · release</text>
  <rect class="accent" x="738" y="420" width="215" height="78"/>
  <text class="head accentHead" x="753" y="446">lib/invoice.js</text>
  <text class="small" x="753" y="470">computeInvoiceFigures · render</text>
  <rect class="card" x="974" y="420" width="196" height="78"/>
  <text class="head" x="989" y="446">lib/ledger.js</text>
  <text class="small" x="989" y="470">chargeOrderToKhata · recordSettlement</text>

  <rect class="card" x="30" y="510" width="215" height="78"/>
  <text class="head" x="45" y="536">lib/orders.js</text>
  <text class="small" x="45" y="560">add · get · cancel · list</text>
  <rect class="card" x="266" y="510" width="215" height="78"/>
  <text class="head" x="281" y="536">lib/pricing.js</text>
  <text class="small" x="281" y="560">subtotal · discount · computeTotals</text>
  <rect class="card" x="502" y="510" width="215" height="78"/>
  <text class="head" x="517" y="536">lib/reports.js</text>
  <text class="small" x="517" y="560">getDashboardSummary · getGstReconciliation</text>
  <rect class="card" x="738" y="510" width="215" height="78"/>
  <text class="head" x="753" y="536">lib/store.js</text>
  <text class="small" x="753" y="560">read · write · appendAudit</text>
  <rect class="accent" x="974" y="510" width="196" height="78"/>
  <text class="head accentHead" x="989" y="536">lib/tax.js</text>
  <text class="small" x="989" y="560">getRateForItem · splitCgstSgst</text>

  <path class="line" d="M845 498 V602 H895 V615"/>
  <path class="line" d="M373 498 V602 H895 V615"/>
  <path class="line" d="M845 588 V602"/>

  <text class="section" x="30" y="623">ORDER PLACEMENT · numbered request and persistence trace</text>
  <g>
    <rect class="step" x="30" y="638" width="132" height="119"/><circle class="num" cx="47" cy="657" r="12"/><text class="numText" x="47" y="662">1</text>
    <text class="stepText" x="42" y="685"><tspan x="42">UI posts cart</tspan><tspan x="42" dy="18">and checkout fields</tspan><tspan x="42" dy="18">to POST /api/orders</tspan></text>
    <path class="line" d="M163 697 H174"/>
    <rect class="step" x="178" y="638" width="132" height="119"/><circle class="num" cx="195" cy="657" r="12"/><text class="numText" x="195" y="662">2</text>
    <text class="stepText" x="190" y="685"><tspan x="190">orders route resolves</tspan><tspan x="190" dy="18">products; inventory</tspan><tspan x="190" dy="18">find + check stock</tspan></text>
    <path class="line" d="M311 697 H322"/>
    <rect class="step" x="326" y="638" width="132" height="119"/><circle class="num" cx="343" cy="657" r="12"/><text class="numText" x="343" y="662">3</text>
    <text class="stepText" x="338" y="685"><tspan x="338">coupons.validate;</tspan><tspan x="338" dy="18">pricing.computeTotals</tspan><tspan x="338" dy="18">uses tax.getRateForItem</tspan></text>
    <path class="line" d="M459 697 H470"/>
    <rect class="step" x="474" y="638" width="132" height="119"/><circle class="num" cx="491" cy="657" r="12"/><text class="numText" x="491" y="662">4</text>
    <text class="stepText" x="486" y="685"><tspan x="486">Khata only:</tspan><tspan x="486" dy="18">ledger.</tspan><tspan x="486" dy="18">chargeOrderToKhata</tspan><tspan x="486" dy="18">checks limit and bills</tspan></text>
    <path class="line" d="M607 697 H618"/>
    <rect class="step" x="622" y="638" width="132" height="119"/><circle class="num" cx="639" cy="657" r="12"/><text class="numText" x="639" y="662">5</text>
    <text class="stepText" x="634" y="685"><tspan x="634">inventory.reserve;</tspan><tspan x="634" dy="18">orders.add creates</tspan><tspan x="634" dy="18">the order record</tspan></text>
    <path class="line" d="M755 697 H766"/>
    <rect class="step" x="770" y="638" width="132" height="119"/><circle class="num" cx="787" cy="657" r="12"/><text class="numText" x="787" y="662">6</text>
    <text class="stepText" x="782" y="685"><tspan x="782">appendAudit then</tspan><tspan x="782" dy="18">store.write persists</tspan><tspan x="782" dy="18">the updated db</tspan></text>
    <path class="line" d="M903 697 H914"/>
    <rect class="step" x="918" y="638" width="252" height="119"/><circle class="num" cx="935" cy="657" r="12"/><text class="numText" x="935" y="662">7</text>
    <text class="stepText" x="958" y="662"><tspan x="958">Printable view: server.js calls</tspan><tspan x="958" dy="18">orders.get → invoice.render;</tspan><tspan x="958" dy="18">invoice recomputes its figures</tspan><tspan x="958" dy="18">from the saved order lines.</tspan></text>
  </g>
  <text class="small" x="30" y="784">Ticket highlight: invoice.js builds the printable figures; tax.js is included because checkout pricing calls its GST slab resolver.</text>
</svg>
