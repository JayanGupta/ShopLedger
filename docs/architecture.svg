<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="description">Browser UI connects to Express server and four routers. Ten library modules support checkout, reporting, invoices, and JSON persistence. A six step sequence traces order placement. Invoice is highlighted as the ticket module and tax as its checkout GST dependency.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#477083"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8052b0"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183443; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #526d7b; }
      .section { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-text { font-size: 12px; }
      .route-text { font-size: 13px; font-weight: 600; }
      .flow-title { font-size: 13px; font-weight: 700; }
      .flow-text { font-size: 12px; }
      .tag { font-size: 12px; font-weight: 700; }
      .box { fill: #fff; stroke: #a8bec9; stroke-width: 1.5; }
      .panel { fill: #f5f9fb; stroke: #c7d7df; stroke-width: 1.5; }
      .route { fill: #fff; stroke: #bacdd6; }
      .ticket { fill: #efe5fa; stroke: #8052b0; stroke-width: 2; }
      .dependency { fill: #f8f1fd; stroke: #ad87d0; stroke-width: 2; }
      .line { fill: none; stroke: #477083; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #8052b0; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#purple-arrow); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#eef4f7"/>
  <text class="title" x="40" y="47">ShopLedger architecture</text>
  <text class="subtitle" x="42" y="72">Node / Express POS · Khata credit ledger · GST invoicing</text>

  <rect x="800" y="29" width="18" height="18" rx="4" class="ticket"/>
  <text class="tag" x="826" y="43">Ticket: invoice.js</text>
  <rect x="974" y="29" width="18" height="18" rx="4" class="dependency"/>
  <text class="tag" x="1000" y="43">GST dependency: tax.js</text>

  <rect x="40" y="110" width="210" height="155" rx="12" class="box"/>
  <text class="node-title" x="58" y="139">Browser UI</text>
  <text class="node-text" x="58" y="161">public/index.html</text>
  <text class="node-text" x="58" y="180">public/js/app.js</text>
  <text class="node-text" x="58" y="199">public/css/style.css</text>
  <text class="node-text" x="58" y="235">Cart, Khata, orders, reports</text>

  <path d="M 250 182 L 295 182" class="line"/>
  <text class="tag" x="260" y="169">HTTP</text>

  <rect x="295" y="110" width="210" height="155" rx="12" class="box"/>
  <text class="node-title" x="313" y="139">server.js</text>
  <text class="node-text" x="313" y="161">Express + JSON body parser</text>
  <text class="node-text" x="313" y="181">Serves public/ and /api</text>
  <text class="node-text" x="313" y="208">GET /orders/:id/invoice</text>
  <text class="node-text" x="313" y="229">→ lib/invoice.js render()</text>

  <path d="M 505 182 L 550 182" class="line"/>
  <text class="tag" x="515" y="169">/api</text>

  <rect x="550" y="101" width="300" height="210" rx="12" class="panel"/>
  <text class="section" x="568" y="126">routes/</text>
  <rect x="568" y="140" width="264" height="33" rx="5" class="route"/>
  <text class="route-text" x="580" y="161">products.js  ·  products, coupons</text>
  <rect x="568" y="180" width="264" height="33" rx="5" class="route"/>
  <text class="route-text" x="580" y="201">orders.js  ·  place, list, cancel</text>
  <rect x="568" y="220" width="264" height="33" rx="5" class="route"/>
  <text class="route-text" x="580" y="241">customers.js  ·  Khata settle</text>
  <rect x="568" y="260" width="264" height="33" rx="5" class="route"/>
  <text class="route-text" x="580" y="281">reports.js  ·  preview, reports</text>

  <rect x="905" y="110" width="245" height="85" rx="12" class="box"/>
  <text class="node-title" x="923" y="140">config.js</text>
  <text class="node-text" x="923" y="162">Shop, HSN slabs, coupons, port</text>

  <rect x="905" y="220" width="245" height="85" rx="12" class="box"/>
  <text class="node-title" x="923" y="250">data/db.json</text>
  <text class="node-text" x="923" y="272">Products, orders, customers, audit</text>

  <path d="M 700 311 L 700 339" class="line"/>
  <text class="tag" x="714" y="330">calls lib/</text>

  <rect x="40" y="342" width="1120" height="276" rx="14" class="panel"/>
  <text class="section" x="58" y="367">lib/  ·  domain logic and persistence</text>

  <rect x="55" y="384" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="71" y="409">pricing.js</text>
  <text class="node-text" x="71" y="432">subtotal(), computeTotals()</text>
  <text class="node-text" x="71" y="452">Discount before line GST</text>

  <rect x="275" y="384" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="291" y="409">coupons.js</text>
  <text class="node-text" x="291" y="432">validate()</text>
  <text class="node-text" x="291" y="452">calculateDiscount()</text>

  <rect x="495" y="384" width="205" height="94" rx="9" class="dependency"/>
  <text class="node-title" x="511" y="409">tax.js</text>
  <text class="node-text" x="511" y="432">getRateForItem()</text>
  <text class="node-text" x="511" y="452">HSN slab for checkout</text>

  <rect x="715" y="384" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="731" y="409">inventory.js</text>
  <text class="node-text" x="731" y="432">find(), check()</text>
  <text class="node-text" x="731" y="452">reserve(), release()</text>

  <rect x="935" y="384" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="951" y="409">ledger.js</text>
  <text class="node-text" x="951" y="432">chargeOrderToKhata()</text>
  <text class="node-text" x="951" y="452">recordSettlement()</text>

  <rect x="55" y="501" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="71" y="526">orders.js</text>
  <text class="node-text" x="71" y="549">add(), get(), cancel()</text>
  <text class="node-text" x="71" y="569">Saved order records</text>

  <rect x="275" y="501" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="291" y="526">dates.js</text>
  <text class="node-text" x="291" y="549">today(), normalizeDateKey()</text>
  <text class="node-text" x="291" y="569">getFiscalYear()</text>

  <rect x="495" y="501" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="511" y="526">reports.js</text>
  <text class="node-text" x="511" y="549">getDashboardSummary()</text>
  <text class="node-text" x="511" y="569">getGstReconciliation()</text>

  <rect x="715" y="501" width="205" height="94" rx="9" class="box"/>
  <text class="node-title" x="731" y="526">store.js</text>
  <text class="node-text" x="731" y="549">read(), write()</text>
  <text class="node-text" x="731" y="569">appendAudit()</text>

  <rect x="935" y="501" width="205" height="94" rx="9" class="ticket"/>
  <text class="node-title" x="951" y="526">invoice.js</text>
  <text class="node-text" x="951" y="549">computeInvoiceFigures()</text>
  <text class="node-text" x="951" y="569">render() printable HTML</text>

  <path d="M 920 548 L 1174 548 L 1174 262 L 1150 262" class="line"/>
  <text class="tag" x="1070" y="534">store writes</text>

  <text class="section" x="42" y="647">Placing an order  ·  numbered request and save flow</text>

  <rect x="40" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="54" y="686">1  Browser sends</text>
  <text class="flow-text" x="54" y="709">app.js POST</text>
  <text class="flow-text" x="54" y="727">/api/orders via</text>
  <text class="flow-text" x="54" y="745">server.js</text>

  <path d="M 220 720 L 227 720" class="line"/>
  <rect x="228" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="242" y="686">2  Resolve items</text>
  <text class="flow-text" x="242" y="709">routes/orders.js</text>
  <text class="flow-text" x="242" y="727">store.read(), find(),</text>
  <text class="flow-text" x="242" y="745">check() stock</text>

  <path d="M 408 720 L 415 720" class="line"/>
  <rect x="416" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="430" y="686">3  Price and tax</text>
  <text class="flow-text" x="430" y="709">coupons.validate()</text>
  <text class="flow-text" x="430" y="727">pricing.computeTotals()</text>
  <text class="flow-text" x="430" y="745">tax.getRateForItem()</text>

  <path d="M 596 720 L 603 720" class="line"/>
  <rect x="604" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="618" y="686">4  Commit effects</text>
  <text class="flow-text" x="618" y="709">ledger.chargeOrderTo</text>
  <text class="flow-text" x="618" y="727">Khata() if credit;</text>
  <text class="flow-text" x="618" y="745">inventory.reserve()</text>

  <path d="M 784 720 L 791 720" class="line"/>
  <rect x="792" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="806" y="686">5  Save order</text>
  <text class="flow-text" x="806" y="709">orders.add()</text>
  <text class="flow-text" x="806" y="727">store.appendAudit()</text>
  <text class="flow-text" x="806" y="745">store.write()</text>

  <path d="M 972 720 L 979 720" class="line"/>
  <rect x="980" y="663" width="179" height="113" rx="9" class="box"/>
  <text class="flow-title" x="994" y="686">6  Persist + reply</text>
  <text class="flow-text" x="994" y="709">data/db.json gets</text>
  <text class="flow-text" x="994" y="727">order, stock, audit;</text>
  <text class="flow-text" x="994" y="745">Khata if credit; 201</text>
</svg>
