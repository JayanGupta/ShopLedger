<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, route modules, library modules, configuration and JSON data store, plus the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#0f172a}.subtitle{font:14px Arial,sans-serif;fill:#475569}.group{font:700 14px Arial,sans-serif;fill:#334155}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.router{fill:#eff6ff;stroke:#60a5fa}.lib{fill:#f8fafc;stroke:#94a3b8}.focus{fill:#fff7ed;stroke:#f97316;stroke-width:2.5}.data{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.server{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.ui{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.label{font:700 14px Arial,sans-serif;fill:#0f172a}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:12px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.flow{stroke:#dc2626;stroke-width:2.5;fill:none;marker-end:url(#flowArrow)}.step{fill:#dc2626}.steptext{font:700 12px Arial,sans-serif;fill:#fff}.legend{font:12px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="40" y="38" class="title">ShopLedger — Node/Express POS, Khata and GST Invoice Architecture</text>
  <text x="40" y="60" class="subtitle">Solid grey arrows show dependencies; red numbered arrows trace POST /api/orders.</text>

  <!-- Browser -->
  <text x="40" y="98" class="group">Browser</text>
  <rect x="40" y="110" width="200" height="126" rx="8" class="ui"/>
  <text x="56" y="138" class="label">public/</text>
  <text x="56" y="160" class="small">index.html</text>
  <text x="56" y="179" class="small">js/app.js</text>
  <text x="56" y="198" class="small">css/style.css</text>
  <text x="56" y="220" class="tiny">POS, orders, Khata, audit UI</text>

  <!-- server -->
  <text x="304" y="98" class="group">HTTP application</text>
  <rect x="304" y="110" width="220" height="126" rx="8" class="server"/>
  <text x="320" y="140" class="label">server.js</text>
  <text x="320" y="161" class="small">Express + bodyParser.json()</text>
  <text x="320" y="181" class="small">static public/</text>
  <text x="320" y="201" class="small">mounts /api routers</text>
  <text x="320" y="221" class="small">GET /orders/:id/invoice</text>
  <path d="M240 173 H304" class="line"/>

  <!-- config -->
  <rect x="550" y="110" width="170" height="126" rx="8" class="box"/>
  <text x="566" y="140" class="label">config.js</text>
  <text x="566" y="162" class="small">shop + port</text>
  <text x="566" y="181" class="small">GST HSN slabs</text>
  <text x="566" y="200" class="small">coupons + inventory</text>
  <text x="566" y="219" class="small">admin key</text>
  <path d="M524 160 H550" class="line"/>

  <!-- routes -->
  <text x="760" y="98" class="group">routes/ (all mounted at /api)</text>
  <rect x="760" y="110" width="185" height="56" rx="7" class="router"/>
  <text x="774" y="134" class="label">products.js</text><text x="774" y="153" class="small">GET products, coupons</text>
  <rect x="960" y="110" width="200" height="56" rx="7" class="router"/>
  <text x="974" y="134" class="label">orders.js</text><text x="974" y="153" class="small">POST /orders, cancel</text>
  <rect x="760" y="180" width="185" height="56" rx="7" class="router"/>
  <text x="774" y="204" class="label">customers.js</text><text x="774" y="223" class="small">GET customers, settle</text>
  <rect x="960" y="180" width="200" height="56" rx="7" class="router"/>
  <text x="974" y="204" class="label">reports.js</text><text x="974" y="223" class="small">dashboard, preview, export</text>
  <path d="M720 173 H748 V138 H760" class="line"/>
  <path d="M720 173 H748 V208 H760" class="line"/>
  <path d="M720 173 H940 V138 H960" class="line"/>
  <path d="M720 173 H940 V208 H960" class="line"/>

  <!-- libraries -->
  <text x="40" y="294" class="group">lib/ business and persistence modules</text>
  <rect x="40" y="308" width="160" height="65" rx="7" class="lib"/><text x="52" y="334" class="label">store.js</text><text x="52" y="355" class="small">read(), write(), audit</text>
  <rect x="216" y="308" width="160" height="65" rx="7" class="lib"/><text x="228" y="334" class="label">inventory.js</text><text x="228" y="355" class="small">find, check, reserve</text>
  <rect x="392" y="308" width="160" height="65" rx="7" class="lib"/><text x="404" y="334" class="label">orders.js</text><text x="404" y="355" class="small">add, get, cancel, list</text>
  <rect x="568" y="308" width="160" height="65" rx="7" class="lib"/><text x="580" y="334" class="label">ledger.js</text><text x="580" y="355" class="small">Khata + settlements</text>
  <rect x="744" y="308" width="160" height="65" rx="7" class="lib"/><text x="756" y="334" class="label">pricing.js</text><text x="756" y="355" class="small">subtotal, computeTotals</text>
  <rect x="920" y="308" width="160" height="65" rx="7" class="lib"/><text x="932" y="334" class="label">coupons.js</text><text x="932" y="355" class="small">validate, calculate</text>
  <rect x="40" y="390" width="160" height="65" rx="7" class="focus"/><text x="52" y="416" class="label">tax.js</text><text x="52" y="437" class="small">HSN rate, CGST/SGST</text>
  <rect x="216" y="390" width="160" height="65" rx="7" class="focus"/><text x="228" y="416" class="label">invoice.js</text><text x="228" y="437" class="small">figures + HTML render</text>
  <rect x="392" y="390" width="160" height="65" rx="7" class="lib"/><text x="404" y="416" class="label">reports.js</text><text x="404" y="437" class="small">dashboard + GST recon</text>
  <rect x="568" y="390" width="160" height="65" rx="7" class="lib"/><text x="580" y="416" class="label">dates.js</text><text x="580" y="437" class="small">today, date helpers</text>

  <!-- data -->
  <rect x="835" y="410" width="245" height="68" rx="8" class="data"/>
  <text x="850" y="438" class="label">data/db.json</text>
  <text x="850" y="458" class="small">products · orders · customers</text>
  <text x="850" y="475" class="small">settlements · auditLog · counters</text>
  <path d="M120 373 V490 H835 V444" class="line"/>
  <path d="M720 236 V278 H100 V308" class="line"/>
  <path d="M635 236 V282 H120 V390" class="line"/>
  <path d="M635 236 V278 H824 V308" class="line"/>
  <path d="M1040 236 V282 H1000 V308" class="line"/>
  <path d="M1040 236 V282 H648 V308" class="line"/>
  <path d="M1040 236 V282 H472 V390" class="line"/>
  <path d="M414 236 V282 H296 V390" class="line"/>

  <!-- flow -->
  <rect x="40" y="526" width="1040" height="158" rx="10" fill="#fff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="56" y="552" class="group" fill="#991b1b">Numbered order-placement flow — POST /api/orders</text>
  <path d="M105 592 H225" class="flow"/><circle cx="128" cy="580" r="11" class="step"/><text x="124" y="584" class="steptext">1</text>
  <path d="M305 592 H425" class="flow"/><circle cx="328" cy="580" r="11" class="step"/><text x="324" y="584" class="steptext">2</text>
  <path d="M505 592 H625" class="flow"/><circle cx="528" cy="580" r="11" class="step"/><text x="524" y="584" class="steptext">3</text>
  <path d="M705 592 H825" class="flow"/><circle cx="728" cy="580" r="11" class="step"/><text x="724" y="584" class="steptext">4</text>
  <path d="M905 592 H1020" class="flow"/><circle cx="928" cy="580" r="11" class="step"/><text x="924" y="584" class="steptext">5</text>
  <text x="56" y="613" class="label">Browser</text><text x="56" y="633" class="small">app.js #place</text>
  <text x="245" y="613" class="label">orders.js</text><text x="245" y="633" class="small">POST /orders</text>
  <text x="445" y="613" class="label">store + inventory</text><text x="445" y="633" class="small">read, find, check</text>
  <text x="645" y="613" class="label">pricing + tax</text><text x="645" y="633" class="small">coupon, computeTotals</text>
  <text x="845" y="613" class="label">ledger + orders</text><text x="845" y="633" class="small">Khata, reserve, add</text>
  <text x="56" y="667" class="tiny">6. appendAudit() then store.write(db) saves the changed products, orders, customer ledger, audit log and ID counters to data/db.json.</text>

  <!-- legend -->
  <rect x="40" y="710" width="1040" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="56" y="741" class="group">Legend</text>
  <rect x="125" y="725" width="18" height="18" class="focus"/><text x="151" y="739" class="legend">Ticket focus: invoice.js and tax.js</text>
  <rect x="390" y="725" width="18" height="18" class="router"/><text x="416" y="739" class="legend">HTTP route module</text>
  <rect x="570" y="725" width="18" height="18" class="data"/><text x="596" y="739" class="legend">Persisted JSON data</text>
  <line x1="775" y1="734" x2="812" y2="734" class="flow"/><text x="824" y="739" class="legend">Order flow</text>
</svg>
