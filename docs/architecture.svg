<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server, routers, libraries, configuration and JSON database, with a numbered order-placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .group { font-size: 14px; font-weight: 700; fill: #334155; }
      .name { font-size: 14px; font-weight: 700; }
      .fn { font-size: 12px; fill: #475569; }
      .small { font-size: 12px; fill: #334155; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .router { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; }
      .lib { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.1; }
      .focus { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .config { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#flowArrow); }
      .dashed { fill: none; stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .step { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }
      .steptext { font-size: 12px; fill: #ffffff; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="38" class="title">ShopLedger architecture</text>
  <text x="32" y="59" class="subtitle">Node / Express POS, Khata ledger, inventory and GST invoice app • orange = ticket focus</text>

  <!-- Browser -->
  <text x="36" y="103" class="group">Browser</text>
  <rect x="32" y="112" width="205" height="151" rx="9" class="box"/>
  <text x="48" y="139" class="name">public/</text>
  <text x="48" y="160" class="fn">index.html</text>
  <text x="48" y="180" class="fn">js/app.js</text>
  <text x="48" y="200" class="fn">css/style.css</text>
  <text x="48" y="229" class="small">POS UI • XMLHttpRequest</text>
  <text x="48" y="247" class="small">post('/api/orders', payload)</text>

  <!-- server -->
  <text x="305" y="103" class="group">HTTP application</text>
  <rect x="301" y="112" width="253" height="151" rx="9" class="box"/>
  <text x="319" y="139" class="name">server.js</text>
  <text x="319" y="161" class="fn">express() • bodyParser.json()</text>
  <text x="319" y="181" class="fn">express.static(public/)</text>
  <text x="319" y="201" class="fn">app.use('/api', routers)</text>
  <text x="319" y="230" class="small">GET /orders/:id/invoice</text>
  <text x="319" y="248" class="small">→ invoice.render(order)</text>

  <!-- routers -->
  <text x="621" y="103" class="group">routes/ (mounted below /api)</text>
  <rect x="616" y="112" width="250" height="65" rx="8" class="router"/>
  <text x="631" y="137" class="name">products.js</text><text x="631" y="158" class="fn">GET /products, /coupons</text>
  <rect x="879" y="112" width="277" height="65" rx="8" class="router"/>
  <text x="894" y="137" class="name">orders.js</text><text x="894" y="158" class="fn">POST /orders • GET • /cancel</text>
  <rect x="616" y="190" width="250" height="65" rx="8" class="router"/>
  <text x="631" y="215" class="name">customers.js</text><text x="631" y="236" class="fn">GET /customers • POST /:id/settle</text>
  <rect x="879" y="190" width="277" height="65" rx="8" class="router"/>
  <text x="894" y="215" class="name">reports.js</text><text x="894" y="236" class="fn">dashboard • GST • preview • export</text>

  <!-- foundation -->
  <text x="36" y="306" class="group">Configuration and persistence</text>
  <rect x="32" y="315" width="252" height="100" rx="9" class="config"/>
  <text x="48" y="343" class="name">config.js</text>
  <text x="48" y="365" class="fn">shop • tax.hsnSlabs • coupons</text>
  <text x="48" y="385" class="fn">inventory • port • adminKey</text>
  <rect x="302" y="315" width="252" height="100" rx="9" class="data"/>
  <text x="318" y="343" class="name">data/db.json</text>
  <text x="318" y="365" class="fn">products • orders • customers</text>
  <text x="318" y="385" class="fn">settlements • auditLog • IDs</text>

  <!-- libraries -->
  <text x="621" y="306" class="group">lib/ business modules</text>
  <rect x="616" y="315" width="164" height="75" rx="8" class="lib"/>
  <text x="628" y="340" class="name">store.js</text><text x="628" y="361" class="fn">read • write • appendAudit</text>
  <rect x="792" y="315" width="164" height="75" rx="8" class="lib"/>
  <text x="804" y="340" class="name">inventory.js</text><text x="804" y="361" class="fn">find • check • reserve</text>
  <rect x="968" y="315" width="188" height="75" rx="8" class="lib"/>
  <text x="980" y="340" class="name">orders.js</text><text x="980" y="361" class="fn">add • get • cancel • list</text>

  <rect x="616" y="403" width="164" height="75" rx="8" class="lib"/>
  <text x="628" y="428" class="name">pricing.js</text><text x="628" y="449" class="fn">subtotal • computeTotals</text>
  <rect x="792" y="403" width="164" height="75" rx="8" class="lib"/>
  <text x="804" y="428" class="name">coupons.js</text><text x="804" y="449" class="fn">validate • calculateDiscount</text>
  <rect x="968" y="403" width="188" height="75" rx="8" class="focus"/>
  <text x="980" y="428" class="name">tax.js</text><text x="980" y="449" class="fn">getRateForItem • splitCgstSgst</text>

  <rect x="616" y="491" width="164" height="75" rx="8" class="lib"/>
  <text x="628" y="516" class="name">ledger.js</text><text x="628" y="537" class="fn">chargeOrderToKhata • settlement</text>
  <rect x="792" y="491" width="164" height="75" rx="8" class="lib"/>
  <text x="804" y="516" class="name">dates.js</text><text x="804" y="537" class="fn">today • normalizeDateKey</text>
  <rect x="968" y="491" width="188" height="75" rx="8" class="focus"/>
  <text x="980" y="516" class="name">invoice.js</text><text x="980" y="537" class="fn">computeInvoiceFigures • render</text>

  <rect x="616" y="579" width="164" height="75" rx="8" class="lib"/>
  <text x="628" y="604" class="name">reports.js</text><text x="628" y="625" class="fn">dashboard • GST reconciliation</text>

  <!-- structural connections -->
  <path d="M237 187 L301 187" class="line"/>
  <path d="M554 151 L616 145" class="line"/>
  <path d="M554 182 L879 145" class="line"/>
  <path d="M554 211 L616 223" class="line"/>
  <path d="M554 240 L879 223" class="line"/>
  <path d="M284 365 L302 365" class="line"/>
  <path d="M694 315 L680 273 L466 273 L466 263" class="line"/>
  <path d="M698 403 L700 390" class="line"/>
  <path d="M874 440 L968 440" class="line"/>
  <path d="M1050 403 L1050 390" class="line"/>
  <path d="M1050 478 L1050 491" class="dashed"/>
  <path d="M1044 315 L1054 255" class="line"/>
  <path d="M698 579 L698 566" class="line"/>
  <path d="M956 528 L968 528" class="dashed"/>
  <path d="M1120 566 L1120 706 L554 706 L554 415" class="line"/>
  <path d="M428 315 L428 263" class="line"/>

  <!-- numbered placement flow -->
  <rect x="32" y="448" width="545" height="290" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="50" y="477" class="group" fill="#1d4ed8">Numbered flow: placing an order</text>
  <text x="74" y="510" class="small">Browser POST /api/orders</text><circle cx="57" cy="506" r="12" class="step"/><text x="57" y="506" class="steptext">1</text>
  <path d="M280 506 L337 506" class="flow"/>
  <text x="354" y="510" class="small">routes/orders.js</text><circle cx="337" cy="506" r="12" class="step"/><text x="337" y="506" class="steptext">2</text>
  <path d="M510 506 L510 537" class="flow"/>
  <text x="74" y="552" class="small">store.read() loads db.json; inventory.find() resolves products</text><circle cx="57" cy="548" r="12" class="step"/><text x="57" y="548" class="steptext">3</text>
  <text x="74" y="588" class="small">inventory.check(); coupons.validate(); pricing.computeTotals()</text><circle cx="57" cy="584" r="12" class="step"/><text x="57" y="584" class="steptext">4</text>
  <text x="74" y="624" class="small">pricing → coupons.calculateDiscount() + tax.getRateForItem()</text><circle cx="57" cy="620" r="12" class="step"/><text x="57" y="620" class="steptext">5</text>
  <text x="74" y="660" class="small">khata only: ledger.chargeOrderToKhata(total)</text><circle cx="57" cy="656" r="12" class="step"/><text x="57" y="656" class="steptext">6</text>
  <text x="74" y="696" class="small">inventory.reserve(); orders.add(); store.appendAudit(); store.write(db)</text><circle cx="57" cy="692" r="12" class="step"/><text x="57" y="692" class="steptext">7</text>
  <text x="74" y="723" class="small">Saved: stock/customer balance, new order, audit entry, nextOrderId</text>

  <!-- legend -->
  <rect x="805" y="680" width="351" height="78" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="821" y="705" class="group">Legend</text>
  <rect x="821" y="717" width="16" height="16" rx="3" class="focus"/><text x="846" y="730" class="small">Ticket focus: invoice.js and tax.js</text>
  <path d="M821 746 L852 746" class="flow"/><text x="861" y="750" class="small">numbered order placement path</text>
</svg>
