<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title>
<desc id="desc">Architecture of the ShopLedger Express POS, with its routes, library modules, storage, ticket paths, and numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#172033}
    .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#475569}
    .head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#475569}
    .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    .node{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
    .ticket{fill:#fff0c2;stroke:#d97706;stroke-width:2}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#blueArrow)}
    .num{fill:#2563eb;stroke:#fff;stroke-width:1.4}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#f1f5f9"/>
<text x="30" y="39" class="title">ShopLedger — application architecture</text>
<text x="30" y="62" class="sub">Node / Express POS · Khata credit ledger · GST invoicing</text>

<!-- Browser and server -->
<rect x="25" y="90" width="190" height="165" rx="9" class="group"/>
<text x="40" y="116" class="head">Browser UI · public/</text>
<rect x="40" y="129" width="160" height="42" rx="5" class="node"/>
<text x="51" y="155">index.html</text>
<rect x="40" y="180" width="160" height="59" rx="5" class="node"/>
<text x="51" y="202">js/app.js</text><text x="51" y="223" class="small">css/style.css</text>

<rect x="235" y="90" width="180" height="165" rx="9" class="group"/>
<text x="250" y="116" class="head">Express server</text>
<rect x="250" y="135" width="150" height="82" rx="5" class="node"/>
<text x="263" y="162" font-weight="700">server.js</text>
<text x="263" y="184" class="small">JSON · static UI</text>
<text x="263" y="202" class="small">mounts API routers</text>
<path d="M215 172 H235" class="flow"/>

<!-- Routers -->
<rect x="445" y="90" width="300" height="255" rx="9" class="group"/>
<text x="460" y="116" class="head">routes/ · mounted at /api</text>
<rect x="460" y="128" width="270" height="43" rx="5" class="node"/>
<text x="473" y="154">products.js · products, coupons</text>
<rect x="460" y="178" width="270" height="43" rx="5" class="node"/>
<text x="473" y="204">orders.js · place, list, cancel</text>
<rect x="460" y="228" width="270" height="43" rx="5" class="ticket"/>
<text x="473" y="254" font-weight="700">customers.js · settlements ★</text>
<rect x="460" y="278" width="270" height="43" rx="5" class="node"/>
<text x="473" y="304">reports.js · preview, reports, export</text>
<path d="M415 172 H445" class="flow"/>

<!-- Configuration and JSON data -->
<rect x="445" y="365" width="300" height="74" rx="9" class="group"/>
<text x="460" y="390" class="head">Configuration</text>
<rect x="460" y="398" width="270" height="31" rx="5" class="node"/>
<text x="473" y="419">config.js · shop, GST, coupons</text>
<rect x="445" y="455" width="300" height="74" rx="9" class="group"/>
<text x="460" y="480" class="head">Persistent JSON data</text>
<rect x="460" y="488" width="270" height="31" rx="5" class="node"/>
<text x="473" y="509">data/db.json</text>

<!-- Library modules -->
<rect x="780" y="90" width="395" height="439" rx="9" class="group"/>
<text x="795" y="116" class="head">lib/ · application modules</text>
<rect x="795" y="128" width="365" height="35" rx="5" class="node"/><text x="808" y="151">pricing.js · subtotal, computeTotals</text>
<rect x="795" y="168" width="365" height="35" rx="5" class="node"/><text x="808" y="191">coupons.js · normalizeCode, validate, calculateDiscount</text>
<rect x="795" y="208" width="365" height="35" rx="5" class="node"/><text x="808" y="231">inventory.js · find, check, reserve, release</text>
<rect x="795" y="248" width="365" height="35" rx="5" class="ticket"/><text x="808" y="271" font-weight="700">orders.js · list ★ · add, get, cancel</text>
<rect x="795" y="288" width="365" height="35" rx="5" class="ticket"/><text x="808" y="311" font-weight="700">ledger.js · recordSettlement, Khata balance ★</text>
<rect x="795" y="328" width="365" height="35" rx="5" class="node"/><text x="808" y="351">store.js · read, write, appendAudit</text>
<rect x="795" y="368" width="365" height="35" rx="5" class="node"/><text x="808" y="391">reports.js · getDashboardSummary, getGstReconciliation</text>
<rect x="795" y="408" width="365" height="35" rx="5" class="ticket"/><text x="808" y="431" font-weight="700">dates.js · today, normalizeDateKey, getFiscalYear ★</text>
<rect x="795" y="448" width="365" height="35" rx="5" class="node"/><text x="808" y="471">invoice.js · render, computeInvoiceFigures</text>
<rect x="795" y="488" width="365" height="35" rx="5" class="node"/><text x="808" y="511">tax.js · getRateForItem, splitCgstSgst</text>

<!-- Relationships -->
<path d="M745 200 H780" class="flow"/><text x="747" y="188" class="small">uses lib/</text>
<path d="M795 345 H765 V503 H730" class="edge"/>
<path d="M415 225 H430 V535 H770 V466 H795" class="edge"/><!-- Ticket paths and legend -->
<rect x="25" y="548" width="1150" height="64" rx="9" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="42" y="560" width="20" height="20" rx="3" class="ticket"/>
<text x="72" y="575" font-weight="700">Ticket scope</text>
<text x="42" y="596" class="small">★ orders.js: list only</text>
<text x="290" y="574" class="small">GET /api/orders → routes/orders.js → orders.list() → dates.normalizeDateKey()</text>
<text x="290" y="596" class="small">POST /api/customers/:id/settle → routes/customers.js → ledger.recordSettlement()</text>

<!-- Numbered order creation flow -->
<rect x="25" y="625" width="1150" height="145" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="42" y="650" class="head" fill="#1d4ed8">Order placement · POST /api/orders</text>
<rect x="42" y="662" width="205" height="88" rx="6" class="node"/>
<circle cx="58" cy="676" r="11" class="num"/><text x="58" y="680" class="numtext">1</text>
<text x="76" y="681" font-weight="700">Submit cart</text><text x="55" y="705" class="small">public/js/app.js</text><text x="55" y="727" class="small">POST /api/orders</text>
<rect x="269" y="662" width="205" height="88" rx="6" class="node"/>
<circle cx="285" cy="676" r="11" class="num"/><text x="285" y="680" class="numtext">2</text>
<text x="303" y="681" font-weight="700">Resolve &amp; check stock</text><text x="282" y="705" class="small">routes/orders.js</text><text x="282" y="727" class="small">inventory.find(), check()</text>
<rect x="496" y="662" width="205" height="88" rx="6" class="node"/>
<circle cx="512" cy="676" r="11" class="num"/><text x="512" y="680" class="numtext">3</text>
<text x="530" y="681" font-weight="700">Calculate bill</text><text x="509" y="705" class="small">pricing.computeTotals()</text><text x="509" y="727" class="small">coupons.js · tax.js</text>
<rect x="723" y="662" width="205" height="88" rx="6" class="node"/>
<circle cx="739" cy="676" r="11" class="num"/><text x="739" y="680" class="numtext">4</text>
<text x="757" y="681" font-weight="700">Khata and stock</text><text x="736" y="705" class="small">ledger.chargeOrderToKhata()</text><text x="736" y="727" class="small">inventory.reserve()</text>
<rect x="950" y="662" width="205" height="88" rx="6" class="node"/>
<circle cx="966" cy="676" r="11" class="num"/><text x="966" y="680" class="numtext">5</text>
<text x="984" y="681" font-weight="700">Save order</text><text x="963" y="705" class="small">orders.add(), appendAudit()</text><text x="963" y="727" class="small">store.write() → db.json</text>
<path d="M247 706 H266" class="flow"/><path d="M474 706 H493" class="flow"/><path d="M701 706 H720" class="flow"/><path d="M928 706 H947" class="flow"/>
</svg>

