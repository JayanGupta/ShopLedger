<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger Node and Express POS, including modules, routers, persistence, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#526078}
      .head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}
      .flow{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.7}.ticket{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2}
      .ticketText{fill:#581c87}.muted{fill:#526078}.line{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .ticketLine{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#arrowPurple)}
      .num{fill:#2563eb}.numText{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="42" class="title">ShopLedger · application architecture</text>
  <text x="30" y="66" class="subtitle">Node / Express POS, Khata credit ledger, inventory and GST invoicing</text>

  <!-- Runtime and entry points -->
  <rect x="25" y="88" width="1150" height="113" rx="12" class="panel"/>
  <text x="42" y="113" class="head">Runtime and entry points</text>
  <rect x="45" y="127" width="245" height="58" rx="8" class="box"/>
  <text x="60" y="151" class="head">Browser UI · public/</text><text x="60" y="173" class="body">index.html · js/app.js · css/style.css</text>
  <rect x="370" y="127" width="260" height="58" rx="8" class="box"/>
  <text x="390" y="151" class="head">server.js · Express app</text><text x="390" y="173" class="body">static files · JSON body parser · invoice view</text>
  <rect x="765" y="127" width="355" height="58" rx="8" class="box"/>
  <text x="785" y="151" class="head">config.js</text><text x="785" y="173" class="body">port · shop/GST identity · HSN slabs · coupons</text>
  <path d="M290 156 H365" class="line"/><text x="306" y="146" class="small muted">HTTP</text>
  <path d="M630 156 H760" class="line"/><text x="644" y="146" class="small muted">loads config</text>

  <!-- Routers -->
  <rect x="25" y="216" width="365" height="175" rx="12" class="panel"/>
  <text x="42" y="242" class="head">Routers · mounted at /api</text>
  <rect x="45" y="255" width="320" height="27" rx="5" class="box"/><text x="56" y="274" class="body">routes/products.js · /products · /coupons</text>
  <rect x="45" y="289" width="320" height="27" rx="5" class="flow"/><text x="56" y="308" class="body">routes/orders.js · /orders · cancel</text>
  <rect x="45" y="323" width="320" height="27" rx="5" class="box"/><text x="56" y="342" class="body">routes/customers.js · /customers · settle</text>
  <rect x="45" y="357" width="320" height="27" rx="5" class="box"/><text x="56" y="376" class="body">routes/reports.js · preview · reports · export</text>
  <path d="M495 201 V210 H205 V216" class="line"/><text x="274" y="211" class="small muted">mounts routers</text>

  <!-- Order flow -->
  <rect x="412" y="216" width="763" height="301" rx="12" class="panel"/>
  <text x="430" y="242" class="head">Order placement · POST /api/orders</text>
  <text x="430" y="262" class="small muted">Blue numbered sequence follows routes/orders.js; optional Khata charge happens before inventory/order save.</text>
  <g>
    <circle cx="445" cy="294" r="13" class="num"/><text x="445" y="299" class="numText">1</text>
    <rect x="465" y="276" width="195" height="42" rx="7" class="flow"/><text x="478" y="294" class="body">UI submits cart</text><text x="478" y="310" class="small">public/js/app.js</text>
    <path d="M660 297 H688" class="line"/>
    <circle cx="707" cy="294" r="13" class="num"/><text x="707" y="299" class="numText">2</text>
    <rect x="727" y="276" width="193" height="42" rx="7" class="flow"/><text x="740" y="294" class="body">Read data + resolve lines</text><text x="740" y="310" class="small">store.read · inventory.find</text>
    <path d="M920 297 H948" class="line"/>
    <circle cx="967" cy="294" r="13" class="num"/><text x="967" y="299" class="numText">3</text>
    <rect x="987" y="276" width="165" height="42" rx="7" class="flow"/><text x="1000" y="294" class="body">Check stock</text><text x="1000" y="310" class="small">inventory.check</text>

    <path d="M1068 318 V348 H1044" class="line"/>
    <circle cx="1025" cy="368" r="13" class="num"/><text x="1025" y="373" class="numText">4</text>
    <rect x="817" y="347" width="188" height="44" rx="7" class="flow"/><text x="830" y="366" class="body">Compute checkout totals</text><text x="830" y="383" class="small">pricing · coupons · tax</text>
    <path d="M817 369 H788" class="line"/>
    <circle cx="769" cy="368" r="13" class="num"/><text x="769" y="373" class="numText">5</text>
    <rect x="568" y="347" width="183" height="44" rx="7" class="flow"/><text x="581" y="366" class="body">Optional Khata charge</text><text x="581" y="383" class="small">ledger.chargeOrderToKhata</text>
    <path d="M568 369 H540 V419 H570" class="line"/>
    <circle cx="590" cy="440" r="13" class="num"/><text x="590" y="445" class="numText">6</text>
    <rect x="610" y="419" width="180" height="44" rx="7" class="flow"/><text x="623" y="438" class="body">Deduct stock</text><text x="623" y="455" class="small">inventory.reserve</text>
    <path d="M790 441 H817" class="line"/>
    <circle cx="836" cy="440" r="13" class="num"/><text x="836" y="445" class="numText">7</text>
    <rect x="856" y="419" width="135" height="44" rx="7" class="flow"/><text x="869" y="438" class="body">Create order</text><text x="869" y="455" class="small">orders.add</text>
    <path d="M991 441 H1018" class="line"/>
    <circle cx="1037" cy="440" r="13" class="num"/><text x="1037" y="445" class="numText">8</text>
    <rect x="1057" y="419" width="95" height="44" rx="7" class="flow"/><text x="1067" y="438" class="body">Audit +</text><text x="1067" y="455" class="small">write JSON</text>
    <text x="574" y="491" class="small muted">Saved: order lines and subtotal / discount / tax / total; customer ledger and stock changes share the same db.json write.</text>
  </g>

  <!-- Module map and persistence -->
  <rect x="25" y="407" width="365" height="265" rx="12" class="panel"/>
  <text x="42" y="433" class="head">lib/ · business modules</text>
  <rect x="45" y="447" width="150" height="42" rx="6" class="box"/><text x="56" y="465" class="body">pricing.js</text><text x="56" y="481" class="small">subtotal · computeTotals</text>
  <rect x="205" y="447" width="165" height="42" rx="6" class="box"/><text x="216" y="465" class="body">coupons.js</text><text x="216" y="481" class="small">validate · calculateDiscount</text>
  <rect x="45" y="497" width="150" height="42" rx="6" class="box"/><text x="56" y="515" class="body">tax.js</text><text x="56" y="531" class="small">HSN rate · CGST / SGST</text>
  <rect x="205" y="497" width="165" height="42" rx="6" class="ticket"/><text x="216" y="515" class="body ticketText">invoice.js ★</text><text x="216" y="531" class="small ticketText">computeInvoiceFigures · render</text>
  <rect x="45" y="547" width="150" height="42" rx="6" class="box"/><text x="56" y="565" class="body">orders.js</text><text x="56" y="581" class="small">add · get · cancel · list</text>
  <rect x="205" y="547" width="165" height="42" rx="6" class="box"/><text x="216" y="565" class="body">inventory.js</text><text x="216" y="581" class="small">find · check · reserve</text>
  <rect x="45" y="597" width="150" height="42" rx="6" class="box"/><text x="56" y="615" class="body">ledger.js</text><text x="56" y="631" class="small">Khata · settlement</text>
  <rect x="205" y="597" width="165" height="42" rx="6" class="box"/><text x="216" y="615" class="body">reports.js</text><text x="216" y="631" class="small">dashboard · reconciliation</text>
  <text x="45" y="658" class="small">Also: store.js (read / write / audit) · dates.js (date helpers)</text>

  <rect x="412" y="537" width="763" height="135" rx="12" class="panel"/>
  <text x="430" y="563" class="head">Persistence and invoice route</text>
  <rect x="438" y="578" width="245" height="69" rx="8" class="box"/>
  <text x="454" y="601" class="head">data/db.json</text><text x="454" y="622" class="body">products · orders · customers</text><text x="454" y="640" class="body">settlements · auditLog · ID counters</text>
  <rect x="747" y="578" width="177" height="69" rx="8" class="ticket"/>
  <text x="763" y="601" class="head ticketText">Invoice view</text><text x="763" y="622" class="body ticketText">GET /orders/:id/invoice</text><text x="763" y="640" class="small ticketText">orders.get → invoice.render</text>
  <rect x="991" y="578" width="158" height="69" rx="8" class="box"/>
  <text x="1007" y="601" class="head">Reports</text><text x="1007" y="622" class="body">reports.js compares</text><text x="1007" y="640" class="small">saved vs invoice totals</text>
  <path d="M1050 185 V207 H1125 V216" class="line"/>
  <path d="M420 156 H350 V224 H365" class="line"/>
  <path d="M365 302 H405" class="line"/>
  <path d="M682 612 H742" class="line"/><text x="688" y="602" class="small muted">reads / writes</text>
  <path d="M924 612 H986" class="ticketLine"/><text x="930" y="602" class="small ticketText">recomputes</text>
  <path d="M495 201 V552 H435 V578" class="line"/>
  <path d="M500 201 V570 H735 V578" class="ticketLine"/>
  <path d="M924 610 H950 V552 H971 V578" class="line"/>

  <!-- legend -->
  <rect x="25" y="695" width="1150" height="76" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="43" y="724" class="head">Legend</text>
  <rect x="126" y="707" width="20" height="20" rx="4" class="ticket"/><text x="155" y="723" class="body">Ticket focus: lib/invoice.js</text>
  <rect x="365" y="707" width="20" height="20" rx="4" class="flow"/><text x="394" y="723" class="body">Order flow step</text>
  <path d="M550 717 H605" class="line"/><text x="615" y="723" class="body">Code/data relationship</text>
  <circle cx="840" cy="717" r="12" class="num"/><text x="840" y="722" class="numText">#</text><text x="862" y="723" class="body">Flow sequence</text>
  <text x="43" y="753" class="small muted">tax.js is shown in neutral colour: checkout uses it for slab selection; invoice.js does not call it.</text>
</svg>
