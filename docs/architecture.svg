<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger, with the numbered order creation flow through the browser, order router, libraries, configuration, and JSON store.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#526078}
      .head{font-size:14px;font-weight:700}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:9}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2;rx:12}
      .ticket{fill:#fff7ed;stroke:#ea8a27;stroke-width:2}
      .flow{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.7;rx:9}
      .small{font-size:12px;fill:#526078}.line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .fline{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="38" class="title">ShopLedger | application architecture</text>
  <text x="29" y="61" class="sub">Express POS · Khata ledger · GST invoicing · JSON file persistence</text>

  <!-- Browser and entry point -->
  <rect x="25" y="86" width="200" height="125" class="group"/>
  <text x="40" y="108" class="head">Browser UI · public/</text>
  <text x="40" y="132">index.html</text><text x="40" y="153">js/app.js</text><text x="40" y="174">css/style.css</text>
  <text x="40" y="197" class="small">Cart → POST /api/orders</text>
  <rect x="270" y="111" width="175" height="76" class="box"/>
  <text x="290" y="139" class="head">server.js</text><text x="290" y="161" class="small">Express · static · route mounts</text>
  <path d="M225 148 H265" class="line"/>

  <!-- Routers -->
  <rect x="475" y="82" width="300" height="178" class="group"/>
  <text x="492" y="105" class="head">routes/ · mounted at /api</text>
  <rect x="492" y="118" width="266" height="29" class="flow"/><text x="505" y="138">orders.js · POST /orders (flow 2)</text>
  <rect x="492" y="153" width="266" height="25" class="box"/><text x="505" y="171">products.js · /products, /coupons</text>
  <rect x="492" y="184" width="266" height="25" class="box"/><text x="505" y="202">customers.js · /customers, /settle</text>
  <rect x="492" y="215" width="266" height="30" class="box"/><text x="505" y="235">reports.js · reports, preview, export</text>
  <path d="M445 149 H480" class="fline"/>

  <!-- Libraries -->
  <rect x="805" y="82" width="370" height="398" class="group"/>
  <text x="822" y="105" class="head">lib/ · business modules</text>
  <rect x="822" y="118" width="158" height="57" class="flow"/><text x="835" y="140">pricing.js</text><text x="835" y="160" class="small">subtotal · computeTotals (3)</text>
  <rect x="992" y="118" width="165" height="57" class="box"/><text x="1005" y="140">coupons.js</text><text x="1005" y="160" class="small">normalizeCode · validate</text>
  <rect x="822" y="185" width="158" height="57" class="ticket"/><text x="835" y="207">inventory.js ★</text><text x="835" y="227" class="small">find · check · reserve (3,4)</text>
  <rect x="992" y="185" width="165" height="57" class="ticket"/><text x="1005" y="207">orders.js ★ cancel only</text><text x="1005" y="227" class="small">add · get · cancel · list</text>
  <rect x="822" y="252" width="158" height="48" class="box"/><text x="835" y="273">ledger.js</text><text x="835" y="291" class="small">Khata charge / reverse</text>
  <rect x="992" y="252" width="165" height="48" class="box"/><text x="1005" y="273">store.js</text><text x="1005" y="291" class="small">read · appendAudit · write (5)</text>
  <rect x="822" y="310" width="158" height="48" class="box"/><text x="835" y="331">tax.js</text><text x="835" y="349" class="small">HSN rates · CGST/SGST</text>
  <rect x="992" y="310" width="165" height="48" class="box"/><text x="1005" y="331">dates.js</text><text x="1005" y="349" class="small">today · date normalization</text>
  <rect x="822" y="368" width="158" height="48" class="box"/><text x="835" y="389">invoice.js</text><text x="835" y="407" class="small">computeInvoiceFigures · render</text>
  <rect x="992" y="368" width="165" height="48" class="box"/><text x="1005" y="389">reports.js</text><text x="1005" y="407" class="small">dashboard · GST reconciliation</text>
  <path d="M775 149 H805" class="fline"/>
  <path d="M758 132 C790 132 790 213 817 213" class="fline"/>
  <path d="M980 146 H988" class="line"/><path d="M901 175 V181" class="fline"/>

  <!-- Config and data -->
  <rect x="475" y="287" width="300" height="77" class="box"/>
  <text x="492" y="311" class="head">config.js</text><text x="492" y="333" class="small">shop · tax slabs · coupons · inventory defaults</text>
  <path d="M775 326 H800" class="line"/>
  <rect x="475" y="391" width="300" height="83" class="flow"/>
  <text x="492" y="417" class="head">data/db.json</text><text x="492" y="440" class="small">products · orders · customers · settlements · auditLog</text>
  <text x="492" y="460" class="small">Read by store.read() · saved by store.write() (1,5)</text>
  <path d="M775 430 H987" class="fline"/>

  <!-- Numbered order flow -->
  <rect x="25" y="510" width="1150" height="252" class="group"/>
  <text x="45" y="538" class="head">Order placement · numbered request path</text>
  <rect x="45" y="558" width="205" height="73" class="flow"/>
  <text x="60" y="582" class="head">1 · public/js/app.js</text><text x="60" y="604" class="small">Collect item id + qty; POST</text><text x="60" y="621" class="small">/api/orders</text>
  <rect x="285" y="558" width="205" height="73" class="flow"/>
  <text x="300" y="582" class="head">2 · routes/orders.js</text><text x="300" y="604" class="small">Resolve product, validate cart;</text><text x="300" y="621" class="small">build line item snapshot</text>
  <rect x="525" y="558" width="205" height="73" class="ticket"/>
  <text x="540" y="582" class="head">3 · inventory.check()</text><text x="540" y="604" class="small">Compare qty with stock − reserved;</text><text x="540" y="621" class="small">pricing / coupon / tax totals</text>
  <rect x="765" y="558" width="205" height="73" class="ticket"/>
  <text x="780" y="582" class="head">4 · inventory.reserve()</text><text x="780" y="604" class="small">Deduct qty from product.stock;</text><text x="780" y="621" class="small">Khata charge if selected</text>
  <rect x="1005" y="558" width="145" height="73" class="flow"/>
  <text x="1020" y="582" class="head">5 · orders.add()</text><text x="1020" y="604" class="small">Create order + ID;</text><text x="1020" y="621" class="small">audit + save JSON</text>
  <path d="M250 594 H280" class="fline"/><path d="M490 594 H520" class="fline"/><path d="M730 594 H760" class="fline"/><path d="M970 594 H1000" class="fline"/>
  <text x="47" y="675" class="small">Stored line item fields: id, sku, name, hsn, price, qty. Products use id, stock, reserved.</text>
  <text x="47" y="698" class="small">Cancellation: POST /orders/:id/cancel → orders.cancel() → inventory.release() + Khata reversal → audit + store.write().</text>
  <text x="47" y="721" class="small">Note: release() looks up item.productId and reduces product.reserved; order lines above use item.id.</text>
  <rect x="915" y="678" width="16" height="16" class="ticket"/><text x="940" y="692" class="small">Ticket focus: inventory.js; orders.js cancel only</text>
  <text x="45" y="748" class="small">Solid arrows show request/data direction; blue numbered path is order placement. ★ marks highlighted modules.</text>
</svg>
