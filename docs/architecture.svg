<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger with modules, data flow, and a numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#475569}
      .head{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.route{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .step{fill:#2563eb;stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="38" class="title">ShopLedger · Application Architecture</text>
  <text x="28" y="62" class="subtitle">POS · Khata credit ledger · GST invoicing · JSON file storage</text>

  <!-- Browser layer -->
  <rect x="24" y="90" width="240" height="660" rx="12" class="group"/>
  <text x="42" y="119" class="head">Browser UI · public/</text>
  <rect x="42" y="136" width="204" height="110" rx="8" class="box"/>
  <text x="56" y="160" class="head">index.html</text>
  <text x="56" y="184" class="body">POS catalog and cart</text>
  <text x="56" y="205" class="body">Orders · Khata · audit</text>
  <text x="56" y="228" class="small">css/style.css · js/app.js</text>
  <rect x="42" y="292" width="204" height="114" rx="8" class="box"/>
  <text x="56" y="317" class="head">Place order</text>
  <text x="56" y="341" class="body">app.js → POST /api/orders</text>
  <text x="56" y="362" class="body">items, customer, mode, coupon</text>
  <text x="56" y="385" class="small">Preview: POST /api/pricing/preview</text>
  <text x="42" y="445" class="small">Also calls product, customer,</text>
  <text x="42" y="464" class="small">order and report endpoints.</text>

  <!-- Server and routing -->
  <rect x="292" y="90" width="260" height="660" rx="12" class="group"/>
  <rect x="316" y="112" width="212" height="80" rx="8" class="box"/>
  <text x="332" y="139" class="head">server.js · Express</text>
  <text x="332" y="163" class="body">static public/ · JSON parser</text>
  <text x="332" y="182" class="small">mounts /api routers</text>
  <text x="316" y="222" class="head">routes/</text>
  <rect x="316" y="238" width="212" height="70" rx="8" class="route"/>
  <text x="330" y="262" class="head">orders.js</text><text x="330" y="285" class="body">POST /orders · cancel · list</text>
  <rect x="316" y="319" width="212" height="62" rx="8" class="route"/>
  <text x="330" y="343" class="head">products.js</text><text x="330" y="365" class="body">products · coupons</text>
  <rect x="316" y="392" width="212" height="62" rx="8" class="route"/>
  <text x="330" y="416" class="head">customers.js</text><text x="330" y="438" class="body">customers · settlements</text>
  <rect x="316" y="465" width="212" height="74" rx="8" class="route"/>
  <text x="330" y="489" class="head">reports.js</text><text x="330" y="512" class="body">preview · dashboard · GST</text>
  <rect x="316" y="572" width="212" height="82" rx="8" class="focus"/>
  <text x="330" y="597" class="head">GET /orders/:id/invoice</text>
  <text x="330" y="620" class="body">orders.get → invoice.render</text>
  <text x="330" y="642" class="small">HTML printable invoice</text>
  <rect x="316" y="681" width="212" height="48" rx="8" class="box"/>
  <text x="330" y="711" class="body">config.js · port, shop, GST, coupons</text>

  <!-- Business modules -->
  <rect x="580" y="90" width="392" height="660" rx="12" class="group"/>
  <text x="600" y="119" class="head">lib/ · business logic</text>
  <rect x="600" y="141" width="168" height="88" rx="8" class="box"/>
  <text x="614" y="165" class="head">pricing.js</text><text x="614" y="189" class="body">subtotal · computeTotals</text><text x="614" y="211" class="small">discount → taxable → GST</text>
  <rect x="784" y="141" width="168" height="88" rx="8" class="box"/>
  <text x="798" y="165" class="head">coupons.js</text><text x="798" y="189" class="body">normalize · validate</text><text x="798" y="211" class="small">calculateDiscount</text>
  <rect x="600" y="244" width="168" height="88" rx="8" class="box"/>
  <text x="614" y="268" class="head">tax.js</text><text x="614" y="292" class="body">getRateForItem</text><text x="614" y="314" class="small">splitCgstSgst</text>
  <rect x="784" y="244" width="168" height="88" rx="8" class="box"/>
  <text x="798" y="268" class="head">inventory.js</text><text x="798" y="292" class="body">find · check · reserve</text><text x="798" y="314" class="small">release · summarize</text>
  <rect x="600" y="347" width="168" height="88" rx="8" class="box"/>
  <text x="614" y="371" class="head">orders.js</text><text x="614" y="395" class="body">add · get · cancel · list</text><text x="614" y="417" class="small">order records</text>
  <rect x="784" y="347" width="168" height="88" rx="8" class="box"/>
  <text x="798" y="371" class="head">ledger.js</text><text x="798" y="395" class="body">Khata · customer balance</text><text x="798" y="417" class="small">settlements · reversals</text>
  <rect x="600" y="450" width="168" height="96" rx="8" class="focus"/>
  <text x="614" y="474" class="head">invoice.js</text><text x="614" y="498" class="body">computeInvoiceFigures</text><text x="614" y="520" class="body">render · printable HTML</text><text x="614" y="539" class="small">independent recalculation</text>
  <rect x="784" y="450" width="168" height="96" rx="8" class="box"/>
  <text x="798" y="474" class="head">reports.js</text><text x="798" y="498" class="body">dashboard summary</text><text x="798" y="520" class="body">GST reconciliation</text>
  <rect x="600" y="561" width="168" height="76" rx="8" class="box"/>
  <text x="614" y="585" class="head">store.js</text><text x="614" y="609" class="body">read · write · appendAudit</text>
  <rect x="784" y="561" width="168" height="76" rx="8" class="box"/>
  <text x="798" y="585" class="head">dates.js</text><text x="798" y="609" class="body">today · normalizeDateKey</text>
  <rect x="600" y="659" width="352" height="60" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="616" y="684" class="body">All module names verified in lib/; pricing/tax feed checkout.</text>
  <text x="616" y="706" class="small">invoice.js is highlighted; tax.js is supporting logic.</text>

  <!-- Persistence and legend -->
  <rect x="1000" y="90" width="176" height="660" rx="12" class="group"/>
  <text x="1018" y="119" class="head">Persistence</text>
  <rect x="1018" y="141" width="140" height="104" rx="8" class="box"/>
  <text x="1032" y="166" class="head">data/db.json</text>
  <text x="1032" y="190" class="body">products · orders</text><text x="1032" y="212" class="body">customers · settlements</text><text x="1032" y="234" class="small">auditLog · counters</text>
  <rect x="1018" y="279" width="140" height="110" rx="8" class="box"/>
  <text x="1032" y="304" class="head">config.js</text><text x="1032" y="328" class="body">shop · GST slabs</text><text x="1032" y="350" class="body">coupons · defaults</text><text x="1032" y="373" class="small">used by routes and lib/</text>
  <rect x="1018" y="433" width="140" height="142" rx="8" class="box"/>
  <text x="1032" y="458" class="head">Legend</text>
  <rect x="1032" y="473" width="18" height="16" rx="3" class="focus"/><text x="1058" y="486" class="small">Ticket focus</text>
  <rect x="1032" y="499" width="18" height="16" rx="3" class="route"/><text x="1058" y="512" class="small">HTTP router</text>
  <line x1="1032" y1="533" x2="1050" y2="533" class="flow"/><text x="1058" y="538" class="small">Order sequence</text>
  <line x1="1032" y1="557" x2="1050" y2="557" class="link"/><text x="1058" y="562" class="small">Module/data link</text>

  <!-- General connections -->
  <path d="M246 185 L316 152" class="link"/>
  <path d="M528 153 L580 153" class="link"/>
  <path d="M952 600 L1018 194" class="link"/>
  <path d="M952 600 L1018 333" class="link"/>
  <path d="M768 498 L316 612" class="link"/>

  <!-- Numbered placement flow: badges identify where each operation runs. -->
  <path d="M246 349 L316 273" class="flow"/>
  <path d="M528 273 L784 288" class="flow"/>
  <path d="M528 273 L600 184" class="flow"/>
  <path d="M684 229 L684 244" class="flow"/>
  <path d="M768 184 L784 184" class="flow"/>
  <path d="M528 273 L784 391" class="flow"/>
  <path d="M528 273 L784 288" class="flow"/>
  <path d="M528 273 L600 391" class="flow"/>
  <path d="M684 435 L684 561" class="flow"/>
  <path d="M768 599 L1018 194" class="flow"/>
  <g><circle cx="130" cy="276" r="13" class="step"/><text x="126" y="281" font-size="13" fill="#fff">1</text></g>
  <g><circle cx="291" cy="294" r="13" class="step"/><text x="287" y="299" font-size="13" fill="#fff">2</text></g>
  <g><circle cx="786" cy="267" r="13" class="step"/><text x="782" y="272" font-size="13" fill="#fff">3</text></g>
  <g><circle cx="698" cy="237" r="13" class="step"/><text x="694" y="242" font-size="13" fill="#fff">4</text></g>
  <g><circle cx="881" cy="391" r="13" class="step"/><text x="877" y="396" font-size="13" fill="#fff">5</text></g>
  <g><circle cx="881" cy="288" r="13" class="step"/><text x="877" y="293" font-size="13" fill="#fff">6</text></g>
  <g><circle cx="698" cy="443" r="13" class="step"/><text x="694" y="448" font-size="13" fill="#fff">7</text></g>
  <g><circle cx="698" cy="548" r="13" class="step"/><text x="694" y="553" font-size="13" fill="#fff">8</text></g>
  <g><circle cx="896" cy="599" r="13" class="step"/><text x="892" y="604" font-size="13" fill="#fff">9</text></g>
  <text x="40" y="707" class="small">1 UI submit · 2 orders route: resolve items · 3 inventory.check · 4 pricing + tax/coupons · 5 Khata (if selected)</text>
  <text x="40" y="728" class="small">6 inventory.reserve · 7 orders.add · 8 store.appendAudit + store.write · 9 data/db.json persists the updated state</text>
</svg>
