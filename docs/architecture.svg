<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">Architecture map of ShopLedger and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}
      .subtitle{font-size:13px;fill:#526176}
      .head{font-size:15px;font-weight:700}
      .label{font-size:13px;font-weight:700}
      .small{font-size:12px;fill:#46556b}
      .tiny{font-size:12px;fill:#46556b}
      .panel{fill:#f7f9fc;stroke:#aebbd0;stroke-width:1.5}
      .node{fill:#fff;stroke:#94a3b8;stroke-width:1.4}
      .focus{fill:#fff3d5;stroke:#d28a00;stroke-width:2}
      .route{fill:#eaf2ff;stroke:#6688bd;stroke-width:1.4}
      .step{fill:#eff6ff;stroke:#8eb3f4;stroke-width:1.2}
      .wire{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#flowArrow)}
      .badge{fill:#2563eb}
      .badgeText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="38" class="title">ShopLedger · Application architecture</text>
  <text x="30" y="61" class="subtitle">Express POS · JSON persistence · order placement flow</text>
  <rect x="830" y="22" width="340" height="48" rx="8" fill="#fff8e8" stroke="#d28a00" stroke-width="1.5"/>
  <rect x="847" y="38" width="18" height="16" rx="3" class="focus"/>
  <text x="875" y="51" class="small">Ticket focus: invoice calculation and rendering</text>

  <!-- Entry points -->
  <rect x="30" y="90" width="265" height="125" rx="10" class="panel"/>
  <text x="48" y="116" class="head">Browser UI · public/</text>
  <text x="48" y="141" class="small">index.html · js/app.js · css/style.css</text>
  <text x="48" y="165" class="small">POS, order desk, Khata, GST audit</text>
  <text x="48" y="189" class="small">POST /api/orders · invoice link</text>

  <rect x="355" y="90" width="290" height="125" rx="10" class="node"/>
  <text x="375" y="118" class="head">server.js · Express app</text>
  <text x="375" y="145" class="small">JSON body parser · static public/</text>
  <text x="375" y="168" class="small">Mounts routers at /api</text>
  <text x="375" y="191" class="small">GET /orders/:id/invoice → invoice.render</text>

  <rect x="900" y="90" width="270" height="125" rx="10" class="node"/>
  <text x="920" y="118" class="head">config.js</text>
  <text x="920" y="145" class="small">Shop details · port · admin key</text>
  <text x="920" y="168" class="small">GST default + HSN slabs</text>
  <text x="920" y="191" class="small">Coupon definitions</text>
  <path d="M900 151 C820 151 750 151 645 151" class="wire"/>

  <path d="M295 151 L355 151" class="wire"/>
  <path d="M500 215 L500 231 L155 231 L155 246" class="wire"/>
  <path d="M500 231 L445 231 L445 246" class="wire"/>
  <path d="M500 231 L735 231 L735 246" class="wire"/>
  <path d="M500 231 L1025 231 L1025 246" class="wire"/>

  <!-- Routers -->
  <text x="30" y="240" class="head">HTTP routers · routes/</text>
  <rect x="30" y="250" width="250" height="96" rx="9" class="route"/>
  <text x="47" y="275" class="label">orders.js</text>
  <text x="47" y="298" class="small">POST /orders · cancel · list/get</text>
  <text x="47" y="322" class="small">Coordinates checkout and persistence</text>
  <rect x="320" y="250" width="250" height="96" rx="9" class="route"/>
  <text x="337" y="275" class="label">products.js</text>
  <text x="337" y="298" class="small">GET /products · GET /coupons</text>
  <text x="337" y="322" class="small">Catalog and active promo list</text>
  <rect x="610" y="250" width="250" height="96" rx="9" class="route"/>
  <text x="627" y="275" class="label">customers.js</text>
  <text x="627" y="298" class="small">GET /customers</text>
  <text x="627" y="322" class="small">POST /customers/:id/settle</text>
  <rect x="900" y="250" width="270" height="96" rx="9" class="route"/>
  <text x="917" y="275" class="label">reports.js</text>
  <text x="917" y="298" class="small">Dashboard · GST reconciliation</text>
  <text x="917" y="322" class="small">Pricing preview · admin export</text>

  <path d="M155 346 L155 362 L70 362 L70 379" class="wire"/>
  <path d="M155 362 L310 362 L310 379" class="wire"/>
  <path d="M155 362 L550 362 L550 379" class="wire"/>
  <path d="M155 362 L790 362 L790 379" class="wire"/>
  <path d="M155 362 L1030 362 L1030 379" class="wire"/>

  <!-- Library modules -->
  <text x="30" y="374" class="head">Business logic · lib/</text>
  <rect x="30" y="384" width="210" height="72" rx="8" class="node"/>
  <text x="46" y="408" class="label">pricing.js</text>
  <text x="46" y="432" class="small">subtotal · computeTotals</text>
  <rect x="270" y="384" width="210" height="72" rx="8" class="node"/>
  <text x="286" y="408" class="label">coupons.js</text>
  <text x="286" y="432" class="small">validate · calculateDiscount</text>
  <rect x="510" y="384" width="210" height="72" rx="8" class="focus"/>
  <text x="526" y="408" class="label">tax.js · ticket focus</text>
  <text x="526" y="432" class="small">getRateForItem · splitCgstSgst</text>
  <rect x="750" y="384" width="210" height="72" rx="8" class="focus"/>
  <text x="766" y="408" class="label">invoice.js · ticket focus</text>
  <text x="766" y="432" class="small">computeInvoiceFigures · render</text>
  <rect x="990" y="384" width="180" height="72" rx="8" class="node"/>
  <text x="1006" y="408" class="label">reports.js</text>
  <text x="1006" y="432" class="small">GST reconciliation</text>

  <rect x="30" y="472" width="210" height="72" rx="8" class="node"/>
  <text x="46" y="496" class="label">inventory.js</text>
  <text x="46" y="520" class="small">find · check · reserve · release</text>
  <rect x="270" y="472" width="210" height="72" rx="8" class="node"/>
  <text x="286" y="496" class="label">ledger.js</text>
  <text x="286" y="520" class="small">Khata charges · settlements</text>
  <rect x="510" y="472" width="210" height="72" rx="8" class="node"/>
  <text x="526" y="496" class="label">orders.js</text>
  <text x="526" y="520" class="small">add · get · cancel · list</text>
  <rect x="750" y="472" width="210" height="72" rx="8" class="node"/>
  <text x="766" y="496" class="label">store.js</text>
  <text x="766" y="520" class="small">read · write · appendAudit</text>
  <rect x="990" y="472" width="180" height="72" rx="8" class="node"/>
  <text x="1006" y="496" class="label">dates.js</text>
  <text x="1006" y="520" class="small">today · date keys</text>

  <!-- Supporting relationships -->
  <path d="M240 420 L270 420" class="wire"/>
  <path d="M480 420 L510 420" class="wire"/>
  <path d="M720 420 L750 420" class="wire"/>
  <path d="M960 420 L990 420" class="wire"/>
  <path d="M615 456 L615 472" class="wire"/>
  <path d="M720 508 L750 508" class="wire"/>
  <path d="M240 508 L270 508" class="wire"/>

  <!-- Database -->
  <path d="M855 544 L855 567" class="wire"/>
  <path d="M30 566 H1170 V620 H30 Z" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="590" class="label">data/db.json</text>
  <text x="52" y="610" class="small">Products · orders · customers · settlements · auditLog</text>
  <text x="715" y="600" class="small">store.read() loads JSON → store.write() rewrites JSON</text>

  <!-- Numbered order placement flow -->
  <text x="30" y="650" class="head">Order placement · numbered request flow</text>
  <rect x="30" y="666" width="265" height="52" rx="8" class="step"/>
  <circle cx="50" cy="692" r="12" class="badge"/><text x="50" y="696" class="badgeText">1</text>
  <text x="70" y="688" class="label">public/js/app.js</text><text x="70" y="707" class="small">POST /api/orders</text>
  <rect x="320" y="666" width="265" height="52" rx="8" class="step"/>
  <circle cx="340" cy="692" r="12" class="badge"/><text x="340" y="696" class="badgeText">2</text>
  <text x="360" y="688" class="label">routes/orders.js</text><text x="360" y="707" class="small">resolve products, validate request</text>
  <rect x="610" y="666" width="265" height="52" rx="8" class="step"/>
  <circle cx="630" cy="692" r="12" class="badge"/><text x="630" y="696" class="badgeText">3</text>
  <text x="650" y="688" class="label">inventory.js · check</text><text x="650" y="707" class="small">confirm stock is sellable</text>
  <rect x="900" y="666" width="270" height="52" rx="8" class="step"/>
  <circle cx="920" cy="692" r="12" class="badge"/><text x="920" y="696" class="badgeText">4</text>
  <text x="940" y="688" class="label">pricing.js · subtotal</text><text x="940" y="707" class="small">coupons.validate / calculateDiscount</text>
  <path d="M295 692 L320 692" class="flow"/><path d="M585 692 L610 692" class="flow"/><path d="M875 692 L900 692" class="flow"/>

  <rect x="30" y="734" width="265" height="52" rx="8" class="step"/>
  <circle cx="50" cy="760" r="12" class="badge"/><text x="50" y="764" class="badgeText">5</text>
  <text x="70" y="756" class="label">pricing.js · computeTotals</text><text x="70" y="775" class="small">tax.js resolves HSN slab; rounds totals</text>
  <rect x="320" y="734" width="265" height="52" rx="8" class="step"/>
  <circle cx="340" cy="760" r="12" class="badge"/><text x="340" y="764" class="badgeText">6</text>
  <text x="360" y="756" class="label">ledger.js · Khata (if selected)</text><text x="360" y="775" class="small">chargeOrderToKhata checks limit</text>
  <rect x="610" y="734" width="265" height="52" rx="8" class="step"/>
  <circle cx="630" cy="760" r="12" class="badge"/><text x="630" y="764" class="badgeText">7</text>
  <text x="650" y="756" class="label">inventory.reserve · orders.add</text><text x="650" y="775" class="small">deduct stock and append order</text>
  <rect x="900" y="734" width="270" height="52" rx="8" class="step"/>
  <circle cx="920" cy="760" r="12" class="badge"/><text x="920" y="764" class="badgeText">8</text>
  <text x="940" y="756" class="label">store.write → data/db.json</text><text x="940" y="775" class="small">save order, stock, Khata, audit</text>
  <path d="M1170 718 L1185 718 L1185 728 L15 728 L15 760 L30 760" class="flow"/>
  <path d="M295 760 L320 760" class="flow"/><path d="M585 760 L610 760" class="flow"/><path d="M875 760 L900 760" class="flow"/>
</svg>
