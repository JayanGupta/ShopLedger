<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser user interface, Express server, routes, libraries, configuration, JSON database, and numbered order-placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0369a1"/></marker>
    <style>
      .bg { fill:#f8fafc; } .title { font:700 24px Arial,sans-serif; fill:#0f172a; }
      .subtitle { font:14px Arial,sans-serif; fill:#475569; }
      .section { font:700 14px Arial,sans-serif; fill:#334155; letter-spacing:.4px; }
      .box { fill:#fff; stroke:#94a3b8; stroke-width:1.3; rx:8; } .server { fill:#e0f2fe; stroke:#0284c7; stroke-width:1.8; rx:9; }
      .route { fill:#f8fafc; stroke:#64748b; stroke-width:1.2; rx:6; } .lib { fill:#f1f5f9; stroke:#64748b; stroke-width:1.2; rx:6; }
      .ticket { fill:#fff1f2; stroke:#e11d48; stroke-width:2; rx:6; } .data { fill:#ecfdf5; stroke:#059669; stroke-width:1.8; rx:8; }
      .config { fill:#fffbeb; stroke:#d97706; stroke-width:1.5; rx:7; } .label { font:700 14px Arial,sans-serif; fill:#0f172a; }
      .small { font:12px Arial,sans-serif; fill:#334155; } .tiny { font:12px Arial,sans-serif; fill:#475569; }
      .line { fill:none; stroke:#475569; stroke-width:1.35; marker-end:url(#arrow); } .flow { fill:none; stroke:#0369a1; stroke-width:2.4; marker-end:url(#flowArrow); }
      .dash { fill:none; stroke:#94a3b8; stroke-width:1.25; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .badge { fill:#0369a1; } .badgeText { font:700 12px Arial,sans-serif; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text x="40" y="38" class="title">ShopLedger — application architecture &amp; order placement</text>
  <text x="40" y="61" class="subtitle">Node/Express POS · Khata credit ledger · GST invoicing · persisted in a local JSON file</text>

  <text x="40" y="100" class="section">BROWSER</text>
  <rect x="40" y="112" width="225" height="122" class="box"/>
  <text x="58" y="139" class="label">public/</text>
  <text x="58" y="163" class="small">index.html</text><text x="58" y="183" class="small">js/app.js — POS UI/API client</text><text x="58" y="203" class="small">css/style.css</text>
  <text x="58" y="222" class="tiny">Places orders; opens printable invoices</text>

  <text x="327" y="100" class="section">EXPRESS APPLICATION</text>
  <rect x="327" y="112" width="234" height="122" class="server"/>
  <text x="345" y="141" class="label">server.js</text>
  <text x="345" y="165" class="small">bodyParser.json()</text><text x="345" y="185" class="small">express.static(public/)</text>
  <text x="345" y="205" class="small">mounts /api routers</text><text x="345" y="224" class="small">GET /orders/:id/invoice</text>
  <path d="M265 173 H327" class="flow"/><circle cx="296" cy="157" r="11" class="badge"/><text x="296" y="158" class="badgeText">1</text>

  <text x="625" y="100" class="section">ROUTERS — routes/</text>
  <rect x="625" y="112" width="220" height="52" class="route"/><text x="639" y="135" class="label">orders.js</text><text x="639" y="153" class="small">POST /orders · cancel · list · get</text>
  <rect x="625" y="176" width="220" height="48" class="route"/><text x="639" y="198" class="label">products.js</text><text x="639" y="215" class="small">GET /products · /coupons</text>
  <rect x="625" y="236" width="220" height="48" class="route"/><text x="639" y="258" class="label">customers.js</text><text x="639" y="275" class="small">GET customers · POST settle</text>
  <rect x="625" y="296" width="220" height="60" class="route"/><text x="639" y="318" class="label">reports.js</text><text x="639" y="336" class="small">dashboard · GST reconciliation</text><text x="639" y="351" class="small">pricing preview · admin export</text>
  <path d="M561 173 H625" class="line"/>

  <text x="910" y="100" class="section">SETTINGS &amp; DATA</text>
  <rect x="910" y="112" width="245" height="96" class="config"/><text x="927" y="137" class="label">config.js</text><text x="927" y="160" class="small">shop identity · port · admin key</text><text x="927" y="180" class="small">HSN GST slabs · coupons</text><text x="927" y="199" class="small">inventory defaults</text>
  <rect x="910" y="230" width="245" height="106" class="data"/><text x="927" y="257" class="label">data/db.json</text><text x="927" y="280" class="small">products · customers · orders</text><text x="927" y="300" class="small">settlements · audit log · counters</text><text x="927" y="319" class="small">sole persistent datastore</text>

  <text x="40" y="282" class="section">BUSINESS LOGIC — lib/</text>
  <rect x="40" y="295" width="160" height="64" class="lib"/><text x="53" y="319" class="label">store.js</text><text x="53" y="340" class="small">read · write · appendAudit</text>
  <rect x="214" y="295" width="160" height="64" class="lib"/><text x="227" y="319" class="label">inventory.js</text><text x="227" y="340" class="small">find · check · reserve</text>
  <rect x="388" y="295" width="160" height="64" class="lib"/><text x="401" y="319" class="label">pricing.js</text><text x="401" y="340" class="small">subtotal · computeTotals</text>
  <rect x="562" y="295" width="160" height="64" class="lib"/><text x="575" y="319" class="label">coupons.js</text><text x="575" y="340" class="small">normalize · validate · calculate</text>
  <rect x="736" y="295" width="160" height="64" class="lib"/><text x="749" y="319" class="label">orders.js</text><text x="749" y="340" class="small">add · get · cancel · list</text>
  <rect x="910" y="350" width="245" height="64" class="lib"/><text x="923" y="374" class="label">ledger.js</text><text x="923" y="395" class="small">customer lookup · charge · settlement</text>

  <rect x="40" y="378" width="160" height="60" class="lib"/><text x="53" y="402" class="label">dates.js</text><text x="53" y="422" class="small">today · date normalization</text>
  <rect x="214" y="378" width="160" height="60" class="lib"/><text x="227" y="402" class="lib label">reports.js</text><text x="227" y="422" class="small">dashboard · GST reconciliation</text>
  <rect x="388" y="378" width="160" height="60" class="lib"/><text x="401" y="402" class="label">tax.js</text><text x="401" y="422" class="small">getRateForItem · CGST/SGST</text>
  <rect x="562" y="378" width="334" height="60" class="ticket"/><text x="575" y="402" class="label">invoice.js  — ticket focus</text><text x="575" y="422" class="small">computeInvoiceFigures · render printable HTML</text>
  <path d="M845 138 H910" class="dash"/><path d="M845 326 H910" class="dash"/>
  <path d="M200 327 H214" class="line"/><path d="M374 327 H388" class="line"/><path d="M548 327 H562" class="line"/><path d="M722 327 H736" class="line"/>
  <path d="M468 359 V378" class="line"/><path d="M120 359 V378" class="line"/>
  <path d="M722 408 H562" class="dash"/><path d="M896 408 H910" class="dash"/>

  <text x="40" y="486" class="section">NUMBERED FLOW: POST /api/orders</text>
  <rect x="40" y="504" width="1115" height="177" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" rx="9"/>
  <path d="M98 577 H220" class="flow"/><path d="M296 577 H420" class="flow"/><path d="M496 577 H620" class="flow"/><path d="M696 577 H820" class="flow"/><path d="M896 577 H1030" class="flow"/>
  <circle cx="70" cy="534" r="13" class="badge"/><text x="70" y="535" class="badgeText">1</text><text x="91" y="538" class="label">Browser</text><text x="53" y="559" class="small">app.js POSTs cart</text><text x="53" y="577" class="small">items + coupon + payment</text>
  <circle cx="248" cy="534" r="13" class="badge"/><text x="248" y="535" class="badgeText">2</text><text x="269" y="538" class="label">orders route</text><text x="229" y="559" class="small">read db; resolve products</text><text x="229" y="577" class="small">validate cart &amp; stock</text>
  <circle cx="448" cy="534" r="13" class="badge"/><text x="448" y="535" class="badgeText">3</text><text x="469" y="538" class="label">Price &amp; tax</text><text x="429" y="559" class="small">pricing.computeTotals()</text><text x="429" y="577" class="small">coupon + HSN GST tax.js</text>
  <circle cx="648" cy="534" r="13" class="badge"/><text x="648" y="535" class="badgeText">4</text><text x="669" y="538" class="label">Commit state</text><text x="629" y="559" class="small">Khata charge if applicable</text><text x="629" y="577" class="small">inventory.reserve()</text>
  <circle cx="848" cy="534" r="13" class="badge"/><text x="848" y="535" class="badgeText">5</text><text x="869" y="538" class="label">Create order</text><text x="829" y="559" class="small">orders.add(); audit event</text><text x="829" y="577" class="small">assign nextOrderId</text>
  <circle cx="1058" cy="534" r="13" class="badge"/><text x="1058" y="535" class="badgeText">6</text><text x="1079" y="538" class="label">Persist</text><text x="1038" y="559" class="small">store.write()</text><text x="1038" y="577" class="small">rewrite db.json; 201</text>
  <text x="59" y="632" class="tiny">Saved order: item snapshots (id, SKU, name, HSN, price, qty), customer/payment/status/coupon, subtotal, discount, tax, total.</text>
  <text x="59" y="655" class="tiny">Separate printable path: server.js GET /orders/:id/invoice → orders.get() → invoice.render() → invoice.computeInvoiceFigures().</text>

  <rect x="40" y="710" width="1115" height="57" fill="#fff" stroke="#cbd5e1" rx="7"/>
  <text x="58" y="735" class="label">Legend</text>
  <rect x="132" y="720" width="20" height="18" class="ticket"/><text x="162" y="734" class="small">Ticket focus</text>
  <rect x="280" y="720" width="20" height="18" class="server"/><text x="310" y="734" class="small">HTTP app</text>
  <rect x="410" y="720" width="20" height="18" class="route"/><text x="440" y="734" class="small">Router/library</text>
  <rect x="574" y="720" width="20" height="18" class="config"/><text x="604" y="734" class="small">Configuration</text>
  <rect x="735" y="720" width="20" height="18" class="data"/><text x="765" y="734" class="small">Persisted data</text>
  <path d="M902 729 H944" class="flow"/><text x="954" y="734" class="small">numbered order flow</text>
</svg>
