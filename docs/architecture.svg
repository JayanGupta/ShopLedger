<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">The browser talks to the Express server, which mounts four API routers and serves printable invoices. The module map shows the ten libraries, configuration and JSON store. The numbered flow follows a successful order and the optional invoice request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526785"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #142540; font-size: 13px }
      .title { font-size: 32px; font-weight: 750 }
      .subtitle { font-size: 15px; fill: #48607b }
      .section { font-size: 15px; font-weight: 750; letter-spacing: .5px }
      .name { font-size: 15px; font-weight: 720 }
      .muted { fill: #425974 }
      .card { fill: #fff; stroke: #bfcede }
      .ticket { fill: #f2eaff; stroke: #784ac1; stroke-width: 1.5 }
      .ticketText { fill: #55268c }
      .wire { fill: none; stroke: #526785; stroke-width: 1.6 }
      .arrow { marker-end: url(#arrow) }
      .num { fill: white; font-weight: 750; text-anchor: middle }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f5f8fc"/>
  <text class="title" x="36" y="55">ShopLedger architecture</text>
  <text class="subtitle" x="37" y="82">Browser POS, Khata credit ledger and printable GST invoices</text>

  <rect x="810" y="106" width="354" height="641" rx="16" fill="#e9eff8" stroke="#c7d3e4"/>
  <text class="section" x="831" y="136">PLACING AN ORDER</text>

  <g class="wire">
    <path class="arrow" d="M173 166H259"/>
    <path d="M505 166H590V230H124M590 230H679"/>
    <path class="arrow" d="M124 230V250"/>
    <path class="arrow" d="M309 230V250"/>
    <path class="arrow" d="M494 230V250"/>
    <path class="arrow" d="M679 230V250"/>
    <path d="M259 185H240V213H25V668" stroke-dasharray="5 5"/>
    <path class="arrow" d="M25 668H43" stroke-dasharray="5 5"/>
  </g>

  <rect class="card" x="43" y="130" width="130" height="72" rx="10"/>
  <text class="name" x="56" y="157">public/</text>
  <text class="muted" x="56" y="180">Browser UI</text>
  <text class="muted" x="184" y="153">HTTP</text>

  <rect class="card" x="259" y="130" width="246" height="72" rx="10"/>
  <text class="name" x="273" y="157">server.js</text>
  <text class="muted" x="273" y="180">Express · static files · JSON requests</text>
  <text class="muted" x="517" y="153">/api</text>

  <text class="section" x="43" y="235">routes/</text>
  <g>
    <rect class="card" x="43" y="250" width="163" height="77" rx="9"/>
    <text class="name" x="55" y="275">products.js</text>
    <text class="muted" x="55" y="296">Catalog and coupons</text>
    <text class="muted" x="55" y="314">Uses inventory, tax</text>

    <rect class="card" x="228" y="250" width="163" height="77" rx="9"/>
    <text class="name" x="240" y="275">orders.js</text>
    <text class="muted" x="240" y="296">Place, list, cancel</text>
    <text class="muted" x="240" y="314">See steps 1–6 →</text>

    <rect class="card" x="413" y="250" width="163" height="77" rx="9"/>
    <text class="name" x="425" y="275">customers.js</text>
    <text class="muted" x="425" y="296">Accounts, settlements</text>
    <text class="muted" x="425" y="314">Uses ledger, store</text>

    <rect class="card" x="598" y="250" width="163" height="77" rx="9"/>
    <text class="name" x="610" y="275">reports.js</text>
    <text class="muted" x="610" y="296">Reports, preview, export</text>
    <text class="muted" x="610" y="314">Uses reports, pricing</text>
  </g>

  <text class="section" x="43" y="356">lib/</text>
  <g>
    <rect class="card" x="43" y="369" width="228" height="70" rx="9"/>
    <text class="name" x="55" y="393">inventory.js</text>
    <text class="muted" x="55" y="415">find() · check() · reserve()</text>

    <rect class="card" x="288" y="369" width="228" height="70" rx="9"/>
    <text class="name" x="300" y="393">pricing.js</text>
    <text class="muted" x="300" y="415">computeTotals() → coupons, tax</text>

    <rect class="card" x="533" y="369" width="228" height="70" rx="9"/>
    <text class="name" x="545" y="393">coupons.js</text>
    <text class="muted" x="545" y="415">validate() · calculateDiscount()</text>

    <rect class="card" x="43" y="451" width="228" height="70" rx="9"/>
    <text class="name" x="55" y="475">tax.js</text>
    <text class="muted" x="55" y="497">getRateForItem() · splitCgstSgst()</text>

    <rect class="card" x="288" y="451" width="228" height="70" rx="9"/>
    <text class="name" x="300" y="475">ledger.js</text>
    <text class="muted" x="300" y="497">chargeOrderToKhata()</text>

    <rect class="card" x="533" y="451" width="228" height="70" rx="9"/>
    <text class="name" x="545" y="475">orders.js</text>
    <text class="muted" x="545" y="497">add() · get() · list() · cancel()</text>

    <rect class="card" x="43" y="533" width="228" height="70" rx="9"/>
    <text class="name" x="55" y="557">dates.js</text>
    <text class="muted" x="55" y="579">today() · normalizeDateKey()</text>

    <rect class="card" x="288" y="533" width="228" height="70" rx="9"/>
    <text class="name" x="300" y="557">reports.js</text>
    <text class="muted" x="300" y="579">getGstReconciliation() → invoice</text>

    <rect class="card" x="533" y="533" width="228" height="70" rx="9"/>
    <text class="name" x="545" y="557">store.js</text>
    <text class="muted" x="545" y="579">read() · appendAudit() · write()</text>

    <rect class="ticket" x="43" y="627" width="228" height="78" rx="9"/>
    <text class="name ticketText" x="55" y="650">lib/invoice.js</text>
    <text class="ticketText" x="55" y="672">render() · computeInvoiceFigures()</text>
    <text class="ticketText" x="55" y="691">Recalculates from items and config</text>

    <rect class="card" x="288" y="627" width="228" height="78" rx="9"/>
    <text class="name" x="300" y="650">config.js</text>
    <text class="muted" x="300" y="672">Shop, GST, coupon and stock rules</text>

    <rect class="card" x="533" y="627" width="228" height="78" rx="9"/>
    <text class="name" x="545" y="650">data/db.json</text>
    <text class="muted" x="545" y="672">Orders, stock, customers,</text>
    <text class="muted" x="545" y="691">settlements, counters and audit</text>
    <path class="wire arrow" d="M647 603V624"/>
  </g>

  <path d="M842 171V613" stroke="#9db0cb" stroke-width="2"/>
  <g>
    <circle cx="842" cy="171" r="12" fill="#263f64"/><text class="num" x="842" y="176">1</text>
    <text class="name" x="864" y="174">Submit order</text>
    <text x="864" y="195">Browser → server.js → routes/orders.js</text>
    <text class="muted" x="864" y="213">POST /api/orders</text>

    <circle cx="842" cy="242" r="12" fill="#263f64"/><text class="num" x="842" y="247">2</text>
    <text class="name" x="864" y="245">Load and check items</text>
    <text x="864" y="266">store.read() loads data/db.json.</text>
    <text class="muted" x="864" y="284">inventory.find() resolves the catalog item.</text>
    <text class="muted" x="864" y="302">inventory.check() checks sellable stock.</text>

    <circle cx="842" cy="330" r="12" fill="#263f64"/><text class="num" x="842" y="335">3</text>
    <text class="name" x="864" y="333">Price the cart</text>
    <text x="864" y="354">coupons.validate() checks eligibility.</text>
    <text class="muted" x="864" y="372">pricing.computeTotals() allocates discounts</text>
    <text class="muted" x="864" y="390">and applies line GST through tax.js.</text>

    <circle cx="842" cy="418" r="12" fill="#263f64"/><text class="num" x="842" y="423">4</text>
    <text class="name" x="864" y="421">Charge Khata if selected</text>
    <text x="864" y="442">ledger.chargeOrderToKhata() checks</text>
    <text class="muted" x="864" y="460">credit and updates the customer balance.</text>

    <circle cx="842" cy="488" r="12" fill="#263f64"/><text class="num" x="842" y="493">5</text>
    <text class="name" x="864" y="491">Commit stock and build order</text>
    <text x="864" y="512">inventory.reserve() deducts stock.</text>
    <text class="muted" x="864" y="530">orders.add() adds the order in memory.</text>

    <circle cx="842" cy="558" r="12" fill="#263f64"/><text class="num" x="842" y="563">6</text>
    <text class="name" x="864" y="561">Persist and respond</text>
    <text x="864" y="582">store.appendAudit() adds ORDER_CREATED.</text>
    <text class="muted" x="864" y="600">store.write() rewrites data/db.json.</text>
    <text class="muted" x="864" y="618">The route returns HTTP 201 with the order.</text>
  </g>

  <rect class="ticket" x="829" y="642" width="316" height="85" rx="9"/>
  <text class="name ticketText" x="842" y="665">Optional invoice request</text>
  <text class="ticketText" x="842" y="687">GET /orders/:id/invoice → server.js</text>
  <text class="ticketText" x="842" y="706">store.read() → orders.get() → invoice.render()</text>

  <rect class="ticket" x="43" y="738" width="18" height="14" rx="3"/>
  <text x="69" y="750">Ticket module</text>
  <path class="wire arrow" d="M179 745H212" stroke-dasharray="5 5"/>
  <text x="224" y="750">Printable invoice path</text>
</svg>
