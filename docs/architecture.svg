<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser to Express routers, all ten library modules, configuration and JSON storage. Six numbered steps trace order placement. Invoice is the ticket focus and currently calculates independently of pricing and tax.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0369a1"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b44;font-size:12px}
      .title{font-size:27px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .heading{font-size:14px;font-weight:700}.file{font-size:14px;font-weight:700}
      .muted{fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}
      .lib{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
      .focus{fill:#fff1e8;stroke:#c2410c;stroke-width:2}
      .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0369a1;stroke-width:2;marker-end:url(#blueArrow)}
      .badge{fill:#0369a1}.num{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#eef3f8"/>
  <text x="28" y="38" class="title">ShopLedger · architecture</text>
  <text x="28" y="61" class="subtitle">Verified from source · Node / Express POS, Khata ledger and printable GST invoices</text>
  <!-- Entry points and shared resources -->
  <rect x="28" y="83" width="252" height="122" rx="9" class="box"/>
  <text x="42" y="107" class="file">Browser UI · public/</text>
  <text x="42" y="130">index.html · css/style.css · js/app.js</text>
  <text x="42" y="151">Cart, orders, Khata, reconciliation</text>
  <text x="42" y="173">getSelectedCartItems() → post()</text>
  <text x="42" y="193" class="muted">POST /api/orders · JSON response</text>
  <path d="M280 143 H323" class="flow"/>
  <circle cx="301" cy="124" r="11" class="badge"/><text x="301" y="129" class="num">1</text>
  <rect x="327" y="83" width="286" height="122" rx="9" class="box"/>
  <text x="341" y="107" class="file">server.js</text>
  <text x="341" y="130">bodyParser.json() · express.static()</text>
  <text x="341" y="151">Mounts all four routers at /api</text>
  <text x="341" y="173">GET /orders/:id/invoice</text>
  <text x="341" y="193" class="muted">store.read() → orders.get() → invoice.render()</text>
  <rect x="638" y="83" width="259" height="122" rx="9" class="box"/>
  <text x="652" y="107" class="file">config.js</text>
  <text x="652" y="130">Shop, port, admin key, inventory,</text>
  <text x="652" y="149">HSN slabs and coupon definitions</text>
  <text x="652" y="172" class="muted">Read by server.js, routes/reports.js,</text>
  <text x="652" y="191" class="muted">inventory, coupons, tax and invoice</text>
  <rect x="922" y="83" width="250" height="122" rx="9" fill="#e5f3eb" stroke="#39805c" stroke-width="1.5"/>
  <text x="936" y="107" class="file">data/db.json</text>
  <text x="936" y="130">products · customers · orders</text>
  <text x="936" y="150">settlements · auditLog · ID counters</text>
  <text x="936" y="173" class="muted">One JSON file; read / rewritten</text>
  <text x="936" y="193" class="muted">synchronously through lib/store.js</text>
  <!-- Server mounts routers; bus denotes routing rather than execution order -->
  <path d="M465 205 V232 H165 V254 M465 232 H455 V254 M465 232 H745 V254 M745 232 H1035 V254" class="edge"/>
  <text x="28" y="234" class="heading">HTTP routers</text>
  <rect x="28" y="256" width="274" height="112" rx="8" class="box"/>
  <text x="42" y="279" class="file">routes/products.js</text>
  <text x="42" y="300">GET /products · GET /coupons</text>
  <text x="42" y="324" class="muted">Uses: store, inventory, tax, coupons</text>
  <text x="42" y="348" class="muted">Product stock and GST slab listing</text>
  <rect x="318" y="256" width="274" height="112" rx="8" fill="#e9f5ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="332" y="279" class="file">routes/orders.js</text>
  <text x="332" y="300">GET /orders · GET /orders/:id</text>
  <text x="332" y="320">POST /orders · POST /orders/:id/cancel</text>
  <text x="332" y="341" class="muted">Uses: store, inventory, pricing,</text>
  <text x="332" y="357" class="muted">coupons, orders, ledger</text>
  <circle cx="574" cy="271" r="11" class="badge"/><text x="574" y="276" class="num">2</text>
  <rect x="608" y="256" width="274" height="112" rx="8" class="box"/>
  <text x="622" y="279" class="file">routes/customers.js</text>
  <text x="622" y="300">GET /customers</text>
  <text x="622" y="320">POST /customers/:id/settle</text>
  <text x="622" y="348" class="muted">Uses: store, ledger</text>
  <rect x="898" y="256" width="274" height="112" rx="8" class="box"/>
  <text x="912" y="279" class="file">routes/reports.js</text>
  <text x="912" y="300">GET /reports/dashboard</text>
  <text x="912" y="317">GET /reports/gst-reconciliation</text>
  <text x="912" y="334">POST /pricing/preview · GET /admin/export</text>
  <text x="912" y="351" class="muted">Uses: config, store, reports,</text>
  <text x="912" y="365" class="muted">pricing, coupons</text>
  <text x="28" y="399" class="heading">Library modules · router dependencies are listed above; selected internal calls shown below</text>
  <!-- All ten lib files; arrows show actual call directions -->
  <rect x="28" y="414" width="216" height="80" rx="8" class="lib"/>
  <text x="40" y="436" class="file">lib/inventory.js</text>
  <text x="40" y="457">find() · check() · reserve()</text>
  <text x="40" y="478">release() · getSellableStock()</text>
  <rect x="260" y="414" width="216" height="80" rx="8" class="lib"/>
  <text x="272" y="436" class="file">lib/pricing.js</text>
  <text x="272" y="457">subtotal() · computeTotals()</text>
  <text x="272" y="478">Discount first; GST per line</text>
  <rect x="492" y="414" width="216" height="80" rx="8" class="lib"/>
  <text x="504" y="436" class="file">lib/coupons.js</text>
  <text x="504" y="457">normalizeCode() · validate()</text>
  <text x="504" y="478">calculateDiscount() · listActive()</text>
  <path d="M476 454 H490" class="edge"/>
  <rect x="724" y="414" width="216" height="80" rx="8" class="lib"/>
  <text x="736" y="436" class="file">lib/orders.js</text>
  <text x="736" y="457">add() · get() · list() · cancel()</text>
  <text x="736" y="478">Also calls inventory and ledger</text>
  <rect x="956" y="414" width="216" height="80" rx="8" class="lib"/>
  <text x="968" y="436" class="file">lib/dates.js</text>
  <text x="968" y="457">today() · normalizeDateKey()</text>
  <text x="968" y="478">getFiscalYear() · also used by ledger</text>
  <path d="M940 454 H954" class="edge"/>
  <rect x="28" y="516" width="216" height="80" rx="8" class="lib"/>
  <text x="40" y="538" class="file">lib/ledger.js</text>
  <text x="40" y="559">chargeOrderToKhata()</text>
  <text x="40" y="580">recordSettlement() · listCustomers()</text>
  <rect x="260" y="516" width="216" height="80" rx="8" class="lib"/>
  <text x="272" y="538" class="file">lib/tax.js</text>
  <text x="272" y="559">getRateForItem() · getSlabPercent()</text>
  <text x="272" y="580">splitCgstSgst(); exact HSN lookup</text>
  <path d="M368 494 V514" class="edge"/>
  <rect x="492" y="516" width="216" height="80" rx="8" class="focus"/>
  <text x="504" y="538" class="file">lib/invoice.js · TICKET</text>
  <text x="504" y="559">render() · computeInvoiceFigures()</text>
  <text x="504" y="580">Own math; no pricing / tax calls</text>
  <rect x="724" y="516" width="216" height="80" rx="8" class="lib"/>
  <text x="736" y="538" class="file">lib/reports.js</text>
  <text x="736" y="559">getDashboardSummary()</text>
  <text x="736" y="580">getGstReconciliation()</text>
  <path d="M724 556 H710" class="edge"/>
  <rect x="956" y="516" width="216" height="80" rx="8" class="lib"/>
  <text x="968" y="538" class="file">lib/store.js</text>
  <text x="968" y="559">read() · write() · appendAudit()</text>
  <text x="968" y="580">JSON persistence; audit capped at 100</text>
  <path d="M1172 555 H1186 V144 H1174" class="edge"/>
  <!-- Numbered successful order path, including the optional Khata branch -->
  <rect x="28" y="615" width="1144" height="158" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="42" y="638" class="heading">Placing an order · successful path (all mutations stay in memory until step 6)</text>
  <circle cx="50" cy="660" r="10" class="badge"/><text x="50" y="665" class="num">1</text>
  <text x="68" y="657">public/js/app.js → server.js</text><text x="68" y="675" class="muted">post('/api/orders', payload, callback)</text>
  <path d="M349 663 H389" class="flow"/>
  <circle cx="412" cy="660" r="10" class="badge"/><text x="412" y="665" class="num">2</text>
  <text x="430" y="657">routes/orders.js → store.read()</text><text x="430" y="675" class="muted">Resolve items via inventory.find(); check()</text>
  <path d="M746 663 H778" class="flow"/>
  <circle cx="802" cy="660" r="10" class="badge"/><text x="802" y="665" class="num">3</text>
  <text x="820" y="657">coupons.validate() → pricing.computeTotals()</text><text x="820" y="675" class="muted">Capped discount; tax.getRateForItem()</text>
  <path d="M1147 682 V695 H50 V704" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#blueArrow)"/>
  <circle cx="50" cy="721" r="10" class="badge"/><text x="50" y="726" class="num">4</text>
  <text x="68" y="718">ledger.chargeOrderToKhata() if Khata</text><text x="68" y="736" class="muted">Check credit; update customer billing / balance</text>
  <path d="M349 724 H389" class="flow"/>
  <circle cx="412" cy="721" r="10" class="badge"/><text x="412" y="726" class="num">5</text>
  <text x="430" y="718">inventory.reserve() → orders.add()</text><text x="430" y="736" class="muted">Deduct stock; append order; increment ID</text>
  <path d="M746 724 H778" class="flow"/>
  <circle cx="802" cy="721" r="10" class="badge"/><text x="802" y="726" class="num">6</text>
  <text x="820" y="718">store.appendAudit() → store.write(db)</text><text x="820" y="736" class="muted">Save db.json → HTTP 201 with saved order</text>
  <text x="42" y="760" class="muted">Saved: item snapshots, coupon, subtotal, discount, tax, total; stock; Khata changes; audit. Line GST / discount breakdowns are not saved.</text>
  <rect x="28" y="783" width="12" height="12" fill="#fff1e8" stroke="#c2410c"/>
  <text x="47" y="794">Ticket focus</text><path d="M145 789 H173" class="flow"/><text x="182" y="794">Numbered order flow</text>
  <path d="M340 789 H368" class="edge"/><text x="377" y="794">Selected routing / calls / storage access</text>
  <text x="677" y="794" class="muted">Invoice branch: recomputes totals from items + current config.</text>
</svg>
