<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement</title>
<desc id="desc">Browser, Express server, four routers, ten library modules, configuration and JSON storage. Invoice module is highlighted as ticket focus. Eight numbered steps trace order placement. Connections are selected; router boxes list their library dependencies. Order flow reads left to right, then continues on the next row.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52657b"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#203047}
.heading{font-size:26px;font-weight:bold}.section{font-size:14px;font-weight:bold}.name{font-size:14px;font-weight:bold}.muted{fill:#506078}.ticket{fill:#853c13}.step{font-size:13px;font-weight:bold}
.box{fill:#fff;stroke:#b7c4d3;stroke-width:1.3}.lib{fill:#f1f6fc;stroke:#9eb4cd;stroke-width:1.3}.focus{fill:#fff0d9;stroke:#c77227;stroke-width:2}.edge{fill:none;stroke:#52657b;stroke-width:1.5;marker-end:url(#arrow)}
</style>
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="24" y="36" class="heading">ShopLedger · architecture</text>
<text x="24" y="59" class="muted">Current code • selected connections • numbered order flow below • all paths relative to repository root</text>
<rect x="910" y="23" width="16" height="16" rx="3" class="focus"/><text x="934" y="36">Ticket focus: invoice.js</text>
<rect x="910" y="47" width="16" height="16" rx="3" class="lib"/><text x="934" y="60">Other library modules</text>

<rect x="24" y="88" width="230" height="108" rx="9" class="box"/>
<text x="36" y="111" class="name">Browser UI · public/</text>
<text x="36" y="132" class="">index.html · css/style.css</text>
<text x="36" y="149" class="">js/app.js · XMLHttpRequest</text>
<text x="36" y="166" class="">Cart, orders, Khata, audit</text>
<rect x="294" y="88" width="380" height="108" rx="9" class="box"/>
<text x="306" y="111" class="name">server.js · Express</text>
<text x="306" y="132" class="">JSON parser; static public/; mounts /api</text>
<text x="306" y="149" class="">GET /orders/:id/invoice → store.read(),</text>
<text x="306" y="166" class="">orders.get(), invoice.render()</text>
<rect x="704" y="88" width="224" height="108" rx="9" class="box"/>
<text x="716" y="111" class="name">config.js</text>
<text x="716" y="132" class="">Shop, GST slabs, coupons</text>
<text x="716" y="149" class="">Inventory settings, admin key</text>
<text x="716" y="166" class="">Read by server and libraries</text>
<rect x="952" y="88" width="224" height="108" rx="9" class="box"/>
<text x="964" y="111" class="name">data/db.json</text>
<text x="964" y="132" class="">Products, orders, customers</text>
<text x="964" y="149" class="">Settlements, audit, ID counters</text>
<text x="964" y="166" class="">lib/store.js reads / writes</text>
<path d="M254 128 H294" class="edge" marker-start="url(#arrow)"/>
<text x="260" y="115" class="">HTTP</text>
<path d="M484 196 V216 H159 V238" class="edge"/>
<path d="M484 216 H453 V238" class="edge"/>
<path d="M484 216 H747 V238" class="edge"/>
<path d="M747 216 H1041 V238" class="edge"/>
<text x="505" y="211" class="">/api routers</text>
<rect x="24" y="238" width="270" height="116" rx="9" class="box"/>
<text x="36" y="261" class="name">routes/products.js</text>
<text x="36" y="282" class="">GET /products · /coupons</text>
<text x="36" y="299" class="">Uses store, inventory, tax, coupons</text>
<rect x="318" y="238" width="270" height="116" rx="9" class="box"/>
<text x="330" y="261" class="name">routes/orders.js</text>
<text x="330" y="282" class="">GET /orders, /orders/:id; POST /orders</text>
<text x="330" y="299" class="">POST /orders/:id/cancel</text>
<text x="330" y="316" class="">Uses store, inventory, pricing, coupons,</text>
<text x="330" y="333" class="">orders, ledger</text>
<rect x="612" y="238" width="270" height="116" rx="9" class="box"/>
<text x="624" y="261" class="name">routes/customers.js</text>
<text x="624" y="282" class="">GET /customers</text>
<text x="624" y="299" class="">POST /customers/:id/settle</text>
<text x="624" y="316" class="">Uses store, ledger</text>
<rect x="906" y="238" width="270" height="116" rx="9" class="box"/>
<text x="918" y="261" class="name">routes/reports.js</text>
<text x="918" y="282" class="">GET /reports/dashboard,</text>
<text x="918" y="299" class="">/reports/gst-reconciliation, /admin/export</text>
<text x="918" y="316" class="">POST /pricing/preview</text>
<text x="918" y="333" class="">Uses config; store, reports, pricing, coupons</text>
<text x="24" y="378" class="section">lib/ · business rules and persistence</text>
<text x="368" y="378" class="muted">Router boxes list direct dependencies; module boxes show key functions.</text>
<rect x="24" y="390" width="208" height="84" rx="9" class="lib"/>
<text x="36" y="413" class="name">lib/inventory.js</text>
<text x="36" y="434" class="">find() · check() · reserve()</text>
<text x="36" y="451" class="">release() · getSellableStock()</text>
<rect x="260" y="390" width="208" height="84" rx="9" class="lib"/>
<text x="272" y="413" class="name">lib/pricing.js</text>
<text x="272" y="434" class="">subtotal() · computeTotals()</text>
<text x="272" y="451" class="">Uses tax + coupons</text>
<rect x="496" y="390" width="208" height="84" rx="9" class="lib"/>
<text x="508" y="413" class="name">lib/coupons.js</text>
<text x="508" y="434" class="">normalizeCode() · validate()</text>
<text x="508" y="451" class="">calculateDiscount() · config</text>
<rect x="732" y="390" width="208" height="84" rx="9" class="lib"/>
<text x="744" y="413" class="name">lib/ledger.js</text>
<text x="744" y="434" class="">chargeOrderToKhata()</text>
<text x="744" y="451" class="">recordSettlement() · dates</text>
<rect x="968" y="390" width="208" height="84" rx="9" class="lib"/>
<text x="980" y="413" class="name">lib/orders.js</text>
<text x="980" y="434" class="">add() · get() · list() · cancel()</text>
<text x="980" y="451" class="">Uses dates, inventory, ledger</text>
<rect x="24" y="494" width="208" height="84" rx="9" class="lib"/>
<text x="36" y="517" class="name">lib/tax.js</text>
<text x="36" y="538" class="">getRateForItem()</text>
<text x="36" y="555" class="">splitCgstSgst() · config</text>
<rect x="260" y="494" width="208" height="84" rx="9" class="lib"/>
<text x="272" y="517" class="name">lib/dates.js</text>
<text x="272" y="538" class="">today() · normalizeDateKey()</text>
<text x="272" y="555" class="">getFiscalYear()</text>
<rect x="496" y="494" width="208" height="84" rx="9" class="lib"/>
<text x="508" y="517" class="name">lib/reports.js</text>
<text x="508" y="538" class="">getDashboardSummary()</text>
<text x="508" y="555" class="">getGstReconciliation()</text>
<text x="508" y="572">Uses inventory, ledger, invoice</text>
<rect x="732" y="494" width="208" height="84" rx="9" class="focus"/>
<text x="744" y="517" class="name">lib/invoice.js</text>
<text x="744" y="538" class="">computeInvoiceFigures()</text>
<text x="744" y="555" class="">render() · uses pricing + config</text>
<rect x="968" y="494" width="208" height="84" rx="9" class="lib"/>
<text x="980" y="517" class="name">lib/store.js</text>
<text x="980" y="538" class="">read() · write()</text>
<text x="980" y="555" class="">appendAudit() · JSON file I/O</text>
<path d="M704 536 H732" class="edge"/>
<path d="M1176 530 H1188 V204 H1064 V196" class="edge" marker-start="url(#arrow)"/>
<text x="24" y="598" class="ticket">Invoice reuses checkout pricing: HSN slabs; capped coupon before GST; identical line taxes and totals.</text>
<rect x="16" y="615" width="1168" height="169" rx="12" fill="#eaf1f8" stroke="#c7d4e3"/>
<text x="30" y="638" class="section">Placing an order · 1 → 2 → 3 → 4, then 5 → 6 → 7 → 8 · routes/orders.js orchestrates steps 2–8</text>
<text x="30" y="660" class="step">1  Browser → server.js</text>
<text x="30" y="678" class="">Place click → POST /api/orders</text>
<text x="30" y="694" class="">getSelectedCartItems() builds payload</text>
<text x="320" y="660" class="step">2  routes/orders.js → store</text>
<text x="320" y="678" class="">POST /orders handler: read()</text>
<text x="320" y="694" class="">Resolve products via inventory.find()</text>
<text x="610" y="660" class="step">3  inventory.check()</text>
<text x="610" y="678" class="">Check stock − reserved per line</text>
<text x="610" y="694" class="">Reject unavailable quantities</text>
<text x="900" y="660" class="step">4  coupons → pricing</text>
<text x="900" y="678" class="">normalizeCode(), validate()</text>
<text x="900" y="694" class="">pricing.computeTotals(items, code)</text>
<text x="30" y="723" class="step">5  pricing → tax + coupons</text>
<text x="30" y="741" class="">Discount allocated across lines</text>
<text x="30" y="757" class="">GST on discounted lines; round totals</text>
<text x="320" y="723" class="step">6  ledger (Khata only)</text>
<text x="320" y="741" class="">chargeOrderToKhata(): credit check</text>
<text x="320" y="757" class="">Update totalBilled and balance</text>
<text x="610" y="723" class="step">7  inventory → orders</text>
<text x="610" y="741" class="">reserve(): subtract physical stock</text>
<text x="610" y="757" class="">add(): order, date, nextOrderId++</text>
<text x="900" y="723" class="step">8  store → db.json → browser</text>
<text x="900" y="741" class="">appendAudit(); write() entire DB</text>
<text x="900" y="757" class="">Items + totals, stock, Khata; HTTP 201</text>
</svg>
