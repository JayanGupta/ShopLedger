<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Express architecture with all routers and library modules, the numbered order placement flow, and the invoice module highlighted for the ticket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#0e766a"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Segoe UI", sans-serif; fill: #192c39; }
    .title { font-size: 37px; font-weight: 760; }
    .heading { font-size: 21px; font-weight: 720; }
    .label { font-size: 15px; font-weight: 700; }
    .code { font-family: Consolas, "Courier New", monospace; font-size: 15px; font-weight: 700; }
    .detail { font-size: 14px; fill: #475c68; }
    .card { fill: #fff; stroke: #c9d7d9; }
    .highlight { fill: #fff2d9; stroke: #c47a20; }
    .ticket-text { fill: #81480b; }
    .flow { stroke: #0e766a; stroke-width: 2; fill: none; }
    .number { fill: #0e766a; }
    .number-text { font-size: 13px; font-weight: 750; text-anchor: middle; fill: #fff; }
  </style>
  <rect width="1200" height="800" fill="#f4f8f7"/>
  <text class="title" x="48" y="63">ShopLedger architecture</text>
  <text class="detail" x="49" y="91">Browser POS · Express API · JSON storage</text>
  <path d="M48 109H1152" stroke="#c9d7d9"/>

  <text class="heading" x="48" y="143">Application structure</text>

  <g>
    <rect class="card" x="48" y="158" width="224" height="78" rx="10"/>
    <text class="code" x="64" y="183">public/</text>
    <text class="detail" x="64" y="204">Browser UI</text>
    <text class="detail" x="64" y="222">index.html · js/app.js · CSS</text>

    <rect class="card" x="309" y="158" width="259" height="78" rx="10"/>
    <text class="code" x="325" y="183">server.js</text>
    <text class="detail" x="325" y="204">Serves static files and mounts /api</text>
    <text class="detail" x="325" y="222">GET /orders/:id/invoice</text>
    <path class="flow" d="M272 193H309" marker-end="url(#arrow)"/>
    <path class="flow" d="M438 236V254" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect class="card" x="48" y="254" width="520" height="103" rx="10"/>
    <text class="label" x="64" y="279">Express routers</text>
    <text class="code" x="64" y="310">routes/products.js</text>
    <text class="code" x="323" y="310">routes/orders.js</text>
    <text class="code" x="64" y="336">routes/customers.js</text>
    <text class="code" x="323" y="336">routes/reports.js</text>
    <path class="flow" d="M438 357V375" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect class="card" x="48" y="375" width="520" height="252" rx="10"/>
    <text class="label" x="64" y="402">Library modules</text>

    <text class="code" x="64" y="431">lib/inventory.js</text>
    <text class="detail" x="64" y="450">Stock checks and adjustments</text>
    <text class="code" x="323" y="431">lib/orders.js</text>
    <text class="detail" x="323" y="450">Order records and cancellation</text>

    <text class="code" x="64" y="470">lib/pricing.js</text>
    <text class="detail" x="64" y="489">Checkout totals</text>
    <text class="code" x="323" y="470">lib/tax.js</text>
    <text class="detail" x="323" y="489">GST rate lookup and tax split</text>

    <text class="code" x="64" y="509">lib/coupons.js</text>
    <text class="detail" x="64" y="528">Coupon validation and discounts</text>
    <text class="code" x="323" y="509">lib/ledger.js</text>
    <text class="detail" x="323" y="528">Khata balances and payments</text>

    <text class="code" x="64" y="548">lib/reports.js</text>
    <text class="detail" x="64" y="567">Dashboard and GST reconciliation</text>
    <rect class="highlight" x="312" y="533" width="244" height="39" rx="6"/>
    <text class="code ticket-text" x="323" y="548">lib/invoice.js</text>
    <text class="detail ticket-text" x="323" y="566">invoice.render() returns HTML</text>

    <text class="code" x="64" y="587">lib/dates.js</text>
    <text class="detail" x="64" y="606">Date utilities</text>
    <text class="code" x="323" y="587">lib/store.js</text>
    <text class="detail" x="323" y="606">JSON storage and audit log</text>
  </g>

  <g>
    <rect class="card" x="48" y="647" width="251" height="85" rx="10"/>
    <text class="code" x="64" y="673">config.js</text>
    <text class="detail" x="64" y="694">Shop, GST slabs, coupon rules,</text>
    <text class="detail" x="64" y="713">inventory settings and port</text>

    <rect class="card" x="316" y="647" width="252" height="85" rx="10"/>
    <path class="flow" d="M438 627V647" marker-end="url(#arrow)"/>
    <text class="code" x="332" y="673">data/db.json</text>
    <text class="detail" x="332" y="694">Products, orders, customers,</text>
    <text class="detail" x="332" y="713">settlements, audit log and IDs</text>
  </g>

  <text class="heading" x="602" y="143">How an order is placed</text>
  <rect class="card" x="602" y="158" width="550" height="574" rx="10"/>
  <path class="flow" d="M632 191V680" marker-end="url(#arrow)"/>

  <g>
    <circle class="number" cx="632" cy="191" r="14"/>
    <text class="number-text" x="632" y="196">1</text>
    <text class="label" x="658" y="188">Submit the cart</text>
    <text class="code" x="658" y="209">getSelectedCartItems() → POST /api/orders</text>
    <text class="detail" x="658" y="229">Sends items, customer, payment mode, status and coupon.</text>

    <circle class="number" cx="632" cy="267" r="14"/>
    <text class="number-text" x="632" y="272">2</text>
    <text class="label" x="658" y="264">Load the order inputs</text>
    <text class="code" x="658" y="285">server.js → routes/orders.js → store.read()</text>
    <text class="detail" x="658" y="305">The POST handler reads data/db.json.</text>

    <circle class="number" cx="632" cy="343" r="14"/>
    <text class="number-text" x="632" y="348">3</text>
    <text class="label" x="658" y="340">Resolve items and check stock</text>
    <text class="code" x="658" y="361">inventory.find() → inventory.check()</text>
    <text class="detail" x="658" y="381">Uses prices and HSN codes from the product catalog.</text>

    <circle class="number" cx="632" cy="419" r="14"/>
    <text class="number-text" x="632" y="424">4</text>
    <text class="label" x="658" y="416">Validate the coupon and calculate totals</text>
    <text class="code" x="658" y="437">pricing.subtotal() → coupons.validate()</text>
    <text class="code" x="658" y="457">pricing.computeTotals() → tax.getRateForItem()</text>
    <text class="detail" x="658" y="477">Apportions the discount, then applies GST per item.</text>

    <circle class="number" cx="632" cy="515" r="14"/>
    <text class="number-text" x="632" y="520">5</text>
    <text class="label" x="658" y="512">Check and charge customer credit for Khata orders</text>
    <text class="code" x="658" y="533">ledger.chargeOrderToKhata()</text>

    <circle class="number" cx="632" cy="590" r="14"/>
    <text class="number-text" x="632" y="595">6</text>
    <text class="label" x="658" y="587">Deduct stock and add the order and audit entry</text>
    <text class="code" x="658" y="608">inventory.reserve() → orders.add()</text>
    <text class="detail" x="658" y="628">store.appendAudit() records ORDER_CREATED.</text>

    <circle class="number" cx="632" cy="680" r="14"/>
    <text class="number-text" x="632" y="685">7</text>
    <text class="label" x="658" y="677">Save the changes and return the order</text>
    <text class="code" x="658" y="698">store.write() → data/db.json · HTTP 201 to the browser</text>
  </g>

  <rect class="highlight" x="48" y="754" width="19" height="15" rx="3"/>
  <text class="detail" x="77" y="767">Invoice ticket module</text>
  <path class="flow" d="M253 762H284" marker-end="url(#arrow)"/>
  <text class="detail" x="296" y="767">Main request and data flow</text>
</svg>
