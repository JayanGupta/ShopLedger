<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Browser, Express server, routers, business modules and JSON storage. The numbered sequence traces a successful checkout. Orange marks inventory and order cancellation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#536980"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 13px; fill: #243c52; }
    .title { font-size: 29px; font-weight: 750; fill: #112c44; }
    .heading { font-size: 18px; font-weight: 700; fill: #112c44; }
    .name { font-size: 14px; font-weight: 700; fill: #112c44; }
    .small { font-size: 12px; }
    .card { fill: #fff; stroke: #bdcbd9; }
    .panel { fill: #edf3f8; stroke: #d2dee9; }
    .focus { fill: #fff0dc; stroke: #b66b26; }
    .focus-text { fill: #81400d; }
    .line { fill: none; stroke: #536980; stroke-width: 1.5; }
    .arrow { marker-end: url(#arrow); }
    .num { fill: #1c496c; }
    .num-text { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect width="1200" height="800" fill="#f7fafd"/>
  <text class="title" x="28" y="47">ShopLedger architecture</text>
  <rect class="focus" x="992" y="29" width="16" height="16" rx="3"/>
  <text x="1018" y="42">Ticket scope</text>

  <g aria-label="Application structure">
    <rect class="card" x="28" y="73" width="238" height="91" rx="10"/>
    <text class="heading" x="44" y="102">Browser UI · public/</text>
    <text x="44" y="126">POS, orders, Khata, audit</text>
    <text class="small" x="44" y="146">index.html · js/app.js · css/style.css</text>

    <path class="line arrow" d="M274 119H333" marker-start="url(#arrow)"/>
    <rect class="card" x="341" y="73" width="390" height="91" rx="10"/>
    <text class="heading" x="357" y="102">server.js</text>
    <text x="357" y="126">Express · JSON requests · static files</text>
    <text x="357" y="146">GET /orders/:id/invoice → invoice.render()</text>

    <path class="line arrow" d="M536 164V192"/>
    <text class="small" x="545" y="183">/api</text>
    <rect class="panel" x="28" y="194" width="703" height="100" rx="10"/>
    <text class="heading" x="44" y="219">routes/</text>

    <rect class="card" x="44" y="231" width="155" height="47" rx="6"/>
    <text class="name" x="55" y="251">products.js</text>
    <text class="small" x="55" y="269">Catalog, coupons</text>
    <rect class="card" x="210" y="231" width="155" height="47" rx="6"/>
    <text class="name" x="221" y="251">orders.js</text>
    <text class="small" x="221" y="269">Place, list, get, cancel</text>
    <rect class="card" x="376" y="231" width="155" height="47" rx="6"/>
    <text class="name" x="387" y="251">customers.js</text>
    <text class="small" x="387" y="269">Accounts, settlements</text>
    <rect class="card" x="542" y="231" width="173" height="47" rx="6"/>
    <text class="name" x="553" y="251">reports.js</text>
    <text class="small" x="553" y="269">Reports, preview, export</text>

    <path class="line arrow" d="M379 294V321"/>
    <rect class="panel" x="28" y="323" width="703" height="332" rx="10"/>
    <text class="heading" x="44" y="349">lib/</text>

    <rect class="focus" x="44" y="363" width="322" height="62" rx="7"/>
    <text class="name focus-text" x="56" y="387">inventory.js</text>
    <text class="small focus-text" x="56" y="409">Sellable stock, checks, deduction, release</text>

    <rect class="card" x="378" y="363" width="337" height="62" rx="7"/>
    <text class="name" x="390" y="387">orders.js</text>
    <text class="small" x="390" y="409">add() · get() · list()</text>
    <rect class="focus" x="593" y="376" width="109" height="34" rx="6"/>
    <text class="name focus-text" x="612" y="398">cancel()</text>

    <rect class="card" x="44" y="437" width="159" height="58" rx="7"/>
    <text class="name" x="56" y="460">pricing.js</text>
    <text class="small" x="56" y="480">Checkout totals</text>
    <rect class="card" x="215" y="437" width="159" height="58" rx="7"/>
    <text class="name" x="227" y="460">coupons.js</text>
    <text class="small" x="227" y="480">Validation, discounts</text>
    <rect class="card" x="386" y="437" width="159" height="58" rx="7"/>
    <text class="name" x="398" y="460">tax.js</text>
    <text class="small" x="398" y="480">GST rates and split</text>
    <rect class="card" x="557" y="437" width="158" height="58" rx="7"/>
    <text class="name" x="569" y="460">ledger.js</text>
    <text class="small" x="569" y="480">Khata balances</text>

    <rect class="card" x="44" y="507" width="159" height="58" rx="7"/>
    <text class="name" x="56" y="530">invoice.js</text>
    <text class="small" x="56" y="550">Printable GST invoice</text>
    <rect class="card" x="215" y="507" width="159" height="58" rx="7"/>
    <text class="name" x="227" y="530">reports.js</text>
    <text class="small" x="227" y="550">Dashboard, GST audit</text>
    <rect class="card" x="386" y="507" width="159" height="58" rx="7"/>
    <text class="name" x="398" y="530">dates.js</text>
    <text class="small" x="398" y="550">Date helpers</text>
    <rect class="card" x="557" y="507" width="158" height="58" rx="7"/>
    <text class="name" x="569" y="530">store.js</text>
    <text class="small" x="569" y="550">JSON I/O, audit entries</text>

    <rect class="focus" x="44" y="579" width="671" height="60" rx="7"/>
    <text class="name focus-text" x="56" y="602">Cancellation · orders.cancel() → inventory.release()</text>
    <text class="small focus-text" x="56" y="623">release() uses productId and reduces reserved. Saved lines use id, so their stock stays deducted.</text>

    <path class="line arrow" d="M715 536H724V673H636V691" marker-start="url(#arrow)"/>
    <rect class="card" x="28" y="693" width="337" height="78" rx="10"/>
    <text class="heading" x="44" y="720">config.js</text>
    <text x="44" y="744">Shop, port, GST, inventory, coupons, export key</text>
    <rect class="card" x="378" y="693" width="353" height="78" rx="10"/>
    <text class="heading" x="394" y="720">data/db.json</text>
    <text x="394" y="744">Products, orders, customers, settlements, audit, IDs</text>
  </g>

  <g aria-label="Successful order placement">
    <rect class="panel" x="755" y="73" width="417" height="698" rx="12"/>
    <text class="heading" x="778" y="106">Placing an order</text>
    <path class="line arrow" d="M790 148V692"/>

    <circle class="num" cx="790" cy="148" r="12"/>
    <text class="num-text" x="790" y="153">1</text>
    <text class="name" x="813" y="147">Browser → server.js</text>
    <text x="813" y="167">getSelectedCartItems() → post('/api/orders', …)</text>

    <circle class="num" cx="790" cy="216" r="12"/>
    <text class="num-text" x="790" y="221">2</text>
    <text class="name" x="813" y="215">routes/orders.js → store.read()</text>
    <text x="813" y="235">Read data/db.json. Resolve lines with inventory.find().</text>
    <text class="small" x="813" y="254">Saved line fields · id, sku, name, hsn, price, qty</text>

    <circle class="num" cx="790" cy="295" r="12"/>
    <text class="num-text" x="790" y="300">3</text>
    <text class="name focus-text" x="813" y="294">inventory.check()</text>
    <text x="813" y="314">getSellableStock() computes max(0, stock − reserved).</text>
    <text x="813" y="333">Reject any line with qty ≥ sellable.</text>

    <circle class="num" cx="790" cy="374" r="12"/>
    <text class="num-text" x="790" y="379">4</text>
    <text class="name" x="813" y="373">Coupons, pricing, and GST</text>
    <text x="813" y="393">pricing.subtotal() → coupons.normalizeCode()</text>
    <text x="813" y="412">Validate a supplied code with coupons.validate().</text>
    <text x="813" y="431">pricing.computeTotals() → tax.getRateForItem()</text>

    <circle class="num" cx="790" cy="472" r="12"/>
    <text class="num-text" x="790" y="477">5</text>
    <text class="name" x="813" y="471">ledger.chargeOrderToKhata() · Khata only</text>
    <text x="813" y="491">Check credit and update totalBilled and balance.</text>

    <circle class="num" cx="790" cy="540" r="12"/>
    <text class="num-text" x="790" y="545">6</text>
    <text class="name focus-text" x="813" y="539">inventory.reserve()</text>
    <text x="813" y="559">Subtract qty from physical stock. Keep reserved as is.</text>

    <circle class="num" cx="790" cy="608" r="12"/>
    <text class="num-text" x="790" y="613">7</text>
    <text class="name" x="813" y="607">orders.add() → dates.today()</text>
    <text x="813" y="627">Assign the next ID and append the order.</text>
    <text x="813" y="646">store.appendAudit() adds ORDER_CREATED.</text>

    <circle class="num" cx="790" cy="705" r="12"/>
    <text class="num-text" x="790" y="710">8</text>
    <text class="name" x="813" y="704">store.write() → data/db.json</text>
    <text x="813" y="724">Save order, stock, Khata changes, ID counter, and audit.</text>
    <text x="813" y="743">Return HTTP 201 and the order to the browser.</text>
  </g>
</svg>
