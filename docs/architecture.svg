<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Browser, Express server, four routers, ten library modules, configuration, and JSON storage. A numbered sequence shows the order write and the invoice request that can follow it.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172942; font-size: 14px; }
      .title { font-size: 38px; font-weight: 750; }
      .heading { font-size: 21px; font-weight: 700; }
      .file { font-size: 16px; font-weight: 700; }
      .detail { fill: #425673; }
      .card { fill: #fff; stroke: #bac9db; }
      .ticket { fill: #fff0d9; stroke: #ad540e; stroke-width: 2; }
      .accent { fill: #813b0b; }
      .connector { fill: none; stroke: #58708e; stroke-width: 2; }
      .path { marker-end: url(#arrow); }
      .step { fill: #225386; }
      .number { fill: white; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58708e"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#edf3fa"/>
  <text x="40" y="58" class="title">ShopLedger architecture</text>
  <text x="42" y="86" class="detail">Point of sale, Khata credit ledger, and printable GST invoices</text>

  <rect x="40" y="112" width="648" height="626" rx="18" fill="#f7faff" stroke="#cfdae8"/>
  <rect x="712" y="112" width="448" height="626" rx="18" fill="#fff" stroke="#cfdae8"/>
  <text x="60" y="147" class="heading">Application modules</text>
  <text x="734" y="147" class="heading">Placing an order</text>

  <g class="connector">
    <path class="path" d="M249 193 H270"/>
    <path d="M364 218 V245 M131 245 H596"/>
    <path class="path" d="M131 245 V255"/>
    <path class="path" d="M286 245 V255"/>
    <path class="path" d="M441 245 V255"/>
    <path class="path" d="M596 245 V255"/>
    <path class="path" d="M484 193 H459"/>
    <path d="M131 310 V323 M286 310 V323 M441 310 V323 M596 310 V323 M131 323 H596"/>
    <path class="path" d="M364 323 V337"/>
  </g>

  <rect class="card" x="60" y="168" width="189" height="50" rx="8"/>
  <text x="72" y="189" class="file">public/</text>
  <text x="72" y="207" class="detail">Browser POS</text>
  <rect class="card" x="271" y="168" width="187" height="50" rx="8"/>
  <text x="283" y="189" class="file">server.js</text>
  <text x="283" y="207" class="detail">Express entry point</text>
  <rect class="card" x="484" y="168" width="183" height="50" rx="8"/>
  <text x="496" y="189" class="file">config.js</text>
  <text x="496" y="207" class="detail">Shop, GST, coupons, port</text>

  <text x="60" y="240" class="detail">routes/ · mounted at /api</text>
  <g>
    <rect class="card" x="60" y="255" width="142" height="55" rx="8"/>
    <text x="72" y="277" class="file">orders.js</text>
    <text x="72" y="297" class="detail">Create, list, cancel</text>
    <rect class="card" x="215" y="255" width="142" height="55" rx="8"/>
    <text x="227" y="277" class="file">products.js</text>
    <text x="227" y="297" class="detail">Catalog and coupons</text>
    <rect class="card" x="370" y="255" width="142" height="55" rx="8"/>
    <text x="382" y="277" class="file">customers.js</text>
    <text x="382" y="297" class="detail">Khata settlements</text>
    <rect class="card" x="525" y="255" width="142" height="55" rx="8"/>
    <text x="537" y="277" class="file">reports.js</text>
    <text x="537" y="297" class="detail">Reports and preview</text>
  </g>

  <rect x="60" y="338" width="607" height="254" rx="10" fill="#e5edf7" stroke="#bac9db"/>
  <text x="73" y="362" class="file">lib/</text>
  <g>
    <rect class="card" x="73" y="375" width="188" height="51" rx="7"/>
    <text x="85" y="396" class="file">inventory.js</text>
    <text x="85" y="415" class="detail">Stock checks and updates</text>
    <rect class="card" x="275" y="375" width="188" height="51" rx="7"/>
    <text x="287" y="396" class="file">pricing.js</text>
    <text x="287" y="415" class="detail">Checkout totals</text>
    <rect class="card" x="477" y="375" width="177" height="51" rx="7"/>
    <text x="489" y="396" class="file">coupons.js</text>
    <text x="489" y="415" class="detail">Validation and discounts</text>
    <rect class="card" x="73" y="435" width="188" height="51" rx="7"/>
    <text x="85" y="456" class="file">ledger.js</text>
    <text x="85" y="475" class="detail">Khata charges and balances</text>
    <rect class="card" x="275" y="435" width="188" height="51" rx="7"/>
    <text x="287" y="456" class="file">orders.js</text>
    <text x="287" y="475" class="detail">Order records and filters</text>
    <rect class="card" x="477" y="435" width="177" height="51" rx="7"/>
    <text x="489" y="456" class="file">tax.js</text>
    <text x="489" y="475" class="detail">HSN rates and GST split</text>
    <rect class="card" x="73" y="495" width="188" height="51" rx="7"/>
    <text x="85" y="516" class="file">dates.js</text>
    <text x="85" y="535" class="detail">Order dates and filters</text>
    <rect class="ticket" x="275" y="495" width="188" height="51" rx="7"/>
    <text x="287" y="516" class="file accent">invoice.js</text>
    <text x="287" y="535" class="accent">Recomputed printable totals</text>
    <rect class="card" x="477" y="495" width="177" height="51" rx="7"/>
    <text x="489" y="516" class="file">reports.js</text>
    <text x="489" y="535" class="detail">Dashboard and GST checks</text>
    <rect class="card" x="275" y="553" width="188" height="30" rx="7"/>
    <text x="287" y="573" class="file">store.js</text>
    <text x="353" y="573" class="detail">JSON and audit</text>
  </g>
  <path class="connector path" d="M369 583 V610"/>
  <rect class="card" x="60" y="611" width="607" height="57" rx="8"/>
  <text x="74" y="634" class="file">data/db.json</text>
  <text x="74" y="654" class="detail">Products, orders, customers, settlements, audit log, and ID counters</text>
  <rect class="ticket" x="61" y="687" width="17" height="17" rx="3"/>
  <text x="88" y="700">Ticket module</text>
  <path class="connector path" d="M218 696 H250"/>
  <text x="262" y="700">Request, module call, or file access</text>

  <path d="M750 181 V595" stroke="#c6d7e8" stroke-width="2"/>
  <g>
    <circle class="step" cx="750" cy="182" r="15"/><text class="number" x="750" y="187">1</text>
    <text x="778" y="180" class="file">Submit the cart</text>
    <text x="778" y="200" class="detail">public/js/app.js → POST /api/orders</text>

    <circle class="step" cx="750" cy="244" r="15"/><text class="number" x="750" y="249">2</text>
    <text x="778" y="242" class="file">Load state and check stock</text>
    <text x="778" y="262" class="detail">routes/orders.js calls store.read(), then</text>
    <text x="778" y="281" class="detail">inventory.find() and inventory.check().</text>

    <circle class="step" cx="750" cy="325" r="15"/><text class="number" x="750" y="330">3</text>
    <text x="778" y="323" class="file">Validate coupon and calculate totals</text>
    <text x="778" y="343" class="detail">coupons.validate() → pricing.computeTotals()</text>
    <text x="778" y="362" class="detail">Allocate discount, then apply tax.getRateForItem().</text>

    <circle class="step" cx="750" cy="406" r="15"/><text class="number" x="750" y="411">4</text>
    <text x="778" y="404" class="file">Charge Khata if selected</text>
    <text x="778" y="424" class="detail">ledger.chargeOrderToKhata() checks credit</text>
    <text x="778" y="443" class="detail">and applies the checkout total to the account.</text>

    <circle class="step" cx="750" cy="487" r="15"/><text class="number" x="750" y="492">5</text>
    <text x="778" y="485" class="file">Deduct stock, record, and save</text>
    <text x="778" y="505" class="detail">inventory.reserve() → orders.add()</text>
    <text x="778" y="524" class="detail">store.appendAudit() → store.write()</text>
    <text x="778" y="543" class="detail">The route returns HTTP 201 with the saved order.</text>

    <circle class="step" cx="750" cy="595" r="15"/><text class="number" x="750" y="600">6</text>
    <text x="778" y="593" class="file">Open the printable invoice (optional)</text>
    <text x="778" y="613" class="detail">GET /orders/:id/invoice → server.js</text>
    <text x="778" y="632" class="detail">store.read() → orders.get() → invoice.render()</text>
    <rect class="ticket" x="777" y="649" width="366" height="62" rx="8"/>
    <text x="789" y="673" class="file accent">invoice.computeInvoiceFigures()</text>
    <text x="789" y="694" class="accent">Recalculates GST and coupons for print.</text>
  </g>
</svg>
