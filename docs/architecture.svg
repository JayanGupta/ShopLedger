<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture of the ShopLedger Express point of sale application and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#536176}
      .group{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}.body{font-size:12px;fill:#475569}
      .small{font-size:12px}.step{font-size:12px;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}
      .ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:1.7}.flowbox{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="38" class="title">ShopLedger | Application architecture</text>
  <text x="29" y="61" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing</text>
  <rect x="917" y="23" width="14" height="14" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="939" y="35" class="small">Ticket focus: invoice + checkout tax</text>

  <!-- Main application components -->
  <rect x="24" y="84" width="224" height="366" rx="10" fill="#eaf2ff" stroke="#93b4e8"/>
  <text x="40" y="111" class="group">Browser UI · public/</text>
  <rect x="39" y="125" width="194" height="83" rx="7" class="box"/>
  <text x="52" y="148" class="label">index.html</text>
  <text x="52" y="168" class="body">POS, order history, Khata,</text>
  <text x="52" y="185" class="body">inventory &amp; GST audit screens</text>
  <rect x="39" y="218" width="194" height="91" rx="7" class="box"/>
  <text x="52" y="241" class="label">js/app.js</text>
  <text x="52" y="261" class="body">Loads data, previews cart,</text>
  <text x="52" y="278" class="body">posts /api/orders</text>
  <rect x="39" y="319" width="194" height="54" rx="7" class="box"/>
  <text x="52" y="342" class="label">css/style.css</text>
  <text x="52" y="360" class="body">Layout and visual styles</text>
  <text x="40" y="412" class="body">Static files served by Express</text>

  <rect x="271" y="84" width="207" height="208" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="289" y="111" class="group">server.js</text>
  <text x="289" y="137" class="body">Express app + JSON body parser</text>
  <text x="289" y="159" class="body">Mounts all /api routers</text>
  <text x="289" y="181" class="body">Serves public/</text>
  <line x1="289" y1="195" x2="460" y2="195" stroke="#e2e8f0"/>
  <text x="289" y="218" class="label">GET /orders/:id/invoice</text>
  <text x="289" y="240" class="body">loads order → invoice.render()</text>
  <text x="289" y="269" class="body">PORT defaults to 3000</text>

  <rect x="500" y="84" width="243" height="366" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="517" y="111" class="group">Routers · routes/</text>
  <rect x="515" y="125" width="213" height="65" rx="6" class="box"/>
  <text x="528" y="148" class="label">orders.js</text><text x="528" y="170" class="body">place, list, get, cancel</text>
  <rect x="515" y="198" width="213" height="65" rx="6" class="box"/>
  <text x="528" y="221" class="label">products.js</text><text x="528" y="243" class="body">catalog + active coupons</text>
  <rect x="515" y="271" width="213" height="65" rx="6" class="box"/>
  <text x="528" y="294" class="label">customers.js</text><text x="528" y="316" class="body">customer list + settlements</text>
  <rect x="515" y="344" width="213" height="65" rx="6" class="box"/>
  <text x="528" y="367" class="label">reports.js</text><text x="528" y="389" class="body">preview, dashboard, GST audit</text>
  <text x="517" y="432" class="body">All mounted at /api in server.js</text>

  <rect x="765" y="84" width="410" height="493" rx="10" fill="#ecfdf5" stroke="#86c8a7" stroke-width="1.4"/>
  <text x="782" y="111" class="group">Business modules · lib/</text>
  <rect x="780" y="125" width="185" height="70" rx="6" class="box"/>
  <text x="792" y="148" class="label">orders.js</text><text x="792" y="169" class="body">add · get · cancel · list</text>
  <rect x="975" y="125" width="185" height="70" rx="6" class="box"/>
  <text x="987" y="148" class="label">store.js</text><text x="987" y="169" class="body">read · write · appendAudit</text>
  <rect x="780" y="203" width="185" height="70" rx="6" class="box"/>
  <text x="792" y="226" class="label">inventory.js</text><text x="792" y="247" class="body">find · check · reserve · release</text>
  <rect x="975" y="203" width="185" height="70" rx="6" class="box"/>
  <text x="987" y="226" class="label">ledger.js</text><text x="987" y="247" class="body">Khata, customers, settlement</text>
  <rect x="780" y="281" width="185" height="70" rx="6" class="box"/>
  <text x="792" y="304" class="label">pricing.js</text><text x="792" y="325" class="body">subtotal · discount · totals</text>
  <rect x="975" y="281" width="185" height="70" rx="6" class="ticket"/>
  <text x="987" y="304" class="label">tax.js · ticket focus</text><text x="987" y="325" class="body">HSN rates · CGST / SGST split</text>
  <rect x="780" y="359" width="185" height="70" rx="6" class="box"/>
  <text x="792" y="382" class="label">coupons.js</text><text x="792" y="403" class="body">normalize · validate · discount</text>
  <rect x="975" y="359" width="185" height="70" rx="6" class="box"/>
  <text x="987" y="382" class="label">reports.js</text><text x="987" y="403" class="body">dashboard · reconciliation</text>
  <rect x="780" y="437" width="185" height="70" rx="6" class="box"/>
  <text x="792" y="460" class="label">dates.js</text><text x="792" y="481" class="body">today · date keys · fiscal year</text>
  <rect x="975" y="437" width="185" height="70" rx="6" class="ticket"/>
  <text x="987" y="460" class="label">invoice.js · ticket focus</text><text x="987" y="481" class="body">computeInvoiceFigures · render</text>
  <text x="782" y="546" class="body">pricing.js calls tax.js; reports.js compares invoice.js with saved order totals</text>

  <!-- Config and persistence -->
  <rect x="271" y="316" width="207" height="134" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="289" y="344" class="group">config.js</text>
  <text x="289" y="368" class="body">Shop details · port · admin key</text>
  <text x="289" y="389" class="body">HSN slabs · default GST</text>
  <text x="289" y="410" class="body">Coupon definitions · stock settings</text>
  <rect x="500" y="462" width="243" height="89" rx="9" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="517" y="489" class="group">data/db.json</text>
  <text x="517" y="512" class="body">Products, orders, customers, settlements</text>
  <text x="517" y="533" class="body">Balances, audit log, ID counters</text>

  <!-- Relationships -->
  <line x1="248" y1="171" x2="268" y2="171" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="478" y1="171" x2="497" y2="171" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="743" y1="174" x2="762" y2="174" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1110 195 L1110 590 L680 590 L680 554" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="866" y="585" class="body">store.js persists JSON</text>
  <path d="M374 315 L374 296" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="383" y="308" class="body">settings</text>
  <path d="M478 422 L758 422 L758 316 L972 316" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blueArrow)"/>
  <text x="792" y="416" class="body">HSN slabs + coupon rules</text>

  <!-- Numbered order flow -->
  <text x="28" y="618" class="group">Order placement flow</text>
  <text x="225" y="618" class="subtitle">Numbered sequence through POST /api/orders</text>
  <g>
    <rect x="25" y="635" width="270" height="62" rx="8" class="flowbox"/><circle cx="47" cy="657" r="13" fill="#2563eb"/><text x="43" y="662" font-size="12" fill="#fff" font-weight="700">1</text><text x="68" y="657" class="label">Browser builds cart</text><text x="68" y="680" class="step">public/js/app.js → POST /api/orders</text>
    <line x1="296" y1="666" x2="312" y2="666" stroke="#2563eb" stroke-width="1.7" marker-end="url(#blueArrow)"/>
    <rect x="317" y="635" width="270" height="62" rx="8" class="flowbox"/><circle cx="339" cy="657" r="13" fill="#2563eb"/><text x="335" y="662" font-size="12" fill="#fff" font-weight="700">2</text><text x="360" y="657" class="label">Resolve item snapshots</text><text x="360" y="680" class="step">routes/orders.js · inventory.find()</text>
    <line x1="588" y1="666" x2="604" y2="666" stroke="#2563eb" stroke-width="1.7" marker-end="url(#blueArrow)"/>
    <rect x="609" y="635" width="270" height="62" rx="8" class="ticket"/><circle cx="631" cy="657" r="13" fill="#ea580c"/><text x="627" y="662" font-size="12" fill="#fff" font-weight="700">3</text><text x="652" y="657" class="label">Check stock + price</text><text x="652" y="680" class="step">inventory.check · pricing.computeTotals</text>
    <line x1="880" y1="666" x2="896" y2="666" stroke="#2563eb" stroke-width="1.7" marker-end="url(#blueArrow)"/>
    <rect x="901" y="635" width="270" height="62" rx="8" class="ticket"/><circle cx="923" cy="657" r="13" fill="#ea580c"/><text x="919" y="662" font-size="12" fill="#fff" font-weight="700">4</text><text x="944" y="657" class="label">Coupon + GST calculation</text><text x="944" y="680" class="step">coupons.validate · tax.getRateForItem</text>
  </g>
  <path d="M1036 699 L1036 715 L169 715 L169 726" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blueArrow)"/>
  <g>
    <rect x="25" y="727" width="350" height="58" rx="8" class="flowbox"/><circle cx="48" cy="749" r="13" fill="#2563eb"/><text x="44" y="754" font-size="12" fill="#fff" font-weight="700">5</text><text x="70" y="749" class="label">Khata check when paymentMode = khata</text><text x="70" y="771" class="step">ledger.chargeOrderToKhata(total)</text>
    <line x1="376" y1="756" x2="397" y2="756" stroke="#2563eb" stroke-width="1.7" marker-end="url(#blueArrow)"/>
    <rect x="402" y="727" width="350" height="58" rx="8" class="flowbox"/><circle cx="425" cy="749" r="13" fill="#2563eb"/><text x="421" y="754" font-size="12" fill="#fff" font-weight="700">6</text><text x="447" y="749" class="label">Deduct stock + append order</text><text x="447" y="771" class="step">inventory.reserve · orders.add</text>
    <line x1="753" y1="756" x2="774" y2="756" stroke="#2563eb" stroke-width="1.7" marker-end="url(#blueArrow)"/>
    <rect x="779" y="727" width="392" height="58" rx="8" class="flowbox"/><circle cx="802" cy="749" r="13" fill="#2563eb"/><text x="798" y="754" font-size="12" fill="#fff" font-weight="700">7</text><text x="824" y="749" class="label">Audit + save full JSON snapshot</text><text x="824" y="771" class="step">store.appendAudit · store.write → data/db.json</text>
  </g>
</svg>
