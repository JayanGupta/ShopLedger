<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A module map for the ShopLedger Express point of sale application and a six step order placement flow. Invoice and tax modules are highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3c7"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8191aa"/>
    </marker>
    <marker id="arrow-both" markerWidth="8" markerHeight="8" refX="1.5" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8191aa"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #e8eef8; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #aab8cb; }
      .section { font-size: 16px; font-weight: 700; }
      .card-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 12px; fill: #c5d0df; }
      .small { font-size: 12px; fill: #9fb0c6; }
      .focus-text { font-size: 12px; fill: #ffe0a1; }
      .flow-title { font-size: 13px; font-weight: 700; }
      .flow-body { font-size: 12px; fill: #c5d0df; }
      .panel { fill: #111c2f; stroke: #34445e; stroke-width: 1.3; }
      .subpanel { fill: #17243a; stroke: #3b4d69; stroke-width: 1; }
      .focus { fill: #302719; stroke: #f2b84b; stroke-width: 1.7; }
      .flow { fill: #101b2d; stroke: #51627d; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #7dd3c7; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #8191aa; stroke-width: 1.7; marker-end: url(#arrow-muted); }
      .data-link { fill: none; stroke: #8191aa; stroke-width: 1.5; stroke-dasharray: 5 4; marker-start: url(#arrow-both); marker-end: url(#arrow-both); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#0b1220"/>
  <text x="32" y="39" class="title">ShopLedger | Architecture &amp; order flow</text>
  <text x="32" y="63" class="subtitle">Node / Express POS, Khata credit ledger, GST pricing and printable invoices</text>

  <rect x="855" y="24" width="22" height="18" rx="4" fill="#302719" stroke="#f2b84b" stroke-width="1.5"/>
  <text x="886" y="38" class="body">Ticket focus</text>
  <text x="886" y="57" class="small">invoice.js + tax.js (tax feeds checkout pricing)</text>

  <rect x="32" y="88" width="180" height="246" rx="12" class="panel"/>
  <text x="48" y="116" class="card-title">Browser UI</text>
  <text x="48" y="140" class="small">public/</text>
  <text x="48" y="164" class="body">index.html</text>
  <text x="48" y="184" class="body">css/style.css</text>
  <text x="48" y="204" class="body">js/app.js</text>
  <line x1="48" y1="218" x2="196" y2="218" stroke="#34445e"/>
  <text x="48" y="240" class="body">POS + cart preview</text>
  <text x="48" y="261" class="body">POST /api/orders</text>
  <text x="48" y="282" class="body">Order history</text>
  <text x="48" y="303" class="body">Khata + GST audit</text>

  <rect x="232" y="88" width="226" height="246" rx="12" class="panel"/>
  <text x="248" y="116" class="card-title">Express app</text>
  <text x="248" y="140" class="small">server.js</text>
  <text x="248" y="164" class="body">JSON request parsing</text>
  <text x="248" y="184" class="body">Static public/ hosting</text>
  <text x="248" y="204" class="body">Mounts four /api routers</text>
  <line x1="248" y1="218" x2="442" y2="218" stroke="#34445e"/>
  <text x="248" y="240" class="body">GET /orders/:id/invoice</text>
  <text x="248" y="260" class="small">store.read() → orders.get()</text>
  <text x="248" y="280" class="small">→ invoice.render()</text>
  <text x="248" y="308" class="small">listen(config.port) when run directly</text>

  <rect x="478" y="88" width="440" height="246" rx="12" class="panel"/>
  <text x="494" y="116" class="card-title">Routers · routes/</text>

  <rect x="492" y="130" width="202" height="82" rx="8" class="subpanel"/>
  <text x="504" y="153" class="card-title">products.js</text>
  <text x="504" y="175" class="body">GET /products</text>
  <text x="504" y="195" class="body">GET /coupons</text>

  <rect x="704" y="130" width="200" height="82" rx="8" class="subpanel"/>
  <text x="716" y="153" class="card-title">orders.js</text>
  <text x="716" y="175" class="body">GET /orders · GET /orders/:id</text>
  <text x="716" y="195" class="body">POST /orders · POST /orders/:id/cancel</text>

  <rect x="492" y="222" width="202" height="96" rx="8" class="subpanel"/>
  <text x="504" y="245" class="card-title">customers.js</text>
  <text x="504" y="267" class="body">GET /customers</text>
  <text x="504" y="287" class="body">POST /customers/:id/settle</text>

  <rect x="704" y="222" width="200" height="106" rx="8" class="subpanel"/>
  <text x="716" y="245" class="card-title">reports.js</text>
  <text x="716" y="263" class="body">POST /pricing/preview</text>
  <text x="716" y="281" class="body">GET /reports/dashboard</text>
  <text x="716" y="299" class="body">GET /reports/gst-reconciliation</text>
  <text x="716" y="317" class="body">GET /admin/export</text>

  <rect x="938" y="88" width="230" height="112" rx="12" class="panel"/>
  <text x="954" y="116" class="card-title">config.js</text>
  <text x="954" y="140" class="body">Shop identity · port</text>
  <text x="954" y="160" class="body">Tax slabs · default GST</text>
  <text x="954" y="180" class="body">Coupons · inventory defaults</text>

  <rect x="938" y="212" width="230" height="122" rx="12" class="panel"/>
  <text x="954" y="240" class="card-title">data/db.json</text>
  <text x="954" y="264" class="body">products · orders · customers</text>
  <text x="954" y="284" class="body">settlements · auditLog</text>
  <text x="954" y="304" class="small">Single JSON persistence file</text>

  <path d="M212 211 H228" class="arrow"/>
  <path d="M458 211 H474" class="arrow"/>
  <path d="M696 335 V350" class="arrow"/>
  <text x="710" y="348" class="small">route calls</text>

  <rect x="32" y="358" width="1136" height="262" rx="12" class="panel"/>
  <text x="48" y="384" class="section">Business modules · lib/</text>
  <text x="832" y="383" class="small">settings from config.js · JSON I/O through store.js</text>

  <rect x="45" y="397" width="214" height="94" rx="9" class="subpanel"/>
  <text x="59" y="422" class="card-title">store.js</text>
  <text x="59" y="447" class="body">read() · write()</text>
  <text x="59" y="467" class="body">appendAudit()</text>

  <rect x="269" y="397" width="214" height="94" rx="9" class="subpanel"/>
  <text x="283" y="422" class="card-title">pricing.js</text>
  <text x="283" y="447" class="body">subtotal() · computeTotals()</text>
  <text x="283" y="467" class="body">discount()</text>

  <rect x="493" y="397" width="214" height="94" rx="9" class="focus"/>
  <text x="507" y="422" class="card-title">tax.js</text>
  <text x="507" y="447" class="focus-text">getRateForItem()</text>
  <text x="507" y="467" class="focus-text">splitCgstSgst()</text>

  <rect x="717" y="397" width="214" height="94" rx="9" class="subpanel"/>
  <text x="731" y="422" class="card-title">coupons.js</text>
  <text x="731" y="447" class="body">normalizeCode() · validate()</text>
  <text x="731" y="467" class="body">calculateDiscount()</text>

  <rect x="941" y="397" width="214" height="94" rx="9" class="subpanel"/>
  <text x="955" y="422" class="card-title">inventory.js</text>
  <text x="955" y="447" class="body">find() · check() · reserve()</text>
  <text x="955" y="467" class="body">release() · summarize()</text>

  <rect x="45" y="503" width="214" height="94" rx="9" class="subpanel"/>
  <text x="59" y="528" class="card-title">ledger.js</text>
  <text x="59" y="551" class="body">chargeOrderToKhata()</text>
  <text x="59" y="573" class="body">recordSettlement()</text>

  <rect x="269" y="503" width="214" height="94" rx="9" class="subpanel"/>
  <text x="283" y="528" class="card-title">orders.js</text>
  <text x="283" y="551" class="body">add() · get() · cancel()</text>
  <text x="283" y="573" class="body">list()</text>

  <rect x="493" y="503" width="214" height="94" rx="9" class="subpanel"/>
  <text x="507" y="528" class="card-title">dates.js</text>
  <text x="507" y="551" class="body">today() · normalizeDateKey()</text>
  <text x="507" y="573" class="body">getFiscalYear()</text>

  <rect x="717" y="503" width="214" height="94" rx="9" class="subpanel"/>
  <text x="731" y="528" class="card-title">reports.js</text>
  <text x="731" y="551" class="body">getDashboardSummary()</text>
  <text x="731" y="573" class="body">getGstReconciliation()</text>

  <rect x="941" y="503" width="214" height="94" rx="9" class="focus"/>
  <text x="955" y="528" class="card-title">invoice.js</text>
  <text x="955" y="551" class="focus-text">computeInvoiceFigures()</text>
  <text x="955" y="573" class="focus-text">render() · recomputes saved lines</text>

  <path d="M1053 334 V355 H152 V393" class="data-link"/>

  <text x="32" y="646" class="section">Order placement · numbered request-to-storage flow</text>

  <rect x="32" y="658" width="180" height="122" rx="10" class="flow"/>
  <circle cx="52" cy="681" r="12" fill="#1d655f"/>
  <text x="48" y="685" class="flow-title">1</text>
  <text x="72" y="685" class="flow-title">Browser submits</text>
  <text x="46" y="712" class="flow-body">app.js #place handler</text>
  <text x="46" y="733" class="flow-body">cart + customer + coupon</text>
  <text x="46" y="754" class="flow-body">POST /api/orders</text>

  <rect x="222" y="658" width="180" height="122" rx="10" class="flow"/>
  <circle cx="242" cy="681" r="12" fill="#1d655f"/>
  <text x="238" y="685" class="flow-title">2</text>
  <text x="262" y="685" class="flow-title">Resolve + check</text>
  <text x="236" y="712" class="flow-body">store.read()</text>
  <text x="236" y="733" class="flow-body">inventory.find()</text>
  <text x="236" y="754" class="flow-body">inventory.check()</text>

  <rect x="412" y="658" width="180" height="122" rx="10" class="flow"/>
  <circle cx="432" cy="681" r="12" fill="#1d655f"/>
  <text x="428" y="685" class="flow-title">3</text>
  <text x="452" y="685" class="flow-title">Price the cart</text>
  <text x="426" y="712" class="flow-body">pricing.subtotal()</text>
  <text x="426" y="733" class="flow-body">coupons.validate()</text>
  <text x="426" y="754" class="flow-body">pricing.computeTotals()</text>

  <rect x="602" y="658" width="180" height="122" rx="10" class="flow"/>
  <circle cx="622" cy="681" r="12" fill="#1d655f"/>
  <text x="618" y="685" class="flow-title">4</text>
  <text x="642" y="685" class="flow-title">GST + Khata</text>
  <text x="616" y="712" class="flow-body">tax.getRateForItem()</text>
  <text x="616" y="733" class="flow-body">splitCgstSgst()</text>
  <text x="616" y="754" class="flow-body">ledger.chargeOrderToKhata()</text>

  <rect x="792" y="658" width="180" height="122" rx="10" class="flow"/>
  <circle cx="812" cy="681" r="12" fill="#1d655f"/>
  <text x="808" y="685" class="flow-title">5</text>
  <text x="832" y="685" class="flow-title">Commit order</text>
  <text x="806" y="712" class="flow-body">inventory.reserve()</text>
  <text x="806" y="733" class="flow-body">orders.add()</text>
  <text x="806" y="754" class="flow-body">store.appendAudit()</text>

  <rect x="982" y="658" width="186" height="122" rx="10" class="flow"/>
  <circle cx="1002" cy="681" r="12" fill="#1d655f"/>
  <text x="998" y="685" class="flow-title">6</text>
  <text x="1022" y="685" class="flow-title">Persist + return</text>
  <text x="996" y="712" class="flow-body">store.write() → db.json</text>
  <text x="996" y="733" class="flow-body">HTTP 201 order JSON</text>
  <text x="996" y="754" class="flow-body">later invoice.render()</text>

  <path d="M212 719 H218" class="arrow"/>
  <path d="M402 719 H408" class="arrow"/>
  <path d="M592 719 H598" class="arrow"/>
  <path d="M782 719 H788" class="arrow"/>
  <path d="M972 719 H978" class="arrow"/>

  <text x="32" y="797" class="small">Ticket focus: tax.js supplies checkout GST rates; invoice.js independently recomputes figures for the later printable view.</text>
</svg>

