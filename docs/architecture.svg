<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Browser, Express routers, business modules, and JSON storage alongside seven steps for placing an order. The printable invoice is highlighted as the ticket scope.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#52718a"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #172e43; font-size: 14px }
      .title { font-size: 35px; font-weight: 750 }
      .section { font-size: 16px; font-weight: 750 }
      .file { font-size: 15px; font-weight: 700 }
      .detail { fill: #405a70; font-size: 13px }
      .card { fill: #fff; stroke: #c2d2df; stroke-width: 1.2 }
      .ticket { fill: #fff0d7; stroke: #ba751d; stroke-width: 1.5 }
      .io { fill: #e8f0f6; stroke: #9db6c9; stroke-width: 1.2 }
      .link { fill: none; stroke: #52718a; stroke-width: 1.5; marker-end: url(#arrow) }
      .step { fill: #285779 }
      .number { fill: #fff; font-weight: 700; text-anchor: middle; dominant-baseline: central }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f4f7fa"/>
  <text x="36" y="56" class="title">ShopLedger architecture</text>
  <text x="38" y="83" class="detail">Point of sale · Khata credit ledger · GST invoicing</text>
  <rect x="992" y="42" width="19" height="16" rx="4" class="ticket"/>
  <text x="1021" y="55" class="detail">Invoice ticket scope</text>
  <path d="M36 104H1164" stroke="#c2d2df"/>

  <text x="36" y="140" class="section">Browser and HTTP</text>
  <rect x="36" y="157" width="258" height="61" rx="8" class="card"/>
  <text x="51" y="181" class="file">public/</text>
  <text x="51" y="202" class="detail">Browser POS, orders, Khata and reports</text>
  <path d="M165 218V243" class="link"/>
  <rect x="36" y="243" width="258" height="72" rx="8" class="card"/>
  <text x="51" y="267" class="file">server.js</text>
  <text x="51" y="287" class="detail">Serves the UI and mounts /api</text>
  <text x="51" y="305" class="detail">GET /orders/:id/invoice</text>
  <path d="M165 315V350" class="link"/>
  <text x="36" y="345" class="section">routes/</text>

  <rect x="36" y="353" width="258" height="52" rx="8" class="io"/>
  <text x="51" y="375" class="file">orders.js</text>
  <text x="51" y="393" class="detail">Place, list, view and cancel orders</text>
  <rect x="36" y="415" width="258" height="52" rx="8" class="card"/>
  <text x="51" y="437" class="file">products.js</text>
  <text x="51" y="455" class="detail">Product catalog and active coupons</text>
  <rect x="36" y="477" width="258" height="52" rx="8" class="card"/>
  <text x="51" y="499" class="file">customers.js</text>
  <text x="51" y="517" class="detail">Customer balances and settlements</text>
  <rect x="36" y="539" width="258" height="52" rx="8" class="card"/>
  <text x="51" y="561" class="file">reports.js</text>
  <text x="51" y="579" class="detail">Preview, dashboard, GST and export</text>

  <text x="325" y="140" class="section">lib/</text>
  <path d="M294 379H317V344H325" class="link"/>
  <path d="M294 300H310V181H325" class="link"/>
  <rect x="325" y="157" width="462" height="61" rx="8" class="ticket"/>
  <text x="340" y="181" class="file">invoice.js</text>
  <text x="340" y="202" class="detail">render() → computeInvoiceFigures() → printable HTML</text>

  <rect x="325" y="230" width="224" height="68" rx="8" class="card"/>
  <text x="340" y="253" class="file">reports.js</text>
  <text x="340" y="274" class="detail">Dashboard and invoice comparison</text>
  <rect x="563" y="230" width="224" height="68" rx="8" class="card"/>
  <text x="578" y="253" class="file">dates.js</text>
  <text x="578" y="274" class="detail">Order and ledger dates</text>

  <rect x="325" y="310" width="224" height="68" rx="8" class="card"/>
  <text x="340" y="333" class="file">pricing.js</text>
  <text x="340" y="354" class="detail">Checkout totals and line GST</text>
  <rect x="563" y="310" width="224" height="68" rx="8" class="card"/>
  <text x="578" y="333" class="file">tax.js</text>
  <text x="578" y="354" class="detail">HSN rates and CGST/SGST split</text>

  <rect x="325" y="390" width="224" height="68" rx="8" class="card"/>
  <text x="340" y="413" class="file">inventory.js</text>
  <text x="340" y="434" class="detail">Stock checks and deductions</text>
  <rect x="563" y="390" width="224" height="68" rx="8" class="card"/>
  <text x="578" y="413" class="file">coupons.js</text>
  <text x="578" y="434" class="detail">Coupon rules and discounts</text>

  <rect x="325" y="470" width="224" height="68" rx="8" class="card"/>
  <text x="340" y="493" class="file">orders.js</text>
  <text x="340" y="514" class="detail">Order records and cancellation</text>
  <rect x="563" y="470" width="224" height="68" rx="8" class="card"/>
  <text x="578" y="493" class="file">ledger.js</text>
  <text x="578" y="514" class="detail">Khata charges and settlements</text>

  <rect x="325" y="550" width="462" height="61" rx="8" class="card"/>
  <text x="340" y="574" class="file">store.js</text>
  <text x="340" y="595" class="detail">Reads and rewrites the JSON file; appends audit entries</text>
  <path d="M556 611V638" class="link"/>

  <rect x="36" y="638" width="258" height="82" rx="8" class="io"/>
  <text x="51" y="665" class="file">config.js</text>
  <text x="51" y="686" class="detail">Shop settings, GST rules and coupons</text>
  <text x="51" y="706" class="detail">Invoice reads tax defaults directly here</text>
  <rect x="325" y="638" width="462" height="82" rx="8" class="io"/>
  <text x="340" y="665" class="file">data/db.json</text>
  <text x="340" y="686" class="detail">Products, orders, customers, settlements, audit and ID counters</text>
  <text x="340" y="706" class="detail">Checkout saves the order, updated stock and any Khata charge</text>

  <rect x="809" y="123" width="355" height="597" rx="12" fill="#e8f0f6"/>
  <text x="828" y="151" class="section">Placing an order</text>
  <path d="M840 184V635" stroke="#9db6c9" stroke-width="2"/>

  <circle cx="840" cy="184" r="12" class="step"/><text x="840" y="184" class="number">1</text>
  <text x="863" y="182" class="file">Submit cart</text>
  <text x="863" y="203" class="detail">public/ → server.js → routes/orders.js</text>
  <text x="863" y="222" class="detail">POST /api/orders</text>

  <circle cx="840" cy="256" r="12" class="step"/><text x="840" y="256" class="number">2</text>
  <text x="863" y="254" class="file">Read database and check stock</text>
  <text x="863" y="275" class="detail">store.read() → inventory.find()</text>
  <text x="863" y="294" class="detail">Copy catalog values; call inventory.check()</text>

  <circle cx="840" cy="328" r="12" class="step"/><text x="840" y="328" class="number">3</text>
  <text x="863" y="326" class="file">Validate coupon and price the cart</text>
  <text x="863" y="347" class="detail">coupons.validate() → pricing.computeTotals()</text>
  <text x="863" y="366" class="detail">tax.getRateForItem() resolves the HSN slab</text>
  <text x="863" y="385" class="detail">GST applies after allocating the discount</text>

  <circle cx="840" cy="419" r="12" class="step"/><text x="840" y="419" class="number">4</text>
  <text x="863" y="417" class="file">Charge Khata if selected</text>
  <text x="863" y="438" class="detail">ledger.chargeOrderToKhata()</text>
  <text x="863" y="457" class="detail">Check credit limit and update the balance</text>

  <circle cx="840" cy="491" r="12" class="step"/><text x="840" y="491" class="number">5</text>
  <text x="863" y="489" class="file">Deduct stock and append order</text>
  <text x="863" y="510" class="detail">inventory.reserve() → orders.add()</text>
  <text x="863" y="529" class="detail">Assign ID and record item snapshots and totals</text>

  <circle cx="840" cy="563" r="12" class="step"/><text x="840" y="563" class="number">6</text>
  <text x="863" y="561" class="file">Audit and persist</text>
  <text x="863" y="582" class="detail">store.appendAudit() → store.write()</text>
  <text x="863" y="601" class="detail">Record ORDER_CREATED; rewrite data/db.json</text>

  <circle cx="840" cy="635" r="12" class="step"/><text x="840" y="635" class="number">7</text>
  <text x="863" y="633" class="file">Return HTTP 201 with the order</text>
  <text x="863" y="654" class="detail">Browser shows the ledger total and invoice link</text>

  <path d="M36 744H1164" stroke="#c2d2df"/>
  <text x="36" y="771" class="detail">Opening the invoice is a separate request. server.js reads the saved order and calls invoice.render() to recalculate the printable figures.</text>
</svg>
