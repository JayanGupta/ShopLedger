<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing browser UI, Express server and routers, library modules, config, JSON database, and numbered order placement steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .head{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}
      .edge{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="38" class="title">ShopLedger | application architecture</text>
  <text x="32" y="61" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing · numbered path traces POST /api/orders</text>

  <!-- Browser UI -->
  <rect x="30" y="105" width="195" height="116" rx="10" class="box"/>
  <text x="48" y="132" class="head">Browser UI</text>
  <text x="48" y="154" class="body">public/index.html</text>
  <text x="48" y="173" class="body">public/js/app.js</text>
  <text x="48" y="192" class="body">public/css/style.css</text>
  <text x="48" y="211" class="small">POS screens / API client</text>

  <!-- Server -->
  <rect x="275" y="105" width="205" height="116" rx="10" class="box"/>
  <text x="295" y="132" class="head">server.js · Express</text>
  <text x="295" y="154" class="body">JSON parser + static public/</text>
  <text x="295" y="173" class="body">mounts API routers at /api</text>
  <text x="295" y="192" class="body">GET /orders/:id/invoice</text>
  <text x="295" y="211" class="small">loads config, store, orders, invoice</text>
  <path d="M225 163 H275" class="edge"/>
  <text x="232" y="151" class="small">HTTP</text>

  <!-- Routes -->
  <rect x="530" y="92" width="250" height="314" rx="12" class="group"/>
  <text x="550" y="119" class="head">routes/ · Express routers</text>
  <rect x="550" y="137" width="210" height="52" rx="7" class="box"/>
  <text x="565" y="158" class="body" font-weight="700">products.js</text><text x="565" y="177" class="small">GET products, coupons</text>
  <rect x="550" y="199" width="210" height="58" rx="7" class="box"/>
  <text x="565" y="220" class="body" font-weight="700">orders.js</text><text x="565" y="240" class="small">POST /orders · GET · cancel</text>
  <rect x="550" y="267" width="210" height="52" rx="7" class="box"/>
  <text x="565" y="288" class="body" font-weight="700">customers.js</text><text x="565" y="307" class="small">customers · settle</text>
  <rect x="550" y="329" width="210" height="58" rx="7" class="box"/>
  <text x="565" y="350" class="body" font-weight="700">reports.js</text><text x="565" y="370" class="small">dashboard · preview · export</text>
  <path d="M480 163 H530" class="edge"/>
  <text x="485" y="151" class="small">dispatch</text>

  <!-- Lib layer -->
  <rect x="815" y="92" width="355" height="500" rx="12" class="group"/>
  <text x="835" y="119" class="head">lib/ · application logic</text>
  <rect x="835" y="137" width="145" height="58" rx="7" class="box"/>
  <text x="848" y="159" class="body" font-weight="700">inventory.js</text><text x="848" y="179" class="small">find / check / reserve</text>
  <rect x="995" y="137" width="155" height="58" rx="7" class="box"/>
  <text x="1008" y="159" class="body" font-weight="700">pricing.js</text><text x="1008" y="179" class="small">subtotal / computeTotals</text>
  <rect x="835" y="207" width="145" height="58" rx="7" class="box"/>
  <text x="848" y="229" class="body" font-weight="700">coupons.js</text><text x="848" y="249" class="small">validate / discount</text>
  <rect x="995" y="207" width="155" height="58" rx="7" class="box"/>
  <text x="1008" y="229" class="body" font-weight="700">tax.js</text><text x="1008" y="249" class="small">HSN slabs / split GST</text>
  <rect x="835" y="277" width="145" height="58" rx="7" class="box"/>
  <text x="848" y="299" class="body" font-weight="700">orders.js</text><text x="848" y="319" class="small">add / get / cancel / list</text>
  <rect x="995" y="277" width="155" height="58" rx="7" class="box"/>
  <text x="1008" y="299" class="body" font-weight="700">ledger.js</text><text x="1008" y="319" class="small">Khata / settlements</text>
  <rect x="835" y="347" width="145" height="58" rx="7" class="box"/>
  <text x="848" y="369" class="body" font-weight="700">store.js</text><text x="848" y="389" class="small">read / write / audit</text>
  <rect x="995" y="347" width="155" height="58" rx="7" class="box"/>
  <text x="1008" y="369" class="body" font-weight="700">dates.js</text><text x="1008" y="389" class="small">today / date keys / FY</text>
  <rect x="835" y="417" width="145" height="65" rx="7" class="box"/>
  <text x="848" y="440" class="body" font-weight="700">reports.js</text><text x="848" y="460" class="small">summary / reconciliation</text>
  <rect x="995" y="417" width="155" height="65" rx="7" class="ticket"/>
  <text x="1008" y="440" class="body" font-weight="700">invoice.js</text><text x="1008" y="460" class="small">computeInvoiceFigures</text><text x="1008" y="476" class="small">render HTML invoice</text>
  <path d="M980 236 H995" class="dash"/>
  <text x="984" y="228" class="small">uses</text>
  <path d="M910 417 V405 H1070 V335" class="dash"/>
  <text x="1036" y="401" class="small">reports reconciliation</text>

  <!-- Config / data -->
  <rect x="815" y="623" width="160" height="90" rx="10" class="box"/>
  <text x="833" y="651" class="head">config.js</text>
  <text x="833" y="673" class="body">shop · coupons</text><text x="833" y="692" class="body">GST slabs · settings</text>
  <rect x="1000" y="623" width="170" height="90" rx="10" class="box"/>
  <text x="1018" y="651" class="head">data/db.json</text>
  <text x="1018" y="673" class="body">products · orders</text><text x="1018" y="692" class="body">customers · audit</text>
  <path d="M895 623 V595 H1070 V482" class="dash"/>
  <path d="M835 623 V573 H907 V405" class="dash"/>
  <text x="918" y="578" class="small">config used by pricing, tax, coupons, invoice</text>
  <path d="M980 376 H1000 V623" class="edge"/>
  <text x="1008" y="552" class="small">store.js reads/writes</text>

  <!-- Numbered order flow -->
  <rect x="30" y="270" width="750" height="484" rx="12" class="group"/>
  <text x="50" y="300" class="head">Order placement flow · POST /api/orders</text>
  <text x="50" y="321" class="small">Route: routes/orders.js · router.post('/orders', ...)</text>

  <circle cx="66" cy="365" r="13" class="num"/><text x="66" y="369" class="numtext">1</text>
  <rect x="91" y="343" width="280" height="48" rx="7" class="box"/>
  <text x="105" y="363" class="body" font-weight="700">Read data + resolve cart items</text><text x="105" y="380" class="small">store.read() · inventory.find()</text>
  <circle cx="420" cy="365" r="13" class="num"/><text x="420" y="369" class="numtext">2</text>
  <rect x="445" y="343" width="305" height="48" rx="7" class="box"/>
  <text x="459" y="363" class="body" font-weight="700">Check availability + price subtotal</text><text x="459" y="380" class="small">inventory.check() · pricing.subtotal()</text>
  <path d="M371 367 H445" class="flow"/>

  <circle cx="66" cy="443" r="13" class="num"/><text x="66" y="447" class="numtext">3</text>
  <rect x="91" y="421" width="280" height="48" rx="7" class="box"/>
  <text x="105" y="441" class="body" font-weight="700">Validate coupon; calculate totals</text><text x="105" y="458" class="small">coupons.validate() · pricing.computeTotals()</text>
  <circle cx="420" cy="443" r="13" class="num"/><text x="420" y="447" class="numtext">4</text>
  <rect x="445" y="421" width="305" height="48" rx="7" class="box"/>
  <text x="459" y="441" class="body" font-weight="700">Optional Khata charge</text><text x="459" y="458" class="small">ledger.chargeOrderToKhata(customerId, total)</text>
  <path d="M371 445 H445" class="flow"/><path d="M598 391 V421" class="flow"/>

  <circle cx="66" cy="521" r="13" class="num"/><text x="66" y="525" class="numtext">5</text>
  <rect x="91" y="499" width="280" height="48" rx="7" class="box"/>
  <text x="105" y="519" class="body" font-weight="700">Deduct stock + add order</text><text x="105" y="536" class="small">inventory.reserve() · orders.add()</text>
  <circle cx="420" cy="521" r="13" class="num"/><text x="420" y="525" class="numtext">6</text>
  <rect x="445" y="499" width="305" height="48" rx="7" class="box"/>
  <text x="459" y="519" class="body" font-weight="700">Audit + persist JSON + respond</text><text x="459" y="536" class="small">store.appendAudit() · store.write(db)</text>
  <path d="M371 523 H445" class="flow"/><path d="M598 469 V499" class="flow"/>

  <rect x="91" y="578" width="659" height="62" rx="7" class="ticket"/>
  <text x="108" y="602" class="body" font-weight="700">Ticket focus: lib/invoice.js</text>
  <text x="108" y="622" class="small">server.js invoice route → orders.get() → invoice.render() → HTML response</text>
  <path d="M600 547 V578" class="flow"/>
  <rect x="91" y="660" width="659" height="64" rx="7" class="box"/>
  <text x="108" y="683" class="body" font-weight="700">Connected modules</text>
  <text x="108" y="703" class="small">routes: products.js · orders.js · customers.js · reports.js  |  lib: coupons.js · dates.js · inventory.js · ledger.js · orders.js · pricing.js · reports.js · store.js · tax.js</text>

  <!-- legend -->
  <rect x="815" y="735" width="355" height="39" rx="7" class="group"/>
  <rect x="832" y="747" width="20" height="15" rx="3" class="ticket"/>
  <text x="860" y="760" class="small">Ticket module highlight</text>
  <path d="M1010 755 H1042" class="flow"/>
  <text x="1050" y="760" class="small">numbered order flow</text>
</svg>
