<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, routes, library modules, configuration, JSON database, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .section { font-size: 15px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-text { font-size: 12px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .flow { font-size: 12px; font-weight: 700; fill: #115e59; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .route { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .lib { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 7; }
      .ticket { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 8; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 10; }
      .flow-band { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flow-line { stroke: #0f766e; stroke-width: 1.8; fill: none; marker-end: url(#flowArrow); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="38" class="title">ShopLedger architecture</text>
  <text x="40" y="62" class="subtitle">Node/Express POS, Khata credit ledger, GST pricing and printable invoice flow</text>

  <!-- Main architecture -->
  <rect x="35" y="90" width="220" height="160" class="box"/>
  <text x="55" y="118" class="node-title">Browser UI</text>
  <text x="55" y="141" class="node-text">public/</text>
  <text x="55" y="163" class="node-text">index.html</text>
  <text x="55" y="183" class="node-text">js/app.js</text>
  <text x="55" y="203" class="node-text">css/style.css</text>
  <text x="55" y="229" class="small">POS cart, preview, orders, Khata, audit</text>

  <rect x="310" y="90" width="260" height="160" class="box"/>
  <text x="330" y="118" class="node-title">Express application</text>
  <text x="330" y="141" class="node-text">server.js</text>
  <text x="330" y="164" class="node-text">body-parser.json()</text>
  <text x="330" y="184" class="node-text">express.static(public/)</text>
  <text x="330" y="206" class="node-text">mounts routers at /api</text>
  <text x="330" y="228" class="node-text">GET /orders/:id/invoice</text>

  <rect x="625" y="90" width="265" height="160" class="route"/>
  <text x="645" y="118" class="node-title">routes/</text>
  <text x="645" y="142" class="node-text">products.js  — /products, /coupons</text>
  <text x="645" y="162" class="node-text">orders.js  — /orders, /cancel</text>
  <text x="645" y="182" class="node-text">customers.js  — /customers, /settle</text>
  <text x="645" y="202" class="node-text">reports.js  — dashboard, GST, preview</text>
  <text x="645" y="226" class="small">HTTP boundary and request validation</text>

  <rect x="945" y="90" width="220" height="72" class="data"/>
  <text x="965" y="118" class="node-title">config.js</text>
  <text x="965" y="141" class="node-text">shop, tax slabs, coupons, limits</text>
  <rect x="945" y="178" width="220" height="72" class="data"/>
  <text x="965" y="206" class="node-title">data/db.json</text>
  <text x="965" y="229" class="node-text">products, customers, orders, audit</text>

  <path d="M255 170 L310 170" class="line"/>
  <path d="M570 170 L625 170" class="line"/>
  <path d="M890 130 L945 130" class="line dash"/>
  <path d="M890 210 L945 210" class="line dash"/>
  <text x="895" y="120" class="small">reads</text>
  <text x="895" y="229" class="small">reads/writes</text>

  <!-- Library layer -->
  <text x="40" y="285" class="section">lib/ business modules</text>
  <rect x="35" y="302" width="136" height="80" class="lib"/>
  <text x="49" y="327" class="node-title">store.js</text>
  <text x="49" y="349" class="node-text">read, write</text>
  <text x="49" y="367" class="node-text">appendAudit</text>

  <rect x="185" y="302" width="136" height="80" class="lib"/>
  <text x="199" y="327" class="node-title">orders.js</text>
  <text x="199" y="349" class="node-text">add, get, list</text>
  <text x="199" y="367" class="node-text">cancel</text>

  <rect x="335" y="302" width="136" height="80" class="lib"/>
  <text x="349" y="327" class="node-title">inventory.js</text>
  <text x="349" y="349" class="node-text">find, check</text>
  <text x="349" y="367" class="node-text">reserve, release</text>

  <rect x="485" y="302" width="136" height="80" class="lib"/>
  <text x="499" y="327" class="node-title">pricing.js</text>
  <text x="499" y="349" class="node-text">subtotal, discount</text>
  <text x="499" y="367" class="node-text">computeTotals</text>

  <rect x="635" y="302" width="136" height="80" class="lib"/>
  <text x="649" y="327" class="node-title">coupons.js</text>
  <text x="649" y="349" class="node-text">normalize, validate</text>
  <text x="649" y="367" class="node-text">calculateDiscount</text>

  <rect x="785" y="302" width="136" height="80" class="lib"/>
  <text x="799" y="327" class="node-title">tax.js</text>
  <text x="799" y="349" class="node-text">getRateForItem</text>
  <text x="799" y="367" class="node-text">splitCgstSgst</text>

  <rect x="935" y="302" width="230" height="80" class="ticket"/>
  <text x="955" y="327" class="node-title">invoice.js  ★ ticket</text>
  <text x="955" y="349" class="node-text">computeInvoiceFigures</text>
  <text x="955" y="367" class="node-text">render printable HTML</text>

  <rect x="35" y="400" width="136" height="80" class="lib"/>
  <text x="49" y="425" class="node-title">ledger.js</text>
  <text x="49" y="447" class="node-text">findCustomer</text>
  <text x="49" y="465" class="node-text">charge / settle</text>

  <rect x="185" y="400" width="136" height="80" class="lib"/>
  <text x="199" y="425" class="node-title">reports.js</text>
  <text x="199" y="447" class="node-text">dashboard summary</text>
  <text x="199" y="465" class="node-text">GST reconciliation</text>

  <rect x="335" y="400" width="136" height="80" class="lib"/>
  <text x="349" y="425" class="node-title">dates.js</text>
  <text x="349" y="447" class="node-text">today</text>
  <text x="349" y="465" class="node-text">normalizeDateKey</text>

  <path d="M755 250 L553 302" class="line dash"/>
  <path d="M755 250 L853 302" class="line dash"/>
  <path d="M755 250 L1050 302" class="line dash"/>
  <path d="M945 214 L1050 302" class="line dash"/>
  <text x="772" y="274" class="small">module calls</text>

  <!-- Ticket legend -->
  <rect x="535" y="400" width="630" height="80" class="box"/>
  <text x="555" y="426" class="node-title">Legend</text>
  <rect x="625" y="412" width="18" height="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2" rx="3"/>
  <text x="652" y="426" class="node-text">ticket module: lib/invoice.js</text>
  <line x1="625" y1="451" x2="643" y2="451" stroke="#64748b" stroke-width="1.5"/>
  <text x="652" y="455" class="node-text">normal module / dependency</text>
  <line x1="845" y1="451" x2="863" y2="451" stroke="#0f766e" stroke-width="1.8"/>
  <text x="872" y="455" class="node-text">numbered checkout flow</text>

  <!-- Numbered order placement flow -->
  <rect x="35" y="520" width="1130" height="245" class="flow-band"/>
  <text x="55" y="548" class="section">Numbered flow: placing an order</text>

  <circle cx="72" cy="594" r="17" fill="#0f766e"/><text x="67" y="599" fill="#ffffff" font-size="14" font-weight="700">1</text>
  <text x="98" y="589" class="flow">public/js/app.js</text><text x="98" y="607" class="node-text">getSelectedCartItems → POST /api/orders</text>
  <path d="M260 594 L292 594" class="flow-line"/>

  <circle cx="315" cy="594" r="17" fill="#0f766e"/><text x="310" y="599" fill="#ffffff" font-size="14" font-weight="700">2</text>
  <text x="341" y="589" class="flow">routes/orders.js</text><text x="341" y="607" class="node-text">read DB, resolve products, validate stock</text>
  <path d="M515 594 L547 594" class="flow-line"/>

  <circle cx="570" cy="594" r="17" fill="#0f766e"/><text x="565" y="599" fill="#ffffff" font-size="14" font-weight="700">3</text>
  <text x="596" y="589" class="flow">pricing.js + coupons.js</text><text x="596" y="607" class="node-text">subtotal, discount, GST-aware totals</text>
  <path d="M806 594 L838 594" class="flow-line"/>

  <circle cx="861" cy="594" r="17" fill="#0f766e"/><text x="856" y="599" fill="#ffffff" font-size="14" font-weight="700">4</text>
  <text x="887" y="589" class="flow">ledger.js (Khata only)</text><text x="887" y="607" class="node-text">credit-limit check and debit</text>

  <path d="M980 625 L980 662 L740 662" class="flow-line"/>
  <circle cx="718" cy="662" r="17" fill="#0f766e"/><text x="713" y="667" fill="#ffffff" font-size="14" font-weight="700">5</text>
  <text x="478" y="657" class="flow">inventory.reserve()</text><text x="478" y="675" class="node-text">decrement product stock</text>
  <path d="M430 662 L398 662" class="flow-line"/>

  <circle cx="375" cy="662" r="17" fill="#0f766e"/><text x="370" y="667" fill="#ffffff" font-size="14" font-weight="700">6</text>
  <text x="135" y="657" class="flow">orders.add()</text><text x="135" y="675" class="node-text">append order with subtotal, discount, tax, total</text>
  <path d="M375 680 L375 718" class="flow-line"/>

  <circle cx="375" cy="734" r="17" fill="#0f766e"/><text x="370" y="739" fill="#ffffff" font-size="14" font-weight="700">7</text>
  <text x="401" y="729" class="flow">store.appendAudit()</text><text x="401" y="747" class="node-text">record ORDER_CREATED</text>
  <path d="M650 734 L682 734" class="flow-line"/>

  <circle cx="705" cy="734" r="17" fill="#0f766e"/><text x="700" y="739" fill="#ffffff" font-size="14" font-weight="700">8</text>
  <text x="731" y="729" class="flow">store.write()</text><text x="731" y="747" class="node-text">save all changes to data/db.json</text>
  <path d="M1000 734 L1032 734" class="flow-line"/>

  <circle cx="1055" cy="734" r="17" fill="#0f766e"/><text x="1050" y="739" fill="#ffffff" font-size="14" font-weight="700">9</text>
  <text x="1079" y="729" class="flow">invoice link</text><text x="1079" y="747" class="node-text">server.js → invoice.render()</text>
</svg>
