<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger's browser UI, Express server, routers, library modules, configuration and JSON store, including the numbered order placement sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52657a"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#167d8d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52657a}
      .head{font-size:16px;font-weight:700}.label{font-size:13px}.small{font-size:12px}
      .box{fill:#fff;stroke:#9aabba;stroke-width:1.4}.layer{fill:#f3f7fa;stroke:#aebdca;stroke-width:1.2}
      .ticket{fill:#fff2df;stroke:#d7831f;stroke-width:2}.data{fill:#edf5ee;stroke:#80a98a;stroke-width:1.4}
      .line{fill:none;stroke:#52657a;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#167d8d;stroke-width:2.7;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:6 5}
      .num{fill:#167d8d;stroke:#fff;stroke-width:2}.numtext{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="34" y="42" class="title">ShopLedger | application architecture</text>
  <text x="34" y="66" class="subtitle">Node / Express POS, Khata ledger and GST invoicing · numbered teal arrows trace order placement</text>

  <!-- Browser UI -->
  <rect x="30" y="97" width="245" height="290" rx="12" class="layer"/>
  <text x="48" y="126" class="head">Browser UI · public/</text>
  <rect x="49" y="143" width="207" height="54" rx="7" class="box"/>
  <text x="63" y="166" class="label">public/index.html</text><text x="63" y="184" class="small">POS, order, Khata, audit views</text>
  <rect x="49" y="207" width="207" height="62" rx="7" class="box"/>
  <text x="63" y="230" class="label">public/js/app.js</text><text x="63" y="248" class="small">Cart, preview, place button</text><text x="63" y="263" class="small">loadProducts · updateCartPreview</text>
  <rect x="49" y="279" width="207" height="45" rx="7" class="box"/>
  <text x="63" y="307" class="label">public/css/style.css</text>
  <text x="49" y="355" class="small">POST /api/orders</text>
  <text x="49" y="374" class="small">POST /api/pricing/preview</text>

  <!-- Server and routers -->
  <rect x="315" y="97" width="400" height="290" rx="12" class="layer"/>
  <rect x="338" y="112" width="354" height="55" rx="8" class="box"/>
  <text x="354" y="137" class="head">server.js · Express entry</text>
  <text x="354" y="157" class="small">static public/ · JSON parsing · mounts /api routers</text>
  <rect x="338" y="181" width="166" height="74" rx="7" class="box"/>
  <text x="352" y="204" class="label">routes/products.js</text><text x="352" y="224" class="small">/products · /coupons</text><text x="352" y="242" class="small">GET</text>
  <rect x="518" y="181" width="174" height="74" rx="7" class="box"/>
  <text x="532" y="204" class="label">routes/orders.js</text><text x="532" y="224" class="small">/orders · cancel</text><text x="532" y="242" class="small">POST /orders</text>
  <rect x="338" y="267" width="166" height="74" rx="7" class="box"/>
  <text x="352" y="290" class="label">routes/customers.js</text><text x="352" y="310" class="small">/customers · /settle</text><text x="352" y="328" class="small">Khata actions</text>
  <rect x="518" y="267" width="174" height="74" rx="7" class="box"/>
  <text x="532" y="290" class="label">routes/reports.js</text><text x="532" y="310" class="small">dashboard · pricing preview</text><text x="532" y="328" class="small">GST reconciliation · export</text>
  <text x="338" y="370" class="small">GET /orders/:id/invoice → invoice.render (server.js)</text>

  <!-- Library modules -->
  <rect x="755" y="97" width="415" height="440" rx="12" class="layer"/>
  <text x="777" y="126" class="head">Business modules · lib/</text>
  <rect x="778" y="143" width="174" height="67" rx="7" class="ticket"/>
  <text x="792" y="166" class="label">lib/pricing.js</text><text x="792" y="186" class="small">subtotal · computeTotals</text><text x="792" y="202" class="small">calls tax + coupons</text>
  <rect x="967" y="143" width="178" height="67" rx="7" class="ticket"/>
  <text x="981" y="166" class="label">lib/tax.js</text><text x="981" y="186" class="small">getRateForItem · split</text><text x="981" y="202" class="small">HSN slabs and GST split</text>
  <rect x="778" y="224" width="174" height="63" rx="7" class="ticket"/>
  <text x="792" y="248" class="label">lib/invoice.js</text><text x="792" y="268" class="small">computeInvoiceFigures · render</text>
  <rect x="967" y="224" width="178" height="63" rx="7" class="box"/>
  <text x="981" y="248" class="label">lib/coupons.js</text><text x="981" y="268" class="small">normalize · validate · discount</text>
  <rect x="778" y="301" width="174" height="63" rx="7" class="box"/>
  <text x="792" y="325" class="label">lib/orders.js</text><text x="792" y="345" class="small">add · get · cancel · list</text>
  <rect x="967" y="301" width="178" height="63" rx="7" class="box"/>
  <text x="981" y="325" class="label">lib/inventory.js</text><text x="981" y="345" class="small">find · check · reserve · release</text>
  <rect x="778" y="378" width="174" height="63" rx="7" class="box"/>
  <text x="792" y="402" class="label">lib/ledger.js</text><text x="792" y="422" class="small">Khata · customer settlements</text>
  <rect x="967" y="378" width="178" height="63" rx="7" class="box"/>
  <text x="981" y="402" class="label">lib/store.js</text><text x="981" y="422" class="small">read · write · appendAudit</text>
  <rect x="778" y="455" width="174" height="63" rx="7" class="box"/>
  <text x="792" y="479" class="label">lib/reports.js</text><text x="792" y="499" class="small">dashboard · GST reconciliation</text>
  <rect x="967" y="455" width="178" height="63" rx="7" class="box"/>
  <text x="981" y="479" class="label">lib/dates.js</text><text x="981" y="499" class="small">today · date keys · fiscal year</text>

  <!-- Persistence/config -->
  <rect x="30" y="435" width="245" height="113" rx="12" class="data"/>
  <text x="49" y="465" class="head">data/db.json</text>
  <text x="49" y="489" class="small">Products · orders · customers</text>
  <text x="49" y="508" class="small">settlements · auditLog · ID counters</text>
  <text x="49" y="531" class="small">Read/written by lib/store.js</text>
  <rect x="315" y="435" width="400" height="113" rx="12" class="box"/>
  <text x="338" y="465" class="head">config.js</text>
  <text x="338" y="489" class="small">Shop identity · port · GST default + HSN slabs</text>
  <text x="338" y="508" class="small">Coupons · inventory options · admin key</text>
  <text x="338" y="531" class="small">Read by server.js and relevant lib modules</text>

  <!-- Numbered placement flow, lower band -->
  <rect x="30" y="578" width="1140" height="159" rx="12" fill="#eef7f8" stroke="#9ec8ce" stroke-width="1.3"/>
  <text x="50" y="607" class="head">Order placement · numbered request and persistence flow</text>
  <path d="M175 666 H290" class="flow"/><path d="M425 666 H540" class="flow"/><path d="M675 666 H790" class="flow"/><path d="M925 666 H1040" class="flow"/>
  <g><circle cx="62" cy="666" r="14" class="num"/><text x="62" y="671" class="numtext">1</text><text x="84" y="655" class="label">Browser cart</text><text x="84" y="675" class="small">app.js sends items</text><text x="84" y="693" class="small">POST /api/orders</text></g>
  <g><circle cx="312" cy="666" r="14" class="num"/><text x="312" y="671" class="numtext">2</text><text x="334" y="655" class="label">orders router</text><text x="334" y="675" class="small">resolve products, check stock</text><text x="334" y="693" class="small">validate coupon</text></g>
  <g><circle cx="562" cy="666" r="14" class="num"/><text x="562" y="671" class="numtext">3</text><text x="584" y="655" class="label">Calculate totals</text><text x="584" y="675" class="small">pricing → coupons + tax</text><text x="584" y="693" class="small">line GST, discount, total</text></g>
  <g><circle cx="812" cy="666" r="14" class="num"/><text x="812" y="671" class="numtext">4</text><text x="834" y="655" class="label">Apply order</text><text x="834" y="675" class="small">optional ledger charge</text><text x="834" y="693" class="small">reserve stock · orders.add</text></g>
  <g><circle cx="1062" cy="666" r="14" class="num"/><text x="1062" y="671" class="numtext">5</text><text x="1084" y="655" class="label">Persist</text><text x="1084" y="675" class="small">audit + store.write</text><text x="1084" y="693" class="small">data/db.json</text></g>
  <text x="50" y="721" class="small">Invoice path: server.js GET /orders/:id/invoice → orders.get → lib/invoice.js render (separate from checkout totals).</text>

  <!-- Architecture relationships -->
  <path d="M275 226 H315" class="line"/><path d="M715 226 H755" class="line"/>
  <path d="M715 303 H755" class="line dash"/><path d="M275 485 H315" class="line dash"/>
  <path d="M715 490 H755" class="line dash"/>
  <path d="M866 210 V224" class="line"/><path d="M952 176 H967" class="line"/>

  <!-- Legend -->
  <rect x="827" y="753" width="17" height="14" rx="3" class="ticket"/><text x="852" y="765" class="small">Ticket focus: invoice + checkout GST tax modules</text>
  <rect x="1090" y="753" width="17" height="14" rx="3" class="data"/><text x="1115" y="765" class="small">JSON data</text>
  <line x1="30" y1="760" x2="76" y2="760" class="flow"/><text x="86" y="765" class="small">Order flow</text>
</svg>
