<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement flow</title>
<desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routes, library modules, configuration, JSON data store, and numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
    .title{font-size:22px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
    .head{font-size:14px;font-weight:700}.small{font-size:12px}.muted{fill:#526174}
    .box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:9}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2;rx:12}
    .ticket{fill:#fff1e8;stroke:#c2410c;stroke-width:2.5;rx:9}.flow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#flowArrow)}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 4}
    .num{fill:#2563eb;stroke:#fff;stroke-width:1.5}.numtxt{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="30" y="38" class="title">ShopLedger — architecture &amp; order placement</text>
<text x="30" y="60" class="subtitle">Express POS, Khata ledger, GST pricing and printable invoice • solid blue arrows trace POST /api/orders</text>

<!-- Browser and process entry -->
<rect x="30" y="85" width="245" height="104" class="box"/>
<text x="48" y="110" class="head">Browser UI · public/</text>
<text x="48" y="134">index.html · js/app.js · css/style.css</text>
<text x="48" y="157" class="muted">Catalog, cart preview, order desk, Khata, audit</text>
<rect x="365" y="85" width="275" height="104" class="box"/>
<text x="383" y="110" class="head">server.js · Express app</text>
<text x="383" y="134">bodyParser.json() · express.static(public/)</text>
<text x="383" y="157" class="muted">Mounts routers at /api; invoice GET route</text>
<rect x="865" y="85" width="305" height="104" class="box"/>
<text x="883" y="110" class="head">config.js</text>
<text x="883" y="134">shop · tax.hsnSlabs · coupons · inventory</text>
<text x="883" y="157" class="muted">port · adminKey</text>
<path d="M275 137 L365 137" class="edge"/><text x="292" y="126" class="small muted">HTTP / static</text>
<path d="M865 151 C790 151 720 151 640 151" class="edge dashed"/><text x="700" y="141" class="small muted">require config</text>

<!-- Routers -->
<rect x="30" y="220" width="1140" height="166" class="group"/>
<text x="48" y="245" class="head">routes/ · mounted by server.js at /api</text>
<rect x="50" y="261" width="250" height="100" class="box"/>
<text x="66" y="286" class="head">products.js</text><text x="66" y="309">GET /products · GET /coupons</text><text x="66" y="334" class="muted">Product listing, slab display</text>
<rect x="325" y="261" width="370" height="100" class="box"/>
<text x="341" y="286" class="head">orders.js</text><text x="341" y="309">POST /orders · GET /orders[/:id]</text><text x="341" y="334">POST /orders/:id/cancel</text>
<rect x="720" y="261" width="205" height="100" class="box"/>
<text x="736" y="286" class="head">customers.js</text><text x="736" y="309">GET /customers</text><text x="736" y="334">POST /customers/:id/settle</text>
<rect x="950" y="261" width="200" height="100" class="box"/>
<text x="966" y="286" class="head">reports.js</text><text x="966" y="309">dashboard · GST reconciliation</text><text x="966" y="334">pricing preview · admin export</text>
<path d="M500 189 L500 261" class="flow"/><circle cx="500" cy="222" r="12" class="num"/><text x="500" y="226" class="numtxt">1</text><text x="515" y="220" class="small" fill="#2563eb">POST /api/orders</text>

<!-- Library modules -->
<rect x="30" y="414" width="1140" height="252" class="group"/>
<text x="48" y="440" class="head">lib/ · business logic</text>
<rect x="50" y="457" width="185" height="83" class="box"/><text x="65" y="481" class="head">inventory.js</text><text x="65" y="504">find · check · reserve</text><text x="65" y="525">release · summarize</text>
<rect x="250" y="457" width="185" height="83" class="box"/><text x="265" y="481" class="head">pricing.js</text><text x="265" y="504">subtotal · discount</text><text x="265" y="525">computeTotals</text>
<rect x="450" y="457" width="170" height="83" class="box"/><text x="465" y="481" class="head">coupons.js</text><text x="465" y="504">normalizeCode · validate</text><text x="465" y="525">calculateDiscount</text>
<rect x="635" y="457" width="170" height="83" class="box"/><text x="650" y="481" class="head">tax.js</text><text x="650" y="504">getRateForItem</text><text x="650" y="525">splitCgstSgst</text>
<rect x="820" y="457" width="155" height="83" class="box"/><text x="835" y="481" class="head">ledger.js</text><text x="835" y="504">chargeOrderToKhata</text><text x="835" y="525">recordSettlement</text>
<rect x="990" y="457" width="160" height="83" class="box"/><text x="1005" y="481" class="head">orders.js</text><text x="1005" y="504">add · get · cancel</text><text x="1005" y="525">list</text>
<rect x="50" y="559" width="205" height="78" class="ticket"/><text x="65" y="584" class="head">invoice.js · TICKET</text><text x="65" y="607">computeInvoiceFigures · render</text><text x="65" y="627" class="small muted">Printable HTML invoice</text>
<rect x="270" y="559" width="205" height="78" class="box"/><text x="285" y="584" class="head">reports.js</text><text x="285" y="607">getDashboardSummary</text><text x="285" y="627">getGstReconciliation</text>
<rect x="490" y="559" width="180" height="78" class="box"/><text x="505" y="584" class="head">store.js</text><text x="505" y="607">read · write · appendAudit</text><text x="505" y="627" class="small muted">JSON persistence</text>
<rect x="685" y="559" width="165" height="78" class="box"/><text x="700" y="584" class="head">dates.js</text><text x="700" y="607">today · normalizeDateKey</text><text x="700" y="627" class="small muted">getFiscalYear</text>
<rect x="870" y="559" width="280" height="78" class="box"/><text x="885" y="584" class="head">GST reconciliation</text><text x="885" y="607">reports.js calls invoice.computeInvoiceFigures()</text><text x="885" y="627" class="small muted">Checkout tax path: pricing.js → tax.js</text>

<!-- Storage -->
<rect x="410" y="700" width="380" height="66" class="box"/>
<text x="430" y="727" class="head">data/db.json</text><text x="430" y="750">products · customers · orders · settlements · auditLog</text>

<!-- Order flow connectors and numbered steps -->
<path d="M510 361 L510 407 L140 407 L140 457" class="flow"/><circle cx="140" cy="407" r="12" class="num"/><text x="140" y="411" class="numtxt">2</text><text x="160" y="402" class="small" fill="#2563eb">find products + check stock</text>
<path d="M510 361 L510 421 L345 421 L345 457" class="flow"/><circle cx="345" cy="421" r="12" class="num"/><text x="345" y="425" class="numtxt">3</text><text x="364" y="417" class="small" fill="#2563eb">subtotal + coupon + GST totals</text>
<path d="M510 361 L510 435 L897 435 L897 457" class="flow"/><circle cx="897" cy="435" r="12" class="num"/><text x="897" y="439" class="numtxt">4</text><text x="916" y="431" class="small" fill="#2563eb">Khata charge when selected</text>
<path d="M510 361 L510 447 L1070 447 L1070 457" class="flow"/><circle cx="1070" cy="447" r="12" class="num"/><text x="1070" y="451" class="numtxt">5</text>
<path d="M1070 540 L1070 548 L592 548 L592 559" class="flow"/><circle cx="1070" cy="548" r="12" class="num"/><text x="1070" y="552" class="numtxt">6</text><text x="886" y="565" class="small" fill="#2563eb">add order + append audit</text>
<path d="M592 637 L592 700" class="flow"/><circle cx="592" cy="670" r="12" class="num"/><text x="592" y="674" class="numtxt">7</text><text x="610" y="675" class="small" fill="#2563eb">write updated JSON</text>
<path d="M140 540 C140 690 260 731 410 731" class="edge dashed"/><text x="48" y="687" class="small muted">read/write via store.js</text>

<!-- route to dependency cues -->
<path d="M405 361 L340 457" class="edge"/><path d="M615 361 L535 457" class="edge"/><path d="M648 540 L670 559" class="edge"/><path d="M897 540 L390 559" class="edge"/><path d="M825 361 L900 457" class="edge"/>
<rect x="890" y="710" width="12" height="12" class="ticket"/><text x="910" y="721" class="small">ticket module highlighted</text>
<line x1="890" y1="745" x2="922" y2="745" class="flow"/><text x="932" y="750" class="small">order placement flow (numbered)</text>
</svg>
