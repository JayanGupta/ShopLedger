<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">The browser connects to Express, which serves the UI and printable invoices and mounts four API routers. The left side maps the routers, ten library modules, configuration and JSON storage. The right side follows a successful order from the browser to the database and back. Teal marks the inventory module and the cancel function in the orders module.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#61738a"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 14px; fill: #20354d; }
      .title { font-size: 33px; font-weight: bold; fill: #102740; }
      .section { font-size: 19px; font-weight: bold; fill: #102740; }
      .label { font-size: 15px; font-weight: bold; fill: #102740; }
      .detail { font-size: 13px; fill: #455c73; }
      .panel { fill: #fff; stroke: #ccd8e4; }
      .card { fill: #f6f9fc; stroke: #cfdae6; }
      .ticket { fill: #d7f4ed; stroke: #318576; }
      .ticket-text { fill: #105a4e; }
      .link { fill: none; stroke: #61738a; stroke-width: 1.5; }
      .step-dot { fill: #244c76; }
      .step-number { font-size: 13px; font-weight: bold; fill: #fff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#edf3f8"/>
  <text class="title" x="38" y="58">ShopLedger architecture</text>
  <rect class="ticket" x="947" y="39" width="20" height="18" rx="4"/>
  <text x="977" y="53">Ticket scope</text>

  <rect class="panel" x="36" y="82" width="692" height="680" rx="14"/>
  <rect class="panel" x="748" y="82" width="416" height="680" rx="14"/>

  <g aria-label="Browser and Express">
    <rect class="card" x="54" y="104" width="292" height="77" rx="8"/>
    <text class="label" x="68" y="129">public/ · Browser UI</text>
    <text class="detail" x="68" y="152">index.html · js/app.js · css/style.css</text>

    <path class="link" d="M347 142H371" marker-end="url(#arrow)"/>
    <rect class="card" x="376" y="104" width="334" height="77" rx="8"/>
    <text class="label" x="390" y="129">server.js · Express</text>
    <text class="detail" x="390" y="149">Serves public/ and mounts routers under /api</text>
    <text class="detail" x="390" y="167">GET /orders/:id/invoice calls invoice.render()</text>
    <path class="link" d="M543 182V222" marker-end="url(#arrow)"/>
  </g>

  <g aria-label="API routers">
    <text class="section" x="54" y="214">API routers</text>
    <rect class="card" x="54" y="228" width="656" height="116" rx="8"/>
    <path d="M382 228V344M54 286H710" stroke="#cfdae6"/>
    <text class="label" x="68" y="250">routes/products.js</text>
    <text class="detail" x="68" y="270">Catalog, sellable stock, GST slabs, coupons</text>
    <text class="label" x="396" y="250">routes/orders.js</text>
    <text class="detail" x="396" y="270">List, fetch, place and cancel orders</text>
    <text class="label" x="68" y="308">routes/customers.js</text>
    <text class="detail" x="68" y="328">Khata accounts and settlements</text>
    <text class="label" x="396" y="308">routes/reports.js</text>
    <text class="detail" x="396" y="328">Dashboard, GST reconciliation, preview, export</text>
    <path class="link" d="M543 345V382" marker-end="url(#arrow)"/>
  </g>

  <g aria-label="Library modules">
    <text class="section" x="54" y="375">Library modules</text>

    <rect class="ticket" x="54" y="388" width="320" height="50" rx="7"/>
    <text class="label ticket-text" x="68" y="409">lib/inventory.js</text>
    <text class="detail ticket-text" x="68" y="427">Stock lookup, checks, deduction and release</text>

    <rect class="card" x="390" y="388" width="320" height="50" rx="7"/>
    <text class="label" x="404" y="409">lib/orders.js</text>
    <text class="detail" x="404" y="427">add(), get(), list()</text>
    <rect class="ticket" x="511" y="412" width="72" height="21" rx="5"/>
    <text class="detail ticket-text" x="523" y="427">cancel()</text>

    <rect class="card" x="54" y="446" width="320" height="50" rx="7"/>
    <text class="label" x="68" y="467">lib/pricing.js</text>
    <text class="detail" x="68" y="485">Checkout totals use coupons.js and tax.js</text>

    <rect class="card" x="390" y="446" width="320" height="50" rx="7"/>
    <text class="label" x="404" y="467">lib/ledger.js</text>
    <text class="detail" x="404" y="485">Khata credit limits, balances and settlements</text>

    <rect class="card" x="54" y="504" width="320" height="50" rx="7"/>
    <text class="label" x="68" y="525">lib/coupons.js</text>
    <text class="detail" x="68" y="543">Coupon validation and discounts</text>

    <rect class="card" x="390" y="504" width="320" height="50" rx="7"/>
    <text class="label" x="404" y="525">lib/tax.js</text>
    <text class="detail" x="404" y="543">HSN rates and CGST/SGST split</text>

    <rect class="card" x="54" y="562" width="320" height="50" rx="7"/>
    <text class="label" x="68" y="583">lib/reports.js</text>
    <text class="detail" x="68" y="601">Dashboard and order/invoice reconciliation</text>

    <rect class="card" x="390" y="562" width="320" height="50" rx="7"/>
    <text class="label" x="404" y="583">lib/invoice.js</text>
    <text class="detail" x="404" y="601">Recomputes totals and renders printable HTML</text>

    <rect class="card" x="54" y="620" width="320" height="50" rx="7"/>
    <text class="label" x="68" y="641">lib/dates.js</text>
    <text class="detail" x="68" y="659">Date formatting and normalization</text>

    <rect class="card" x="390" y="620" width="320" height="50" rx="7"/>
    <text class="label" x="404" y="641">lib/store.js</text>
    <text class="detail" x="404" y="659">Reads and writes JSON, maintains the audit log</text>
    <path class="link" d="M550 671V683" marker-end="url(#arrow)"/>
  </g>

  <g aria-label="Configuration and data">
    <rect class="card" x="54" y="688" width="320" height="56" rx="7"/>
    <text class="label" x="68" y="710">config.js</text>
    <text class="detail" x="68" y="730">Port, shop details, GST, coupons, stock defaults</text>

    <rect class="card" x="390" y="688" width="320" height="56" rx="7"/>
    <text class="label" x="404" y="710">data/db.json</text>
    <text class="detail" x="404" y="730">Products, orders, customers, settlements, audit</text>
  </g>

  <g aria-label="Successful order placement sequence">
    <text class="section" x="768" y="117">Placing an order</text>
    <path d="M785 151V672" stroke="#b7c9da" stroke-width="2"/>

    <circle class="step-dot" cx="785" cy="155" r="13"/>
    <text class="step-number" x="785" y="160">1</text>
    <text class="label" x="811" y="154">Submit the cart</text>
    <text class="detail" x="811" y="174">public/js/app.js sends POST /api/orders.</text>
    <text class="detail" x="811" y="192">server.js dispatches to routes/orders.js.</text>

    <circle class="step-dot" cx="785" cy="226" r="13"/>
    <text class="step-number" x="785" y="231">2</text>
    <text class="label" x="811" y="225">Load and check the items</text>
    <text class="detail" x="811" y="245">store.read() loads data/db.json. The route uses</text>
    <text class="detail" x="811" y="263">inventory.find() to look up prices and HSN.</text>
    <text class="detail" x="811" y="281">inventory.check() checks sellable stock.</text>

    <circle class="step-dot" cx="785" cy="310" r="13"/>
    <text class="step-number" x="785" y="315">3</text>
    <text class="label" x="811" y="309">Validate coupon and compute totals</text>
    <text class="detail" x="811" y="329">coupons.normalizeCode() and coupons.validate()</text>
    <text class="detail" x="811" y="347">check any supplied code against the subtotal.</text>
    <text class="detail" x="811" y="365">pricing.computeTotals() apportions the discount</text>
    <text class="detail" x="811" y="383">and applies HSN GST to each discounted line.</text>

    <circle class="step-dot" cx="785" cy="416" r="13"/>
    <text class="step-number" x="785" y="421">4</text>
    <text class="label" x="811" y="415">Charge Khata if selected</text>
    <text class="detail" x="811" y="435">ledger.chargeOrderToKhata() checks the credit</text>
    <text class="detail" x="811" y="453">limit and updates the customer's balance.</text>

    <circle class="step-dot" cx="785" cy="487" r="13"/>
    <text class="step-number" x="785" y="492">5</text>
    <text class="label" x="811" y="486">Deduct stock and add the order</text>
    <text class="detail" x="811" y="506">inventory.reserve() deducts physical stock.</text>
    <text class="detail" x="811" y="524">orders.add() assigns ID/date and records lines,</text>
    <text class="detail" x="811" y="542">customer, payment, status, coupon and totals.</text>

    <circle class="step-dot" cx="785" cy="575" r="13"/>
    <text class="step-number" x="785" y="580">6</text>
    <text class="label" x="811" y="574">Audit and persist</text>
    <text class="detail" x="811" y="594">store.appendAudit() records ORDER_CREATED.</text>
    <text class="detail" x="811" y="612">store.write() saves the order, stock, any Khata</text>
    <text class="detail" x="811" y="630">changes and the audit entry to data/db.json.</text>

    <circle class="step-dot" cx="785" cy="672" r="13"/>
    <text class="step-number" x="785" y="677">7</text>
    <text class="label" x="811" y="671">Return the saved order</text>
    <text class="detail" x="811" y="691">The API sends HTTP 201 with the order JSON.</text>
    <text class="detail" x="811" y="709">The UI shows the total and printable invoice link.</text>
  </g>
</svg>
