<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser talks to Express, which mounts four API routers and separately serves printable invoices. The left side maps the routers, ten library modules, config, and JSON store. The right side traces seven steps from Place Order to the 201 response. The invoice library is highlighted in amber.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#52647b"/>
    </marker>
    <marker id="invoice-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a65010"/>
    </marker>
    <style>
      text {font-family:Segoe UI,Arial,sans-serif;fill:#15273c;font-size:14px}
      .title {font-size:34px;font-weight:700}
      .subtitle {font-size:16px;fill:#465a72}
      .section {font-size:14px;font-weight:700;letter-spacing:.7px;fill:#38516e}
      .name {font-size:16px;font-weight:700}
      .detail {font-size:13px;fill:#435870}
      .module-detail {font-size:12px;fill:#435870}
      .legend {font-size:13px;fill:#435870}
      .mono {font-family:Consolas,monospace}
      .group {fill:#ebf1f8;stroke:#c4d2e2}
      .card {fill:#fff;stroke:#c4d2e2}
      .entry {fill:#e0edfb;stroke:#a5bfdc}
      .flow {fill:#fff;stroke:#c4d2e2}
      .ticket {fill:#fff0d6;stroke:#a65010;stroke-width:1.5}
      .ticket-text {fill:#7b370b}
      .edge {fill:none;stroke:#52647b;stroke-width:1.6;marker-end:url(#arrow)}
      .invoice-edge {fill:none;stroke:#a65010;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#invoice-arrow)}
      .number {fill:#225a91}
      .number-text {font-size:14px;font-weight:700;fill:white;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f6f9fd"/>
  <text class="title" x="36" y="50">ShopLedger architecture</text>
  <text class="subtitle" x="38" y="77">Browser POS, Khata credit ledger, and printable GST invoices</text>
  <path d="M36 94H1164M752 110V721M36 733H1164" stroke="#c4d2e2" fill="none"/>

  <!-- Architecture map -->
  <g aria-label="Architecture map">
    <rect class="entry" x="48" y="110" width="270" height="62" rx="9"/>
    <text class="name" x="62" y="134">public/</text>
    <text class="detail" x="62" y="155">Browser UI · index.html, js/app.js, CSS</text>

    <rect class="entry" x="377" y="110" width="345" height="62" rx="9"/>
    <text class="name" x="391" y="134">server.js</text>
    <text class="detail" x="391" y="155">Express · serves the UI, API, and invoice HTML</text>
    <path class="edge" d="M318 141H377"/>

    <rect class="group" x="36" y="204" width="700" height="103" rx="10"/>
    <text class="section" x="48" y="226">routes/</text>
    <path class="edge" d="M550 172V204"/>
    <text class="detail mono" x="563" y="193">/api</text>

    <g transform="translate(48 236)">
      <rect class="card" width="164" height="58" rx="7"/>
      <text class="name" x="10" y="23">products.js</text>
      <text class="detail" x="10" y="44">Catalog and coupons</text>
    </g>
    <g transform="translate(218 236)">
      <rect class="card" width="164" height="58" rx="7"/>
      <text class="name" x="10" y="23">orders.js</text>
      <text class="detail" x="10" y="44">Create, list, cancel</text>
    </g>
    <g transform="translate(388 236)">
      <rect class="card" width="164" height="58" rx="7"/>
      <text class="name" x="10" y="23">customers.js</text>
      <text class="detail" x="10" y="44">Khata and settlements</text>
    </g>
    <g transform="translate(558 236)">
      <rect class="card" width="164" height="58" rx="7"/>
      <text class="name" x="10" y="23">reports.js</text>
      <text class="detail" x="10" y="44">Reports, preview, export</text>
    </g>

    <rect class="group" x="36" y="328" width="700" height="309" rx="10"/>
    <text class="section" x="48" y="351">lib/</text>
    <path class="edge" d="M550 307V328"/>
    <text class="detail" x="563" y="322">Module calls</text>
    <path class="invoice-edge" d="M408 172V187H22V551H48"/>

    <g transform="translate(48 363)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">pricing.js</text>
      <text class="module-detail mono" x="10" y="41">computeTotals()</text>
      <text class="module-detail" x="10" y="56">Discount allocation and GST</text>
    </g>
    <g transform="translate(218 363)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">coupons.js</text>
      <text class="module-detail mono" x="10" y="41">validate()</text>
      <text class="module-detail mono" x="10" y="56">calculateDiscount()</text>
    </g>
    <g transform="translate(388 363)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">tax.js</text>
      <text class="module-detail mono" x="10" y="41">getRateForItem()</text>
      <text class="module-detail mono" x="10" y="56">splitCgstSgst()</text>
    </g>
    <g transform="translate(558 363)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">inventory.js</text>
      <text class="module-detail mono" x="10" y="41">find(), check()</text>
      <text class="module-detail mono" x="10" y="56">reserve(), release()</text>
    </g>

    <g transform="translate(48 438)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">ledger.js</text>
      <text class="module-detail mono" x="10" y="41">chargeOrderToKhata()</text>
      <text class="module-detail mono" x="10" y="56">recordSettlement()</text>
    </g>
    <g transform="translate(218 438)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">orders.js</text>
      <text class="module-detail mono" x="10" y="41">add(), get()</text>
      <text class="module-detail mono" x="10" y="56">cancel(), list()</text>
    </g>
    <g transform="translate(388 438)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">dates.js</text>
      <text class="module-detail mono" x="10" y="41">today()</text>
      <text class="module-detail mono" x="10" y="56">normalizeDateKey()</text>
    </g>
    <g transform="translate(558 438)">
      <rect class="card" width="164" height="64" rx="7"/>
      <text class="name" x="10" y="22">reports.js</text>
      <text class="module-detail mono" x="10" y="41">getDashboardSummary()</text>
      <text class="module-detail mono" x="10" y="56">getGstReconciliation()</text>
    </g>

    <g transform="translate(48 524)">
      <rect class="ticket" width="354" height="76" rx="7"/>
      <text class="name ticket-text" x="12" y="21">invoice.js</text>
      <text class="detail mono ticket-text" x="12" y="41">GET /orders/:id/invoice</text>
      <text class="detail ticket-text" x="12" y="62">render() calls computeInvoiceFigures()</text>
    </g>
    <g transform="translate(416 524)">
      <rect class="card" width="306" height="76" rx="7"/>
      <text class="name" x="12" y="21">store.js</text>
      <text class="detail mono" x="12" y="41">read(), appendAudit(), write()</text>
      <text class="detail" x="12" y="62">Synchronous JSON file access</text>
    </g>

    <rect class="card" x="48" y="659" width="354" height="62" rx="9"/>
    <text class="name" x="62" y="683">config.js</text>
    <text class="detail" x="62" y="705">Port, shop details, GST slabs, and coupon rules</text>
    <path class="edge" d="M225 600V659"/>
    <text class="detail" x="237" y="625">Reads config</text>

    <rect class="card" x="416" y="659" width="306" height="62" rx="9"/>
    <text class="name" x="430" y="683">data/db.json</text>
    <text class="detail" x="430" y="705">Stock, orders, Khata, audits, and ID counters</text>
    <path class="edge" d="M569 600V659"/>
    <text class="detail" x="581" y="625">Reads and rewrites</text>
  </g>

  <!-- Successful checkout sequence -->
  <g aria-label="Seven steps for placing an order">
    <text class="section" x="768" y="126">PLACING AN ORDER</text>
    <path d="M790 174V679" stroke="#abc2dc" stroke-width="2"/>

    <g transform="translate(768 141)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">1</text>
      <text class="name" x="45" y="23">Submit the cart</text>
      <text class="detail mono" x="45" y="43">public/js/app.js → POST /api/orders</text>
      <text class="detail mono" x="45" y="61">server.js → routes/orders.js</text>
    </g>
    <g transform="translate(768 223)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">2</text>
      <text class="name" x="45" y="23">Read the database and check stock</text>
      <text class="detail mono" x="45" y="43">store.read() → inventory.find()</text>
      <text class="detail mono" x="45" y="61">inventory.check()</text>
    </g>
    <g transform="translate(768 305)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">3</text>
      <text class="name" x="45" y="23">Validate coupon and price the order</text>
      <text class="detail mono" x="45" y="43">pricing.subtotal() → coupons.validate()</text>
      <text class="detail mono" x="45" y="61">pricing.computeTotals() uses coupons and tax</text>
    </g>
    <g transform="translate(768 387)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">4</text>
      <text class="name" x="45" y="23">Resolve customer and charge Khata if used</text>
      <text class="detail mono" x="45" y="43">ledger.findCustomer()</text>
      <text class="detail mono" x="45" y="61">ledger.chargeOrderToKhata()</text>
    </g>
    <g transform="translate(768 469)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">5</text>
      <text class="name" x="45" y="23">Deduct stock and create the order</text>
      <text class="detail mono" x="45" y="43">inventory.reserve() → orders.add()</text>
      <text class="detail" x="45" y="61">Save item snapshots and checkout totals in memory.</text>
    </g>
    <g transform="translate(768 551)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">6</text>
      <text class="name" x="45" y="23">Audit and persist</text>
      <text class="detail mono" x="45" y="43">store.appendAudit() → store.write()</text>
      <text class="detail" x="45" y="61">Write order, stock, audit, and any Khata changes.</text>
    </g>
    <g transform="translate(768 633)">
      <rect class="flow" width="396" height="72" rx="9"/>
      <circle class="number" cx="22" cy="22" r="13"/>
      <text class="number-text" x="22" y="27">7</text>
      <text class="name" x="45" y="23">Return the order</text>
      <text class="detail mono" x="45" y="43">201 Created</text>
      <text class="detail" x="45" y="61">The browser shows the saved total and invoice link.</text>
    </g>
  </g>

  <!-- Legend -->
  <g aria-label="Legend">
    <path class="edge" d="M48 761H78"/>
    <text class="legend" x="88" y="766">Request or dependency</text>
    <path class="invoice-edge" d="M251 761H281"/>
    <text class="legend" x="291" y="766">Separate invoice request</text>
    <rect class="ticket" x="480" y="753" width="18" height="15" rx="3"/>
    <text class="legend" x="508" y="766">Ticket module</text>
    <circle class="number" cx="658" cy="761" r="10"/>
    <text class="number-text" x="658" y="766">1</text>
    <text class="legend" x="676" y="766">Checkout step</text>
  </g>
</svg>
