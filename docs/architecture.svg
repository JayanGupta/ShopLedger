<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server, routes, libraries, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52657a"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#087f8c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#152538;font-size:14px}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#51647a}
      .head{font-size:16px;font-weight:700}.small{font-size:12px}.tiny{font-size:12px;fill:#52657a}
      .box{fill:#fff;stroke:#9aabba;stroke-width:1.5;rx:10}.group{fill:#f5f8fb;stroke:#b8c5d1;stroke-width:1.5;rx:14}
      .route{fill:#fff;stroke:#71859a;stroke-width:1.3;rx:8}.lib{fill:#edf3f8;stroke:#94a8bb;stroke-width:1.2;rx:8}
      .ticket{fill:#fff0dc;stroke:#e49a3c;stroke-width:2;rx:8}.store{fill:#e8f5eb;stroke:#57966a;stroke-width:1.5;rx:9}
      .line{fill:none;stroke:#52657a;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#087f8c;stroke-width:2.4;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f9fbfd"/>
  <text x="34" y="42" class="title">ShopLedger | Application architecture</text>
  <text x="35" y="66" class="subtitle">Express POS · Khata ledger · GST invoicing · File-backed JSON data</text>

  <!-- Browser and server entry -->
  <rect x="32" y="100" width="235" height="126" class="box"/>
  <text x="50" y="127" class="head">Browser UI · public/</text>
  <text x="50" y="151">index.html · js/app.js</text>
  <text x="50" y="174">css/style.css</text>
  <text x="50" y="204" class="tiny">POS, orders, Khata, audit views</text>
  <rect x="320" y="100" width="235" height="126" class="box"/>
  <text x="339" y="127" class="head">server.js</text>
  <text x="339" y="151">Express app · JSON body parser</text>
  <text x="339" y="174">serves public/ and mounts /api</text>
  <text x="339" y="204" class="tiny">GET /orders/:id/invoice</text>
  <path d="M267 163 L320 163" class="line"/>
  <text x="271" y="150" class="tiny">HTTP</text>

  <!-- Routes -->
  <rect x="598" y="88" width="264" height="258" class="group"/>
  <text x="616" y="116" class="head">routes/ · mounted at /api</text>
  <rect x="615" y="132" width="230" height="39" class="route"/><text x="629" y="157">products.js · products, coupons</text>
  <rect x="615" y="179" width="230" height="44" class="route"/><text x="629" y="198">orders.js · list, get, create,</text><text x="629" y="215">cancel order</text>
  <rect x="615" y="231" width="230" height="39" class="route"/><text x="629" y="256">customers.js · list, settle</text>
  <rect x="615" y="278" width="230" height="50" class="route"/><text x="629" y="298">reports.js · dashboard, GST</text><text x="629" y="316">reconciliation, pricing preview, export</text>
  <path d="M555 163 L598 163" class="line"/>
  <path d="M555 191 C575 191 575 300 598 300" class="line"/>

  <!-- Libraries -->
  <rect x="900" y="88" width="268" height="438" class="group"/>
  <text x="918" y="116" class="head">lib/ · application logic</text>
  <rect x="918" y="132" width="232" height="44" class="lib"/><text x="932" y="151">orders.js · add, get, list, cancel</text><text x="932" y="168" class="tiny">uses inventory, ledger, dates</text>
  <rect x="918" y="184" width="232" height="44" class="lib"/><text x="932" y="203">pricing.js · subtotal, computeTotals</text><text x="932" y="220" class="tiny">discount allocation and line tax</text>
  <rect x="918" y="236" width="232" height="44" class="lib"/><text x="932" y="255">tax.js · HSN rate, GST split</text><text x="932" y="272" class="tiny">used by checkout pricing</text>
  <rect x="918" y="288" width="232" height="44" class="lib"/><text x="932" y="307">coupons.js · normalize, validate, discount</text><text x="932" y="324" class="tiny">coupon rules from config.js</text>
  <rect x="918" y="340" width="232" height="48" class="ticket"/><text x="932" y="360" font-weight="700">invoice.js · computeInvoiceFigures,</text><text x="932" y="379" font-weight="700">render printable HTML</text>
  <rect x="918" y="396" width="108" height="42" class="lib"/><text x="930" y="422">inventory.js</text>
  <rect x="1036" y="396" width="114" height="42" class="lib"/><text x="1048" y="422">ledger.js</text>
  <rect x="918" y="446" width="108" height="42" class="lib"/><text x="930" y="472">reports.js</text>
  <rect x="1036" y="446" width="114" height="42" class="lib"/><text x="1048" y="472">dates.js</text>
  <rect x="918" y="496" width="232" height="24" class="lib"/><text x="932" y="514">store.js · read, write, appendAudit</text>
  <path d="M845 202 L900 202" class="line"/><path d="M845 250 C870 250 870 205 900 205" class="line"/>
  <path d="M845 304 C878 304 878 413 900 413" class="line"/>
  <path d="M845 304 C874 304 874 467 900 467" class="line"/>
  <path d="M845 304 C880 304 880 508 900 508" class="line"/>
  <path d="M845 203 C876 203 876 359 918 359" class="line dash"/>
  <path d="M845 203 L918 206" class="line"/>
  <path d="M1034 228 L1034 236" class="line"/>
  <path d="M1034 228 C1083 228 1083 288 1034 288" class="line"/>
  <path d="M1034 176 C1080 176 1080 396 1026 416" class="line dash"/>
  <path d="M1034 176 C1110 176 1110 396 1036 416" class="line dash"/>
  <path d="M1034 176 C1118 176 1118 457 1026 467" class="line dash"/>
  <path d="M1034 176 C1143 176 1143 457 1036 467" class="line dash"/>

  <!-- Data/config -->
  <rect x="320" y="270" width="235" height="74" class="box"/>
  <text x="339" y="298" class="head">config.js</text>
  <text x="339" y="323">shop · tax slabs · coupons · port</text>
  <rect x="320" y="383" width="235" height="92" class="store"/>
  <text x="339" y="413" class="head">data/db.json</text>
  <text x="339" y="438">products · orders · customers</text>
  <text x="339" y="460">settlements · auditLog · IDs</text>
  <path d="M900 508 C790 540 700 428 555 428" class="line"/>
  <text x="667" y="492" class="tiny">store.read() / store.write()</text>
  <path d="M555 305 C700 320 808 265 918 258" class="line dash"/>
  <path d="M555 305 C720 330 812 307 918 308" class="line dash"/>
  <path d="M555 305 C740 350 815 360 918 364" class="line dash"/>

  <!-- Numbered order flow -->
  <rect x="32" y="556" width="1136" height="192" class="group"/>
  <text x="51" y="584" class="head">Order placement flow · POST /api/orders</text>
  <rect x="51" y="606" width="190" height="92" class="box"/><circle cx="70" cy="625" r="13" fill="#087f8c"/><text x="66" y="630" fill="#fff" font-weight="700">1</text><text x="91" y="630" font-weight="700">public/js/app.js</text><text x="66" y="655">collect cart and submit</text><text x="66" y="678" class="tiny">POST order payload</text>
  <rect x="270" y="606" width="190" height="92" class="route"/><circle cx="289" cy="625" r="13" fill="#087f8c"/><text x="285" y="630" fill="#fff" font-weight="700">2</text><text x="310" y="630" font-weight="700">routes/orders.js</text><text x="285" y="655">resolve products; validate</text><text x="285" y="678" class="tiny">inventory.check()</text>
  <rect x="489" y="606" width="190" height="92" class="lib"/><circle cx="508" cy="625" r="13" fill="#087f8c"/><text x="504" y="630" fill="#fff" font-weight="700">3</text><text x="529" y="630" font-weight="700">pricing.js</text><text x="504" y="655">coupon + HSN slab GST</text><text x="504" y="678" class="tiny">computeTotals() → tax.js</text>
  <rect x="708" y="606" width="190" height="92" class="lib"/><circle cx="727" cy="625" r="13" fill="#087f8c"/><text x="723" y="630" fill="#fff" font-weight="700">4</text><text x="748" y="630" font-weight="700">inventory / ledger</text><text x="723" y="655">reserve stock; charge Khata</text><text x="723" y="678" class="tiny">when payment is khata</text>
  <rect x="927" y="606" width="216" height="92" class="store"/><circle cx="946" cy="625" r="13" fill="#087f8c"/><text x="942" y="630" fill="#fff" font-weight="700">5</text><text x="967" y="630" font-weight="700">orders.add → store.write</text><text x="942" y="655">save order + audit to db.json</text><text x="942" y="678" class="tiny">respond with created order</text>
  <path d="M241 652 L270 652" class="flow"/><path d="M460 652 L489 652" class="flow"/><path d="M679 652 L708 652" class="flow"/><path d="M898 652 L927 652" class="flow"/>

  <!-- Invoice path and legend -->
  <path d="M437 226 C449 490 770 540 918 364" fill="none" stroke="#e49a3c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="465" y="520" class="tiny" fill="#9a5c12">invoice route calls invoice.render(order)</text>
  <rect x="51" y="716" width="17" height="17" class="ticket"/><text x="76" y="730" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="278" y="716" width="17" height="17" class="lib"/><text x="303" y="730" class="small">Other app modules</text>
  <rect x="464" y="716" width="17" height="17" class="store"/><text x="489" y="730" class="small">Persistent JSON data</text>
  <line x1="685" y1="724" x2="730" y2="724" class="flow"/><text x="740" y="730" class="small">Numbered order flow</text>
  <text x="51" y="772" class="tiny">Solid arrows show request or data paths · Dashed arrows show shared dependencies · Diagram labels match files and exported functions</text>
</svg>
