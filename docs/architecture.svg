<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">Browser and Express entry points, four routers, ten library modules, configuration and JSON storage, with the eight steps of placing an order. The invoice module is highlighted.</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #14283d; font-size: 13px }
      .title { font-size: 32px; font-weight: 700 }
      .section { font-size: 15px; font-weight: 700; fill: #37536e }
      .name { font-size: 15px; font-weight: 700 }
      .muted { fill: #425d75 }
      .card { fill: #fff; stroke: #b9cbdc }
      .group { fill: #edf3f8; stroke: #d5e0eb }
      .ticket { fill: #f1e7fa; stroke: #8952a7 }
      .ticket-text { fill: #683384 }
      .arrow { fill: none; stroke: #51708a; stroke-width: 1.5; marker-end: url(#arrow) }
      .branch { fill: none; stroke: #51708a; stroke-width: 1.5 }
      .step { fill: #235975 }
      .number { fill: white; font-weight: 700; text-anchor: middle }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#51708a"/>
    </marker>
    <rect id="module" width="330" height="47" rx="6"/>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="49" class="title">ShopLedger architecture</text>
  <text x="33" y="74" class="muted">Point of sale, Khata credit ledger and GST invoicing</text>
  <rect x="956" y="34" width="17" height="17" rx="4" class="ticket"/>
  <text x="981" y="48" class="ticket-text">Ticket scope</text>

  <rect x="32" y="98" width="342" height="64" rx="8" class="card"/>
  <text x="48" y="124" class="name">Browser UI · public/</text>
  <text x="48" y="146" class="muted">index.html and js/app.js · POS, Khata and reports</text>
  <path d="M374 130 H400" class="arrow"/>
  <rect x="402" y="98" width="334" height="64" rx="8" class="card"/>
  <text x="418" y="124" class="name">server.js</text>
  <text x="418" y="146" class="muted">Express · static files, JSON, /api and invoice HTML</text>

  <path d="M569 162 V185" class="arrow"/>
  <rect x="32" y="187" width="704" height="125" rx="9" class="group"/>
  <text x="47" y="211" class="section">routes/ · mounted under /api</text>
  <g class="card">
    <rect x="46" y="223" width="163" height="73" rx="6"/>
    <rect x="216" y="223" width="163" height="73" rx="6"/>
    <rect x="386" y="223" width="163" height="73" rx="6"/>
    <rect x="556" y="223" width="166" height="73" rx="6"/>
  </g>
  <g>
    <text x="57" y="246" class="name">products.js</text>
    <text x="57" y="265">Catalog and</text><text x="57" y="282">active coupons</text>
    <text x="227" y="246" class="name">orders.js</text>
    <text x="227" y="265">Place, list, view</text><text x="227" y="282">and cancel orders</text>
    <text x="397" y="246" class="name">customers.js</text>
    <text x="397" y="265">Khata accounts</text><text x="397" y="282">and settlements</text>
    <text x="567" y="246" class="name">reports.js</text>
    <text x="567" y="265">Dashboard, GST,</text><text x="567" y="282">preview and export</text>
  </g>

  <path d="M384 312 V335" class="arrow"/>
  <rect x="32" y="337" width="704" height="327" rx="9" class="group"/>
  <text x="47" y="361" class="section">lib/ · business logic and persistence</text>
  <g class="card">
    <use href="#module" x="46" y="373"/><use href="#module" x="392" y="373"/>
    <use href="#module" x="46" y="431"/><use href="#module" x="392" y="431"/>
    <use href="#module" x="46" y="489"/>
    <use href="#module" x="46" y="547"/><use href="#module" x="392" y="547"/>
    <use href="#module" x="46" y="605"/><use href="#module" x="392" y="605"/>
  </g>
  <use href="#module" x="392" y="489" class="ticket"/>
  <g>
    <text x="58" y="393" class="name">inventory.js</text><text x="58" y="410">Check sellable units and deduct stock</text>
    <text x="404" y="393" class="name">pricing.js</text><text x="404" y="410">Apportion discount and compute checkout totals</text>
    <text x="58" y="451" class="name">coupons.js</text><text x="58" y="468">Validate coupon and calculate discount</text>
    <text x="404" y="451" class="name">tax.js</text><text x="404" y="468">Resolve HSN rates and split CGST/SGST</text>
    <text x="58" y="509" class="name">orders.js</text><text x="58" y="526">Create, retrieve, filter and cancel orders</text>
    <text x="404" y="509" class="name ticket-text">invoice.js</text><text x="404" y="526" class="ticket-text">Recompute figures and render printable HTML</text>
    <text x="58" y="567" class="name">ledger.js</text><text x="58" y="584">Khata charges, reversals and repayments</text>
    <text x="404" y="567" class="name">reports.js</text><text x="404" y="584">Dashboard totals and invoice reconciliation</text>
    <text x="58" y="625" class="name">dates.js</text><text x="58" y="642">Order dates and date filter keys</text>
    <text x="404" y="625" class="name">store.js</text><text x="404" y="642">Read and write JSON, append audit entries</text>
  </g>

  <path d="M203 692 V666" class="arrow"/>
  <path d="M557 652 V692" class="arrow"/>
  <rect x="32" y="694" width="342" height="67" rx="8" class="card"/>
  <text x="48" y="719" class="name">config.js</text>
  <text x="48" y="741">Shop settings, HSN slabs and coupon rules</text>
  <rect x="402" y="694" width="334" height="67" rx="8" class="card"/>
  <text x="418" y="719" class="name">data/db.json</text>
  <text x="418" y="741">Stock, orders, Khata, settlements, IDs and audit</text>

  <rect x="758" y="98" width="410" height="663" rx="9" class="group"/>
  <text x="778" y="125" class="section">Placing an order</text>
  <path d="M793 155 V559" class="branch"/>
  <g class="step">
    <circle cx="793" cy="155" r="13"/><circle cx="793" cy="213" r="13"/>
    <circle cx="793" cy="271" r="13"/><circle cx="793" cy="329" r="13"/>
    <circle cx="793" cy="387" r="13"/><circle cx="793" cy="445" r="13"/>
    <circle cx="793" cy="503" r="13"/><circle cx="793" cy="561" r="13"/>
  </g>
  <g class="number">
    <text x="793" y="160">1</text><text x="793" y="218">2</text>
    <text x="793" y="276">3</text><text x="793" y="334">4</text>
    <text x="793" y="392">5</text><text x="793" y="450">6</text>
    <text x="793" y="508">7</text><text x="793" y="566">8</text>
  </g>
  <g>
    <text x="817" y="154" class="name">Submit cart</text>
    <text x="817" y="174">Browser → server.js → POST /api/orders</text>
    <text x="817" y="212" class="name">Load and check stock</text>
    <text x="817" y="232">store.read() → inventory.find() → inventory.check()</text>
    <text x="817" y="270" class="name">Validate coupon</text>
    <text x="817" y="290">pricing.subtotal() → coupons.validate()</text>
    <text x="817" y="328" class="name">Calculate payable amount</text>
    <text x="817" y="348">pricing.computeTotals() allocates the discount;</text>
    <text x="817" y="365">tax.getRateForItem() supplies each line’s GST rate.</text>
    <text x="817" y="386" class="name">Charge Khata if selected</text>
    <text x="817" y="406">ledger.chargeOrderToKhata() updates the balance.</text>
    <text x="817" y="444" class="name">Deduct stock and add order</text>
    <text x="817" y="464">inventory.reserve() → orders.add() → dates.today()</text>
    <text x="817" y="502" class="name">Save changes</text>
    <text x="817" y="522">store.appendAudit() → store.write() → data/db.json</text>
    <text x="817" y="560" class="name">Return the saved order</text>
    <text x="817" y="580">HTTP 201 · UI shows ledger total and invoice link.</text>
  </g>

  <rect x="778" y="611" width="370" height="128" rx="8" class="ticket"/>
  <text x="792" y="635" class="name ticket-text">When staff open the printable invoice</text>
  <text x="792" y="656">GET /orders/:id/invoice → server.js</text>
  <text x="792" y="675">store.read() → orders.get() → invoice.render()</text>
  <text x="792" y="694">invoice.computeInvoiceFigures() recalculates</text>
  <text x="792" y="713">GST and coupon discounts using config.js.</text>
</svg>
