<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture overview of the browser, Express server, route modules, library modules, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#526174"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #526174; }
      .head { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; fill: #415066; }
      .tiny { font-size: 12px; }
      .panel { fill: #f8fafc; stroke: #9aa9bb; stroke-width: 1.4; }
      .node { fill: #fff; stroke: #6b7b8f; stroke-width: 1.2; }
      .ticket { fill: #fff1dc; stroke: #d97706; stroke-width: 2; }
      .line { fill: none; stroke: #526174; stroke-width: 1.6; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#flowArrow); }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="40" class="title">ShopLedger | Application architecture</text>
  <text x="32" y="64" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing</text>

  <!-- Main architecture panels -->
  <rect x="28" y="92" width="205" height="282" rx="12" class="panel"/>
  <text x="46" y="120" class="head">Browser UI</text>
  <rect x="46" y="139" width="169" height="54" rx="8" class="node"/>
  <text x="60" y="162" class="label">public/</text><text x="60" y="181" class="small">index.html · css/style.css</text>
  <rect x="46" y="207" width="169" height="58" rx="8" class="node"/>
  <text x="60" y="230" class="label">public/js/app.js</text><text x="60" y="250" class="small">POS · orders · Khata · audit</text>
  <text x="46" y="299" class="small">Calls /api endpoints and opens</text>
  <text x="46" y="318" class="small">the printable invoice route.</text>
  <text x="46" y="351" class="small">Static files served by Express</text>

  <rect x="262" y="92" width="190" height="282" rx="12" class="panel"/>
  <text x="280" y="120" class="head">Express server</text>
  <rect x="280" y="139" width="154" height="75" rx="8" class="node"/>
  <text x="294" y="164" class="label">server.js</text>
  <text x="294" y="184" class="small">JSON body parser</text>
  <text x="294" y="201" class="small">static public/ · mounts routes</text>
  <rect x="280" y="231" width="154" height="61" rx="8" class="ticket"/>
  <text x="294" y="254" class="label">GET invoice</text>
  <text x="294" y="276" class="small">orders/:id/invoice</text>
  <rect x="280" y="310" width="154" height="43" rx="8" class="node"/>
  <text x="294" y="337" class="label">config.js</text>

  <rect x="482" y="92" width="214" height="282" rx="12" class="panel"/>
  <text x="500" y="120" class="head">routes/ · mounted at /api</text>
  <rect x="500" y="139" width="178" height="43" rx="7" class="node"/>
  <text x="514" y="166" class="label">products.js</text>
  <rect x="500" y="191" width="178" height="43" rx="7" class="node"/>
  <text x="514" y="218" class="label">orders.js</text>
  <rect x="500" y="243" width="178" height="43" rx="7" class="node"/>
  <text x="514" y="270" class="label">customers.js</text>
  <rect x="500" y="295" width="178" height="43" rx="7" class="node"/>
  <text x="514" y="322" class="label">reports.js</text>
  <text x="500" y="360" class="small">Each router is a routes/*.js file</text>

  <rect x="726" y="92" width="286" height="441" rx="12" class="panel"/>
  <text x="744" y="120" class="head">lib/ · application modules</text>
  <rect x="744" y="139" width="116" height="42" rx="7" class="node"/><text x="758" y="166" class="label">pricing.js</text>
  <rect x="872" y="139" width="122" height="42" rx="7" class="node"/><text x="886" y="166" class="label">coupons.js</text>
  <rect x="744" y="190" width="116" height="42" rx="7" class="ticket"/><text x="758" y="217" class="label">tax.js</text>
  <rect x="872" y="190" width="122" height="42" rx="7" class="node"/><text x="886" y="217" class="label">inventory.js</text>
  <rect x="744" y="241" width="116" height="42" rx="7" class="node"/><text x="758" y="268" class="label">orders.js</text>
  <rect x="872" y="241" width="122" height="42" rx="7" class="node"/><text x="886" y="268" class="label">ledger.js</text>
  <rect x="744" y="292" width="116" height="42" rx="7" class="node"/><text x="758" y="319" class="label">reports.js</text>
  <rect x="872" y="292" width="122" height="42" rx="7" class="node"/><text x="886" y="319" class="label">dates.js</text>
  <rect x="744" y="343" width="116" height="48" rx="7" class="node"/><text x="758" y="372" class="label">store.js</text>
  <rect x="872" y="343" width="122" height="48" rx="7" class="ticket"/><text x="886" y="365" class="label">invoice.js</text><text x="886" y="383" class="small">render · figures</text>
  <text x="744" y="422" class="small">orders.js route → pricing / coupons /</text>
  <text x="744" y="441" class="small">inventory / ledger / orders / store</text>
  <text x="744" y="466" class="small">server.js invoice route → orders.get →</text>
  <text x="744" y="485" class="small">invoice.render</text>
  <text x="744" y="515" class="small">pricing.js calls tax.js for GST rates</text>

  <rect x="1042" y="92" width="130" height="282" rx="12" class="panel"/>
  <text x="1058" y="120" class="head">Persistence</text>
  <rect x="1058" y="158" width="98" height="84" rx="8" class="node"/>
  <text x="1070" y="184" class="label">data/</text><text x="1070" y="205" class="small">db.json</text>
  <text x="1058" y="273" class="small">JSON file</text>
  <text x="1058" y="294" class="small">read/write via</text>
  <text x="1058" y="315" class="small">lib/store.js</text>

  <!-- Main connections -->
  <path d="M215 162 H280" class="line"/>
  <path d="M215 235 H280" class="line"/>
  <path d="M434 166 H500" class="line"/>
  <path d="M678 213 H726" class="line"/>
  <path d="M678 265 H726" class="line"/>
  <path d="M678 316 H726" class="line"/>
  <path d="M994 367 H1058" class="line"/>
  <path d="M434 259 C565 259 624 360 744 367" class="line"/>
  <path d="M434 332 C545 390 738 419 872 365" class="line"/>
  <text x="1046" y="353" class="small">file I/O</text>

  <!-- Numbered order flow -->
  <rect x="28" y="560" width="1144" height="207" rx="12" fill="#f2f7ff" stroke="#8bb2f0" stroke-width="1.5"/>
  <text x="48" y="591" class="head">Order placement flow · POST /api/orders</text>
  <text x="48" y="616" class="subtitle">Numbered sequence follows routes/orders.js; arrows show the order request path and its saved effects.</text>
  <g>
    <rect x="48" y="642" width="194" height="93" rx="9" fill="#fff" stroke="#7c9ac2"/>
    <circle cx="68" cy="662" r="13" fill="#2563eb"/><text x="64" y="667" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="90" y="667" class="label">UI submits cart</text>
    <text x="62" y="693" class="small">public/js/app.js</text><text x="62" y="713" class="small">POST /api/orders</text>

    <rect x="270" y="642" width="194" height="93" rx="9" fill="#fff" stroke="#7c9ac2"/>
    <circle cx="290" cy="662" r="13" fill="#2563eb"/><text x="286" y="667" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="312" y="667" class="label">Resolve & validate</text>
    <text x="284" y="693" class="small">inventory.find/check</text><text x="284" y="713" class="small">coupons.validate</text>

    <rect x="492" y="642" width="194" height="93" rx="9" fill="#fff" stroke="#7c9ac2"/>
    <circle cx="512" cy="662" r="13" fill="#2563eb"/><text x="508" y="667" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="534" y="667" class="label">Compute totals</text>
    <text x="506" y="693" class="small">pricing.subtotal / computeTotals</text><text x="506" y="713" class="small">tax.getRateForItem</text>

    <rect x="714" y="642" width="194" height="93" rx="9" fill="#fff" stroke="#7c9ac2"/>
    <circle cx="734" cy="662" r="13" fill="#2563eb"/><text x="730" y="667" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="756" y="667" class="label">Commit effects</text>
    <text x="728" y="693" class="small">ledger.chargeOrderToKhata*</text><text x="728" y="713" class="small">inventory.reserve</text>

    <rect x="936" y="642" width="214" height="93" rx="9" fill="#fff" stroke="#7c9ac2"/>
    <circle cx="956" cy="662" r="13" fill="#2563eb"/><text x="952" y="667" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="978" y="667" class="label">Save & respond</text>
    <text x="950" y="693" class="small">orders.add · appendAudit</text><text x="950" y="713" class="small">store.write → data/db.json</text>
  </g>
  <path d="M242 688 H270" class="flow"/><path d="M464 688 H492" class="flow"/><path d="M686 688 H714" class="flow"/><path d="M908 688 H936" class="flow"/>
  <text x="48" y="754" class="small">* Khata debit occurs only when paymentMode is khata. The route returns HTTP 201 with the created order.</text>

  <!-- Legend -->
  <rect x="935" y="37" width="237" height="43" rx="8" fill="#fffaf2" stroke="#d97706"/>
  <rect x="950" y="51" width="18" height="16" rx="3" class="ticket"/>
  <text x="977" y="64" class="small">Ticket focus: lib/invoice.js, lib/tax.js</text>
</svg>
