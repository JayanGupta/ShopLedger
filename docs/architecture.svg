<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser, Express server, routes, libraries, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#526179}
      .head{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:12px}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .ticket{fill:#fff3e6;stroke:#e58a2b;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#flowArrow)}
      .number{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text class="title" x="28" y="38">ShopLedger · application architecture</text>
  <text class="subtitle" x="29" y="61">Request flow, module relationships, and order persistence</text>

  <!-- Browser -->
  <rect class="box" x="28" y="100" width="195" height="112" rx="10"/>
  <text class="head" x="46" y="126">Browser UI</text>
  <text class="small" x="46" y="149">public/index.html</text>
  <text class="small" x="46" y="168">public/js/app.js</text>
  <text class="small" x="46" y="187">public/css/style.css</text>

  <!-- Server -->
  <rect class="box" x="278" y="100" width="224" height="112" rx="10"/>
  <text class="head" x="297" y="126">Express application</text>
  <text class="label" x="297" y="151">server.js</text>
  <text class="small" x="297" y="172">JSON body parser · static UI</text>
  <text class="small" x="297" y="191">mounts routes under /api</text>
  <path class="edge" d="M223 155 H270"/>

  <!-- Routes group -->
  <rect class="group" x="550" y="86" width="284" height="242" rx="12"/>
  <text class="head" x="570" y="111">routes/</text>
  <rect class="box" x="570" y="124" width="244" height="42" rx="7"/>
  <text class="label" x="584" y="142">products.js</text><text class="small" x="584" y="158">catalog · active coupons</text>
  <rect class="box" x="570" y="174" width="244" height="42" rx="7"/>
  <text class="label" x="584" y="192">orders.js</text><text class="small" x="584" y="208">list · place · cancel</text>
  <rect class="box" x="570" y="224" width="244" height="42" rx="7"/>
  <text class="label" x="584" y="242">customers.js</text><text class="small" x="584" y="258">customer balances · settlement</text>
  <rect class="box" x="570" y="274" width="244" height="42" rx="7"/>
  <text class="label" x="584" y="292">reports.js</text><text class="small" x="584" y="308">dashboard · preview · reconciliation</text>
  <path class="edge" d="M502 155 H540"/>

  <!-- config -->
  <rect class="box" x="890" y="100" width="278" height="85" rx="10"/>
  <text class="head" x="910" y="128">config.js</text>
  <text class="small" x="910" y="151">shop settings · HSN GST slabs</text>
  <text class="small" x="910" y="170">coupon definitions · defaults</text>

  <!-- libs -->
  <rect class="group" x="278" y="370" width="556" height="385" rx="12"/>
  <text class="head" x="298" y="398">lib/</text>
  <rect class="box" x="300" y="415" width="244" height="57" rx="7"/>
  <text class="label" x="314" y="438">pricing.js</text><text class="small" x="314" y="458">subtotal · discount · GST totals</text>
  <rect class="box" x="568" y="415" width="244" height="57" rx="7"/>
  <text class="label" x="582" y="438">coupons.js</text><text class="small" x="582" y="458">normalize · validate · calculate</text>
  <rect class="box" x="300" y="487" width="244" height="57" rx="7"/>
  <text class="label" x="314" y="510">tax.js</text><text class="small" x="314" y="530">HSN rate · CGST/SGST split</text>
  <rect class="box" x="568" y="487" width="244" height="57" rx="7"/>
  <text class="label" x="582" y="510">inventory.js</text><text class="small" x="582" y="530">find · stock check · reserve</text>
  <rect class="box" x="300" y="559" width="244" height="57" rx="7"/>
  <text class="label" x="314" y="582">orders.js</text><text class="small" x="314" y="602">add · get · list · cancel</text>
  <rect class="box" x="568" y="559" width="244" height="57" rx="7"/>
  <text class="label" x="582" y="582">ledger.js</text><text class="small" x="582" y="602">Khata debit · reverse · settle</text>
  <rect class="ticket" x="300" y="631" width="244" height="57" rx="7"/>
  <text class="label" x="314" y="654">invoice.js</text><text class="small" x="314" y="674">computeInvoiceFigures · render</text>
  <rect class="box" x="568" y="631" width="244" height="57" rx="7"/>
  <text class="label" x="582" y="654">reports.js</text><text class="small" x="582" y="674">dashboard · GST reconciliation</text>
  <rect class="box" x="300" y="703" width="244" height="37" rx="7"/>
  <text class="label" x="314" y="727">store.js</text><text class="small" x="393" y="727">read · write · appendAudit</text>
  <rect class="box" x="568" y="703" width="244" height="37" rx="7"/>
  <text class="label" x="582" y="727">dates.js</text><text class="small" x="660" y="727">today · normalizeDateKey</text>

  <!-- data -->
  <path class="box" d="M949 624 h180 l22 22 v94 h-202 z"/>
  <path d="M1129 624 v22 h22" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="head" x="970" y="663">data/db.json</text>
  <text class="small" x="970" y="686">products · orders · customers</text>
  <text class="small" x="970" y="705">settlements · audit log</text>
  <rect class="box" x="890" y="222" width="278" height="84" rx="10"/>
  <text class="head" x="910" y="250">Invoice endpoint</text>
  <text class="small" x="910" y="273">server.js → /orders/:id/invoice</text>
  <text class="small" x="910" y="292">orders.get → invoice.render</text>

  <!-- dependencies -->
  <path class="edge" d="M814 194 C850 194 850 436 812 436"/>
  <path class="edge" d="M544 443 H560"/>
  <path class="edge" d="M422 487 V478"/>
  <path class="edge" d="M692 631 C692 610 680 604 680 618"/>
  <path class="edge" d="M814 294 C858 294 858 263 882 263"/>
  <path class="edge" d="M502 100 C590 65 904 63 927 94"/>
  <path class="edge" d="M814 655 H940"/>
  <path class="edge" d="M812 720 H939"/>
  <path class="edge" d="M544 720 C900 758 914 470 944 306"/>
  <path class="edge" d="M814 583 C860 583 865 306 882 286"/>

  <!-- numbered order flow overlay -->
  <path class="flow" d="M123 218 V345 H665 V168"/>
  <circle class="number" cx="123" cy="244" r="13"/><text class="numtext" x="123" y="248">1</text>
  <path class="flow" d="M692 216 V352 H420 V407"/>
  <circle class="number" cx="692" cy="346" r="13"/><text class="numtext" x="692" y="350">2</text>
  <path class="flow" d="M420 472 V480"/>
  <circle class="number" cx="444" cy="476" r="13"/><text class="numtext" x="444" y="480">3</text>
  <path class="flow" d="M544 443 H558"/>
  <circle class="number" cx="552" cy="420" r="13"/><text class="numtext" x="552" y="424">4</text>
  <path class="flow" d="M692 544 V557"/>
  <circle class="number" cx="717" cy="550" r="13"/><text class="numtext" x="717" y="554">5</text>
  <path class="flow" d="M420 544 V557"/>
  <circle class="number" cx="444" cy="550" r="13"/><text class="numtext" x="444" y="554">6</text>
  <path class="flow" d="M420 616 V628"/>
  <circle class="number" cx="444" cy="622" r="13"/><text class="numtext" x="444" y="626">7</text>
  <path class="flow" d="M544 720 H938"/>
  <circle class="number" cx="850" cy="720" r="13"/><text class="numtext" x="850" y="724">8</text>

  <!-- Legend -->
  <rect x="890" y="370" width="278" height="192" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="head" x="910" y="399">Order flow</text>
  <text class="small" x="910" y="424">1 Browser sends POST /api/orders</text>
  <text class="small" x="910" y="446">2 routes/orders validates request</text>
  <text class="small" x="910" y="468">3 inventory.check</text>
  <text class="small" x="910" y="490">4 pricing.computeTotals + coupons</text>
  <text class="small" x="910" y="512">5 ledger.chargeOrderToKhata (if Khata)</text>
  <text class="small" x="910" y="534">6 inventory.reserve → 7 orders.add</text>
  <rect class="ticket" x="890" y="578" width="278" height="38" rx="7"/>
  <text class="small" x="905" y="602">Ticket module: lib/invoice.js</text>
  <text class="small" x="890" y="757">8 store.write persists JSON + audit entry</text>

  <!-- Legend for arrows -->
  <path class="flow" d="M28 760 H77"/><text class="small" x="87" y="765">numbered order placement sequence</text>
  <path class="edge" d="M300 760 H349"/><text class="small" x="359" y="765">module use / request connection</text>
</svg>
