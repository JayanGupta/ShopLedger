<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">Browser, server, four API routers, ten library modules, configuration and JSON storage. Steps show how an order is placed. Inventory and orders are highlighted for issue 2.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #142c34; }
    .title { font-size: 38px; font-weight: bold; }
    .subtitle { font-size: 17px; fill: #425e67; }
    .label { font-size: 14px; font-weight: bold; letter-spacing: 1px; fill: #425e67; }
    .name { font-size: 17px; font-weight: bold; }
    .detail { font-size: 15px; }
    .card { fill: #fff; stroke: #a8bec4; }
    .scope { fill: #fff0ce; stroke: #a96812; stroke-width: 2; }
    .arrow { stroke: #426b77; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#426b77"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#eef5f6"/>
  <text class="title" x="48" y="65">ShopLedger architecture</text>
  <text class="subtitle" x="49" y="96">Point of sale, Khata credit, and GST reporting</text>
  <rect class="scope" x="909" y="51" width="22" height="19" rx="4"/>
  <text class="detail" x="942" y="66">Issue #2 scope</text>
  <g class="card">
    <rect x="48" y="139" width="235" height="121" rx="10"/>
    <rect x="316" y="139" width="273" height="121" rx="10"/>
    <rect x="622" y="139" width="310" height="121" rx="10"/>
    <rect x="48" y="310" width="884" height="250" rx="10"/>
    <rect x="965" y="310" width="187" height="118" rx="10"/>
    <rect x="965" y="450" width="187" height="110" rx="10"/>
    <rect x="48" y="607" width="1104" height="146" rx="10"/>
  </g>
  <g class="arrow" marker-end="url(#tip)">
    <path d="M283 200H316"/>
    <path d="M589 200H622"/>
    <path d="M777 260V310"/>
    <path d="M932 506H965"/>
  </g>
  <path class="arrow" d="M965 369H932" marker-end="url(#tip)"/>
  <g>
    <text class="label" x="67" y="169">BROWSER</text>
    <text class="name" x="67" y="198">public/</text>
    <text class="detail" x="67" y="221">index.html · js/app.js</text>
    <text class="detail" x="67" y="242">css/style.css</text>
    <text class="label" x="335" y="169">EXPRESS ENTRY POINT</text>
    <text class="name" x="335" y="198">server.js</text>
    <text class="detail" x="335" y="221">Static UI, /api and printable</text>
    <text class="detail" x="335" y="242">/orders/:id/invoice</text>
    <text class="label" x="641" y="169">API ROUTERS · routes/</text>
    <text class="name" x="641" y="204">products.js</text>
    <text class="name" x="780" y="204">orders.js</text>
    <text class="name" x="641" y="238">customers.js</text>
    <text class="name" x="780" y="238">reports.js</text>
    <text class="label" x="68" y="344">LIBRARY MODULES · lib/</text>
    <rect class="scope" x="64" y="365" width="146" height="42" rx="7"/>
    <rect class="scope" x="232" y="365" width="146" height="42" rx="7"/>
    <text class="name" x="76" y="392">inventory.js</text>
    <text class="name" x="244" y="392">orders.js</text>
    <text class="name" x="412" y="392">pricing.js</text>
    <text class="name" x="580" y="392">coupons.js</text>
    <text class="name" x="748" y="392">tax.js</text>
    <text class="name" x="76" y="456">ledger.js</text>
    <text class="name" x="244" y="456">dates.js</text>
    <text class="name" x="412" y="456">invoice.js</text>
    <text class="name" x="580" y="456">reports.js</text>
    <text class="name" x="748" y="456">store.js</text>
    <text class="detail" x="76" y="522">Highlighted modules check stock and return physical inventory when an order is cancelled.</text>
    <text class="label" x="984" y="343">SETTINGS</text>
    <text class="name" x="984" y="375">config.js</text>
    <text class="detail" x="984" y="402">Shop, GST, port</text>
    <text class="label" x="984" y="482">PERSISTENCE</text>
    <text class="name" x="984" y="512">data/db.json</text>
    <text class="detail" x="984" y="538">One JSON store</text>
    <text class="label" x="68" y="639">PLACING AN ORDER</text>
    <text class="detail" x="68" y="671">1. Browser sends POST /api/orders.</text>
    <text class="detail" x="68" y="701">2. Order router reads the store and calls inventory.check.</text>
    <text class="detail" x="68" y="731">3. Coupons are validated and pricing computes totals.</text>
    <text class="detail" x="621" y="671">4. Charge Khata when selected and deduct physical stock.</text>
    <text class="detail" x="621" y="701">5. Add the order and audit entry, then write the store.</text>
    <text class="detail" x="621" y="731">6. Return the new order with HTTP 201.</text>
  </g>
</svg>
