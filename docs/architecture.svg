<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">A component map of ShopLedger showing browser, Express server, routers, library modules, configuration, JSON storage, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526174}
      .head{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:12px;fill:#526174}
      .box{fill:#fff;stroke:#9aa9bb;stroke-width:1.4}.group{fill:#f4f7fb;stroke:#cbd5e1;stroke-width:1.2}
      .route{fill:#fff;stroke:#a6b5c5;stroke-width:1.1}.lib{fill:#fff;stroke:#b8c4d1;stroke-width:1.1}
      .ticket{fill:#fff0e8;stroke:#e5793c;stroke-width:2}.flowline{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#blueArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:1.5}.numtext{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="40" class="title">ShopLedger · application architecture</text>
  <text x="32" y="62" class="subtitle">Node / Express POS, Khata ledger and GST invoicing · component names verified from source</text>

  <!-- Browser -->
  <rect x="30" y="100" width="205" height="185" rx="10" class="box"/>
  <text x="48" y="127" class="head">Browser UI · public/</text>
  <rect x="48" y="143" width="169" height="48" rx="6" class="group"/>
  <text x="60" y="163" class="label">index.html</text><text x="60" y="180" class="small">app.js · style.css</text>
  <text x="48" y="216" class="small">Catalog · cart · coupons</text>
  <text x="48" y="235" class="small">Orders · Khata · reports</text>
  <text x="48" y="254" class="small">POST /api/orders</text>
  <circle cx="222" cy="254" r="12" class="num"/><text x="222" y="254" class="numtext">1</text>

  <!-- server -->
  <rect x="275" y="100" width="210" height="185" rx="10" class="box"/>
  <text x="295" y="127" class="head">server.js · Express</text>
  <text x="295" y="153" class="small">Serves public/ and mounts routers</text>
  <text x="295" y="177" class="small">JSON body parsing</text>
  <text x="295" y="201" class="small">GET /orders/:id/invoice</text>
  <text x="295" y="225" class="small">invoice.render(order)</text>
  <circle cx="298" cy="254" r="12" class="num"/><text x="298" y="254" class="numtext">2</text>
  <path d="M235 195 H275" class="flowline"/>

  <!-- routers -->
  <rect x="520" y="100" width="310" height="260" rx="10" class="group"/>
  <text x="540" y="127" class="head">routes/ · API routers</text>
  <rect x="540" y="143" width="270" height="42" rx="5" class="route"/>
  <text x="554" y="161" class="label">orders.js</text><text x="554" y="177" class="small">POST /orders · GET/list · cancel</text>
  <circle cx="795" cy="164" r="12" class="num"/><text x="795" y="164" class="numtext">3</text>
  <rect x="540" y="193" width="270" height="36" rx="5" class="route"/><text x="554" y="216" class="label">products.js</text>
  <rect x="540" y="237" width="270" height="36" rx="5" class="route"/><text x="554" y="260" class="label">customers.js</text>
  <rect x="540" y="281" width="270" height="58" rx="5" class="route"/><text x="554" y="303" class="label">reports.js</text><text x="554" y="323" class="small">dashboard · preview · reconciliation · export</text>
  <path d="M485 195 H520" class="link"/>

  <!-- libraries -->
  <rect x="275" y="390" width="555" height="198" rx="10" class="group"/>
  <text x="295" y="417" class="head">lib/ · application logic</text>
  <rect x="295" y="432" width="160" height="55" rx="5" class="lib"/><text x="307" y="454" class="label">pricing.js</text><text x="307" y="474" class="small">subtotal · computeTotals</text>
  <rect x="465" y="432" width="160" height="55" rx="5" class="lib"/><text x="477" y="454" class="label">coupons.js</text><text x="477" y="474" class="small">validate · calculateDiscount</text>
  <rect x="635" y="432" width="175" height="55" rx="5" class="lib"/><text x="647" y="454" class="label">tax.js</text><text x="647" y="474" class="small">HSN rate · CGST / SGST</text>
  <rect x="295" y="500" width="160" height="66" rx="5" class="lib"/><text x="307" y="522" class="label">orders.js</text><text x="307" y="542" class="small">add · get · cancel · list</text>
  <rect x="465" y="500" width="160" height="66" rx="5" class="lib"/><text x="477" y="522" class="label">inventory.js</text><text x="477" y="542" class="small">find · check · reserve</text>
  <rect x="635" y="500" width="175" height="66" rx="5" class="lib"/><text x="647" y="522" class="label">ledger.js</text><text x="647" y="542" class="small">Khata · settlements</text>
  <path d="M295 576 H810" stroke="#d4dce5"/>
  <text x="295" y="581" class="small">Also: store.js · dates.js · reports.js</text>
  <rect x="842" y="390" width="190" height="198" rx="10" class="ticket"/>
  <text x="860" y="417" class="head" fill="#9a4318">Ticket focus</text>
  <text x="860" y="448" class="label" fill="#9a4318">invoice.js</text>
  <text x="860" y="470" class="small">computeInvoiceFigures</text>
  <text x="860" y="489" class="small">render</text>
  <text x="860" y="524" class="small">Recomputes printable</text>
  <text x="860" y="543" class="small">invoice figures from order</text>
  <path d="M830 489 H842" class="link"/>

  <!-- connections from route to libs -->
  <path d="M675 360 V377 H375 V432" class="link"/>
  <path d="M660 360 V384 H545 V432" class="link"/>
  <path d="M645 360 V377 H715 V432" class="link"/>
  <path d="M630 360 V392 H375 V500" class="link"/>
  <path d="M615 360 V386 H545 V500" class="link"/>
  <path d="M600 360 V380 H715 V500" class="link"/>
  <path d="M830 218 H851 V390" class="link"/>

  <!-- storage and config -->
  <rect x="880" y="100" width="285" height="100" rx="10" class="box"/>
  <text x="900" y="128" class="head">config.js</text><text x="900" y="151" class="small">Shop settings · GST slabs · coupons</text><text x="900" y="174" class="small">Imported by server and library modules</text>
  <rect x="880" y="230" width="285" height="125" rx="10" class="box"/>
  <text x="900" y="258" class="head">data/db.json</text>
  <text x="900" y="282" class="small">products · customers · orders</text>
  <text x="900" y="303" class="small">settlements · audit log · ID counters</text>
  <text x="900" y="332" class="small">lib/store.js read() / write()</text>
  <path d="M830 318 H858 V291 H880" class="link"/>
  <path d="M830 545 H860 V332 H880" class="link"/>
  <path d="M830 465 H862 V182 H880" class="link"/>
  <path d="M830 455 H850 V151 H880" class="link"/>

  <!-- numbered order flow -->
  <rect x="30" y="620" width="1135" height="145" rx="10" class="box"/>
  <text x="50" y="648" class="head">Order placement · numbered request and save path</text>
  <circle cx="62" cy="683" r="12" class="num"/><text x="62" y="683" class="numtext">1</text>
  <text x="82" y="680" class="label">UI submits cart</text><text x="82" y="700" class="small">public/js/app.js</text>
  <path d="M205 683 H245" class="flowline"/>
  <circle cx="263" cy="683" r="12" class="num"/><text x="263" y="683" class="numtext">2</text>
  <text x="283" y="680" class="label">Express receives</text><text x="283" y="700" class="small">server.js → routes/orders.js</text>
  <path d="M465 683 H505" class="flowline"/>
  <circle cx="523" cy="683" r="12" class="num"/><text x="523" y="683" class="numtext">3</text>
  <text x="543" y="680" class="label">Validate products / stock</text><text x="543" y="700" class="small">inventory.find() · check()</text>
  <path d="M745 683 H780" class="flowline"/>
  <circle cx="798" cy="683" r="12" class="num"/><text x="798" y="683" class="numtext">4</text>
  <text x="818" y="680" class="label">Price &amp; apply GST</text><text x="818" y="700" class="small">pricing.computeTotals() · coupons · tax</text>
  <path d="M1038 683 H1060 V727 H1020" class="flowline"/>
  <circle cx="1000" cy="727" r="12" class="num"/><text x="1000" y="727" class="numtext">5</text>
  <text x="980" y="731" class="small" text-anchor="end">Khata charge if selected</text>
  <path d="M970 727 H720" class="flowline"/>
  <circle cx="700" cy="727" r="12" class="num"/><text x="700" y="727" class="numtext">6</text>
  <text x="680" y="731" class="small" text-anchor="end">reserve · orders.add · audit · store.write(db)</text>
  <path d="M400 727 H195" class="flowline"/>
  <circle cx="175" cy="727" r="12" class="num"/><text x="175" y="727" class="numtext">7</text>
  <text x="155" y="731" class="small" text-anchor="end">Persisted in data/db.json; return order</text>

  <!-- legend -->
  <rect x="842" y="563" width="190" height="25" rx="4" fill="#fff0e8" stroke="#e5793c" stroke-width="2"/>
  <text x="852" y="580" class="small">Orange = ticket module</text>
  <text x="32" y="789" class="small">Solid arrows show request, module, or storage relationships. Numbered flow tracks POST /api/orders.</text>
</svg>
