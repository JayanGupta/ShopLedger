<rect x="926" y="412" width="222" height="84" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="939" y="436" class="b">invoice.js ★</text><text x="939" y="458" class="c">computeInvoiceFigures</text><text x="939" y="479" class="c">render</text>
