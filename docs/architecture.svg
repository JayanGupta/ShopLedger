<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">Browser UI, Express server, four routers, ten library modules, configuration, JSON database, and a six-step order placement flow. Invoice and tax modules are highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526078; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #526078; }
      .name { font-size: 16px; font-weight: 700; }
      .detail { font-size: 12px; fill: #526078; }
      .note { font-size: 13px; fill: #526078; }
      .flow-title { font-size: 14px; font-weight: 700; }
      .flow-detail { font-size: 12px; fill: #526078; }
      .step-number { font-size: 13px; font-weight: 700; fill: #fff; }
      .panel { fill: #fff; stroke: #ccd6e3; stroke-width: 1.5; }
      .focus { fill: #f3eaff; stroke: #8b5cf6; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f7f9fc"/>
  <text x="36" y="43" class="title">ShopLedger architecture</text>
  <text x="36" y="67" class="subtitle">Node / Express POS · Khata ledger · GST invoicing</text>

  <text x="36" y="108" class="section">BROWSER</text>
  <text x="283" y="108" class="section">ENTRY POINT</text>
  <text x="520" y="108" class="section">ROUTERS</text>
  <text x="803" y="108" class="section">LIBRARY MODULES</text>

  <rect x="36" y="126" width="207" height="132" rx="12" class="panel"/>
  <text x="53" y="153" class="name">public/</text>
  <text x="53" y="178" class="detail">index.html · css/style.css</text>
  <text x="53" y="197" class="detail">js/app.js</text>
  <text x="53" y="224" class="detail">POS, orders, Khata, audit UI</text>

  <rect x="283" y="126" width="207" height="132" rx="12" class="panel"/>
  <text x="300" y="153" class="name">server.js</text>
  <text x="300" y="178" class="detail">JSON middleware, static UI</text>
  <text x="300" y="197" class="detail">Mounts /api routers</text>
  <text x="300" y="224" class="detail">GET /orders/:id/invoice</text>

  <path d="M243 191 H281" class="edge"/>
  <path d="M490 191 H518" class="edge"/>
  <path d="M769 266 H801" class="edge"/>

  <rect x="520" y="126" width="249" height="72" rx="11" class="panel"/>
  <text x="536" y="151" class="name">routes/products.js</text>
  <text x="536" y="174" class="detail">Products and coupons</text>
  <rect x="520" y="207" width="249" height="72" rx="11" class="panel"/>
  <text x="536" y="232" class="name">routes/orders.js</text>
  <text x="536" y="255" class="detail">POST /orders · GET · cancel</text>
  <rect x="520" y="288" width="249" height="72" rx="11" class="panel"/>
  <text x="536" y="313" class="name">routes/customers.js</text>
  <text x="536" y="336" class="detail">Khata customers and settle</text>
  <rect x="520" y="369" width="249" height="72" rx="11" class="panel"/>
  <text x="536" y="394" class="name">routes/reports.js</text>
  <text x="536" y="417" class="detail">Preview, reports, export</text>

  <rect x="803" y="126" width="174" height="61" rx="10" class="panel"/>
  <text x="818" y="151" class="name">pricing.js</text>
  <text x="818" y="171" class="detail">computeTotals()</text>
  <rect x="989" y="126" width="174" height="61" rx="10" class="focus"/>
  <text x="1004" y="151" class="name">tax.js</text>
  <text x="1004" y="171" class="detail">getRateForItem()</text>

  <rect x="803" y="198" width="174" height="61" rx="10" class="panel"/>
  <text x="818" y="223" class="name">coupons.js</text>
  <text x="818" y="243" class="detail">calculateDiscount()</text>
  <rect x="989" y="198" width="174" height="61" rx="10" class="panel"/>
  <text x="1004" y="223" class="name">inventory.js</text>
  <text x="1004" y="243" class="detail">check(), reserve()</text>

  <rect x="803" y="270" width="174" height="61" rx="10" class="panel"/>
  <text x="818" y="295" class="name">orders.js</text>
  <text x="818" y="315" class="detail">add(), get(), cancel()</text>
  <rect x="989" y="270" width="174" height="61" rx="10" class="panel"/>
  <text x="1004" y="295" class="name">ledger.js</text>
  <text x="1004" y="315" class="detail">chargeOrderToKhata()</text>

  <rect x="803" y="342" width="174" height="61" rx="10" class="panel"/>
  <text x="818" y="367" class="name">store.js</text>
  <text x="818" y="387" class="detail">read(), write(), audit</text>
  <rect x="989" y="342" width="174" height="61" rx="10" class="focus"/>
  <text x="1004" y="367" class="name">invoice.js</text>
  <text x="1004" y="387" class="detail">computeInvoiceFigures()</text>

  <rect x="803" y="414" width="174" height="61" rx="10" class="panel"/>
  <text x="818" y="439" class="name">reports.js</text>
  <text x="818" y="459" class="detail">GST reconciliation</text>
  <rect x="989" y="414" width="174" height="61" rx="10" class="panel"/>
  <text x="1004" y="439" class="name">dates.js</text>
  <text x="1004" y="459" class="detail">today(), date keys</text>

  <rect x="36" y="316" width="207" height="96" rx="12" class="panel"/>
  <text x="53" y="343" class="name">config.js</text>
  <text x="53" y="367" class="detail">Shop, HSN slabs, coupons,</text>
  <text x="53" y="386" class="detail">inventory settings</text>

  <rect x="283" y="316" width="207" height="96" rx="12" class="panel"/>
  <text x="300" y="343" class="name">data/db.json</text>
  <text x="300" y="367" class="detail">Products, orders, customers,</text>
  <text x="300" y="386" class="detail">settlements, audit log, IDs</text>

  <path d="M889 403 V509 H387 V414" class="edge"/>
  <text x="555" y="502" class="detail">store.read() / store.write()</text>
  <rect x="36" y="447" width="207" height="68" rx="10" fill="#fff" stroke="#d8e0ec"/>
  <rect x="50" y="461" width="18" height="18" rx="4" class="focus"/>
  <text x="77" y="475" class="detail">Ticket focus / direct tax dependency</text>
  <text x="50" y="499" class="detail">Other modules use neutral cards</text>

  <text x="36" y="551" class="note">Printable invoice: server.js → orders.get() → invoice.render(); figures are recalculated separately.</text>
  <line x1="36" y1="571" x2="1164" y2="571" stroke="#d8e0ec" stroke-width="1.5"/>
  <text x="36" y="599" class="section">ORDER PLACEMENT · NUMBERED FLOW</text>

  <g>
    <rect x="36" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="57" cy="642" r="13" fill="#1d4ed8"/><text x="53" y="647" class="step-number">1</text>
    <text x="77" y="647" class="flow-title">Browser UI</text>
    <text x="50" y="676" class="flow-detail">public/js/app.js sends</text>
    <text x="50" y="695" class="flow-detail">POST /api/orders with</text>
    <text x="50" y="714" class="flow-detail">items and payment data</text>
  </g>
  <g>
    <rect x="225" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="246" cy="642" r="13" fill="#1d4ed8"/><text x="242" y="647" class="step-number">2</text>
    <text x="266" y="647" class="flow-title">Order route</text>
    <text x="239" y="676" class="flow-detail">store.read(); resolve</text>
    <text x="239" y="695" class="flow-detail">products; inventory.check()</text>
    <text x="239" y="714" class="flow-detail">against sellable stock</text>
  </g>
  <g>
    <rect x="414" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="435" cy="642" r="13" fill="#1d4ed8"/><text x="431" y="647" class="step-number">3</text>
    <text x="455" y="647" class="flow-title">Price and tax</text>
    <text x="428" y="676" class="flow-detail">coupons.validate();</text>
    <text x="428" y="695" class="flow-detail">pricing.computeTotals();</text>
    <text x="428" y="714" class="flow-detail">tax.getRateForItem()</text>
  </g>
  <g>
    <rect x="603" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="624" cy="642" r="13" fill="#1d4ed8"/><text x="620" y="647" class="step-number">4</text>
    <text x="644" y="647" class="flow-title">Charge and deduct</text>
    <text x="617" y="676" class="flow-detail">Khata: ledger.</text>
    <text x="617" y="695" class="flow-detail">chargeOrderToKhata();</text>
    <text x="617" y="714" class="flow-detail">inventory.reserve()</text>
  </g>
  <g>
    <rect x="792" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="813" cy="642" r="13" fill="#1d4ed8"/><text x="809" y="647" class="step-number">5</text>
    <text x="833" y="647" class="flow-title">Save order</text>
    <text x="806" y="676" class="flow-detail">orders.add(): ID, items</text>
    <text x="806" y="695" class="flow-detail">coupon, subtotal, discount</text>
    <text x="806" y="714" class="flow-detail">tax, total</text>
  </g>
  <g>
    <rect x="981" y="620" width="181" height="119" rx="11" class="panel"/>
    <circle cx="1002" cy="642" r="13" fill="#1d4ed8"/><text x="998" y="647" class="step-number">6</text>
    <text x="1022" y="647" class="flow-title">Persist and reply</text>
    <text x="995" y="676" class="flow-detail">store.appendAudit();</text>
    <text x="995" y="695" class="flow-detail">store.write(db) rewrites</text>
    <text x="995" y="714" class="flow-detail">db.json; HTTP 201</text>
  </g>
  <path d="M217 681 H223 M406 681 H412 M595 681 H601 M784 681 H790 M973 681 H979" class="edge"/>
  <text x="36" y="773" class="detail">Order flow is sequential; the printable invoice is opened later through its own server.js route.</text>
</svg>
