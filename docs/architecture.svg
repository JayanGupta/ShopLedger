<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="description">Browser UI sends order requests through Express routes to pricing, inventory, ledger and order modules before the JSON store persists the order.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 15px Arial, sans-serif; }
      .head { fill: #0f172a; font: 700 16px Arial, sans-serif; }
      .text { fill: #334155; font: 14px Arial, sans-serif; }
      .small { fill: #475569; font: 12px Arial, sans-serif; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .route { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 10; }
      .ticket { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; rx: 10; }
      .store { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 10; }
      .flow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .number { fill: #0f172a; font: 700 13px Arial, sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="60" y="55">ShopLedger architecture</text>
  <text class="subtitle" x="60" y="82">Node/Express POS, Khata ledger and GST invoicing · highlighted modules are the active ticket scope</text>

  <rect class="box" x="60" y="130" width="210" height="130"/>
  <text class="head" x="82" y="162">Browser UI</text>
  <text class="text" x="82" y="190">public/index.html</text>
  <text class="text" x="82" y="213">public/js/app.js</text>
  <text class="text" x="82" y="236">public/css/style.css</text>

  <rect class="box" x="370" y="130" width="210" height="130"/>
  <text class="head" x="392" y="162">Express application</text>
  <text class="text" x="392" y="190">server.js</text>
  <text class="text" x="392" y="213">config.js</text>
  <text class="small" x="392" y="237">/api routes + invoice view</text>

  <rect class="route" x="680" y="105" width="190" height="66"/>
  <text class="head" x="702" y="135">routes/orders.js</text>
  <text class="small" x="702" y="157">orders + cancellation</text>
  <rect class="route" x="680" y="185" width="190" height="66"/>
  <text class="head" x="702" y="215">routes/customers.js</text>
  <text class="small" x="702" y="237">Khata settlements</text>
  <rect class="route" x="900" y="105" width="190" height="66"/>
  <text class="head" x="922" y="135">routes/products.js</text>
  <text class="small" x="922" y="157">catalogue + stock</text>
  <rect class="route" x="900" y="185" width="190" height="66"/>
  <text class="head" x="922" y="215">routes/reports.js</text>
  <text class="small" x="922" y="237">dashboard + GST audit</text>

  <rect class="ticket" x="70" y="375" width="190" height="82"/>
  <text class="head" x="92" y="406">lib/invoice.js</text>
  <text class="small" x="92" y="429">#1 invoice figures + HTML</text>
  <rect class="box" x="285" y="375" width="190" height="82"/>
  <text class="head" x="307" y="406">lib/pricing.js</text>
  <text class="small" x="307" y="429">checkout totals</text>
  <rect class="box" x="500" y="375" width="165" height="82"/>
  <text class="head" x="522" y="406">lib/tax.js</text>
  <text class="small" x="522" y="429">HSN GST slabs</text>
  <rect class="box" x="690" y="375" width="180" height="82"/>
  <text class="head" x="712" y="406">lib/coupons.js</text>
  <text class="small" x="712" y="429">discount + cap</text>
  <rect class="box" x="895" y="375" width="180" height="82"/>
  <text class="head" x="917" y="406">lib/inventory.js</text>
  <text class="small" x="917" y="429">stock reservations</text>

  <rect class="ticket" x="170" y="540" width="180" height="82"/>
  <text class="head" x="192" y="571">lib/dates.js</text>
  <text class="small" x="192" y="594">sortable date keys · #3</text>
  <rect class="ticket" x="390" y="540" width="190" height="82"/>
  <text class="head" x="412" y="571">lib/orders.js</text>
  <text class="small" x="412" y="594">list/filter logic · #3</text>
  <rect class="ticket" x="620" y="540" width="190" height="82"/>
  <text class="head" x="642" y="571">lib/ledger.js</text>
  <text class="small" x="642" y="594">settlements · #3</text>
  <rect class="store" x="850" y="540" width="220" height="82"/>
  <text class="head" x="872" y="571">lib/store.js</text>
  <text class="small" x="872" y="594">data/db.json persistence</text>

  <path class="flow" d="M270 195 H370"/><text class="number" x="315" y="184">1</text>
  <path class="flow" d="M580 185 H680"/><text class="number" x="627" y="174">2</text>
  <path class="flow" d="M775 251 V330 H380 V375"/><text class="number" x="755" y="300">3</text>
  <path class="flow" d="M475 416 H500"/><text class="number" x="482" y="406">4</text>
  <path class="flow" d="M665 416 H690"/><text class="number" x="672" y="406">5</text>
  <path class="flow" d="M775 251 V500 H485 V540"/><text class="number" x="758" y="490">6</text>
  <path class="flow" d="M580 581 H620"/><text class="number" x="595" y="571">7</text>
  <path class="flow" d="M810 581 H850"/><text class="number" x="825" y="571">8</text>

  <text class="head" x="60" y="685">Order placement flow</text>
  <text class="text" x="60" y="711">1 UI sends POST /api/orders → 2 orders route resolves products → 3 pricing applies coupon and HSN GST</text>
  <text class="text" x="60" y="735">4 inventory reserves stock → 5 Khata ledger debits credit orders → 6 orders module adds record → 7 store writes data/db.json</text>
  <rect x="880" y="666" width="20" height="20" fill="#fff7ed" stroke="#f97316" stroke-width="2" rx="4"/>
  <text class="small" x="910" y="681">Active ticket module</text>
  <rect x="880" y="699" width="20" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <text class="small" x="910" y="714">Supporting module</text>
</svg>
