<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement flow</title>
<desc id="desc">Browser UI connects to the Express server and routers. Routers call business modules, which read and write config and JSON data. Numbered arrows trace order placement. Invoice module is highlighted.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52647a"/></marker>
  <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1769aa"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172435;font-size:14px}
    .title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#506176}
    .box{fill:#f4f7fb;stroke:#8797aa;stroke-width:1.5;rx:9}
    .head{font-size:16px;font-weight:700}.small{font-size:12px;fill:#52647a}
    .flow{fill:#eaf4ff;stroke:#1769aa;stroke-width:2;rx:9}
    .ticket{fill:#fff2cc;stroke:#cf8c00;stroke-width:2.5;rx:9}
    .line{fill:none;stroke:#52647a;stroke-width:1.7;marker-end:url(#arrow)}
    .flowline{fill:none;stroke:#1769aa;stroke-width:2.4;marker-end:url(#flowArrow)}
    .dashed{stroke-dasharray:6 5}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="32" y="42" class="title">ShopLedger — architecture &amp; order placement</text>
<text x="32" y="66" class="subtitle">Node / Express POS · modules and calls verified against repository source</text>

<!-- Main application architecture -->
<rect x="28" y="92" width="1144" height="285" rx="14" fill="#fbfcfe" stroke="#c7d1dd"/>
<text x="48" y="119" class="head">Application structure</text>
<rect x="48" y="143" width="176" height="106" class="box"/>
<text x="64" y="169" class="head">Browser UI</text><text x="64" y="192">public/</text><text x="64" y="215" class="small">index.html · css/ · js/app.js</text>
<rect x="282" y="143" width="174" height="106" class="box"/>
<text x="298" y="169" class="head">server.js</text><text x="298" y="192">Express app</text><text x="298" y="215" class="small">static files · invoice route</text>
<path d="M224 195 L282 195" class="line"/><text x="229" y="185" class="small">HTTP</text>
<rect x="508" y="137" width="198" height="224" class="box"/>
<text x="524" y="162" class="head">routes/</text>
<text x="524" y="188">products.js</text><text x="524" y="212">orders.js</text><text x="524" y="236">customers.js</text><text x="524" y="260">reports.js</text>
<text x="524" y="292" class="small">API endpoints</text><text x="524" y="313" class="small">mounted at /api</text>
<path d="M456 195 L508 195" class="line"/><text x="459" y="184" class="small">/api</text>
<rect x="768" y="137" width="222" height="224" class="box"/>
<text x="784" y="162" class="head">lib/ modules</text>
<text x="784" y="187">orders.js · pricing.js</text><text x="784" y="208">coupons.js · tax.js</text><text x="784" y="229">inventory.js · ledger.js</text><text x="784" y="250">store.js · reports.js</text><text x="784" y="271">dates.js</text>
<rect x="784" y="291" width="190" height="49" class="ticket"/>
<text x="798" y="312" class="head">invoice.js</text><text x="798" y="330" class="small">ticket focus · render / figures</text>
<path d="M706 196 L768 196" class="line"/><text x="711" y="185" class="small">calls</text>
<path d="M706 239 C735 239 737 313 784 313" class="line dashed"/><text x="715" y="278" class="small">server.js invoice route</text>
<rect x="1034" y="143" width="116" height="82" class="box"/>
<text x="1050" y="170" class="head">config.js</text><text x="1050" y="195" class="small">shop · GST · coupons</text>
<rect x="1034" y="263" width="116" height="82" class="box"/>
<text x="1048" y="290" class="head">data/</text><text x="1048" y="313">db.json</text><text x="1048" y="333" class="small">JSON store</text>
<path d="M990 177 L1034 177" class="line"/><path d="M990 321 L1034 305" class="line"/>
<path d="M456 229 C650 377 915 382 1034 324" class="line dashed"/><text x="903" y="369" class="small">store.read() / store.write()</text>

<!-- Numbered checkout flow -->
<text x="32" y="419" class="head">Order placement flow</text>
<text x="32" y="441" class="small">Solid blue arrows show the sequence in routes/orders.js; module calls are named at each step.</text>
<rect x="38" y="469" width="170" height="112" class="flow"/>
<circle cx="58" cy="489" r="13" fill="#1769aa"/><text x="54" y="494" fill="#fff" style="fill:#fff;font-weight:700">1</text>
<text x="80" y="494" class="head">POST order</text><text x="54" y="519">public/js/app.js</text><text x="54" y="541">→ /api/orders</text><text x="54" y="563" class="small">cart + payment details</text>
<rect x="250" y="469" width="180" height="112" class="flow"/>
<circle cx="270" cy="489" r="13" fill="#1769aa"/><text x="266" y="494" style="fill:#fff;font-weight:700">2</text>
<text x="292" y="494" class="head">Resolve &amp; check</text><text x="266" y="519">store.read()</text><text x="266" y="541">inventory.find(), check()</text><text x="266" y="563" class="small">product snapshots · stock</text>
<rect x="472" y="469" width="180" height="112" class="flow"/>
<circle cx="492" cy="489" r="13" fill="#1769aa"/><text x="488" y="494" style="fill:#fff;font-weight:700">3</text>
<text x="514" y="494" class="head">Compute totals</text><text x="488" y="519">pricing.subtotal()</text><text x="488" y="541">coupons.validate()</text><text x="488" y="563" class="small">pricing.computeTotals()</text>
<rect x="694" y="469" width="180" height="112" class="flow"/>
<circle cx="714" cy="489" r="13" fill="#1769aa"/><text x="710" y="494" style="fill:#fff;font-weight:700">4</text>
<text x="736" y="494" class="head">Commit changes</text><text x="710" y="519">ledger charge (Khata)</text><text x="710" y="541">inventory.reserve()</text><text x="710" y="563" class="small">orders.add() · audit</text>
<rect x="916" y="469" width="238" height="112" class="flow"/>
<circle cx="936" cy="489" r="13" fill="#1769aa"/><text x="932" y="494" style="fill:#fff;font-weight:700">5</text>
<text x="958" y="494" class="head">Save &amp; respond</text><text x="932" y="519">store.write(db) → data/db.json</text><text x="932" y="541">HTTP 201 + order JSON</text><text x="932" y="563" class="small">UI offers printable invoice</text>
<path d="M208 525 L250 525" class="flowline"/><path d="M430 525 L472 525" class="flowline"/><path d="M652 525 L694 525" class="flowline"/><path d="M874 525 L916 525" class="flowline"/>
<rect x="250" y="626" width="290" height="92" class="ticket"/>
<circle cx="272" cy="648" r="13" fill="#cf8c00"/><text x="268" y="653" style="fill:#fff;font-weight:700">6</text>
<text x="295" y="652" class="head">Printable invoice</text><text x="268" y="678">GET /orders/:id/invoice</text><text x="268" y="700" class="small">server.js → orders.get() → invoice.render()</text>
<path d="M1033 581 C1033 647 674 673 540 673" class="flowline"/>
<rect x="728" y="626" width="426" height="92" rx="10" fill="#f7f9fc" stroke="#bdc8d5"/>
<text x="748" y="652" class="head">Legend</text>
<rect x="748" y="667" width="20" height="16" class="box"/><text x="777" y="681">app component / module</text>
<rect x="948" y="667" width="20" height="16" class="ticket"/><text x="977" y="681">ticket focus</text>
<path d="M748 700 L780 700" class="flowline"/><text x="790" y="705">numbered order flow</text>
<text x="32" y="770" class="small">Invoice uses lib/invoice.js; lib/tax.js is used by pricing.js, but invoice.js does not import it.</text>
</svg>
