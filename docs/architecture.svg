<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server and routers, library modules, configuration and JSON data store, with numbered order placement flow and highlighted inventory and order cancellation logic.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526176; }
      .section { font-size: 16px; font-weight: 700; }
      .node { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; fill: #526176; }
      .flow { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 1.2; }
      .ticket { fill: #fff1d6; stroke: #d97706; stroke-width: 1.8; }
      .connector { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .flowline { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#flowArrow); }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="42" class="title">ShopLedger · Application Architecture</text>
  <text x="30" y="67" class="subtitle">Express application, JSON file storage, and order placement flow</text>

  <!-- Browser/UI -->
  <rect x="30" y="100" width="235" height="650" rx="12" class="panel"/>
  <text x="48" y="130" class="section">Browser UI · public/</text>
  <rect x="48" y="150" width="199" height="47" rx="7" class="box"/>
  <text x="63" y="170" class="node">index.html</text><text x="63" y="187" class="small">POS · Order History · Khata</text>
  <rect x="48" y="207" width="199" height="42" rx="7" class="box"/>
  <text x="63" y="233" class="node">css/style.css</text>
  <rect x="48" y="259" width="199" height="55" rx="7" class="box"/>
  <text x="63" y="280" class="node">js/app.js</text><text x="63" y="300" class="small">get(), post(), POS and orders UI</text>
  <path d="M247 287 H285 V445 H330" class="flowline"/>
  <text x="272" y="350" class="flow">1 · POST /api/orders</text>
  <text x="48" y="355" class="small">Static files served by Express</text>
  <path d="M48 378 H247" stroke="#cbd5e1"/>
  <text x="48" y="405" class="small">UI calls API with JSON request.</text>
  <text x="48" y="425" class="small">Order History calls GET /api/orders.</text>
  <text x="48" y="445" class="small">Cancel calls POST /api/orders/:id/cancel.</text>

  <!-- Server and routers -->
  <rect x="300" y="100" width="310" height="650" rx="12" class="panel"/>
  <text x="318" y="130" class="section">HTTP application</text>
  <rect x="330" y="150" width="250" height="50" rx="7" class="box"/>
  <text x="350" y="172" class="node">server.js</text><text x="350" y="190" class="small">bodyParser · express.static · mounts routers</text>
  <path d="M455 200 V223" class="connector"/>
  <text x="318" y="244" class="section">routes/ · mounted at /api</text>
  <rect x="330" y="258" width="250" height="49" rx="7" class="box"/>
  <text x="347" y="279" class="node">orders.js</text><text x="347" y="297" class="small">POST /orders · GET /orders · cancel</text>
  <rect x="330" y="317" width="250" height="42" rx="7" class="box"/>
  <text x="347" y="343" class="node">products.js</text>
  <rect x="330" y="369" width="250" height="42" rx="7" class="box"/>
  <text x="347" y="395" class="node">customers.js</text>
  <rect x="330" y="421" width="250" height="42" rx="7" class="box"/>
  <text x="347" y="447" class="node">reports.js</text>
  <path d="M455 200 V258" class="flowline"/>
  <text x="464" y="233" class="flow">2 · route</text>
  <path d="M580 282 H635 V489 H667" class="flowline"/>
  <text x="587" y="334" class="flow">3 · validate</text>
  <text x="587" y="351" class="flow">4 · price</text>
  <text x="587" y="368" class="flow">5 · commit</text>

  <!-- Lib modules -->
  <rect x="635" y="100" width="300" height="650" rx="12" class="panel"/>
  <text x="653" y="130" class="section">lib/ · application logic</text>
  <rect x="667" y="150" width="236" height="48" rx="7" class="box"/>
  <text x="682" y="170" class="node">pricing.js</text><text x="682" y="188" class="small">subtotal · computeTotals</text>
  <rect x="667" y="207" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="233" class="node">coupons.js</text>
  <rect x="667" y="258" width="236" height="50" rx="7" class="ticket"/>
  <text x="682" y="279" class="node">inventory.js</text><text x="682" y="298" class="small">check · reserve · release</text>
  <rect x="667" y="317" width="236" height="50" rx="7" class="ticket"/>
  <text x="682" y="338" class="node">orders.js</text><text x="682" y="357" class="small">cancel only highlighted</text>
  <rect x="667" y="376" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="402" class="node">ledger.js</text>
  <rect x="667" y="428" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="454" class="node">tax.js</text>
  <rect x="667" y="480" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="506" class="node">store.js</text>
  <rect x="667" y="532" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="558" class="node">dates.js</text>
  <rect x="667" y="584" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="610" class="node">reports.js</text>
  <rect x="667" y="636" width="236" height="42" rx="7" class="box"/>
  <text x="682" y="662" class="node">invoice.js</text>
  <path d="M785 249 V258" class="connector"/>
  <path d="M785 308 V317" class="connector"/>
  <path d="M785 367 V376" class="connector"/>
  <path d="M785 470 V480" class="connector"/>
  <path d="M903 501 H953" class="connector"/>
  <text x="848" y="491" class="small">read/write</text>

  <!-- Config and persistence -->
  <rect x="965" y="100" width="205" height="280" rx="12" class="panel"/>
  <text x="983" y="130" class="section">Runtime &amp; data</text>
  <rect x="985" y="153" width="165" height="58" rx="7" class="box"/>
  <text x="1000" y="178" class="node">config.js</text><text x="1000" y="198" class="small">port · shop · tax · inventory</text>
  <path d="M580 175 H620 V125 H965" class="connector"/>
  <text x="777" y="119" class="small">server settings</text>
  <rect x="985" y="239" width="165" height="66" rx="7" class="box"/>
  <text x="1000" y="264" class="node">data/db.json</text><text x="1000" y="284" class="small">products · orders · customers</text>
  <text x="1000" y="300" class="small">settlements · auditLog</text>
  <path d="M903 501 H945 V272 H985" class="connector"/>
  <text x="966" y="348" class="small">file-backed JSON</text>
  <rect x="965" y="405" width="205" height="345" rx="12" class="panel"/>
  <text x="983" y="435" class="section">Order placement</text>
  <text x="983" y="466" class="small">2 · routes/orders.js builds items</text>
  <text x="983" y="492" class="small">3 · inventory.check(stock)</text>
  <text x="983" y="518" class="small">4 · pricing.computeTotals(items)</text>
  <text x="983" y="544" class="small">5 · inventory.reserve(items)</text>
  <text x="983" y="570" class="small">   orders.add(db, orderData)</text>
  <text x="983" y="596" class="small">6 · store.appendAudit + store.write</text>
  <path d="M903 282 H945 V459 H983" class="flowline"/>
  <path d="M903 283 H932 V519 H983" class="flowline"/>
  <path d="M903 282 H920 V545 H983" class="flowline"/>
  <path d="M903 341 H910 V571 H983" class="flowline"/>
  <path d="M903 501 H924 V597 H983" class="flowline"/>
  <text x="983" y="635" class="small">Cancellation path:</text>
  <text x="983" y="655" class="small">POST /orders/:id/cancel →</text>
  <text x="983" y="675" class="small">orders.cancel → inventory.release</text>
  <text x="983" y="695" class="small">→ store.write</text>

  <!-- Legend -->
  <rect x="30" y="706" width="570" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="48" y="720" width="19" height="16" rx="3" class="ticket"/>
  <text x="77" y="733" class="small">Ticket focus: lib/inventory.js and lib/orders.js cancellation flow</text>
  <line x1="470" y1="728" x2="510" y2="728" stroke="#2563eb" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text x="518" y="733" class="small">numbered order flow</text>
</svg>
