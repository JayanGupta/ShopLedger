<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">The browser calls Express, which mounts four API routers. The application uses ten library modules, a configuration file and a JSON data store. Six numbered steps trace a successful order. The highlighted invoice module runs separately when an invoice is opened and when reports calculate GST reconciliation.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #162940; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #465b73; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; fill: #465b73; }
      .small { font-size: 13px; fill: #465b73; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .panel { fill: #ffffff; stroke: #ccd7e5; }
      .node { fill: #f7f9fc; stroke: #c9d5e5; }
      .entry { fill: #eaf2fc; stroke: #a8bfdc; }
      .ticket { fill: #f2eafa; stroke: #7448b2; stroke-width: 1.8; }
      .ticket-text { fill: #57338a; }
      .divider { stroke: #dce5ef; }
      .wire { fill: none; stroke: #657f9d; stroke-width: 1.5; }
      .timeline { fill: none; stroke: #abc4e7; stroke-width: 2; }
      .dot { fill: #235898; }
      .number { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .step-title { font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 4 L0 8 Z" fill="#657f9d"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#f0f4f9"/>
  <text x="32" y="50" class="title">ShopLedger architecture</text>
  <text x="33" y="76" class="subtitle">Point of sale, Khata credit and GST invoicing</text>

  <g role="group" aria-label="Legend">
    <rect x="876" y="43" width="17" height="17" rx="4" class="ticket"/>
    <text x="902" y="57" class="body">Ticket module</text>
    <path d="M1024 52 H1044" class="timeline"/>
    <circle cx="1034" cy="52" r="8" class="dot"/>
    <text x="1054" y="57" class="body">Order steps</text>
  </g>

  <g role="group" aria-label="Application map">
    <rect x="30" y="103" width="735" height="667" rx="15" class="panel"/>
    <text x="52" y="139" class="heading">Application map</text>
    <path d="M52 152 H743" class="divider"/>

    <g transform="translate(52 169)">
      <rect width="319" height="62" rx="8" class="entry"/>
      <text x="14" y="25" class="label mono">public/</text>
      <text x="14" y="46" class="body">Browser UI · index.html and js/app.js</text>
    </g>
    <path d="M371 200 H413" class="wire" marker-end="url(#arrow)"/>
    <g transform="translate(413 169)">
      <rect width="331" height="62" rx="8" class="entry"/>
      <text x="14" y="25" class="label mono">server.js</text>
      <text x="14" y="46" class="body">Express · static files, API and invoice route</text>
    </g>

    <text x="52" y="254" class="label mono">routes/</text>
    <text x="127" y="254" class="small">Mounted under /api</text>
    <path d="M579 231 V266 M135 266 H663" class="wire"/>
    <path d="M135 266 V278" class="wire" marker-end="url(#arrow)"/>
    <path d="M311 266 V278" class="wire" marker-end="url(#arrow)"/>
    <path d="M487 266 V278" class="wire" marker-end="url(#arrow)"/>
    <path d="M663 266 V278" class="wire" marker-end="url(#arrow)"/>
    <g transform="translate(52 278)">
      <rect width="166" height="58" rx="7" class="node"/>
      <text x="12" y="24" class="label mono">products.js</text>
      <text x="12" y="44" class="small">Catalog and coupons</text>
    </g>
    <g transform="translate(228 278)">
      <rect width="166" height="58" rx="7" class="node"/>
      <text x="12" y="24" class="label mono">orders.js</text>
      <text x="12" y="44" class="small">Place, list and cancel</text>
    </g>
    <g transform="translate(404 278)">
      <rect width="166" height="58" rx="7" class="node"/>
      <text x="12" y="24" class="label mono">customers.js</text>
      <text x="12" y="44" class="small">Khata and settlements</text>
    </g>
    <g transform="translate(580 278)">
      <rect width="164" height="58" rx="7" class="node"/>
      <text x="12" y="24" class="label mono">reports.js</text>
      <text x="12" y="44" class="small">Preview and reports</text>
    </g>

    <text x="52" y="365" class="label mono">lib/</text>
    <text x="104" y="365" class="small">Business logic and persistence</text>

    <path d="M503 406 H534" class="wire" marker-end="url(#arrow)"/>
    <path d="M398 431 V443" class="wire" marker-end="url(#arrow)"/>
    <path d="M639 553 V565" class="wire" marker-end="url(#arrow)"/>
    <path d="M503 596 H534" class="wire" marker-end="url(#arrow)"/>
    <g transform="translate(52 381)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/inventory.js</text>
      <text x="12" y="39" class="small">find(), check(), reserve()</text>
    </g>
    <g transform="translate(293 381)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/pricing.js</text>
      <text x="12" y="39" class="small">computeTotals()</text>
    </g>
    <g transform="translate(534 381)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/coupons.js</text>
      <text x="12" y="39" class="small">validate(), calculateDiscount()</text>
    </g>
    <g transform="translate(52 443)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/ledger.js</text>
      <text x="12" y="39" class="small">chargeOrderToKhata()</text>
    </g>
    <g transform="translate(293 443)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/tax.js</text>
      <text x="12" y="39" class="small">getRateForItem()</text>
    </g>
    <g transform="translate(534 443)">
      <rect width="210" height="50" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/dates.js</text>
      <text x="12" y="39" class="small">today() and date filtering</text>
    </g>
    <g transform="translate(52 505)">
      <rect width="210" height="48" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/orders.js</text>
      <text x="12" y="39" class="small">add(), get(), cancel()</text>
    </g>
    <g transform="translate(293 505)">
      <rect width="210" height="48" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/store.js</text>
      <text x="12" y="39" class="small">JSON reads, writes and audit</text>
    </g>
    <g transform="translate(534 505)">
      <rect width="210" height="48" rx="7" class="node"/>
      <text x="12" y="21" class="label mono">lib/reports.js</text>
      <text x="12" y="39" class="small">getGstReconciliation()</text>
    </g>
    <g transform="translate(52 565)">
      <rect width="451" height="62" rx="7" class="node"/>
      <text x="12" y="25" class="label mono">GET /orders/:id/invoice</text>
      <text x="12" y="46" class="body">server.js loads the saved order with orders.get()</text>
    </g>
    <g transform="translate(534 565)">
      <rect width="210" height="62" rx="7" class="ticket"/>
      <text x="12" y="21" class="label mono ticket-text">lib/invoice.js</text>
      <text x="12" y="39" class="small ticket-text">render()</text>
      <text x="12" y="55" class="small ticket-text">computeInvoiceFigures()</text>
    </g>

    <text x="52" y="653" class="label">Settings and data</text>
    <g transform="translate(52 666)">
      <rect width="336" height="71" rx="8" class="node"/>
      <text x="13" y="24" class="label mono">config.js</text>
      <text x="13" y="44" class="small">Shop details, GST slabs, coupon definitions</text>
      <text x="13" y="61" class="small">Read by tax, coupons and invoice modules</text>
    </g>
    <g transform="translate(408 666)">
      <rect width="336" height="71" rx="8" class="node"/>
      <text x="13" y="24" class="label mono">data/db.json</text>
      <text x="13" y="44" class="small">Products, orders, customers, settlements and audit</text>
      <text x="13" y="61" class="small">Read and rewritten by lib/store.js</text>
    </g>
  </g>

  <g role="group" aria-label="Six steps for placing an order">
    <rect x="786" y="103" width="384" height="667" rx="15" class="panel"/>
    <text x="808" y="139" class="heading">Place an order</text>
    <text x="809" y="163" class="small">Successful POST /api/orders</text>
    <path d="M819 204 V634" class="timeline"/>

    <circle cx="819" cy="204" r="14" class="dot"/>
    <text x="819" y="209" class="number">1</text>
    <text x="845" y="208" class="step-title">Submit the cart</text>
    <text x="845" y="230" class="small mono">getSelectedCartItems()</text>
    <text x="845" y="249" class="small">Browser → server.js → routes/orders.js</text>
    <path d="M845 266 H1146" class="divider"/>

    <circle cx="819" cy="290" r="14" class="dot"/>
    <text x="819" y="295" class="number">2</text>
    <text x="845" y="294" class="step-title">Read and check available stock</text>
    <text x="845" y="316" class="small mono">store.read() → data/db.json</text>
    <text x="845" y="335" class="small mono">inventory.find(), inventory.check()</text>
    <path d="M845 352 H1146" class="divider"/>

    <circle cx="819" cy="376" r="14" class="dot"/>
    <text x="819" y="381" class="number">3</text>
    <text x="845" y="380" class="step-title">Apply coupon, then calculate GST</text>
    <text x="845" y="402" class="small mono">coupons.validate()</text>
    <text x="845" y="421" class="small mono">pricing.computeTotals()</text>
    <path d="M845 438 H1146" class="divider"/>

    <circle cx="819" cy="462" r="14" class="dot"/>
    <text x="819" y="467" class="number">4</text>
    <text x="845" y="466" class="step-title">Charge Khata if selected</text>
    <text x="845" y="488" class="small mono">ledger.chargeOrderToKhata()</text>
    <text x="845" y="507" class="small">Checks credit and updates the customer balance.</text>
    <path d="M845 524 H1146" class="divider"/>

    <circle cx="819" cy="548" r="14" class="dot"/>
    <text x="819" y="553" class="number">5</text>
    <text x="845" y="552" class="step-title">Deduct stock and record the sale</text>
    <text x="845" y="574" class="small mono">inventory.reserve(), orders.add()</text>
    <text x="845" y="593" class="small">Records line items, coupon and totals.</text>
    <path d="M845 610 H1146" class="divider"/>

    <circle cx="819" cy="634" r="14" class="dot"/>
    <text x="819" y="639" class="number">6</text>
    <text x="845" y="638" class="step-title">Save and return the order</text>
    <text x="845" y="660" class="small mono">store.appendAudit(), store.write()</text>
    <text x="845" y="679" class="small">Writes data/db.json, then returns HTTP 201.</text>

    <rect x="807" y="704" width="342" height="33" rx="6" fill="#eaf2fc"/>
    <text x="820" y="725" class="small">The printable invoice opens separately from checkout.</text>
  </g>
</svg>
