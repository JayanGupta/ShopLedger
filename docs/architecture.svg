<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and Ticket 1 invoice flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express server, routers, library modules, configuration, JSON database, and numbered order and invoice flows.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8bb8a8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#47d6a1"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #e7f2ee; }
      .title { font-size: 27px; font-weight: 700; }
      .sub { font-size: 14px; fill: #a9c2b9; }
      .head { font-size: 17px; font-weight: 700; fill: #baf3df; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #bbcec7; }
      .box { fill: #102720; stroke: #355c4e; stroke-width: 1.5; rx: 12; }
      .ticket { fill: #173a30; stroke: #47d6a1; stroke-width: 2.5; rx: 10; }
      .flow { fill: none; stroke: #8bb8a8; stroke-width: 2; marker-end: url(#arrow); }
      .ticketFlow { fill: none; stroke: #47d6a1; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .dash { stroke-dasharray: 6 5; }
      .num { fill: #47d6a1; }
      .numText { font-size: 13px; font-weight: 700; fill: #062117; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#091a15"/>
  <text x="40" y="44" class="title">ShopLedger | runtime and billing architecture</text>
  <text x="40" y="70" class="sub">Source map verified against the current main tree. Ticket 1 scope is highlighted.</text>
  <rect x="842" y="28" width="318" height="38" rx="19" fill="#173a30" stroke="#47d6a1" stroke-width="1.5"/>
  <text x="1001" y="52" text-anchor="middle" class="small" fill="#baf3df">TICKET 1: lib/invoice.js</text>

  <rect x="40" y="108" width="190" height="190" class="box"/>
  <text x="58" y="137" class="head">Browser UI</text>
  <text x="58" y="164" class="label">public/index.html</text>
  <text x="58" y="188" class="label">public/js/app.js</text>
  <text x="58" y="212" class="label">public/css/style.css</text>
  <text x="58" y="253" class="small">POS sends POST /api/orders</text>
  <text x="58" y="274" class="small">Invoice link opens HTML view</text>

  <rect x="270" y="108" width="160" height="190" class="box"/>
  <text x="288" y="137" class="head">Express app</text>
  <text x="288" y="164" class="label">server.js</text>
  <text x="288" y="190" class="small">Serves public/</text>
  <text x="288" y="211" class="small">Mounts routers</text>
  <text x="288" y="245" class="small">GET invoice route</text>
  <text x="288" y="266" class="small">returns rendered HTML</text>

  <rect x="470" y="108" width="230" height="250" class="box"/>
  <text x="488" y="137" class="head">routes/</text>
  <text x="488" y="165" class="label">orders.js</text>
  <text x="488" y="188" class="label">products.js</text>
  <text x="488" y="211" class="label">customers.js</text>
  <text x="488" y="234" class="label">reports.js</text>
  <line x1="488" y1="249" x2="680" y2="249" stroke="#355c4e"/>
  <text x="488" y="273" class="small">Orders route validates and</text>
  <text x="488" y="292" class="small">coordinates checkout modules.</text>
  <text x="488" y="332" class="small">POST /api/orders</text>

  <rect x="740" y="108" width="235" height="390" class="box"/>
  <text x="758" y="137" class="head">lib/ modules</text>
  <text x="758" y="164" class="label">pricing.js</text>
  <text x="758" y="187" class="label">coupons.js</text>
  <text x="758" y="210" class="label">tax.js</text>
  <text x="758" y="233" class="label">inventory.js</text>
  <text x="758" y="256" class="label">ledger.js</text>
  <text x="758" y="279" class="label">orders.js</text>
  <text x="758" y="302" class="label">store.js</text>
  <text x="758" y="325" class="label">dates.js</text>
  <text x="758" y="348" class="label">reports.js</text>
  <rect x="752" y="364" width="211" height="40" class="ticket"/>
  <text x="765" y="389" class="label" fill="#d4ffed">invoice.js | Ticket 1</text>
  <text x="758" y="430" class="small">Checkout math: pricing.js</text>
  <text x="758" y="449" class="small">Invoice rendering: invoice.js</text>
  <text x="758" y="472" class="small">Both use config / order data</text>

  <rect x="1000" y="108" width="160" height="140" class="box"/>
  <text x="1018" y="137" class="head">Configuration</text>
  <text x="1018" y="166" class="label">config.js</text>
  <text x="1018" y="192" class="small">GST slabs</text>
  <text x="1018" y="212" class="small">Coupons and caps</text>
  <text x="1018" y="232" class="small">Port and shop settings</text>

  <rect x="1000" y="274" width="160" height="155" class="box"/>
  <text x="1018" y="303" class="head">JSON store</text>
  <text x="1018" y="332" class="label">data/db.json</text>
  <text x="1018" y="359" class="small">Products, customers,</text>
  <text x="1018" y="379" class="small">orders, settlements,</text>
  <text x="1018" y="399" class="small">audit log</text>

  <path d="M230 176 H260" class="flow"/>
  <circle cx="244" cy="158" r="12" class="num"/><text x="244" y="158" class="numText">1</text>
  <path d="M430 176 H460" class="flow"/>
  <circle cx="444" cy="158" r="12" class="num"/><text x="444" y="158" class="numText">2</text>
  <path d="M700 204 H730" class="ticketFlow"/>
  <circle cx="714" cy="186" r="12" class="num"/><text x="714" y="186" class="numText">3</text>
  <path d="M975 326 H990" class="flow"/>
  <circle cx="982" cy="306" r="12" class="num"/><text x="982" y="306" class="numText">4</text>
  <path d="M1080 248 V264" class="flow dash"/>
  <path d="M700 335 C720 335 720 384 742 384" class="ticketFlow"/>
  <circle cx="719" cy="358" r="12" class="num"/><text x="719" y="358" class="numText">5</text>

  <rect x="40" y="535" width="545" height="210" class="box"/>
  <text x="60" y="568" class="head">Order flow | checkout (numbered)</text>
  <text x="60" y="599" class="label"><tspan fill="#47d6a1" font-weight="700">1</tspan><tspan> Browser submits items and coupon.</tspan></text>
  <text x="60" y="626" class="label"><tspan fill="#47d6a1" font-weight="700">2</tspan><tspan> server.js sends request to routes/orders.js.</tspan></text>
  <text x="60" y="653" class="label"><tspan fill="#47d6a1" font-weight="700">3</tspan><tspan> Route checks product and stock, then calls pricing,</tspan></text>
  <text x="82" y="675" class="label">coupons, tax, and (for Khata) ledger.</text>
  <text x="60" y="704" class="label"><tspan fill="#47d6a1" font-weight="700">4</tspan><tspan> orders.add builds the order; inventory reserves stock.</tspan></text>
  <text x="60" y="731" class="label"><tspan fill="#47d6a1" font-weight="700">5</tspan><tspan> store.appendAudit and store.write persist to db.json.</tspan></text>

  <rect x="615" y="535" width="545" height="210" class="ticket"/>
  <text x="635" y="568" class="head">Invoice flow | Ticket 1</text>
  <text x="635" y="600" class="label">GET /orders/:id/invoice → server.js reads the order</text>
  <text x="635" y="628" class="label">store.read → orders.get → invoice.computeInvoiceFigures</text>
  <text x="635" y="656" class="label">→ invoice.render builds printable HTML for the browser.</text>
  <text x="635" y="696" class="small">Ticket scope: lib/invoice.js (highlighted). lib/tax.js is</text>
  <text x="635" y="716" class="small">shown as a dependency; no change is assumed yet.</text>

  <rect x="40" y="762" width="18" height="18" rx="4" fill="#173a30" stroke="#355c4e"/>
  <text x="67" y="776" class="small">Existing module</text>
  <rect x="205" y="762" width="18" height="18" rx="4" fill="#173a30" stroke="#47d6a1" stroke-width="2"/>
  <text x="232" y="776" class="small">Ticket 1 module</text>
  <line x1="380" y1="771" x2="420" y2="771" class="flow"/>
  <text x="430" y="776" class="small">Order / data flow</text>
</svg>
