<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">Browser, Express routers, library modules and JSON storage, with six steps for placing an order. The printable invoice module is highlighted.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172c40; font-size: 13px; }
    .heading { font-size: 32px; font-weight: 700; }
    .section { font-size: 18px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .detail { fill: #43596b; }
    .code { font-family: monospace; font-size: 13px; }
    .card { fill: #fff; stroke: #b9cad6; }
    .ticket { fill: #f3eaff; stroke: #8953b8; }
    .connector { fill: none; stroke: #526f86; stroke-width: 1.6; }
    .number { fill: #fff; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#526f86"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f8fb"/>
  <text x="35" y="57" class="heading">ShopLedger architecture</text>
  <rect x="966" y="38" width="18" height="18" rx="4" class="ticket"/>
  <text x="994" y="52">Ticket module</text>

  <text x="35" y="107" class="section">Browser and API</text>
  <rect x="35" y="124" width="294" height="70" rx="10" class="card"/>
  <text x="50" y="151" class="label">public/</text>
  <text x="50" y="175" class="detail">Checkout, order register, Khata and reports</text>
  <path d="M329 159H405" class="connector" marker-end="url(#arrow)"/>
  <text x="349" y="149" class="detail">HTTP</text>
  <rect x="405" y="124" width="314" height="70" rx="10" class="card"/>
  <text x="420" y="151" class="label">server.js</text>
  <text x="420" y="175" class="detail">Express, static files and printable invoice</text>
  <path d="M562 194V225" class="connector" marker-end="url(#arrow)"/>
  <text x="573" y="215" class="code">/api</text>

  <rect x="35" y="225" width="684" height="148" rx="12" fill="#e9f1f7" stroke="#b9cad6"/>
  <text x="50" y="252" class="label">routes/products.js</text>
  <text x="50" y="273" class="detail">Catalog and coupons</text>
  <text x="380" y="252" class="label">routes/orders.js</text>
  <text x="380" y="273" class="detail">Order creation and cancellation</text>
  <text x="50" y="316" class="label">routes/customers.js</text>
  <text x="50" y="337" class="detail">Customer accounts and settlements</text>
  <text x="380" y="316" class="label">routes/reports.js</text>
  <text x="380" y="337" class="detail">Reports, pricing preview and export</text>
  <path d="M377 373V404" class="connector" marker-end="url(#arrow)"/>
  <text x="388" y="394" class="detail">Calls library modules</text>

  <text x="35" y="425" class="section">Libraries, configuration and storage</text>
  <rect x="35" y="442" width="222" height="59" rx="8" class="card"/>
  <text x="47" y="465" class="label">lib/orders.js</text>
  <text x="47" y="486" class="detail">Order records and cancellation</text>
  <rect x="266" y="442" width="222" height="59" rx="8" class="card"/>
  <text x="278" y="465" class="label">lib/inventory.js</text>
  <text x="278" y="486" class="detail">Stock checks and deductions</text>
  <rect x="497" y="442" width="222" height="59" rx="8" class="card"/>
  <text x="509" y="465" class="label">lib/ledger.js</text>
  <text x="509" y="486" class="detail">Khata charges and settlements</text>
  <rect x="35" y="511" width="222" height="59" rx="8" class="card"/>
  <text x="47" y="534" class="label">lib/pricing.js</text>
  <text x="47" y="555" class="detail">Checkout totals via coupons and tax</text>
  <rect x="266" y="511" width="222" height="59" rx="8" class="card"/>
  <text x="278" y="534" class="label">lib/coupons.js</text>
  <text x="278" y="555" class="detail">Coupon rules from config.js</text>
  <rect x="497" y="511" width="222" height="59" rx="8" class="card"/>
  <text x="509" y="534" class="label">lib/tax.js</text>
  <text x="509" y="555" class="detail">GST slabs from config.js</text>
  <rect x="35" y="580" width="222" height="59" rx="8" class="card"/>
  <text x="47" y="603" class="label">lib/reports.js</text>
  <text x="47" y="624" class="detail">Dashboard and GST reconciliation</text>
  <rect x="266" y="580" width="222" height="59" rx="8" class="ticket"/>
  <text x="278" y="603" class="label">lib/invoice.js</text>
  <text x="278" y="624" class="detail">Printable totals from order and config</text>
  <rect x="497" y="580" width="222" height="59" rx="8" class="card"/>
  <text x="509" y="603" class="label">lib/dates.js</text>
  <text x="509" y="624" class="detail">Dates for orders and settlements</text>
  <rect x="35" y="649" width="222" height="59" rx="8" class="card"/>
  <text x="47" y="672" class="label">lib/store.js</text>
  <text x="47" y="693" class="detail">Reads and writes data/db.json</text>
  <rect x="266" y="649" width="222" height="59" rx="8" class="card"/>
  <text x="278" y="672" class="label">data/db.json</text>
  <text x="278" y="693" class="detail">Orders, stock, Khata and audits</text>
  <rect x="497" y="649" width="222" height="59" rx="8" class="card"/>
  <text x="509" y="672" class="label">config.js</text>
  <text x="509" y="693" class="detail">Shop, GST, coupons and settings</text>

  <rect x="745" y="86" width="420" height="622" rx="14" fill="#e9f1f7" stroke="#b9cad6"/>
  <text x="766" y="116" class="section">Placing an order</text>
  <path d="M780 151V632" class="connector"/>
  <rect x="804" y="133" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="155" r="13" fill="#28516e"/>
  <text x="780" y="160" class="number">1</text>
  <text x="817" y="157" class="label">Submit the cart</text>
  <text x="817" y="179" class="code">public/ → server.js → routes/orders.js</text>
  <text x="817" y="198" class="detail">POST /api/orders</text>
  <rect x="804" y="227" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="249" r="13" fill="#28516e"/>
  <text x="780" y="254" class="number">2</text>
  <text x="817" y="251" class="label">Load catalog and check stock</text>
  <text x="817" y="273" class="code">store.read() → inventory.find()</text>
  <text x="817" y="292" class="detail">→ inventory.check()</text>
  <rect x="804" y="321" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="343" r="13" fill="#28516e"/>
  <text x="780" y="348" class="number">3</text>
  <text x="817" y="345" class="label">Validate coupon and price the order</text>
  <text x="817" y="367" class="code">pricing.subtotal() → coupons.normalizeCode()</text>
  <text x="817" y="386" class="detail">→ coupons.validate() → pricing.computeTotals()</text>
  <rect x="804" y="415" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="437" r="13" fill="#28516e"/>
  <text x="780" y="442" class="number">4</text>
  <text x="817" y="439" class="label">Charge Khata if selected</text>
  <text x="817" y="461" class="code">ledger.chargeOrderToKhata()</text>
  <text x="817" y="480" class="detail">Uses the checkout total.</text>
  <rect x="804" y="509" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="531" r="13" fill="#28516e"/>
  <text x="780" y="536" class="number">5</text>
  <text x="817" y="533" class="label">Deduct stock and append the order</text>
  <text x="817" y="555" class="code">inventory.reserve() → orders.add()</text>
  <text x="817" y="574" class="detail">Saves item snapshots and checkout amounts.</text>
  <rect x="804" y="603" width="342" height="81" rx="8" class="card"/>
  <circle cx="780" cy="625" r="13" fill="#28516e"/>
  <text x="780" y="630" class="number">6</text>
  <text x="817" y="627" class="label">Audit, persist and respond</text>
  <text x="817" y="649" class="code">store.appendAudit() → store.write()</text>
  <text x="817" y="668" class="detail">Write data/db.json, then return HTTP 201.</text>

  <rect x="35" y="722" width="1130" height="55" rx="9" class="ticket"/>
  <text x="50" y="744" class="label">Printable invoice</text>
  <text x="50" y="765" class="code">GET /orders/:id/invoice → server.js → store.read() → orders.get() → invoice.render() → invoice.computeInvoiceFigures()</text>
</svg>