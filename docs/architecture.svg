<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Architecture of the ShopLedger browser app, Express server, routers, libraries, configuration and JSON data, with a numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#526176}.head{font-size:15px;font-weight:700}.label{font-size:13px}.small{font-size:12px;fill:#526176}.flowtxt{font-size:12px;font-weight:600;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}.subbox{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}.ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}.link{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text class="title" x="28" y="38">ShopLedger · architecture &amp; order flow</text>
  <text class="subtitle" x="28" y="60">Browser POS → Express API → business modules → JSON file store</text>

  <!-- browser -->
  <rect class="box" x="28" y="92" width="225" height="164" rx="10"/>
  <text class="head" x="46" y="119">Browser UI · public/</text>
  <text class="label" x="46" y="145">index.html</text>
  <text class="label" x="46" y="166">js/app.js</text>
  <text class="label" x="46" y="187">css/style.css</text>
  <text class="small" x="46" y="218">POST /api/orders</text>
  <text class="small" x="46" y="237">from “Place order” handler</text>

  <!-- server -->
  <rect class="box" x="292" y="92" width="248" height="164" rx="10"/>
  <text class="head" x="310" y="119">server.js · Express</text>
  <text class="label" x="310" y="145">static(public/) · JSON body</text>
  <text class="label" x="310" y="168">mounts routers at /api</text>
  <text class="label" x="310" y="191">GET /orders/:id/invoice</text>
  <text class="small" x="310" y="220">uses config.port</text>

  <!-- config -->
  <rect class="box" x="928" y="92" width="242" height="164" rx="10"/>
  <text class="head" x="946" y="119">config.js</text>
  <text class="label" x="946" y="145">port · shop details</text>
  <text class="label" x="946" y="168">tax · HSN slabs</text>
  <text class="label" x="946" y="191">inventory · coupons</text>
  <text class="small" x="946" y="220">read by server and modules</text>

  <!-- routers -->
  <rect class="box" x="292" y="286" width="248" height="222" rx="10"/>
  <text class="head" x="310" y="313">API routers · routes/</text>
  <text class="label" x="310" y="341">orders.js · POST /orders</text>
  <text class="label" x="310" y="365">products.js · GET /products</text>
  <text class="label" x="310" y="389">customers.js · ledger</text>
  <text class="label" x="310" y="413">reports.js · dashboard / preview</text>
  <text class="small" x="310" y="447">server.js mounts each at /api</text>
  <text class="small" x="310" y="472">Printable invoice handled in server.js</text>

  <!-- libs -->
  <rect class="box" x="580" y="286" width="340" height="360" rx="10"/>
  <text class="head" x="598" y="313">Business modules · lib/</text>
  <rect class="subbox" x="598" y="329" width="145" height="39" rx="6"/><text class="label" x="610" y="353">orders.js</text>
  <rect class="subbox" x="754" y="329" width="148" height="39" rx="6"/><text class="label" x="766" y="353">inventory.js</text>
  <rect class="subbox" x="598" y="377" width="145" height="39" rx="6"/><text class="label" x="610" y="401">pricing.js</text>
  <rect class="subbox" x="754" y="377" width="148" height="39" rx="6"/><text class="label" x="766" y="401">coupons.js</text>
  <rect class="subbox" x="598" y="425" width="145" height="39" rx="6"/><text class="label" x="610" y="449">tax.js</text>
  <rect class="subbox" x="754" y="425" width="148" height="39" rx="6"/><text class="label" x="766" y="449">ledger.js</text>
  <rect class="subbox" x="598" y="473" width="145" height="39" rx="6"/><text class="label" x="610" y="497">dates.js</text>
  <rect class="subbox" x="754" y="473" width="148" height="39" rx="6"/><text class="label" x="766" y="497">reports.js</text>
  <rect class="subbox" x="598" y="521" width="145" height="39" rx="6"/><text class="label" x="610" y="545">store.js</text>
  <rect class="ticket" x="754" y="521" width="148" height="39" rx="6"/><text class="label" x="766" y="545" fill="#9a3412">invoice.js</text>
  <text class="small" x="598" y="587">pricing.js uses tax.js + coupons.js</text>
  <text class="small" x="598" y="610">store.js reads/writes data/db.json</text>

  <!-- data -->
  <rect class="box" x="954" y="354" width="216" height="112" rx="10"/>
  <text class="head" x="972" y="382">data/db.json</text>
  <text class="label" x="972" y="407">products · orders</text>
  <text class="label" x="972" y="430">customers · settlements · auditLog</text>

  <!-- architecture arrows -->
  <path class="link" d="M253 173 H292"/>
  <path class="link" d="M416 256 V286"/>
  <path class="link" d="M540 192 C566 192 555 297 580 297"/>
  <path class="link" d="M860 256 C860 274 836 275 836 286"/>
  <path class="link" d="M920 545 H954 V430"/>
  <text class="small" x="920" y="528">JSON file</text>

  <!-- numbered order-flow row -->
  <text class="head" x="28" y="548">Place an order · verified request path</text>
  <rect x="28" y="568" width="210" height="124" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="49" cy="591" r="13" fill="#2563eb"/><text x="45" y="596" font-size="13" font-weight="700" fill="#fff">1</text>
  <text class="flowtxt" x="70" y="595">UI submits</text>
  <text class="small" x="44" y="620">app.js sends POST /api/orders</text>
  <text class="small" x="44" y="641">with items, coupon, customer</text>
  <text class="small" x="44" y="662">to server.js → routes/orders.js</text>

  <rect x="260" y="568" width="210" height="124" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="281" cy="591" r="13" fill="#2563eb"/><text x="277" y="596" font-size="13" font-weight="700" fill="#fff">2</text>
  <text class="flowtxt" x="302" y="595">Read &amp; validate</text>
  <text class="small" x="276" y="620">store.read() gets db.json</text>
  <text class="small" x="276" y="641">inventory.find() + check()</text>
  <text class="small" x="276" y="662">reject unavailable stock</text>

  <rect x="492" y="568" width="210" height="124" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="513" cy="591" r="13" fill="#2563eb"/><text x="509" y="596" font-size="13" font-weight="700" fill="#fff">3</text>
  <text class="flowtxt" x="534" y="595">Calculate totals</text>
  <text class="small" x="508" y="620">pricing.subtotal() + coupons</text>
  <text class="small" x="508" y="641">pricing.computeTotals()</text>
  <text class="small" x="508" y="662">pricing uses tax.js</text>

  <rect x="724" y="568" width="210" height="124" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="745" cy="591" r="13" fill="#2563eb"/><text x="741" y="596" font-size="13" font-weight="700" fill="#fff">4</text>
  <text class="flowtxt" x="766" y="595">Apply order changes</text>
  <text class="small" x="740" y="620">optional ledger charge</text>
  <text class="small" x="740" y="641">inventory.reserve() · orders.add()</text>
  <text class="small" x="740" y="662">store.appendAudit()</text>

  <rect x="956" y="568" width="214" height="124" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="977" cy="591" r="13" fill="#2563eb"/><text x="973" y="596" font-size="13" font-weight="700" fill="#fff">5</text>
  <text class="flowtxt" x="998" y="595">Persist &amp; reply</text>
  <text class="small" x="972" y="620">store.write(db) → db.json</text>
  <text class="small" x="972" y="641">router responds with order</text>
  <text class="small" x="972" y="662">browser shows confirmation</text>

  <path class="flow" d="M238 630 H258"/><path class="flow" d="M470 630 H490"/><path class="flow" d="M702 630 H722"/><path class="flow" d="M934 630 H954"/>

  <!-- legend -->
  <rect x="28" y="728" width="1142" height="45" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <rect x="48" y="742" width="18" height="16" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="small" x="76" y="755">Ticket module (lib/invoice.js)</text>
  <line x1="332" y1="750" x2="378" y2="750" stroke="#2563eb" stroke-width="2" marker-end="url(#flowArrow)"/>
  <text class="small" x="388" y="755">Numbered order flow</text>
  <line x1="590" y1="750" x2="636" y2="750" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="small" x="646" y="755">Module / data relationship</text>
</svg>
