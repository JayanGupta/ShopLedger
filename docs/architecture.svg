<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">A verified module map for the ShopLedger browser UI, Express server and routers, library modules, configuration and JSON data store. A numbered strip traces order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:23px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .head{font-size:15px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#475569}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .focus{fill:#e6fffb;stroke:#0f766e;stroke-width:2}.focusText{fill:#115e59}
      .flow{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.flowNo{fill:#1d4ed8}
      .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .focusLine{fill:none;stroke:#0f766e;stroke-width:1.8;marker-end:url(#tealArrow)}
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fff"/>
  <text x="28" y="34" class="title">ShopLedger — application architecture</text>
  <text x="28" y="55" class="subtitle">Node / Express POS · Khata credit ledger · HSN-based GST invoicing · JSON file persistence</text>

  <!-- Runtime components -->
  <rect x="24" y="72" width="210" height="238" rx="10" class="panel"/>
  <text x="40" y="98" class="head">Browser UI · public/</text>
  <text x="40" y="121" class="body">index.html</text>
  <text x="40" y="141" class="body">js/app.js · css/style.css</text>
  <text x="40" y="174" class="small">POS · order history</text>
  <text x="40" y="193" class="small">Customer Khata · GST audit</text>
  <text x="40" y="224" class="small">Calls JSON endpoints under /api</text>
  <text x="40" y="245" class="small">Opens printable order invoice</text>

  <rect x="267" y="92" width="205" height="165" rx="10" class="card"/>
  <text x="283" y="119" class="head">server.js</text>
  <text x="283" y="142" class="body">Express app · JSON parser</text>
  <text x="283" y="161" class="body">serves public/ · mounts routers</text>
  <text x="283" y="190" class="body">GET /orders/:id/invoice</text>
  <text x="283" y="213" class="small">Starts listener when run directly</text>

  <rect x="267" y="278" width="205" height="93" rx="10" class="card"/>
  <text x="283" y="304" class="head">config.js</text>
  <text x="283" y="326" class="body">Shop · GST slabs · coupons</text>
  <text x="283" y="347" class="body">PORT · optional ADMIN_KEY</text>

  <rect x="505" y="72" width="302" height="390" rx="10" class="panel"/>
  <text x="521" y="98" class="head">Express routers · routes/</text>
  <rect x="521" y="111" width="270" height="76" rx="7" class="card"/>
  <text x="533" y="132" class="body" font-weight="700">products.js</text>
  <text x="533" y="151" class="small">GET /products · GET /coupons</text>
  <rect x="521" y="197" width="270" height="102" rx="7" class="card"/>
  <text x="533" y="218" class="body" font-weight="700">orders.js</text>
  <text x="533" y="237" class="small">GET /orders · GET /orders/:id</text>
  <text x="533" y="256" class="small">POST /orders · POST /orders/:id/cancel</text>
  <rect x="521" y="309" width="270" height="64" rx="7" class="focus"/>
  <text x="533" y="331" class="body focusText" font-weight="700">customers.js · ticket focus</text>
  <text x="533" y="351" class="body focusText">GET /customers · POST /customers/:id/settle</text>
  <rect x="521" y="383" width="270" height="63" rx="7" class="card"/>
  <text x="533" y="405" class="body" font-weight="700">reports.js</text>
  <text x="533" y="425" class="small">dashboard · GST · preview · admin export</text>

  <rect x="839" y="72" width="337" height="506" rx="10" class="panel"/>
  <text x="855" y="98" class="head">Business modules · lib/</text>
  <rect x="855" y="111" width="305" height="43" rx="6" class="card"/>
  <text x="867" y="130" class="body" font-weight="700">orders.js</text>
  <text x="867" y="147" class="small">add · get · cancel</text>
  <rect x="1043" y="119" width="105" height="27" rx="5" class="focus"/>
  <text x="1053" y="137" class="body focusText" font-weight="700">list() focus</text>
  <rect x="855" y="161" width="305" height="43" rx="6" class="focus"/>
  <text x="867" y="180" class="body focusText" font-weight="700">dates.js · ticket focus</text>
  <text x="867" y="197" class="body focusText">today · normalizeDateKey · getFiscalYear</text>
  <rect x="855" y="211" width="305" height="43" rx="6" class="focus"/>
  <text x="867" y="230" class="body focusText" font-weight="700">ledger.js · ticket focus</text>
  <text x="867" y="247" class="small focusText">Khata balances · settlements</text>
  <rect x="855" y="261" width="147" height="43" rx="6" class="card"/>
  <text x="867" y="280" class="body" font-weight="700">inventory.js</text>
  <text x="867" y="297" class="small">stock checks / updates</text>
  <rect x="1012" y="261" width="148" height="43" rx="6" class="card"/>
  <text x="1024" y="280" class="body" font-weight="700">pricing.js</text>
  <text x="1024" y="297" class="small">order totals</text>
  <rect x="855" y="311" width="147" height="43" rx="6" class="card"/>
  <text x="867" y="330" class="body" font-weight="700">coupons.js</text>
  <text x="867" y="347" class="small">coupon rules</text>
  <rect x="1012" y="311" width="148" height="43" rx="6" class="card"/>
  <text x="1024" y="330" class="body" font-weight="700">tax.js</text>
  <text x="1024" y="347" class="small">HSN rate / CGST / SGST</text>
  <rect x="855" y="361" width="147" height="43" rx="6" class="card"/>
  <text x="867" y="380" class="body" font-weight="700">invoice.js</text>
  <text x="867" y="397" class="small">HTML invoice renderer</text>
  <rect x="1012" y="361" width="148" height="43" rx="6" class="card"/>
  <text x="1024" y="380" class="body" font-weight="700">reports.js</text>
  <text x="1024" y="397" class="small">dashboard / GST recon</text>
  <rect x="855" y="411" width="305" height="43" rx="6" class="card"/>
  <text x="867" y="430" class="body" font-weight="700">store.js</text>
  <text x="867" y="447" class="small">read · write · appendAudit</text>
  <rect x="855" y="471" width="305" height="82" rx="7" class="card"/>
  <text x="867" y="493" class="body" font-weight="700">data/db.json</text>
  <text x="867" y="513" class="small">Products · customers · orders · settlements</text>
  <text x="867" y="533" class="small">Audit log · next ID counters</text>

  <!-- Relationships -->
  <path d="M234 181 H267" class="line"/>
  <text x="238" y="170" class="small">HTTP</text>
  <path d="M472 162 H490 V253 H505" class="line"/>
  <text x="477" y="149" class="small">mounts /api</text>
  <path d="M472 320 H490 V492 H827 V332 H855" class="line"/>
  <text x="610" y="485" class="small">config values</text>
  <path d="M807 246 H826 V132 H839" class="line"/>
  <path d="M807 246 H826 V182 H839" class="focusLine"/>
  <path d="M807 246 H826 V232 H839" class="focusLine"/>
  <path d="M807 246 H826 V382 H839" class="line"/>
  <text x="809" y="263" class="small">calls</text>
  <path d="M1007 454 V471" class="line"/>
  <path d="M970 257 V411" class="line"/>

  <!-- Numbered order placement flow -->
  <rect x="24" y="606" width="1152" height="170" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="42" y="632" class="head">Order placement · POST /api/orders</text>
  <rect x="42" y="650" width="160" height="88" rx="8" class="flow"/>
  <circle cx="62" cy="670" r="13" class="flowNo"/><text x="58" y="675" font-size="12" fill="#fff">1</text>
  <text x="82" y="674" class="body" font-weight="700">Browser UI</text>
  <text x="54" y="700" class="small">submits cart JSON</text>
  <text x="54" y="719" class="small">POST /api/orders</text>
  <path d="M202 694 H222" class="line"/>
  <rect x="224" y="650" width="160" height="88" rx="8" class="flow"/>
  <circle cx="244" cy="670" r="13" class="flowNo"/><text x="240" y="675" font-size="12" fill="#fff">2</text>
  <text x="264" y="674" class="body" font-weight="700">routes/orders.js</text>
  <text x="236" y="700" class="small">reads DB · validates</text>
  <text x="236" y="719" class="small">product / quantity</text>
  <path d="M384 694 H404" class="line"/>
  <rect x="406" y="650" width="160" height="88" rx="8" class="flow"/>
  <circle cx="426" cy="670" r="13" class="flowNo"/><text x="422" y="675" font-size="12" fill="#fff">3</text>
  <text x="446" y="674" class="body" font-weight="700">inventory.js</text>
  <text x="418" y="700" class="small">checks sellable stock</text>
  <text x="418" y="719" class="small">including duplicate lines</text>
  <path d="M566 694 H586" class="line"/>
  <rect x="588" y="650" width="160" height="88" rx="8" class="flow"/>
  <circle cx="608" cy="670" r="13" class="flowNo"/><text x="604" y="675" font-size="12" fill="#fff">4</text>
  <text x="628" y="674" class="body" font-weight="700">pricing.js</text>
  <text x="600" y="700" class="small">coupons.js + tax.js</text>
  <text x="600" y="719" class="small">compute subtotal / GST</text>
  <path d="M748 694 H768" class="line"/>
  <rect x="770" y="650" width="160" height="88" rx="8" class="flow"/>
  <circle cx="790" cy="670" r="13" class="flowNo"/><text x="786" y="675" font-size="12" fill="#fff">5</text>
  <text x="810" y="674" class="body" font-weight="700">ledger.js</text>
  <text x="782" y="700" class="small">Khata charge when</text>
  <text x="782" y="719" class="small">payment mode is khata</text>
  <path d="M930 694 H950" class="line"/>
  <rect x="952" y="650" width="204" height="88" rx="8" class="flow"/>
  <circle cx="972" cy="670" r="13" class="flowNo"/><text x="968" y="675" font-size="12" fill="#fff">6</text>
  <text x="992" y="674" class="body" font-weight="700">orders.js + store.js</text>
  <text x="964" y="700" class="small">deduct stock · create order</text>
  <text x="964" y="719" class="small">audit · write data/db.json</text>

  <!-- Legend -->
  <rect x="839" y="27" width="337" height="38" rx="6" class="focus"/>
  <rect x="849" y="38" width="14" height="14" rx="2" fill="#0f766e"/>
  <text x="871" y="43" class="body focusText" font-weight="700">Ticket focus</text>
  <text x="871" y="59" class="body focusText">customers route · dates · ledger · orders.list()</text>
</svg>
