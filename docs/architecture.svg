<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">Browser, Express entry point, four routers, all ten library modules, configuration and JSON storage. Purple marks ticket scope, limited to list in orders.js. Numbered steps show successful order placement.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; font-size: 13px; fill: #243449; }
      .title { font-size: 25px; font-weight: bold; }
      .heading { font-size: 16px; font-weight: bold; }
      .name { font-size: 14px; font-weight: bold; }
      .small { font-size: 12px; }
      .box { fill: #ffffff; stroke: #8ca3ba; stroke-width: 1.3; }
      .ticket { fill: #f0e7ff; stroke: #8052bb; stroke-width: 1.5; }
      .panel { fill: #edf3f8; stroke: #d2dee9; }
      .edge { fill: none; stroke: #72879c; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #167c85; stroke-width: 2; marker-end: url(#flowArrow); }
      .step { fill: #e5f5f3; stroke: #167c85; stroke-width: 1.3; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#72879c"/></marker>
    <marker id="flowArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#167c85"/></marker>
  </defs>
  <rect width="1200" height="840" fill="#f8fafc"/>
  <text x="24" y="35" class="title">ShopLedger | architecture</text>
  <rect x="750" y="18" width="16" height="16" class="ticket"/>
  <text x="774" y="31" class="small">Ticket scope (orders.js: list only)</text>
  <path d="M1010 26 H1040" class="flow"/>
  <text x="1050" y="31" class="small">Order sequence</text>

  <rect x="24" y="56" width="280" height="95" rx="8" class="box"/>
  <text x="40" y="80" class="heading">Browser UI · public/</text>
  <text x="40" y="102">index.html · js/app.js · css/style.css</text>
  <text x="40" y="124">POS · orders · Khata · inventory/GST audit</text>
  <path d="M304 101 H390" class="edge"/>
  <text x="315" y="89" class="small">HTTP / JSON</text>
  <rect x="390" y="56" width="370" height="95" rx="8" class="box"/>
  <text x="406" y="80" class="heading">server.js · Express</text>
  <text x="406" y="102">Static public/ · JSON body parsing · /api routers</text>
  <text x="406" y="124">GET /orders/:id/invoice → store / orders / invoice</text>
  <rect x="815" y="56" width="361" height="95" rx="8" class="box"/>
  <text x="831" y="80" class="heading">config.js</text>
  <text x="831" y="102">Port · shop · GST slabs · coupons · inventory</text>
  <text x="831" y="124">Read by server, inventory, coupons, tax, invoice</text>

  <path d="M575 151 V167 H160 V181 M575 167 H452 V181 M575 167 H744 V181 M575 167 H1036 V181" class="edge"/>
  <rect x="24" y="181" width="272" height="95" rx="7" class="box"/>
  <text x="38" y="204" class="name">routes/products.js</text>
  <text x="38" y="225">GET /products · /coupons</text>
  <text x="38" y="247" class="small">Uses store, inventory, tax, coupons</text>
  <rect x="316" y="181" width="272" height="95" rx="7" class="box"/>
  <text x="330" y="204" class="name">routes/orders.js</text>
  <text x="330" y="225">List / get / place / cancel orders</text>
  <text x="330" y="247" class="small">Uses store, inventory, pricing, coupons,</text>
  <text x="330" y="264" class="small">orders, ledger</text>
  <rect x="608" y="181" width="272" height="95" rx="7" class="ticket"/>
  <text x="622" y="204" class="name">routes/customers.js</text>
  <text x="622" y="225">GET /customers · POST /customers/:id/settle</text>
  <text x="622" y="247" class="small">Uses store, ledger</text>
  <rect x="900" y="181" width="276" height="95" rx="7" class="box"/>
  <text x="914" y="204" class="name">routes/reports.js</text>
  <text x="914" y="225">Dashboard · GST · preview · export</text>
  <text x="914" y="247" class="small">Uses store, reports, pricing, coupons, config</text>

  <rect x="24" y="291" width="1152" height="258" rx="8" class="panel"/>
  <text x="40" y="313" class="heading">lib/ · business logic (router dependencies listed above; internal calls listed below)</text>
  <rect x="40" y="325" width="212" height="95" rx="6" class="box"/>
  <text x="51" y="347" class="name">inventory.js</text>
  <text x="51" y="368" class="small">find · check · reserve · release</text>
  <text x="51" y="386" class="small">getSellableStock · summarize</text>
  <text x="51" y="405" class="small">Reads config</text>
  <rect x="267" y="325" width="212" height="95" rx="6" class="box"/>
  <text x="278" y="347" class="name">pricing.js</text>
  <text x="278" y="368">subtotal · computeTotals</text>
  <text x="278" y="386">discount · round2</text>
  <text x="278" y="405" class="small">Calls tax, coupons</text>
  <rect x="494" y="325" width="212" height="95" rx="6" class="box"/>
  <text x="505" y="347" class="name">coupons.js</text>
  <text x="505" y="368">normalizeCode · validate</text>
  <text x="505" y="386">calculateDiscount · listActive</text>
  <text x="505" y="405" class="small">getCoupon · reads config</text>
  <rect x="721" y="325" width="212" height="95" rx="6" class="box"/>
  <text x="732" y="347" class="name">tax.js</text>
  <text x="732" y="368">getRateForItem · getSlabPercent</text>
  <text x="732" y="386">splitCgstSgst · round2</text>
  <text x="732" y="405" class="small">Reads config</text>
  <rect x="948" y="325" width="212" height="95" rx="6" class="box"/>
  <text x="959" y="347" class="name">invoice.js</text>
  <text x="959" y="368">computeInvoiceFigures · render</text>
  <text x="959" y="386">Separate invoice calculation</text>
  <text x="959" y="405" class="small">Reads config</text>

  <rect x="40" y="433" width="212" height="100" rx="6" class="box"/>
  <text x="51" y="453" class="name">orders.js</text>
  <rect x="48" y="461" width="196" height="23" rx="3" class="ticket"/>
  <text x="55" y="477" class="small">list → dates.normalizeDateKey</text>
  <text x="51" y="503" class="small">add · get · cancel</text>
  <text x="51" y="521" class="small">Calls dates, inventory, ledger</text>
  <rect x="267" y="433" width="212" height="100" rx="6" class="ticket"/>
  <text x="278" y="455" class="name">dates.js</text>
  <text x="278" y="477">today · normalizeDateKey</text>
  <text x="278" y="498">getFiscalYear</text>
  <text x="278" y="521" class="small">DD/MM/YYYY strings</text>
  <rect x="494" y="433" width="212" height="100" rx="6" class="ticket"/>
  <text x="505" y="455" class="name">ledger.js</text>
  <text x="505" y="474" class="small">findCustomer · listCustomers</text>
  <text x="505" y="490" class="small">chargeOrderToKhata</text>
  <text x="505" y="506" class="small">reverseOrderDebit</text>
  <text x="505" y="521" class="small">recordSettlement → dates.today</text>
  <rect x="721" y="433" width="212" height="100" rx="6" class="box"/>
  <text x="732" y="455" class="name">reports.js</text>
  <text x="732" y="477">getDashboardSummary</text>
  <text x="732" y="498">getGstReconciliation</text>
  <text x="732" y="521" class="small">Calls inventory, ledger, invoice</text>
  <rect x="948" y="433" width="212" height="100" rx="6" class="box"/>
  <text x="959" y="455" class="name">store.js</text>
  <text x="959" y="477">read · write · appendAudit</text>
  <text x="959" y="498">Synchronous JSON file I/O</text>
  <text x="959" y="521" class="small">Audit capped at 100 entries</text>

  <rect x="24" y="562" width="848" height="68" rx="7" class="box"/>
  <text x="39" y="584" class="name">Ticket behavior to inspect</text>
  <text x="39" y="603" class="small">orders.list: raw date-string sort; normalizeDateKey: ISO → DD/MM/YYYY, then string range comparisons.</text>
  <text x="39" y="620" class="small">Settlement: customers route → ledger.recordSettlement → totalSettled + raw amount → balance → store.write.</text>
  <path d="M1054 533 V561" class="edge"/>
  <rect x="900" y="562" width="276" height="68" rx="7" class="box"/>
  <text x="914" y="584" class="name">data/db.json</text>
  <text x="914" y="603" class="small">products · orders · customers · settlements</text>
  <text x="914" y="620" class="small">auditLog · nextOrderId · nextSettlementId</text>

  <text x="24" y="656" class="heading">Place an order · successful POST /api/orders (all steps orchestrated by routes/orders.js)</text>
  <rect x="24" y="669" width="272" height="65" rx="6" class="step"/>
  <text x="36" y="690" class="name">1 · Browser → server → orders router</text>
  <text x="36" y="709" class="small">public/js/app.js: post('/api/orders', payload)</text>
  <text x="36" y="725" class="small">store.read() loads db.json</text>
  <path d="M296 701 H316" class="flow"/>
  <rect x="316" y="669" width="272" height="65" rx="6" class="step"/>
  <text x="328" y="690" class="name">2 · Resolve products; check stock</text>
  <text x="328" y="709" class="small">inventory.find() → inventory.check()</text>
  <text x="328" y="725" class="small">Use database prices; parse quantities</text>
  <path d="M588 701 H608" class="flow"/>
  <rect x="608" y="669" width="272" height="65" rx="6" class="step"/>
  <text x="620" y="690" class="name">3 · Validate coupon; calculate totals</text>
  <text x="620" y="709" class="small">coupons.normalizeCode() / validate()</text>
  <text x="620" y="725" class="small">pricing.computeTotals() → coupons / tax</text>
  <path d="M880 701 H900" class="flow"/>
  <rect x="900" y="669" width="276" height="65" rx="6" class="step"/>
  <text x="912" y="690" class="name">4 · Resolve customer; charge Khata</text>
  <text x="912" y="709" class="small">ledger.findCustomer(); if Khata:</text>
  <text x="912" y="725" class="small">chargeOrderToKhata() updates customer</text>
  <path d="M1176 701 H1187 V745 H160 V754" class="flow"/>
  <rect x="24" y="755" width="272" height="65" rx="6" class="step"/>
  <text x="36" y="776" class="name">5 · Deduct stock; append order</text>
  <text x="36" y="795" class="small">inventory.reserve() → orders.add()</text>
  <text x="36" y="811" class="small">nextOrderId++; date = dates.today()</text>
  <path d="M296 787 H316" class="flow"/>
  <rect x="316" y="755" width="272" height="65" rx="6" class="step"/>
  <text x="328" y="776" class="name">6 · Audit and persist whole database</text>
  <text x="328" y="795" class="small">store.appendAudit() → store.write()</text>
  <text x="328" y="811" class="small">Orders + stock + Khata + IDs + audit saved</text>
  <path d="M588 787 H608" class="flow"/>
  <rect x="608" y="755" width="272" height="65" rx="6" class="step"/>
  <text x="620" y="776" class="name">7 · Return HTTP 201 with order</text>
  <text x="620" y="795" class="small">UI clears cart and refreshes data</text>
  <text x="620" y="811" class="small">Invoice is a separate GET request</text>
  <text x="902" y="775" class="small">Saved order: item snapshots, customer,</text>
  <text x="902" y="793" class="small">date, status, paymentMode, coupon,</text>
  <text x="902" y="811" class="small">subtotal, discount, tax, total, id.</text>
</svg>
