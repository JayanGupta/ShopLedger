<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger Node and Express point of sale, with modules and a numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526176}
      .section{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#526176}
      .box{fill:#fff;stroke:#bac5d3;stroke-width:1.4}.subbox{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .ticket{fill:#fff4df;stroke:#d78b13;stroke-width:2}.flow{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.2}
      .line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .flowline{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}
      .badge{fill:#2563eb}.badgetext{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <text class="title" x="28" y="38">ShopLedger · application architecture</text>
  <text class="subtitle" x="29" y="60">Node / Express POS · Khata credit ledger · GST invoicing</text>

  <rect class="flow" x="24" y="78" width="1152" height="96" rx="10"/>
  <text class="section" x="42" y="101">Order placement flow</text>
  <g>
    <circle class="badge" cx="56" cy="128" r="12"/><text class="badgetext" x="56" y="132">1</text>
    <text class="body" x="76" y="125">public/js/app.js</text><text class="small" x="76" y="145">place handler sends POST /api/orders</text>
    <path class="flowline" d="M278 130 H315"/>
    <circle class="badge" cx="337" cy="128" r="12"/><text class="badgetext" x="337" y="132">2</text>
    <text class="body" x="357" y="125">routes/orders.js</text><text class="small" x="357" y="145">validates items, stock and coupon</text>
    <path class="flowline" d="M561 130 H598"/>
    <circle class="badge" cx="620" cy="128" r="12"/><text class="badgetext" x="620" y="132">3</text>
    <text class="body" x="640" y="125">pricing.computeTotals</text><text class="small" x="640" y="145">coupon allocation + HSN GST</text>
    <path class="flowline" d="M834 130 H871"/>
    <circle class="badge" cx="893" cy="128" r="12"/><text class="badgetext" x="893" y="132">4</text>
    <text class="body" x="913" y="125">ledger + inventory</text><text class="small" x="913" y="145">Khata charge (if selected); deduct stock</text>
    <circle class="badge" cx="56" cy="158" r="12"/><text class="badgetext" x="56" y="162">5</text>
    <text class="body" x="76" y="163">orders.add builds order → store.appendAudit → store.write(db) saves data/db.json</text>
  </g>

  <!-- Main application modules -->
  <rect class="box" x="24" y="198" width="222" height="220" rx="9"/>
  <text class="section" x="42" y="224">Browser UI · public/</text>
  <text class="body" x="42" y="251">index.html</text>
  <text class="body" x="42" y="275">js/app.js</text>
  <text class="body" x="42" y="299">css/style.css</text>
  <text class="small" x="42" y="335">Catalog · cart preview · order</text>
  <text class="small" x="42" y="353">register · Khata · audit screens</text>
  <text class="small" x="42" y="389">Calls the /api routes</text>

  <rect class="box" x="270" y="198" width="250" height="126" rx="9"/>
  <text class="section" x="288" y="224">Express app · server.js</text>
  <text class="body" x="288" y="250">JSON body parser + static public/</text>
  <text class="body" x="288" y="274">Mounts all four routers at /api</text>
  <text class="body" x="288" y="298">GET /orders/:id/invoice</text>

  <rect class="box" x="544" y="198" width="354" height="220" rx="9"/>
  <text class="section" x="562" y="224">API routers · routes/</text>
  <rect class="subbox" x="562" y="238" width="318" height="36" rx="5"/>
  <text class="body" x="574" y="261">orders.js · list, place, cancel orders</text>
  <rect class="subbox" x="562" y="282" width="318" height="36" rx="5"/>
  <text class="body" x="574" y="305">products.js · products + coupons</text>
  <rect class="subbox" x="562" y="326" width="318" height="36" rx="5"/>
  <text class="body" x="574" y="349">customers.js · customers + settlements</text>
  <rect class="subbox" x="562" y="370" width="318" height="36" rx="5"/>
  <text class="body" x="574" y="393">reports.js · dashboard, preview, export</text>

  <rect class="box" x="922" y="198" width="254" height="96" rx="9"/>
  <text class="section" x="940" y="224">config.js</text>
  <text class="body" x="940" y="249">Shop · tax slabs · coupons</text>
  <text class="body" x="940" y="273">Port · inventory defaults · admin key</text>
  <rect class="box" x="922" y="310" width="254" height="108" rx="9"/>
  <text class="section" x="940" y="337">data/db.json</text>
  <text class="body" x="940" y="362">Products · orders · customers</text>
  <text class="body" x="940" y="386">Settlements · audit log · ID counters</text>
  <text class="small" x="940" y="407">Read/written by lib/store.js</text>

  <!-- Readable module inventory -->
  <rect class="box" x="24" y="438" width="1152" height="298" rx="9"/>
  <text class="section" x="42" y="465">Application logic · lib/</text>
  <text class="small" x="42" y="486">Routers call these modules; the order route uses pricing, coupons, inventory, orders, ledger and store.</text>

  <rect class="subbox" x="42" y="504" width="265" height="48" rx="6"/>
  <text class="body" x="56" y="525">pricing.js</text><text class="small" x="56" y="543">subtotal · computeTotals</text>
  <rect class="subbox" x="321" y="504" width="265" height="48" rx="6"/>
  <text class="body" x="335" y="525">coupons.js</text><text class="small" x="335" y="543">validate · calculateDiscount</text>
  <rect class="subbox" x="600" y="504" width="265" height="48" rx="6"/>
  <text class="body" x="614" y="525">inventory.js</text><text class="small" x="614" y="543">check · reserve · release</text>
  <rect class="subbox" x="879" y="504" width="265" height="48" rx="6"/>
  <text class="body" x="893" y="525">orders.js</text><text class="small" x="893" y="543">add · get · cancel · list</text>

  <rect class="subbox" x="42" y="565" width="265" height="48" rx="6"/>
  <text class="body" x="56" y="586">ledger.js</text><text class="small" x="56" y="604">Khata balances + settlements</text>
  <rect class="subbox" x="321" y="565" width="265" height="48" rx="6"/>
  <text class="body" x="335" y="586">store.js</text><text class="small" x="335" y="604">read · write · appendAudit</text>
  <rect class="subbox" x="600" y="565" width="265" height="48" rx="6"/>
  <text class="body" x="614" y="586">tax.js</text><text class="small" x="614" y="604">HSN rate lookup · CGST/SGST split</text>
  <rect class="subbox" x="879" y="565" width="265" height="48" rx="6"/>
  <text class="body" x="893" y="586">dates.js</text><text class="small" x="893" y="604">today · normalizeDateKey · fiscal year</text>

  <rect class="subbox" x="42" y="626" width="265" height="48" rx="6"/>
  <text class="body" x="56" y="647">reports.js</text><text class="small" x="56" y="665">dashboard summary · GST reconciliation</text>
  <rect class="ticket" x="321" y="626" width="265" height="48" rx="6"/>
  <text class="body" x="335" y="647">invoice.js · TICKET FOCUS</text><text class="small" x="335" y="665">computeInvoiceFigures · render HTML</text>

  <rect x="600" y="626" width="544" height="48" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <rect x="616" y="642" width="17" height="17" rx="3" fill="#fff4df" stroke="#d78b13" stroke-width="2"/>
  <text class="body" x="643" y="656">Ticket-highlighted module</text>
  <text class="small" x="819" y="656">tax.js remains standard: checkout uses it; invoice.js does not.</text>

  <!-- Relationship arrows, kept behind annotations -->
  <path class="line" d="M246 287 H270"/>
  <path class="line" d="M520 260 H544"/>
  <path class="line" d="M898 260 H922"/>
  <path class="line" d="M898 347 H922"/>
  <path class="line" d="M795 418 V430 H450 V438"/>
  <path class="line" d="M1049 418 V430 H450"/>
  <text class="small" x="263" y="764">Solid arrows show request/data connections; numbered strip shows order creation sequence.</text>
</svg>
