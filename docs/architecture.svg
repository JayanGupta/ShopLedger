<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">The browser sends an order through Express and the orders router. Seven numbered steps show the database read, inventory validation, pricing, Khata billing, saving, and response. The printable invoice uses a separate calculation highlighted in purple.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#40658e"/>
    </marker>
    <style>
      text {font-family:system-ui,sans-serif;fill:#16263c;font-size:14px}
      .title {font-size:32px;font-weight:750}
      .heading {font-size:17px;font-weight:700}
      .label {font-size:14px;font-weight:700}
      .detail {font-size:13px;fill:#344c67}
      .panel {fill:#edf3f9;stroke:#cfdae8}
      .card {fill:#fff;stroke:#b9c9dd}
      .flow {fill:#fff;stroke:#8baaca}
      .ticket {fill:#f2e9ff;stroke:#8652bc;stroke-width:1.5}
      .ticketText {fill:#57278a}
      .edge {fill:none;stroke:#40658e;stroke-width:1.6;marker-end:url(#arrow)}
      .printEdge {stroke-dasharray:5 4}
      .step {fill:#234d7b}
      .number {fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f7f9fc"/>
  <text x="32" y="51" class="title">ShopLedger architecture</text>
  <text x="33" y="77" class="detail">Point of sale, Khata credit and printable GST invoices</text>

  <rect x="32" y="109" width="276" height="646" rx="14" class="panel"/>
  <rect x="328" y="109" width="464" height="646" rx="14" class="panel"/>
  <rect x="812" y="109" width="356" height="646" rx="14" class="panel"/>
  <text x="48" y="139" class="heading">Browser and API</text>
  <text x="346" y="139" class="heading">Placing an order</text>
  <text x="830" y="139" class="heading">Invoice, reports and shared data</text>

  <g class="edge">
    <path d="M170 227V244"/>
    <path d="M170 334V364"/>
    <path d="M292 404H318V187H345"/>
    <path d="M560 214V225"/>
    <path d="M560 288V299"/>
    <path d="M560 364V375"/>
    <path d="M560 480V491"/>
    <path d="M560 555V566"/>
    <path d="M560 650V661"/>
    <path d="M774 617H829"/>
  </g>
  <path d="M292 291H313V96H990V162" class="edge printEdge"/>

  <rect x="48" y="162" width="244" height="65" rx="8" class="card"/>
  <text x="61" y="187" class="label">public/ · Browser UI</text>
  <text x="61" y="209" class="detail">Cart, order register, Khata, reports</text>

  <rect x="48" y="244" width="244" height="90" rx="8" class="card"/>
  <text x="61" y="270" class="label">server.js · Express</text>
  <text x="61" y="292" class="detail">Serves public/ and mounts /api</text>
  <text x="61" y="314" class="detail">GET /orders/:id/invoice</text>

  <rect x="48" y="364" width="244" height="70" rx="8" class="flow"/>
  <text x="61" y="389" class="label">routes/orders.js</text>
  <text x="61" y="412" class="detail">Place, list, view and cancel orders</text>

  <rect x="48" y="450" width="244" height="70" rx="8" class="card"/>
  <text x="61" y="475" class="label">routes/products.js</text>
  <text x="61" y="498" class="detail">Product stock, GST and coupons</text>

  <rect x="48" y="536" width="244" height="70" rx="8" class="card"/>
  <text x="61" y="561" class="label">routes/customers.js</text>
  <text x="61" y="584" class="detail">Customers and Khata settlements</text>

  <rect x="48" y="622" width="244" height="86" rx="8" class="card"/>
  <text x="61" y="647" class="label">routes/reports.js</text>
  <text x="61" y="670" class="detail">Dashboard and GST reconciliation</text>
  <text x="61" y="691" class="detail">Cart pricing preview and export</text>

  <g class="flow">
    <rect x="346" y="158" width="428" height="56" rx="8"/>
    <rect x="346" y="226" width="428" height="62" rx="8"/>
    <rect x="346" y="300" width="428" height="64" rx="8"/>
    <rect x="346" y="376" width="428" height="104" rx="8"/>
    <rect x="346" y="492" width="428" height="63" rx="8"/>
    <rect x="346" y="567" width="428" height="83" rx="8"/>
    <rect x="346" y="662" width="428" height="63" rx="8"/>
  </g>
  <g class="step">
    <circle cx="367" cy="177" r="12"/><circle cx="367" cy="245" r="12"/>
    <circle cx="367" cy="319" r="12"/><circle cx="367" cy="395" r="12"/>
    <circle cx="367" cy="511" r="12"/><circle cx="367" cy="586" r="12"/>
    <circle cx="367" cy="681" r="12"/>
  </g>
  <g class="number">
    <text x="367" y="182">1</text><text x="367" y="250">2</text>
    <text x="367" y="324">3</text><text x="367" y="400">4</text>
    <text x="367" y="516">5</text><text x="367" y="591">6</text>
    <text x="367" y="686">7</text>
  </g>
  <text x="388" y="182" class="label">Submit · POST /api/orders</text>
  <text x="388" y="201" class="detail">Browser sends cart, customer, payment, status and coupon</text>

  <text x="388" y="250" class="label">Load · lib/store.js → read()</text>
  <text x="388" y="273" class="detail">Read products, orders and customer data from data/db.json</text>

  <text x="388" y="324" class="label">Check stock · lib/inventory.js → find(), check()</text>
  <text x="388" y="347" class="detail">Use catalog price and HSN, then check sellable quantity</text>

  <text x="388" y="400" class="label">Price · lib/pricing.js → subtotal(), computeTotals()</text>
  <text x="388" y="423" class="detail">lib/coupons.js → validate(), calculateDiscount()</text>
  <text x="388" y="444" class="detail">lib/tax.js → getRateForItem(), splitCgstSgst()</text>
  <text x="388" y="465" class="detail">Allocate coupon discount before applying HSN GST per line</text>

  <text x="388" y="516" class="label">Bill Khata · lib/ledger.js → chargeOrderToKhata()</text>
  <text x="388" y="539" class="detail">For Khata, check the credit limit and update the balance</text>

  <text x="388" y="591" class="label">Save · reserve(), add(), appendAudit(), write()</text>
  <text x="388" y="614" class="detail">lib/inventory.js deducts stock; lib/orders.js adds order</text>
  <text x="388" y="635" class="detail">lib/store.js records ORDER_CREATED and writes the JSON</text>

  <text x="388" y="686" class="label">Respond · HTTP 201 with order JSON</text>
  <text x="388" y="709" class="detail">Browser shows the saved total and printable invoice link</text>

  <rect x="830" y="162" width="320" height="126" rx="8" class="ticket"/>
  <text x="845" y="187" class="label ticketText">lib/invoice.js · Printable GST invoice</text>
  <text x="845" y="210" class="detail">server.js loads the order with orders.get()</text>
  <text x="845" y="230" class="detail">render() calls computeInvoiceFigures()</text>
  <text x="845" y="250" class="detail">Saved gstRate or fallback; GST before coupon</text>
  <text x="845" y="270" class="detail">Warns when printed and saved totals differ</text>

  <rect x="830" y="302" width="320" height="82" rx="8" class="card"/>
  <text x="845" y="327" class="label">lib/reports.js</text>
  <text x="845" y="350" class="detail">getDashboardSummary(), getGstReconciliation()</text>
  <text x="845" y="370" class="detail">Compares saved and recomputed GST and total</text>

  <rect x="830" y="398" width="320" height="76" rx="8" class="card"/>
  <text x="845" y="423" class="label">config.js</text>
  <text x="845" y="446" class="detail">Shop details, fallback GST, HSN rates and coupons</text>

  <rect x="830" y="488" width="320" height="76" rx="8" class="card"/>
  <text x="845" y="513" class="label">lib/dates.js</text>
  <text x="845" y="536" class="detail">today() dates orders; normalizeDateKey() filters</text>

  <rect x="830" y="578" width="320" height="84" rx="8" class="card"/>
  <text x="845" y="603" class="label">data/db.json</text>
  <text x="845" y="626" class="detail">Products, orders, customers, settlements,</text>
  <text x="845" y="646" class="detail">audit log and ID counters · read and written by store</text>

  <rect x="831" y="684" width="16" height="14" rx="3" class="ticket"/>
  <text x="856" y="696" class="detail">Ticket module</text>
  <path d="M832 718H847" class="edge printEdge"/>
  <text x="856" y="722" class="detail">Invoice request path</text>
</svg>
