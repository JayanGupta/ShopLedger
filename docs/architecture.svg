<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order flow</title>
<desc id="desc">Architecture map of the ShopLedger Express POS application, routes, business logic modules, configuration and JSON store. Inventory and order cancellation modules are highlighted for Ticket 3.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/></marker>
  <style>
    .heading{font:700 23px Arial,sans-serif;fill:#0f172a}
    .sub{font:14px Arial,sans-serif;fill:#475569}
    .node{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;rx:9}
    .route{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5;rx:8}
    .ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5;rx:8}
    .store{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.7;rx:8}
    .label{font:700 14px Arial,sans-serif;fill:#0f172a}
    .small{font:12px Arial,sans-serif;fill:#334155}
    .flow{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.3;rx:8}
    .num{font:700 17px Arial,sans-serif;fill:#1d4ed8}
    .line{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    .dash{stroke-dasharray:5 4}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="36" y="42" class="heading">ShopLedger — architecture &amp; order flow</text>
<text x="36" y="66" class="sub">Node.js / Express · static browser UI · JSON persistence · Ticket 3 modules highlighted</text>

<!-- UI and application -->
<rect x="36" y="112" width="205" height="112" class="node"/>
<text x="52" y="139" class="label">Browser UI</text>
<text x="52" y="161" class="small">public/index.html</text>
<text x="52" y="180" class="small">public/js/app.js</text>
<text x="52" y="199" class="small">public/css/style.css</text>

<rect x="284" y="112" width="205" height="112" class="node"/>
<text x="300" y="139" class="label">server.js</text>
<text x="300" y="161" class="small">Express app + body-parser</text>
<text x="300" y="180" class="small">serves public/ static files</text>
<text x="300" y="199" class="small">mounts four routers</text>
<path d="M241 168 L284 168" class="line"/>

<rect x="284" y="270" width="205" height="78" class="node"/>
<text x="300" y="299" class="label">config.js</text>
<text x="300" y="320" class="small">port · shop · GST · stock · coupons</text>

<!-- Routes -->
<text x="535" y="92" class="label">routes/ — HTTP endpoints</text>
<rect x="535" y="112" width="220" height="70" class="route"/>
<text x="550" y="139" class="label">products.js</text>
<text x="550" y="159" class="small">GET /products · GET /coupons</text>
<rect x="535" y="198" width="220" height="90" class="route"/>
<text x="550" y="225" class="label">orders.js</text>
<text x="550" y="246" class="small">GET /orders · POST /orders</text>
<text x="550" y="266" class="small">POST /orders/:id/cancel</text>
<rect x="535" y="304" width="220" height="70" class="route"/>
<text x="550" y="331" class="label">customers.js</text>
<text x="550" y="351" class="small">GET /customers · POST /settle</text>
<rect x="535" y="390" width="220" height="70" class="route"/>
<text x="550" y="417" class="label">reports.js</text>
<text x="550" y="437" class="small">dashboard · GST · pricing preview</text>
<path d="M489 168 L515 168 L515 147 L535 147" class="line"/>
<path d="M489 168 L515 168 L515 243 L535 243" class="line"/>
<path d="M489 168 L515 168 L515 339 L535 339" class="line"/>
<path d="M489 168 L515 168 L515 425 L535 425" class="line"/>

<!-- Logic modules -->
<text x="795" y="36" class="label">lib/ — business logic</text>
<rect x="790" y="50" width="180" height="48" class="ticket"/>
<text x="804" y="70" class="label">inventory.js</text>
<text x="804" y="87" class="small">check · reserve · release</text>
<rect x="985" y="50" width="180" height="48" class="ticket"/>
<text x="999" y="70" class="label">orders.js</text>
<text x="999" y="87" class="small">add · get · cancel · list</text>

<rect x="790" y="112" width="180" height="48" class="node"/>
<text x="804" y="132" class="label">pricing.js</text>
<text x="804" y="149" class="small">subtotal · GST totals</text>
<rect x="985" y="112" width="180" height="48" class="node"/>
<text x="999" y="132" class="label">coupons.js</text>
<text x="999" y="149" class="small">validate · discount</text>

<rect x="790" y="174" width="180" height="48" class="node"/>
<text x="804" y="194" class="label">ledger.js</text>
<text x="804" y="211" class="small">Khata · settlements</text>
<rect x="985" y="174" width="180" height="48" class="node"/>
<text x="999" y="194" class="label">dates.js</text>
<text x="999" y="211" class="small">date keys · fiscal year</text>

<rect x="790" y="236" width="180" height="48" class="node"/>
<text x="804" y="256" class="label">tax.js</text>
<text x="804" y="273" class="small">HSN slabs · CGST/SGST</text>
<rect x="985" y="236" width="180" height="48" class="node"/>
<text x="999" y="256" class="label">invoice.js</text>
<text x="999" y="273" class="small">invoice figures · HTML</text>

<rect x="790" y="298" width="180" height="48" class="node"/>
<text x="804" y="318" class="label">reports.js</text>
<text x="804" y="335" class="small">dashboard · GST reconcile</text>
<rect x="985" y="298" width="180" height="48" class="store"/>
<text x="999" y="318" class="label">store.js</text>
<text x="999" y="335" class="small">read · write · audit log</text>

<!-- Connections from routes to modules -->
<path d="M755 147 L775 147 L775 74 L790 74" class="line"/>
<path d="M755 147 L780 147 L780 136 L790 136" class="line"/>
<path d="M755 243 L770 243 L770 74 L790 74" class="line"/>
<path d="M755 243 L985 74" class="line"/>
<path d="M755 243 L775 243 L775 136 L790 136" class="line"/>
<path d="M755 243 L780 243 L780 198 L790 198" class="line"/>
<path d="M755 243 L985 136" class="line"/>
<path d="M755 339 L780 339 L780 198 L790 198" class="line"/>
<path d="M755 425 L780 425 L780 322 L790 322" class="line"/>
<path d="M970 322 L985 322" class="line"/>

<!-- persistence -->
<rect x="790" y="372" width="375" height="66" class="store"/>
<text x="808" y="399" class="label">data/db.json</text>
<text x="808" y="420" class="small">products · orders · customers · settlements · auditLog</text>
<path d="M1075 346 L1075 372" class="line"/>
<path d="M489 309 L510 309 L510 450 L970 450 L970 438" class="line dash"/>
<text x="530" y="474" class="small">config.js supplies app, tax, inventory and coupon settings</text>

<!-- legend -->
<rect x="36" y="270" width="205" height="78" class="node"/>
<text x="52" y="294" class="label">Legend</text>
<rect x="52" y="306" width="15" height="12" class="route"/><text x="76" y="317" class="small">HTTP router</text>
<rect x="52" y="326" width="15" height="12" class="ticket"/><text x="76" y="337" class="small">Ticket 3 scope</text>
<rect x="36" y="365" width="205" height="78" class="store"/>
<text x="52" y="391" class="label">Storage</text>
<text x="52" y="413" class="small">Only lib/store.js reads/writes</text>
<text x="52" y="431" class="small">the JSON database file.</text>

<!-- Order flow -->
<text x="36" y="520" class="heading" style="font-size:18px">Order placement flow — POST /api/orders</text>
<rect x="36" y="544" width="125" height="112" class="flow"/>
<text x="49" y="570" class="num">1</text><text x="49" y="592" class="label">Request</text><text x="49" y="614" class="small">routes/orders.js</text><text x="49" y="634" class="small">read body</text>
<rect x="180" y="544" width="125" height="112" class="flow"/>
<text x="193" y="570" class="num">2</text><text x="193" y="592" class="label">Load data</text><text x="193" y="614" class="small">store.read()</text><text x="193" y="634" class="small">db.json</text>
<rect x="324" y="544" width="125" height="112" class="flow"/>
<text x="337" y="570" class="num">3</text><text x="337" y="592" class="label">Resolve items</text><text x="337" y="614" class="small">inventory.find()</text><text x="337" y="634" class="small">line item id, qty</text>
<rect x="468" y="544" width="125" height="112" class="ticket"/>
<text x="481" y="570" class="num">4</text><text x="481" y="592" class="label">Check stock</text><text x="481" y="614" class="small">inventory.check()</text><text x="481" y="634" class="small">sellable = stock − reserved</text>
<rect x="612" y="544" width="125" height="112" class="flow"/>
<text x="625" y="570" class="num">5</text><text x="625" y="592" class="label">Price</text><text x="625" y="614" class="small">pricing + coupons</text><text x="625" y="634" class="small">tax.js</text>
<rect x="756" y="544" width="125" height="112" class="ticket"/>
<text x="769" y="570" class="num">6</text><text x="769" y="592" class="label">Reserve</text><text x="769" y="614" class="small">inventory.reserve()</text><text x="769" y="634" class="small">deduct stock</text>
<rect x="900" y="544" width="125" height="112" class="flow"/>
<text x="913" y="570" class="num">7</text><text x="913" y="592" class="label">Create order</text><text x="913" y="614" class="small">orders.add()</text><text x="913" y="634" class="small">append audit</text>
<rect x="1044" y="544" width="125" height="112" class="store"/>
<text x="1057" y="570" class="num">8</text><text x="1057" y="592" class="label">Persist</text><text x="1057" y="614" class="small">store.write()</text><text x="1057" y="634" class="small">HTTP 201</text>
<path d="M161 600 L180 600" class="line"/><path d="M305 600 L324 600" class="line"/><path d="M449 600 L468 600" class="line"/><path d="M593 600 L612 600" class="line"/><path d="M737 600 L756 600" class="line"/><path d="M881 600 L900 600" class="line"/><path d="M1025 600 L1044 600" class="line"/>

<text x="36" y="700" class="small">Ticket 3: inventory.check must allow qty equal to sellable stock; cancellation must restore stock via route-shaped line item id.</text>
<text x="36" y="724" class="small">Cancellation: routes/orders.js → orders.cancel() → inventory.release() → store.write(); repeated cancellation is rejected.</text>
<text x="36" y="772" class="small">Verified names from repository source: server.js, config.js, routes/*.js, lib/*.js, public/* and data/db.json.</text>
</svg>