<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture overview of ShopLedger with verified source modules and a numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
  <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#526078}
    .head{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#526078}
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.soft{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
    .node{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.focus{fill:#eff6ff;stroke:#2563eb;stroke-width:2.3}
    .conn{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#flowArrow)}
    .pill{fill:#dbeafe;stroke:#93c5fd;stroke-width:1}.num{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    .stepHead{font-size:13px;font-weight:700}.stepBody{font-size:12px;fill:#526078}
  </style>
</defs>
<rect width="1200" height="800" fill="#f1f5f9"/>
<text x="28" y="38" class="title">ShopLedger · application architecture</text>
<text x="28" y="62" class="subtitle">Express POS, Khata ledger and GST invoicing · verified against source files</text>
<rect x="905" y="25" width="267" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/>
<rect x="918" y="38" width="17" height="16" rx="3" class="focus"/><text x="944" y="51" class="small">Ticket focus: printable invoice</text>

<!-- Main application layers -->
<rect x="24" y="88" width="250" height="426" rx="12" class="panel"/>
<text x="42" y="116" class="head">Browser UI · public/</text>
<rect x="42" y="132" width="214" height="65" rx="8" class="soft"/>
<text x="56" y="155" class="body" font-weight="700">index.html</text><text x="56" y="177" class="small">POS · Orders · Khata · Audit views</text>
<rect x="42" y="207" width="214" height="65" rx="8" class="soft"/>
<text x="56" y="230" class="body" font-weight="700">js/app.js</text><text x="56" y="252" class="small">XHR API calls · renders UI</text>
<rect x="42" y="282" width="214" height="48" rx="8" class="soft"/>
<text x="56" y="311" class="body" font-weight="700">css/style.css</text>
<text x="42" y="367" class="small">Static files served by</text><text x="42" y="386" class="small">Express static middleware</text>
<rect x="42" y="416" width="214" height="69" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="56" y="440" class="small">Order placement starts here:</text><text x="56" y="463" class="body" font-weight="700">POST /api/orders</text>

<rect x="300" y="88" width="290" height="150" rx="12" class="panel"/>
<text x="320" y="117" class="head">server.js · Express app</text>
<text x="320" y="145" class="body">bodyParser.json() · express.static(public)</text>
<text x="320" y="170" class="body">Mounts all routers at /api</text>
<text x="320" y="196" class="body">GET /orders/:id/invoice</text>
<text x="320" y="219" class="small">Invoice route → orders.get() → invoice.render()</text>

<rect x="300" y="260" width="290" height="254" rx="12" class="panel"/>
<text x="320" y="289" class="head">routes/ · mounted at /api</text>
<rect x="318" y="306" width="254" height="43" rx="7" class="node"/><text x="332" y="325" class="body" font-weight="700">products.js</text><text x="332" y="341" class="small">GET /products · GET /coupons</text>
<rect x="318" y="357" width="254" height="43" rx="7" class="node"/><text x="332" y="376" class="body" font-weight="700">orders.js</text><text x="332" y="392" class="small">POST /orders · cancel · list · get</text>
<rect x="318" y="408" width="254" height="43" rx="7" class="node"/><text x="332" y="427" class="body" font-weight="700">customers.js</text><text x="332" y="443" class="small">GET /customers · settle</text>
<rect x="318" y="459" width="254" height="43" rx="7" class="node"/><text x="332" y="478" class="body" font-weight="700">reports.js</text><text x="332" y="494" class="small">dashboard · GST · pricing preview · export</text>

<rect x="614" y="88" width="354" height="426" rx="12" class="panel"/>
<text x="634" y="117" class="head">lib/ · application modules</text>
<rect x="632" y="133" width="318" height="47" rx="7" class="node"/><text x="646" y="153" class="body" font-weight="700">pricing.js</text><text x="646" y="170" class="small">subtotal · discount · computeTotals</text>
<rect x="632" y="186" width="318" height="47" rx="7" class="node"/><text x="646" y="206" class="body" font-weight="700">coupons.js</text><text x="646" y="223" class="small">normalizeCode · validate · calculateDiscount</text>
<rect x="632" y="239" width="318" height="47" rx="7" class="node"/><text x="646" y="259" class="body" font-weight="700">inventory.js</text><text x="646" y="276" class="small">find · check · reserve · release</text>
<rect x="632" y="292" width="318" height="47" rx="7" class="node"/><text x="646" y="312" class="body" font-weight="700">orders.js</text><text x="646" y="329" class="small">add · get · cancel · list</text>
<rect x="632" y="345" width="318" height="47" rx="7" class="node"/><text x="646" y="365" class="body" font-weight="700">ledger.js</text><text x="646" y="382" class="small">chargeOrderToKhata · recordSettlement</text>
<rect x="632" y="398" width="318" height="47" rx="7" class="focus"/><text x="646" y="418" class="body" font-weight="700" fill="#1d4ed8">invoice.js · TICKET FOCUS</text><text x="646" y="435" class="small">computeInvoiceFigures · render</text>
<rect x="632" y="451" width="155" height="47" rx="7" class="node"/><text x="644" y="471" class="body" font-weight="700">tax.js</text><text x="644" y="488" class="small">GST helpers</text>
<rect x="795" y="451" width="155" height="47" rx="7" class="node"/><text x="807" y="471" class="body" font-weight="700">reports.js</text><text x="807" y="488" class="small">dashboard · reconciliation</text>

<rect x="990" y="88" width="186" height="190" rx="12" class="panel"/>
<text x="1008" y="117" class="head">Configuration</text>
<rect x="1008" y="135" width="150" height="54" rx="7" class="soft"/><text x="1020" y="158" class="body" font-weight="700">config.js</text><text x="1020" y="178" class="small">shop · tax · coupons</text>
<path d="M950 210 C970 210 980 170 1008 164" class="conn"/>
<text x="1008" y="221" class="small">Used by tax, coupons,</text><text x="1008" y="239" class="small">invoice and server</text>

<rect x="990" y="300" width="186" height="214" rx="12" class="panel"/>
<text x="1008" y="329" class="head">Persistent data</text>
<rect x="1008" y="348" width="150" height="66" rx="7" class="soft"/><text x="1020" y="374" class="body" font-weight="700">data/db.json</text><text x="1020" y="394" class="small">products · orders · ledger</text>
<text x="1008" y="444" class="small">lib/store.js</text><text x="1008" y="463" class="small">read() · write()</text>
<path d="M950 474 C972 474 979 400 1008 400" class="conn"/>

<!-- Main architecture connectors -->
<path d="M256 238 C275 238 282 180 300 180" class="conn"/>
<path d="M445 238 L445 260" class="conn"/>
<path d="M590 386 L614 386" class="conn"/>
<path d="M590 485 C606 485 608 422 632 422" class="conn"/>
<path d="M950 475 L990 475" class="conn"/>

<!-- Numbered order sequence -->
<rect x="24" y="536" width="1152" height="240" rx="12" fill="#fff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="44" y="566" class="head">Place an order · request and save flow</text>
<text x="44" y="588" class="small">Blue sequence follows POST /api/orders in routes/orders.js; arrows show order of work.</text>
<g>
 <rect x="42" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="60" cy="631" r="13" fill="#2563eb"/><text x="60" y="635" class="num">1</text><text x="80" y="636" class="stepHead">Browser</text><text x="54" y="666" class="stepBody">app.js sends cart</text><text x="54" y="685" class="stepBody">POST /api/orders</text>
 <rect x="231" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="249" cy="631" r="13" fill="#2563eb"/><text x="249" y="635" class="num">2</text><text x="269" y="636" class="stepHead">Route validates</text><text x="243" y="666" class="stepBody">orders.js resolves</text><text x="243" y="685" class="stepBody">product + quantity</text>
 <rect x="420" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="438" cy="631" r="13" fill="#2563eb"/><text x="438" y="635" class="num">3</text><text x="458" y="636" class="stepHead">Stock + totals</text><text x="432" y="666" class="stepBody">inventory.check()</text><text x="432" y="685" class="stepBody">pricing + coupons + tax</text>
 <rect x="609" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="627" cy="631" r="13" fill="#2563eb"/><text x="627" y="635" class="num">4</text><text x="647" y="636" class="stepHead">Optional Khata</text><text x="621" y="666" class="stepBody">ledger.chargeOrder</text><text x="621" y="685" class="stepBody">ToKhata(total)</text>
 <rect x="798" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="816" cy="631" r="13" fill="#2563eb"/><text x="816" y="635" class="num">5</text><text x="836" y="636" class="stepHead">Commit order</text><text x="810" y="666" class="stepBody">inventory.reserve()</text><text x="810" y="685" class="stepBody">orders.add() + audit</text>
 <rect x="987" y="613" width="166" height="126" rx="9" fill="#eff6ff" stroke="#93c5fd"/><circle cx="1005" cy="631" r="13" fill="#2563eb"/><text x="1005" y="635" class="num">6</text><text x="1025" y="636" class="stepHead">Persist + reply</text><text x="999" y="666" class="stepBody">store.write(db.json)</text><text x="999" y="685" class="stepBody">HTTP 201 + order</text>
 <path d="M208 675 L229 675" class="flow"/><path d="M397 675 L418 675" class="flow"/><path d="M586 675 L607 675" class="flow"/><path d="M775 675 L796 675" class="flow"/><path d="M964 675 L985 675" class="flow"/>
</g>
<text x="44" y="760" class="small">Separate invoice path: GET /orders/:id/invoice → orders.get() → invoice.render() → computeInvoiceFigures().</text>
</svg>
