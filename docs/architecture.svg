<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger browser UI, Express server, routers, library modules, configuration and JSON data store. The numbered arrows trace order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526477"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#087e8b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a;font-size:14px}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#536779}
      .zone{font-size:13px;font-weight:700;letter-spacing:1px;fill:#526477}
      .box{fill:#fff;stroke:#a8b8c6;stroke-width:1.5}.router{fill:#eff6fb;stroke:#8aa7bd;stroke-width:1.3}
      .lib{fill:#f7fafc;stroke:#b5c2cc;stroke-width:1.2}.ticket{fill:#fff3d9;stroke:#d18b16;stroke-width:2}
      .store{fill:#eaf5ed;stroke:#7da98a;stroke-width:1.5}.config{fill:#f1edfa;stroke:#a898c9;stroke-width:1.5}
      .small{font-size:12px;fill:#536779}.label{font-size:12px;font-weight:700;fill:#087e8b}
      .line{fill:none;stroke:#526477;stroke-width:1.6;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#087e8b;stroke-width:2.5;marker-end:url(#flowArrow)}
      .num{fill:#087e8b;stroke:#fff;stroke-width:1.5}.numtext{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f5f8fb"/>
  <text x="32" y="40" class="title">ShopLedger | application architecture</text>
  <text x="32" y="64" class="subtitle">Request path, business modules, persistence, and numbered order placement flow</text>

  <text x="32" y="98" class="zone">CLIENT</text>
  <rect x="32" y="110" width="205" height="104" rx="10" class="box"/>
  <text x="50" y="138" font-weight="700">Browser UI · public/</text>
  <text x="50" y="162" class="small">index.html · js/app.js · css/style.css</text>
  <text x="50" y="187" class="small">Cart preview and order submission</text>

  <text x="285" y="98" class="zone">HTTP SERVER</text>
  <rect x="285" y="110" width="205" height="104" rx="10" class="box"/>
  <text x="303" y="138" font-weight="700">server.js · Express</text>
  <text x="303" y="162" class="small">Static UI + /api routers</text>
  <text x="303" y="187" class="small">GET /orders/:id/invoice</text>
  <path d="M237 154 H278" class="line"/>

  <text x="535" y="98" class="zone">ROUTES · mounted at /api</text>
  <rect x="535" y="110" width="195" height="49" rx="8" class="router"/>
  <text x="551" y="132" font-weight="700">routes/products.js</text><text x="551" y="149" class="small">GET products, coupons</text>
  <rect x="535" y="169" width="195" height="56" rx="8" fill="#dff3f2" stroke="#087e8b" stroke-width="2"/>
  <text x="551" y="192" font-weight="700">routes/orders.js</text><text x="551" y="212" class="small">POST /orders · cancel · list</text>
  <rect x="748" y="110" width="195" height="49" rx="8" class="router"/>
  <text x="764" y="132" font-weight="700">routes/customers.js</text><text x="764" y="149" class="small">Customers · settlements</text>
  <rect x="748" y="169" width="195" height="56" rx="8" class="router"/>
  <text x="764" y="192" font-weight="700">routes/reports.js</text><text x="764" y="212" class="small">Preview · reports · export</text>
  <path d="M490 154 H520 V196 H528" class="flow"/>
  <path d="M490 154 H520 V135 H528" class="line"/>
  <path d="M490 154 H740" class="line"/>

  <text x="32" y="261" class="zone">BUSINESS MODULES · lib/</text>
  <rect x="32" y="276" width="205" height="85" rx="9" class="lib"/>
  <text x="48" y="302" font-weight="700">lib/inventory.js</text>
  <text x="48" y="326" class="small">find · check · reserve · release</text>
  <rect x="258" y="276" width="205" height="85" rx="9" class="lib"/>
  <text x="274" y="302" font-weight="700">lib/pricing.js</text>
  <text x="274" y="326" class="small">subtotal · computeTotals</text>
  <rect x="484" y="276" width="205" height="85" rx="9" class="lib"/>
  <text x="500" y="302" font-weight="700">lib/coupons.js</text>
  <text x="500" y="326" class="small">normalizeCode · validate · calculateDiscount</text>
  <rect x="710" y="276" width="205" height="85" rx="9" class="ticket"/>
  <text x="726" y="302" font-weight="700">lib/invoice.js</text>
  <text x="726" y="326" class="small">computeInvoiceFigures · render</text>
  <rect x="936" y="276" width="232" height="85" rx="9" class="ticket"/>
  <text x="952" y="302" font-weight="700">lib/tax.js</text>
  <text x="952" y="326" class="small">getRateForItem · splitCgstSgst</text>

  <rect x="32" y="389" width="205" height="80" rx="9" class="lib"/>
  <text x="48" y="415" font-weight="700">lib/orders.js</text><text x="48" y="440" class="small">add · get · cancel · list</text>
  <rect x="258" y="389" width="205" height="80" rx="9" class="lib"/>
  <text x="274" y="415" font-weight="700">lib/ledger.js</text><text x="274" y="440" class="small">Khata billing · settlements</text>
  <rect x="484" y="389" width="205" height="80" rx="9" class="lib"/>
  <text x="500" y="415" font-weight="700">lib/store.js</text><text x="500" y="440" class="small">read · write · appendAudit</text>
  <rect x="710" y="389" width="205" height="80" rx="9" class="lib"/>
  <text x="726" y="415" font-weight="700">lib/reports.js</text><text x="726" y="440" class="small">dashboard · GST reconciliation</text>
  <rect x="936" y="389" width="232" height="80" rx="9" class="lib"/>
  <text x="952" y="415" font-weight="700">lib/dates.js</text><text x="952" y="440" class="small">today · date normalization · fiscal year</text>

  <!-- Numbered order placement flow: route orchestration and its business/data calls -->
  <path d="M630 225 V245 H135 V268" class="flow"/>
  <circle cx="135" cy="252" r="12" class="num"/><text x="135" y="256" class="numtext">1</text>
  <path d="M135 361 V381" class="flow"/>
  <circle cx="135" cy="373" r="12" class="num"/><text x="135" y="377" class="numtext">2</text>
  <path d="M630 225 V260 H360 V268" class="flow"/>
  <circle cx="360" cy="252" r="12" class="num"/><text x="360" y="256" class="numtext">3</text>
  <path d="M360 361 V379 H585 V381" class="flow"/>
  <circle cx="585" cy="373" r="12" class="num"/><text x="585" y="377" class="numtext">4</text>
  <path d="M360 361 V372 H1040 V268" class="flow"/>
  <circle cx="1040" cy="252" r="12" class="num"/><text x="1040" y="256" class="numtext">5</text>
  <path d="M630 225 V235 H135 V381" class="flow"/>
  <circle cx="202" cy="235" r="12" class="num"/><text x="202" y="239" class="numtext">6</text>
  <path d="M630 225 V240 H585 V381" class="flow"/>
  <circle cx="500" cy="240" r="12" class="num"/><text x="500" y="244" class="numtext">7</text>

  <text x="32" y="512" class="zone">ORDER FLOW · numbered teal connectors start at routes/orders.js</text>
  <text x="32" y="538"><tspan font-weight="700" fill="#087e8b">1</tspan><tspan dx="8">Load JSON state and resolve products via store.read() + inventory.find().</tspan></text>
  <text x="32" y="563"><tspan font-weight="700" fill="#087e8b">2</tspan><tspan dx="8">Check availability with inventory.check().</tspan></text>
  <text x="32" y="588"><tspan font-weight="700" fill="#087e8b">3</tspan><tspan dx="8">Compute subtotal and validate coupon: pricing.subtotal() → coupons.validate().</tspan></text>
  <text x="32" y="613"><tspan font-weight="700" fill="#087e8b">4</tspan><tspan dx="8">Compute discounted taxable lines, GST slabs and total: pricing.computeTotals() → tax.getRateForItem().</tspan></text>
  <text x="32" y="638"><tspan font-weight="700" fill="#087e8b">5</tspan><tspan dx="8">If Khata: charge customer with ledger.chargeOrderToKhata().</tspan></text>
  <text x="32" y="663"><tspan font-weight="700" fill="#087e8b">6</tspan><tspan dx="8">Deduct stock and create order: inventory.reserve() → orders.add() (dates.today()).</tspan></text>
  <text x="32" y="688"><tspan font-weight="700" fill="#087e8b">7</tspan><tspan dx="8">Append audit and persist full JSON: store.appendAudit() → store.write() → data/db.json.</tspan></text>

  <rect x="32" y="715" width="205" height="58" rx="9" class="config"/>
  <text x="48" y="741" font-weight="700">config.js</text><text x="48" y="761" class="small">shop · GST slabs · coupons · settings</text>
  <rect x="258" y="715" width="230" height="58" rx="9" class="store"/>
  <text x="274" y="741" font-weight="700">data/db.json</text><text x="274" y="761" class="small">products · orders · customers · ledger</text>
  <path d="M590 469 V699 H373 V708" class="line"/>
  <path d="M596 361 V700 H167 V708" class="line"/>
  <path d="M590 469 V698 H373 V708" class="line"/>
  <text x="540" y="744" class="small">store.read() / store.write()</text>
  <path d="M1040 361 V695 H270 V708" class="line"/>
  <text x="536" y="770" class="small">config feeds tax, coupons, and shop invoice details</text>

  <rect x="824" y="715" width="344" height="58" rx="9" class="box"/>
  <rect x="841" y="730" width="18" height="18" rx="3" class="ticket"/>
  <text x="869" y="744" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="841" y="751" width="18" height="14" rx="3" class="ticket"/>
  <text x="869" y="763" class="small">lib/tax.js highlighted: used by checkout pricing</text>
  <path d="M812 214 V268" class="line"/>
  <text x="822" y="250" class="small">invoice route</text>
</svg>
