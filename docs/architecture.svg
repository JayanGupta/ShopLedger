<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture map of ShopLedger with browser, Express server, routes, library modules and JSON storage. Numbered path traces order placement.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
    .title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#475569}
    .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:9}
    .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;rx:13}
    .head{font-size:16px;font-weight:700}.small{font-size:12px;fill:#475569}
    .highlight{fill:#fff4d6;stroke:#d97706;stroke-width:2.4;rx:9}
    .highlightText{fill:#7c3e00}
    .connector{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}
    .flowLabel{fill:#1d4ed8;font-weight:700;font-size:12px}
    .badge{fill:#2563eb;stroke:#fff;stroke-width:2}
    .badgeText{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#f1f5f9"/>
<text x="32" y="38" class="title">ShopLedger · application architecture</text>
<text x="32" y="62" class="sub">Browser POS → Express API → business modules → JSON file</text>

<!-- browser and app entry -->
<rect x="28" y="90" width="212" height="135" class="group"/>
<text x="44" y="116" class="head">Browser UI</text>
<rect x="44" y="128" width="180" height="76" class="box"/>
<text x="57" y="151" font-weight="700">public/</text>
<text x="57" y="172" class="small">index.html · js/app.js · css/style.css</text>

<rect x="280" y="90" width="195" height="135" class="group"/>
<text x="296" y="116" class="head">Express application</text>
<rect x="296" y="128" width="163" height="76" class="box"/>
<text x="309" y="153" font-weight="700">server.js</text>
<text x="309" y="174" class="small">static UI · mounts routers</text>

<path d="M224 165 H296" class="connector"/><text x="238" y="153" class="small">HTTP</text>
<path d="M459 165 H493 V256 H514" class="connector"/>

<!-- route group -->
<rect x="500" y="90" width="270" height="405" class="group"/>
<text x="518" y="116" class="head">routes/ · mounted at /api</text>
<rect x="518" y="132" width="234" height="66" class="box"/>
<text x="532" y="157" font-weight="700">orders.js</text><text x="532" y="180" class="small">GET /orders · POST /orders · cancel</text>
<rect x="518" y="210" width="234" height="55" class="box"/>
<text x="532" y="234" font-weight="700">products.js</text><text x="532" y="253" class="small">products · coupons</text>
<rect x="518" y="277" width="234" height="55" class="box"/>
<text x="532" y="301" font-weight="700">customers.js</text><text x="532" y="320" class="small">customers · settle</text>
<rect x="518" y="344" width="234" height="72" class="box"/>
<text x="532" y="368" font-weight="700">reports.js</text><text x="532" y="389" class="small">dashboard · GST reconcile · pricing preview</text>
<text x="518" y="453" class="small">Invoice page route: server.js → /orders/:id/invoice</text>

<!-- lib group -->
<rect x="800" y="90" width="370" height="565" class="group"/>
<text x="818" y="116" class="head">lib/ · business logic</text>
<rect x="818" y="132" width="155" height="58" class="box"/>
<text x="832" y="156" font-weight="700">pricing.js</text><text x="832" y="176" class="small">computeTotals()</text>
<rect x="992" y="132" width="160" height="58" class="box"/>
<text x="1006" y="156" font-weight="700">coupons.js</text><text x="1006" y="176" class="small">validate · discount</text>
<rect x="818" y="207" width="155" height="58" class="box"/>
<text x="832" y="231" font-weight="700">tax.js</text><text x="832" y="251" class="small">HSN slab · CGST/SGST</text>
<rect x="992" y="207" width="160" height="58" class="box"/>
<text x="1006" y="231" font-weight="700">inventory.js</text><text x="1006" y="251" class="small">check · reserve</text>
<rect x="818" y="282" width="155" height="58" class="box"/>
<text x="832" y="306" font-weight="700">orders.js</text><text x="832" y="326" class="small">add · get · cancel</text>
<rect x="992" y="282" width="160" height="58" class="box"/>
<text x="1006" y="306" font-weight="700">ledger.js</text><text x="1006" y="326" class="small">Khata · settlements</text>
<rect x="818" y="357" width="155" height="58" class="highlight"/>
<text x="832" y="381" class="head highlightText">invoice.js</text><text x="832" y="401" class="small highlightText">computeInvoiceFigures · render</text>
<rect x="992" y="357" width="160" height="58" class="box"/>
<text x="1006" y="381" font-weight="700">reports.js</text><text x="1006" y="401" class="small">summary · reconciliation</text>
<rect x="818" y="432" width="155" height="58" class="box"/>
<text x="832" y="456" font-weight="700">store.js</text><text x="832" y="476" class="small">read · write · audit</text>
<rect x="992" y="432" width="160" height="58" class="box"/>
<text x="1006" y="456" font-weight="700">dates.js</text><text x="1006" y="476" class="small">today · date keys</text>
<text x="818" y="527" class="small">tax.js is used by checkout pricing;</text>
<text x="818" y="546" class="small">invoice.js recalculates figures separately.</text>

<!-- config and persistence -->
<rect x="500" y="525" width="270" height="92" class="group"/>
<rect x="518" y="542" width="234" height="58" class="box"/>
<text x="532" y="566" font-weight="700">config.js</text><text x="532" y="586" class="small">shop · tax/HSN slabs · coupons · port</text>
<rect x="500" y="650" width="270" height="94" class="group"/>
<rect x="518" y="667" width="234" height="59" class="box"/>
<text x="532" y="691" font-weight="700">data/db.json</text><text x="532" y="711" class="small">products · orders · customers · ledger</text>

<!-- routes to modules -->
<path d="M752 164 H818" class="connector"/>
<path d="M752 164 H785 V236 H992" class="connector"/>
<path d="M752 164 H790 V310 H818" class="connector"/>
<path d="M752 164 H780 V310 H992" class="connector"/>
<path d="M752 380 H790 V386 H992" class="connector"/>
<path d="M752 380 H800 V386 H973" class="connector"/>
<path d="M752 453 H800 V461 H818" class="connector"/>
<path d="M752 571 H818 V236" class="connector"/>
<path d="M752 571 H785 V160 H992" class="connector"/>
<path d="M895 190 V207" class="connector"/>
<path d="M973 161 H992" class="connector"/>
<path d="M895 340 V357" class="connector"/>
<path d="M1072 340 V357" class="connector"/>
<path d="M895 415 V432" class="connector"/>
<path d="M1072 415 V432" class="connector"/>
<path d="M973 461 H992" class="connector"/>
<path d="M895 490 V635 H650 V667" class="connector"/>
<path d="M459 195 V572 H500" class="connector"/>

<!-- numbered order flow overlays -->
<path d="M224 185 H280" class="flow"/><circle cx="252" cy="185" r="12" class="badge"/><text x="252" y="189" class="badgeText">1</text>
<path d="M459 147 H500" class="flow"/><circle cx="480" cy="147" r="12" class="badge"/><text x="480" y="151" class="badgeText">2</text>
<path d="M752 152 H818" class="flow"/><circle cx="785" cy="152" r="12" class="badge"/><text x="785" y="156" class="badgeText">3</text>
<path d="M752 174 H992" class="flow"/><circle cx="875" cy="174" r="12" class="badge"/><text x="875" y="178" class="badgeText">4</text>
<path d="M752 186 H818 V310" class="flow"/><circle cx="785" cy="201" r="12" class="badge"/><text x="785" y="205" class="badgeText">5</text>
<path d="M752 190 H790 V310 H992" class="flow"/><circle cx="785" cy="280" r="12" class="badge"/><text x="785" y="284" class="badgeText">6</text>
<path d="M752 193 H800 V461 H818" class="flow"/><circle cx="785" cy="440" r="12" class="badge"/><text x="785" y="444" class="badgeText">7</text>

<!-- footer flow legend -->
<rect x="800" y="680" width="370" height="64" class="group"/>
<circle cx="825" cy="704" r="12" class="badge"/><text x="825" y="708" class="badgeText">1</text>
<text x="845" y="709" class="small">1 UI request → 2 server.js routes POST /orders</text>
<circle cx="825" cy="729" r="12" class="badge"/><text x="825" y="733" class="badgeText">2</text>
<text x="845" y="734" class="small">3–7 validate · price/coupon · order · Khata · save</text>
<text x="818" y="635" class="small">3 pricing + GST · 4 coupon · 5 order record · 6 Khata · 7 persist JSON</text>

<!-- legend -->
<rect x="28" y="760" width="1142" height="28" fill="#fff" stroke="#cbd5e1" rx="7"/>
<rect x="44" y="767" width="20" height="14" class="highlight"/><text x="72" y="780" class="small">Ticket focus: lib/invoice.js</text>
<line x1="280" y1="774" x2="320" y2="774" class="connector"/><text x="332" y="780" class="small">Module dependency / data access</text>
<line x1="575" y1="774" x2="615" y2="774" class="flow"/><circle cx="595" cy="774" r="9" class="badge"/><text x="595" y="778" class="badgeText">#</text><text x="625" y="780" class="small">Numbered order-placement path</text>
<text x="875" y="780" class="small">tax.js shown as checkout dependency; invoice.js does not call it.</text>
</svg>

