<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Architecture diagram of ShopLedger Node and Express app, its browser UI, routers, library modules, configuration, JSON database, invoice rendering, and numbered checkout flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
      .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.head{font-size:16px;font-weight:700}
      .small{font-size:12px;fill:#475569}.module{font-size:13px;font-weight:600}
      .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}
      .focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.focusText{fill:#9f1239;font-weight:700}
      .pill{fill:#dbeafe;stroke:#60a5fa}.num{font-size:12px;font-weight:700;fill:#1d4ed8;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="40" class="title">ShopLedger | application architecture</text>
  <text x="32" y="63" class="sub">Node / Express POS, Khata ledger, inventory and GST invoicing · solid gray = dependency/data access · blue = order placement sequence</text>

  <!-- Browser UI -->
  <rect x="30" y="105" width="210" height="126" rx="10" class="box"/>
  <text x="48" y="132" class="head">Browser UI</text>
  <text x="48" y="155" class="module">public/</text>
  <text x="48" y="178" class="small">index.html · css/style.css</text>
  <text x="48" y="198" class="small">js/app.js · POS &amp; reports</text>
  <text x="48" y="218" class="small">POST /api/orders</text>

  <!-- Server -->
  <rect x="300" y="105" width="210" height="126" rx="10" class="box"/>
  <text x="320" y="133" class="head">Express app</text>
  <text x="320" y="157" class="module">server.js</text>
  <text x="320" y="180" class="small">static files + JSON body parser</text>
  <text x="320" y="201" class="small">mounts routers at /api</text>
  <text x="320" y="220" class="small">GET /orders/:id/invoice</text>
  <path d="M240 166 H300" class="edge"/>

  <!-- Routers -->
  <rect x="570" y="92" width="270" height="201" rx="10" class="box"/>
  <text x="590" y="119" class="head">routes/ (mounted at /api)</text>
  <rect x="590" y="132" width="230" height="31" rx="6" class="pill"/><text x="602" y="153" class="module">1 · orders.js · POST /orders</text>
  <rect x="590" y="169" width="230" height="27" rx="6" class="box"/><text x="602" y="188" class="module">products.js · products, coupons</text>
  <rect x="590" y="202" width="230" height="27" rx="6" class="box"/><text x="602" y="221" class="module">customers.js · customers, settle</text>
  <rect x="590" y="235" width="230" height="27" rx="6" class="box"/><text x="602" y="254" class="module">reports.js · dashboard, preview</text>
  <text x="590" y="281" class="small">Also: cancellation, export, reconciliation</text>
  <path d="M510 166 H570" class="edge"/>

  <!-- Libraries -->
  <rect x="865" y="92" width="305" height="426" rx="10" class="box"/>
  <text x="885" y="119" class="head">lib/ business modules</text>
  <rect x="885" y="132" width="265" height="43" rx="7" class="focus"/>
  <text x="899" y="151" class="module focusText">invoice.js  ★ ticket focus</text><text x="899" y="168" class="small">computeInvoiceFigures() · render()</text>
  <rect x="885" y="183" width="265" height="31" rx="7" class="box"/><text x="899" y="204" class="module">pricing.js · subtotal, computeTotals</text>
  <rect x="885" y="220" width="265" height="31" rx="7" class="focus"/><text x="899" y="241" class="module focusText">tax.js · GST rate + CGST/SGST split</text>
  <rect x="885" y="257" width="265" height="31" rx="7" class="box"/><text x="899" y="278" class="module">coupons.js · validate, calculateDiscount</text>
  <rect x="885" y="294" width="265" height="31" rx="7" class="box"/><text x="899" y="315" class="module">inventory.js · check, reserve, release</text>
  <rect x="885" y="331" width="265" height="31" rx="7" class="box"/><text x="899" y="352" class="module">orders.js · add, get, cancel, list</text>
  <rect x="885" y="368" width="265" height="31" rx="7" class="box"/><text x="899" y="389" class="module">ledger.js · Khata + settlements</text>
  <rect x="885" y="405" width="265" height="31" rx="7" class="box"/><text x="899" y="426" class="module">reports.js · summary, reconciliation</text>
  <rect x="885" y="442" width="265" height="31" rx="7" class="box"/><text x="899" y="463" class="module">store.js · read, write, appendAudit</text>
  <rect x="885" y="479" width="265" height="27" rx="7" class="box"/><text x="899" y="498" class="module">dates.js · date helpers</text>
  <path d="M840 180 H865" class="edge"/>
  <path d="M840 245 C850 245 852 205 865 205" class="edge"/>

  <!-- Config + DB -->
  <rect x="570" y="330" width="250" height="76" rx="10" class="box"/>
  <text x="590" y="357" class="head">config.js</text><text x="590" y="381" class="small">shop · tax slabs · coupons · defaults</text>
  <rect x="570" y="440" width="250" height="82" rx="10" class="box"/>
  <text x="590" y="468" class="head">data/db.json</text><text x="590" y="491" class="small">products · orders · customers</text><text x="590" y="511" class="small">settlements · auditLog · counters</text>
  <path d="M820 368 C844 368 850 237 885 237" class="edge"/>
  <path d="M820 382 C850 382 850 270 885 270" class="edge"/>
  <path d="M820 479 H850 V457 H885" class="edge"/>
  <path d="M820 480 C850 480 850 350 885 350" class="edge"/>

  <!-- Invoice route -->
  <rect x="300" y="265" width="235" height="76" rx="10" class="focus"/>
  <text x="318" y="292" class="module focusText">Printable invoice route</text>
  <text x="318" y="315" class="small">server.js → orders.get() →</text>
  <text x="318" y="333" class="small">invoice.render(order)</text>
  <path d="M405 231 V265" class="edge"/>
  <path d="M535 303 C690 303 740 154 885 154" class="edge"/>

  <!-- Flow -->
  <text x="32" y="379" class="head">Order placement · POST /api/orders</text>
  <text x="32" y="402" class="small">Numbers are the execution sequence in routes/orders.js; checkout tax flows through pricing.js → tax.js.</text>
  <g>
    <rect x="32" y="425" width="250" height="91" rx="10" class="box"/><circle cx="53" cy="446" r="14" fill="#dbeafe"/><text x="53" y="450" class="num">1</text>
    <text x="76" y="450" class="module">Resolve + validate cart</text><text x="48" y="477" class="small">store.read() · inventory.find()</text><text x="48" y="497" class="small">inventory.check()</text>
    <rect x="322" y="425" width="250" height="91" rx="10" class="box"/><circle cx="343" cy="446" r="14" fill="#dbeafe"/><text x="343" y="450" class="num">2</text>
    <text x="366" y="450" class="module">Compute checkout totals</text><text x="338" y="477" class="small">pricing.subtotal() + coupons.validate()</text><text x="338" y="497" class="small">pricing.computeTotals() → tax.js</text>
    <rect x="612" y="425" width="250" height="91" rx="10" class="box"/><circle cx="633" cy="446" r="14" fill="#dbeafe"/><text x="633" y="450" class="num">3</text>
    <text x="656" y="450" class="module">Apply credit + stock</text><text x="628" y="477" class="small">ledger.chargeOrderToKhata()</text><text x="628" y="497" class="small">inventory.reserve()</text>
    <rect x="32" y="548" width="250" height="91" rx="10" class="box"/><circle cx="53" cy="569" r="14" fill="#dbeafe"/><text x="53" y="573" class="num">4</text>
    <text x="76" y="573" class="module">Create order record</text><text x="48" y="600" class="small">orders.add() → db.orders</text><text x="48" y="620" class="small">id, items, coupon, totals, status</text>
    <rect x="322" y="548" width="250" height="91" rx="10" class="box"/><circle cx="343" cy="569" r="14" fill="#dbeafe"/><text x="343" y="573" class="num">5</text>
    <text x="366" y="573" class="module">Persist JSON database</text><text x="338" y="600" class="small">store.appendAudit() · store.write()</text><text x="338" y="620" class="small">writes data/db.json</text>
    <rect x="612" y="548" width="250" height="91" rx="10" class="focus"/><text x="628" y="575" class="module focusText">Invoice computed separately</text><text x="628" y="602" class="small">invoice.computeInvoiceFigures()</text><text x="628" y="622" class="small">renders HTML; compares recorded total</text>
  </g>
  <path d="M282 470 H322" class="flow"/><path d="M572 470 H612" class="flow"/>
  <path d="M737 516 V548 H282" class="flow"/><path d="M282 593 H322" class="flow"/>
  <path d="M572 593 H612" class="edge"/>

  <!-- Data and legend -->
  <path d="M1000 518 V554 H820 V480" class="edge"/>
  <rect x="895" y="562" width="275" height="104" rx="10" class="box"/>
  <text x="915" y="589" class="head">Legend</text>
  <rect x="915" y="602" width="18" height="14" rx="3" class="focus"/><text x="944" y="615" class="small">Ticket focus / invoice logic</text>
  <path d="M915 637 H945" class="flow"/><text x="955" y="642" class="small">Numbered checkout flow</text>
  <path d="M32 698 H1168" stroke="#cbd5e1"/>
  <text x="32" y="726" class="small">Invoice flow is distinct from checkout: invoice.js recomputes line tax/discount using its own rules; reports.js compares invoice figures with stored order totals.</text>
  <text x="32" y="750" class="small">Checked module names and function references against the source tree; no unverified modules are shown.</text>
</svg>
