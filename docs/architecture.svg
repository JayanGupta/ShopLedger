<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order placement flow</title>
  <desc id="desc">Browser UI connects to Express server routes, library modules, configuration and JSON data. Numbered arrows trace placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52616b"/></marker>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1769aa"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #52616b; }
      .section { font-size: 14px; font-weight: 700; fill: #33424f; }
      .box { fill: #f7fafc; stroke: #91a4b5; stroke-width: 1.4; rx: 7; }
      .server { fill: #eaf3f8; stroke: #397a9d; stroke-width: 2; rx: 8; }
      .route { fill: #eef5ff; stroke: #5c87b5; stroke-width: 1.3; rx: 6; }
      .lib { fill: #f8f4ec; stroke: #a58b5b; stroke-width: 1.2; rx: 6; }
      .focus { fill: #fff0d7; stroke: #d07716; stroke-width: 2.3; rx: 6; }
      .data { fill: #edf7ef; stroke: #54896b; stroke-width: 1.8; rx: 8; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; fill: #40515e; }
      .line { fill: none; stroke: #758593; stroke-width: 1.2; marker-end: url(#arrow); }
      .fline { fill: none; stroke: #1769aa; stroke-width: 2.4; marker-end: url(#flow); }
      .step { fill: #1769aa; }
      .steptext { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="34" y="38" class="title">ShopLedger architecture</text>
  <text x="34" y="59" class="subtitle">Node/Express POS, Khata credit ledger, GST checkout, and printable invoices</text>

  <text x="38" y="98" class="section">Browser</text>
  <rect x="38" y="112" width="196" height="132" class="box"/>
  <text x="54" y="139" class="label">public/</text>
  <text x="54" y="162" class="small">index.html</text>
  <text x="54" y="181" class="small">js/app.js</text>
  <text x="54" y="200" class="small">css/style.css</text>
  <text x="54" y="225" class="small">POS · orders · Khata · audit</text>

  <text x="285" y="98" class="section">Application</text>
  <rect x="285" y="112" width="214" height="132" class="server"/>
  <text x="302" y="141" class="label">server.js</text>
  <text x="302" y="164" class="small">Express + bodyParser.json()</text>
  <text x="302" y="184" class="small">static public/</text>
  <text x="302" y="204" class="small">/api route mounts</text>
  <text x="302" y="224" class="small">/orders/:id/invoice</text>

  <text x="547" y="98" class="section">routes/</text>
  <rect x="547" y="112" width="220" height="57" class="route"/>
  <text x="561" y="135" class="label">products.js</text>
  <text x="561" y="155" class="small">GET /products · GET /coupons</text>
  <rect x="547" y="181" width="220" height="57" class="route"/>
  <text x="561" y="204" class="label">orders.js</text>
  <text x="561" y="224" class="small">POST /orders · cancel/list/get</text>
  <rect x="779" y="112" width="220" height="57" class="route"/>
  <text x="793" y="135" class="label">customers.js</text>
  <text x="793" y="155" class="small">GET /customers · settle</text>
  <rect x="779" y="181" width="220" height="57" class="route"/>
  <text x="793" y="204" class="label">reports.js</text>
  <text x="793" y="224" class="small">dashboard · reconciliation · preview</text>

  <rect x="1038" y="112" width="128" height="78" class="box"/>
  <text x="1053" y="138" class="label">config.js</text>
  <text x="1053" y="159" class="small">shop · slabs</text>
  <text x="1053" y="177" class="small">coupons</text>

  <path d="M234 178 H282" class="line"/>
  <path d="M499 178 H543" class="line"/>
  <path d="M499 178 H525 V210 H543" class="line"/>
  <path d="M499 178 H765 V140 H775" class="line"/>
  <path d="M499 178 H765 V210 H775" class="line"/>

  <text x="38" y="284" class="section">lib/</text>
  <rect x="38" y="299" width="175" height="62" class="lib"/>
  <text x="50" y="324" class="label">store.js</text><text x="50" y="345" class="small">read · write · appendAudit</text>
  <rect x="225" y="299" width="175" height="62" class="lib"/>
  <text x="237" y="324" class="label">inventory.js</text><text x="237" y="345" class="small">find · check · reserve · release</text>
  <rect x="412" y="299" width="175" height="62" class="lib"/>
  <text x="424" y="324" class="label">orders.js</text><text x="424" y="345" class="small">add · get · cancel · list</text>
  <rect x="599" y="299" width="175" height="62" class="lib"/>
  <text x="611" y="324" class="label">ledger.js</text><text x="611" y="345" class="small">chargeOrderToKhata · settlement</text>
  <rect x="786" y="299" width="175" height="62" class="lib"/>
  <text x="798" y="324" class="label">pricing.js</text><text x="798" y="345" class="small">subtotal · computeTotals</text>
  <rect x="973" y="299" width="175" height="62" class="lib"/>
  <text x="985" y="324" class="label">coupons.js</text><text x="985" y="345" class="small">validate · calculateDiscount</text>

  <rect x="38" y="377" width="175" height="62" class="focus"/>
  <text x="50" y="402" class="label">tax.js</text><text x="50" y="423" class="small">getRateForItem · splitCgstSgst</text>
  <rect x="225" y="377" width="175" height="62" class="focus"/>
  <text x="237" y="402" class="label">invoice.js</text><text x="237" y="423" class="small">computeInvoiceFigures · render</text>
  <rect x="412" y="377" width="175" height="62" class="lib"/>
  <text x="424" y="402" class="label">reports.js</text><text x="424" y="423" class="small">dashboard · GST reconciliation</text>
  <rect x="599" y="377" width="175" height="62" class="lib"/>
  <text x="611" y="402" class="label">dates.js</text><text x="611" y="423" class="small">today · normalizeDateKey</text>

  <rect x="878" y="385" width="270" height="71" class="data"/>
  <text x="897" y="413" class="label">data/db.json</text>
  <text x="897" y="435" class="small">products · orders · customers · settlements · auditLog</text>
  <path d="M125 299 V270 H657 V240" class="line"/>
  <path d="M313 299 V270 H657" class="line"/>
  <path d="M499 299 V270 H657" class="line"/>
  <path d="M686 299 V270 H889 V240" class="line"/>
  <path d="M874 299 V270 H889" class="line"/>
  <path d="M1061 299 V270 H889" class="line"/>
  <path d="M1110 361 V385" class="line"/>
  <path d="M125 361 V377" class="line"/>
  <path d="M312 361 V377" class="line"/>
  <path d="M499 361 V377" class="line"/>
  <path d="M686 361 V377" class="line"/>
  <path d="M312 439 V471 H1013 V456" class="line"/>
  <path d="M1102 190 V278 H1060 V299" class="line"/>
  <path d="M1102 190 V369 H125 V377" class="line"/>

  <text x="38" y="501" class="section">Numbered flow: placing an order</text>
  <path d="M104 536 H304" class="fline"/><circle cx="83" cy="536" r="13" class="step"/><text x="79" y="540" class="steptext">1</text>
  <text x="52" y="565" class="small">public/js/app.js</text><text x="52" y="582" class="small">POST /api/orders</text>
  <path d="M337 536 H525" class="fline"/><circle cx="318" cy="536" r="13" class="step"/><text x="314" y="540" class="steptext">2</text>
  <text x="285" y="565" class="small">routes/orders.js</text><text x="285" y="582" class="small">resolve product lines</text>
  <path d="M558 536 H748" class="fline"/><circle cx="539" cy="536" r="13" class="step"/><text x="535" y="540" class="steptext">3</text>
  <text x="505" y="565" class="small">inventory.find/check</text><text x="505" y="582" class="small">stock validation</text>
  <path d="M781 536 H971" class="fline"/><circle cx="762" cy="536" r="13" class="step"/><text x="728" y="565" class="small">coupon validate +</text><text x="728" y="582" class="small">pricing.computeTotals</text>
  <path d="M1004 536 H1140" class="fline"/><circle cx="985" cy="536" r="13" class="step"/><text x="981" y="540" class="steptext">4</text>
  <text x="974" y="565" class="small">tax.getRateForItem</text><text x="974" y="582" class="small">per HSN line</text>

  <path d="M1120 625 H923" class="fline"/><circle cx="1142" cy="625" r="13" class="step"/><text x="1138" y="629" class="steptext">5</text>
  <text x="1006" y="656" class="small">optional: ledger.</text><text x="1006" y="673" class="small">chargeOrderToKhata</text>
  <path d="M890 625 H692" class="fline"/><circle cx="912" cy="625" r="13" class="step"/><text x="908" y="629" class="steptext">6</text>
  <text x="757" y="656" class="small">inventory.reserve</text><text x="757" y="673" class="small">deduct stock</text>
  <path d="M659 625 H462" class="fline"/><circle cx="681" cy="625" r="13" class="step"/><text x="677" y="629" class="steptext">7</text>
  <text x="527" y="656" class="small">orders.add</text><text x="527" y="673" class="small">push order / next ID</text>
  <path d="M429 625 H230" class="fline"/><circle cx="451" cy="625" r="13" class="step"/><text x="447" y="629" class="steptext">8</text>
  <text x="294" y="656" class="small">store.appendAudit</text><text x="294" y="673" class="small">then store.write</text>
  <path d="M197 625 H73" class="fline"/><circle cx="219" cy="625" r="13" class="step"/><text x="215" y="629" class="steptext">9</text>
  <text x="52" y="656" class="small">persist full JSON</text><text x="52" y="673" class="small">to data/db.json</text>

  <rect x="38" y="717" width="1090" height="52" fill="#fbfcfd" stroke="#c5d0d8" rx="6"/>
  <rect x="56" y="733" width="18" height="18" class="focus"/><text x="84" y="747" class="small">Ticket focus: invoice.js and tax.js</text>
  <rect x="321" y="733" width="18" height="18" class="data"/><text x="349" y="747" class="small">Persistent JSON data</text>
  <path d="M550 742 H587" class="fline"/><text x="598" y="747" class="small">Numbered order-placement flow</text>
  <path d="M858 742 H895" class="line"/><text x="906" y="747" class="small">Module dependency</text>
</svg>
