<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">Browser, Express server, four routers, ten library modules, configuration, and JSON data store. The right panel traces a successful order in eight steps. The printable invoice module is highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526981"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #192f46; font-size: 13px }
      .title { font-size: 34px; font-weight: 750 }
      .section { font-size: 16px; font-weight: 750 }
      .file { font-size: 15px; font-weight: 700 }
      .muted { fill: #425970 }
      .panel { fill: #edf3f8; stroke: #cddae6 }
      .card { fill: #fff; stroke: #b9cadb }
      .ticket { fill: #fff0dc; stroke: #ac5d19; stroke-width: 1.5 }
      .ticket-label { fill: #854112 }
      .link { fill: none; stroke: #526981; stroke-width: 1.5 }
      .arrow { marker-end: url(#arrow) }
      .number { fill: #254d72 }
      .digit { fill: #fff; text-anchor: middle; font-weight: 750 }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="54" class="title">ShopLedger</text>
  <text x="34" y="80" class="muted">Point of sale, Khata credit ledger, and GST invoices</text>
  <g transform="translate(818 43)">
    <rect width="18" height="18" rx="4" class="ticket"/>
    <text x="27" y="14">Ticket module</text>
    <path d="M143 9 H170" class="link arrow"/>
    <text x="180" y="14">Request or data access</text>
  </g>

  <rect x="32" y="114" width="276" height="100" rx="10" class="card"/>
  <text x="48" y="139" class="file">public/ · Browser UI</text>
  <text x="48" y="163">index.html, js/app.js, css/style.css</text>
  <text x="48" y="187" class="muted">Cart preview, checkout, invoice link</text>

  <path d="M308 163 H354" class="link arrow"/>
  <rect x="356" y="114" width="432" height="100" rx="10" class="card"/>
  <text x="372" y="139" class="file">server.js · Express</text>
  <text x="372" y="163">Serves public/ and mounts the four routers at /api</text>
  <text x="372" y="187" class="muted">GET /orders/:id/invoice calls invoice.render()</text>

  <rect x="32" y="250" width="756" height="116" rx="12" class="panel"/>
  <path d="M572 214 V239 H128 M572 239 H692" class="link"/>
  <path d="M128 239 V285 M316 239 V285 M504 239 V285 M692 239 V285" class="link"/>
  <path d="M128 274 V285 M316 274 V285 M504 274 V285 M692 274 V285" class="link arrow"/>
  <text x="48" y="274" class="section">routes/</text>
  <g transform="translate(44 286)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">products.js</text>
    <text x="12" y="46">Catalog and coupons</text>
  </g>
  <g transform="translate(232 286)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">orders.js</text>
    <text x="12" y="46">Place, list, cancel orders</text>
  </g>
  <g transform="translate(420 286)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">customers.js</text>
    <text x="12" y="46">Customers and payments</text>
  </g>
  <g transform="translate(608 286)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">reports.js</text>
    <text x="12" y="46">Reports, preview, export</text>
  </g>

  <rect x="32" y="382" width="756" height="284" rx="12" class="panel"/>
  <text x="48" y="408" class="section">lib/</text>
  <text x="89" y="408" class="muted">Business logic and storage used by the routes and invoice endpoint</text>
  <g transform="translate(44 420)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">inventory.js</text>
    <text x="12" y="46">Stock and reservations</text>
  </g>
  <g transform="translate(232 420)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">pricing.js</text>
    <text x="12" y="46">Checkout totals</text>
  </g>
  <g transform="translate(420 420)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">coupons.js</text>
    <text x="12" y="46">Eligibility and discounts</text>
  </g>
  <g transform="translate(608 420)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">tax.js</text>
    <text x="12" y="46">HSN rates and GST split</text>
  </g>
  <g transform="translate(44 498)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">ledger.js</text>
    <text x="12" y="46">Khata charges and payments</text>
  </g>
  <g transform="translate(232 498)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">orders.js</text>
    <text x="12" y="46">Order records and status</text>
  </g>
  <g transform="translate(420 498)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">dates.js</text>
    <text x="12" y="46">Dates and formatting</text>
  </g>
  <g transform="translate(608 498)">
    <rect width="168" height="64" rx="7" class="card"/>
    <text x="12" y="25" class="file">reports.js</text>
    <text x="12" y="46">Dashboard and GST checks</text>
  </g>
  <g transform="translate(44 576)">
    <rect width="544" height="72" rx="7" class="ticket"/>
    <text x="12" y="24" class="file ticket-label">invoice.js</text>
    <text x="12" y="45">computeInvoiceFigures() recomputes totals from saved items and config.js</text>
    <text x="12" y="62">render() prints those figures and flags a difference from the saved total</text>
  </g>
  <g transform="translate(608 576)">
    <rect width="168" height="72" rx="7" class="card"/>
    <text x="12" y="25" class="file">store.js</text>
    <text x="12" y="46">JSON reads and writes</text>
    <text x="12" y="63">Audit log</text>
  </g>

  <rect x="32" y="692" width="368" height="76" rx="10" class="card"/>
  <text x="48" y="720" class="file">config.js</text>
  <text x="48" y="744">Shop details, GST rates, coupon and stock rules</text>
  <path d="M692 648 V690" class="link arrow"/>
  <rect x="420" y="692" width="368" height="76" rx="10" class="card"/>
  <text x="436" y="720" class="file">data/db.json</text>
  <text x="436" y="744">Products, orders, customers, settlements, audit, IDs</text>

  <rect x="810" y="114" width="358" height="654" rx="12" class="panel"/>
  <text x="830" y="145" class="section">Placing an order</text>
  <path d="M842 178 V696" class="link"/>
  <g transform="translate(842 178)">
    <circle r="12" class="number"/><text y="5" class="digit">1</text>
    <text x="23" y="1" class="file">Submit the cart</text>
    <text x="23" y="21">public/ sends POST /api/orders</text>
    <text x="23" y="39">through server.js to routes/orders.js.</text>
  </g>
  <g transform="translate(842 252)">
    <circle r="12" class="number"/><text y="5" class="digit">2</text>
    <text x="23" y="1" class="file">Load the database</text>
    <text x="23" y="21">store.read() loads data/db.json.</text>
  </g>
  <g transform="translate(842 326)">
    <circle r="12" class="number"/><text y="5" class="digit">3</text>
    <text x="23" y="1" class="file">Resolve items and check stock</text>
    <text x="23" y="21">inventory.find() gets catalog details.</text>
    <text x="23" y="39">inventory.check() checks sellable stock.</text>
  </g>
  <g transform="translate(842 400)">
    <circle r="12" class="number"/><text y="5" class="digit">4</text>
    <text x="23" y="1" class="file">Validate coupon and price the order</text>
    <text x="23" y="21">coupons.validate() checks eligibility.</text>
    <text x="23" y="39">pricing.computeTotals() applies the coupon</text>
    <text x="23" y="57">before GST using tax.getRateForItem().</text>
  </g>
  <g transform="translate(842 474)">
    <circle r="12" class="number"/><text y="5" class="digit">5</text>
    <text x="23" y="1" class="file">Charge Khata when selected</text>
    <text x="23" y="21">ledger.chargeOrderToKhata() checks credit</text>
    <text x="23" y="39">and updates the customer's balance.</text>
  </g>
  <g transform="translate(842 548)">
    <circle r="12" class="number"/><text y="5" class="digit">6</text>
    <text x="23" y="1" class="file">Deduct stock and record the order</text>
    <text x="23" y="21">inventory.reserve() deducts physical stock.</text>
    <text x="23" y="39">orders.add() assigns the ID and saves the</text>
    <text x="23" y="57">dated order, item details, and totals in memory.</text>
  </g>
  <g transform="translate(842 622)">
    <circle r="12" class="number"/><text y="5" class="digit">7</text>
    <text x="23" y="1" class="file">Write the updated database</text>
    <text x="23" y="21">store.appendAudit() adds ORDER_CREATED.</text>
    <text x="23" y="39">store.write() rewrites data/db.json.</text>
  </g>
  <g transform="translate(842 696)">
    <circle r="12" class="number"/><text y="5" class="digit">8</text>
    <text x="23" y="1" class="file">Return the saved order</text>
    <text x="23" y="21">HTTP 201 sends the order back to the UI,</text>
    <text x="23" y="39">which offers a separate printable invoice.</text>
  </g>
</svg>
