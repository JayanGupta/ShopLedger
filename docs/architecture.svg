<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture and order placement flow</title>
  <desc id="desc">Browser UI served by Express, four API routers, application modules, configuration, and JSON persistence. A numbered sequence traces placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .section { font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: .3px; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; }
      .muted { font-size: 12px; fill: #475569; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; rx: 14; }
      .ticket { fill: #fff1e8; stroke: #ea7a35; stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#flowArrow); }
      .link { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 4; }
      .step { fill: #2563eb; stroke: #fff; stroke-width: 2; }
      .stepnum { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="38" class="title">ShopLedger · application architecture</text>
  <text x="32" y="60" class="subtitle">Express app · browser UI · JSON file persistence · numbered order placement path</text>

  <!-- Browser UI -->
  <rect x="30" y="92" width="245" height="189" class="group"/>
  <text x="48" y="117" class="section">BROWSER UI · public/</text>
  <rect x="48" y="132" width="209" height="39" class="box"/>
  <text x="62" y="156" class="label">index.html</text>
  <rect x="48" y="181" width="209" height="39" class="box"/>
  <text x="62" y="205" class="label">js/app.js</text>
  <rect x="48" y="230" width="209" height="35" class="box"/>
  <text x="62" y="253" class="label">css/style.css</text>
  <text x="63" y="277" class="muted">POS · orders · customers · reports</text>

  <!-- Server -->
  <rect x="320" y="92" width="270" height="189" class="group"/>
  <text x="338" y="117" class="section">HTTP SERVER</text>
  <rect x="345" y="134" width="220" height="78" class="box"/>
  <text x="365" y="159" class="label">server.js</text>
  <text x="365" y="180" class="small">serves public/ · mounts /api routers</text>
  <text x="365" y="198" class="small">GET /orders/:id/invoice</text>
  <rect x="345" y="225" width="220" height="40" class="box"/>
  <text x="365" y="250" class="label">config.js</text>

  <!-- Routers -->
  <rect x="635" y="92" width="535" height="189" class="group"/>
  <text x="653" y="117" class="section">API ROUTERS · mounted at /api</text>
  <rect x="653" y="132" width="238" height="53" class="box"/>
  <text x="668" y="153" class="label">routes/products.js</text>
  <text x="668" y="173" class="small">GET /products · GET /coupons</text>
  <rect x="909" y="132" width="243" height="53" class="box"/>
  <text x="924" y="153" class="label">routes/orders.js</text>
  <text x="924" y="173" class="small">GET /orders · POST /orders · cancel</text>
  <rect x="653" y="199" width="238" height="53" class="box"/>
  <text x="668" y="220" class="label">routes/customers.js</text>
  <text x="668" y="240" class="small">GET /customers · settle</text>
  <rect x="909" y="199" width="243" height="53" class="box"/>
  <text x="924" y="220" class="label">routes/reports.js</text>
  <text x="924" y="240" class="small">dashboard · GST recon · preview · export</text>

  <!-- Main order path -->
  <rect x="30" y="312" width="1140" height="205" class="group"/>
  <text x="48" y="338" class="section">PLACE AN ORDER · POST /api/orders</text>
  <rect x="50" y="365" width="190" height="112" class="box"/>
  <circle cx="58" cy="365" r="13" class="step"/><text x="58" y="365" class="stepnum">1</text>
  <text x="70" y="391" class="label">Browser submits</text>
  <text x="70" y="414" class="small">public/js/app.js</text>
  <text x="70" y="435" class="small">items · coupon · payment</text>
  <text x="70" y="456" class="small">POST /api/orders</text>

  <rect x="277" y="365" width="214" height="112" class="box"/>
  <circle cx="285" cy="365" r="13" class="step"/><text x="285" y="365" class="stepnum">2</text>
  <text x="297" y="391" class="label">Validate request</text>
  <text x="297" y="414" class="small">routes/orders.js</text>
  <text x="297" y="435" class="small">resolve products · check stock</text>
  <text x="297" y="456" class="small">validate coupon</text>

  <rect x="528" y="365" width="205" height="112" class="box"/>
  <circle cx="536" cy="365" r="13" class="step"/><text x="536" y="365" class="stepnum">3</text>
  <text x="548" y="391" class="label">Compute totals</text>
  <text x="548" y="414" class="small">lib/pricing.js</text>
  <text x="548" y="435" class="small">subtotal · discount · GST</text>
  <text x="548" y="456" class="small">lib/coupons.js + lib/tax.js</text>

  <rect x="770" y="365" width="188" height="112" class="box"/>
  <circle cx="778" cy="365" r="13" class="step"/><text x="778" y="365" class="stepnum">4</text>
  <text x="790" y="391" class="label">Apply side effects</text>
  <text x="790" y="414" class="small">optional Khata debit</text>
  <text x="790" y="435" class="small">reserve inventory</text>
  <text x="790" y="456" class="small">lib/ledger.js · inventory.js</text>

  <rect x="995" y="365" width="154" height="112" class="box"/>
  <circle cx="1003" cy="365" r="13" class="step"/><text x="1003" y="365" class="stepnum">5</text>
  <text x="1015" y="391" class="label">Persist &amp; reply</text>
  <text x="1015" y="414" class="small">lib/orders.js</text>
  <text x="1015" y="435" class="small">audit + store.write</text>
  <text x="1015" y="456" class="small">201 order response</text>

  <path d="M240 421 H270" class="flow"/><path d="M491 421 H521" class="flow"/><path d="M733 421 H763" class="flow"/><path d="M958 421 H988" class="flow"/>
  <path d="M1070 478 V496 H1100" class="flow"/>
  <text x="1110" y="500" class="small">saved</text>

  <!-- modules and data -->
  <rect x="30" y="546" width="750" height="220" class="group"/>
  <text x="48" y="571" class="section">APPLICATION MODULES · lib/</text>
  <rect x="48" y="588" width="220" height="39" class="box"/><text x="62" y="613" class="label">coupons.js</text>
  <rect x="281" y="588" width="220" height="39" class="box"/><text x="295" y="613" class="label">dates.js</text>
  <rect x="514" y="588" width="240" height="39" class="box"/><text x="528" y="613" class="label">inventory.js</text>
  <rect x="48" y="638" width="220" height="39" class="box"/><text x="62" y="663" class="label">ledger.js</text>
  <rect x="281" y="638" width="220" height="39" class="box"/><text x="295" y="663" class="label">orders.js</text>
  <rect x="514" y="638" width="240" height="39" class="box"/><text x="528" y="663" class="label">pricing.js</text>
  <rect x="48" y="688" width="220" height="39" class="box"/><text x="62" y="713" class="label">reports.js</text>
  <rect x="281" y="688" width="220" height="39" class="box"/><text x="295" y="713" class="label">store.js</text>
  <rect x="514" y="688" width="240" height="39" class="ticket"/><text x="528" y="713" class="label">tax.js  · ticket</text>

  <rect x="810" y="546" width="360" height="220" class="group"/>
  <text x="828" y="571" class="section">OUTPUTS &amp; DATA</text>
  <rect x="830" y="588" width="320" height="48" class="ticket"/>
  <text x="846" y="609" class="label">invoice.js  · ticket</text>
  <text x="846" y="627" class="small">computeInvoiceFigures · render HTML</text>
  <rect x="830" y="650" width="320" height="48" class="box"/>
  <text x="846" y="671" class="label">data/db.json</text>
  <text x="846" y="689" class="small">read/write via lib/store.js</text>
  <rect x="830" y="712" width="320" height="36" class="box"/>
  <text x="846" y="736" class="small">server.js invoice route → invoice.render(order)</text>

  <!-- architecture links -->
  <path d="M275 168 H337" class="link"/>
  <path d="M590 168 H645" class="link"/>
  <path d="M454 265 V300 H390 V365" class="link dash"/>
  <path d="M1068 252 V300 H400 V365" class="link dash"/>
  <path d="M635 477 V536 H634 V638" class="link dash"/>
  <path d="M854 477 V535 H400 V638" class="link dash"/>
  <path d="M1072 477 V535 H400 V708" class="link dash"/>
  <path d="M634 477 V550 H634 V688" class="link dash"/>
  <path d="M634 727 V742 H988 V698" class="link dash"/>
  <path d="M398 677 V699" class="link dash"/>
  <path d="M990 212 V546" class="link dash"/>
  <path d="M454 246 V546 H990 V650" class="link dash"/>
  <path d="M990 636 V712" class="link dash"/>

  <!-- Legend -->
  <rect x="804" y="92" width="366" height="0" fill="none"/>
  <rect x="852" y="756" width="16" height="14" class="ticket"/>
  <text x="876" y="768" class="small">Ticket modules</text>
  <line x1="1000" y1="763" x2="1033" y2="763" class="flow"/>
  <text x="1044" y="768" class="small">Order flow</text>
</svg>
