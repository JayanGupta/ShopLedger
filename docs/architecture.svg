<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the public browser UI, Express server, four route modules, all library modules, configuration and JSON storage. Numbered arrows show order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1565c0"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 24px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#475569}.group{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:10}.groupLabel{font:700 15px Arial,sans-serif;fill:#334155}.box{fill:#fff;stroke:#64748b;stroke-width:1.4;rx:7}.server{fill:#eef4ff;stroke:#2563eb;stroke-width:2;rx:8}.route{fill:#f8fafc;stroke:#64748b;stroke-width:1.3;rx:6}.lib{fill:#f0fdf4;stroke:#4d7c0f;stroke-width:1.3;rx:6}.ticket{fill:#fff0f6;stroke:#c02678;stroke-width:2;rx:6}.config{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4;rx:6}.data{fill:#f5f3ff;stroke:#6d28d9;stroke-width:1.5;rx:6}.t{font:700 13px Arial,sans-serif;fill:#172554}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:12px Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:1.3;marker-end:url(#arrow)}.flow{fill:none;stroke:#1565c0;stroke-width:2.2;marker-end:url(#flowArrow)}.num{fill:#1565c0}.numt{font:700 12px Arial,sans-serif;fill:#fff}.legend{font:12px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text x="32" y="38" class="title">ShopLedger — application architecture and order placement</text>
  <text x="32" y="60" class="sub">Node/Express POS, Khata ledger, GST checkout, reporting and printable invoices</text>

  <!-- Browser -->
  <rect x="32" y="100" width="192" height="155" class="group"/>
  <text x="48" y="126" class="groupLabel">Browser UI · public/</text>
  <rect x="48" y="143" width="160" height="43" class="box"/>
  <text x="60" y="161" class="t">index.html</text><text x="60" y="178" class="tiny">POS, orders, Khata, audit</text>
  <rect x="48" y="198" width="160" height="42" class="box"/>
  <text x="60" y="216" class="t">js/app.js</text><text x="60" y="232" class="tiny">API calls &amp; renderers</text>

  <!-- Server -->
  <rect x="280" y="130" width="185" height="94" class="server"/>
  <text x="298" y="157" class="t">server.js</text>
  <text x="298" y="178" class="small">Express + body-parser</text>
  <text x="298" y="197" class="tiny">/api mount · static public/</text>
  <text x="298" y="213" class="tiny">GET /orders/:id/invoice</text>
  <path d="M224 177 L280 177" class="flow"/>
  <circle cx="252" cy="165" r="11" class="num"/><text x="248" y="169" class="numt">1</text>

  <!-- Routes -->
  <rect x="520" y="88" width="275" height="260" class="group"/>
  <text x="536" y="114" class="groupLabel">routes/ · mounted at /api</text>
  <rect x="538" y="130" width="239" height="43" class="route"/><text x="550" y="148" class="t">products.js</text><text x="550" y="164" class="tiny">GET products · coupons</text>
  <rect x="538" y="184" width="239" height="50" class="route"/><text x="550" y="202" class="t">orders.js</text><text x="550" y="219" class="tiny">POST /orders · GET/list · cancel</text>
  <rect x="538" y="245" width="239" height="43" class="route"/><text x="550" y="263" class="t">customers.js</text><text x="550" y="279" class="tiny">customers · settle</text>
  <rect x="538" y="299" width="239" height="35" class="route"/><text x="550" y="321" class="t">reports.js · dashboard, preview, GST audit, export</text>
  <path d="M465 177 L520 210" class="flow"/>
  <circle cx="490" cy="180" r="11" class="num"/><text x="486" y="184" class="numt">2</text>

  <!-- Config / data -->
  <rect x="850" y="98" width="150" height="74" class="config"/><text x="866" y="122" class="t">config.js</text><text x="866" y="141" class="tiny">shop · tax slabs</text><text x="866" y="157" class="tiny">coupons · inventory</text>
  <rect x="1036" y="98" width="132" height="74" class="data"/><text x="1051" y="122" class="t">data/db.json</text><text x="1051" y="141" class="tiny">products, orders</text><text x="1051" y="157" class="tiny">customers, audit</text>

  <!-- Lib -->
  <rect x="280" y="390" width="888" height="295" class="group"/>
  <text x="298" y="416" class="groupLabel">lib/ · business logic</text>
  <rect x="300" y="436" width="155" height="54" class="lib"/><text x="312" y="456" class="t">store.js</text><text x="312" y="474" class="tiny">read · write · appendAudit</text>
  <rect x="470" y="436" width="155" height="54" class="lib"/><text x="482" y="456" class="t">inventory.js</text><text x="482" y="474" class="tiny">find · check · reserve</text>
  <rect x="640" y="436" width="155" height="54" class="lib"/><text x="652" y="456" class="t">pricing.js</text><text x="652" y="474" class="tiny">subtotal · computeTotals</text>
  <rect x="810" y="436" width="155" height="54" class="lib"/><text x="822" y="456" class="t">coupons.js</text><text x="822" y="474" class="tiny">validate · calculateDiscount</text>
  <rect x="980" y="436" width="168" height="54" class="lib"/><text x="992" y="456" class="t">orders.js</text><text x="992" y="474" class="tiny">add · get · cancel · list</text>
  <rect x="300" y="512" width="155" height="54" class="lib"/><text x="312" y="532" class="t">ledger.js</text><text x="312" y="550" class="tiny">charge · settlement</text>
  <rect x="470" y="512" width="155" height="54" class="lib"/><text x="482" y="532" class="t">dates.js</text><text x="482" y="550" class="tiny">today · normalizeDateKey</text>
  <rect x="640" y="512" width="155" height="54" class="lib"/><text x="652" y="532" class="t">reports.js</text><text x="652" y="550" class="tiny">dashboard · reconciliation</text>
  <rect x="810" y="512" width="155" height="54" class="ticket"/><text x="822" y="532" class="t">invoice.js ★</text><text x="822" y="550" class="tiny">computeInvoiceFigures · render</text>
  <rect x="980" y="512" width="168" height="54" class="ticket"/><text x="992" y="532" class="t">tax.js ★</text><text x="992" y="550" class="tiny">getRateForItem · splitCgstSgst</text>
  <text x="305" y="595" class="tiny">★ Ticket-focus modules: invoice.js is directly requested; tax.js is highlighted because pricing.js calls it to resolve checkout GST rates.</text>

  <!-- Order call links -->
  <path d="M657 234 L657 415 L377 415 L377 436" class="flow"/><circle cx="675" cy="380" r="11" class="num"/><text x="671" y="384" class="numt">3</text>
  <path d="M690 234 L690 415 L547 415 L547 436" class="flow"/><circle cx="710" cy="370" r="11" class="num"/><text x="706" y="374" class="numt">4</text>
  <path d="M720 234 L720 415 L717 415 L717 436" class="flow"/><circle cx="740" cy="370" r="11" class="num"/><text x="736" y="374" class="numt">5</text>
  <path d="M750 234 L750 415 L887 415 L887 436" class="flow"/><circle cx="770" cy="370" r="11" class="num"/><text x="766" y="374" class="numt">5</text>
  <path d="M775 234 L775 415 L1064 415 L1064 436" class="flow"/><circle cx="798" cy="370" r="11" class="num"/><text x="794" y="374" class="numt">6</text>
  <path d="M377 490 L377 512" class="flow"/><circle cx="394" cy="503" r="11" class="num"/><text x="390" y="507" class="numt">7</text>
  <path d="M1064 490 L1064 512" class="flow"/><circle cx="1082" cy="503" r="11" class="num"/><text x="1078" y="507" class="numt">8</text>
  <path d="M455 463 L1036 135" class="line"/><path d="M965 463 L850 135" class="line"/><path d="M1148 463 L1036 135" class="flow"/><circle cx="1096" cy="314" r="11" class="num"/><text x="1092" y="318" class="numt">9</text>

  <!-- Invoice route -->
  <path d="M465 201 L810 535" class="line"/>
  <text x="606" y="285" class="tiny">invoice endpoint: store.read → orders.get → invoice.render</text>

  <!-- Flow explanation -->
  <rect x="32" y="704" width="1136" height="72" class="group"/>
  <text x="48" y="728" class="groupLabel">Numbered order placement flow</text>
  <text x="48" y="750" class="small">1 UI POST /api/orders → 2 routes/orders.js → 3 store.read(db.json) → 4 inventory.find/check → 5 pricing.computeTotals + coupons.validate → 6 orders.add</text>
  <text x="48" y="768" class="small">7 Khata: ledger.chargeOrderToKhata (when selected) → 8 inventory.reserve → 9 store.appendAudit + store.write(db.json). Config feeds tax/coupon/inventory rules.</text>
  <rect x="1000" y="724" width="16" height="16" class="ticket"/><text x="1024" y="737" class="legend">Ticket focus</text>
  <rect x="1000" y="748" width="16" height="16" class="flow" style="marker-end:none"/><text x="1024" y="761" class="legend">Order flow</text>
</svg>
