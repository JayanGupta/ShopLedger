<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger, including its browser UI, Express server, routes, library modules, configuration, JSON data store, and numbered order flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526174}
      .section{font-size:15px;font-weight:700;letter-spacing:.5px;fill:#334155}
      .box-title{font-size:15px;font-weight:700}.body{font-size:12px;fill:#334155}
      .tiny{font-size:12px;fill:#475569}.flow{font-size:13px;font-weight:700}.num{fill:#fff;font-size:13px;font-weight:700}
      .node{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.highlight{fill:#fff4e6;stroke:#e28b2e;stroke-width:2}
      .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="sub">Node / Express POS · Khata credit ledger · GST invoicing</text>

  <text x="32" y="100" class="section">APP ENTRY POINTS &amp; STORAGE</text>
  <rect x="32" y="114" width="245" height="92" rx="9" class="node"/>
  <text x="50" y="140" class="box-title">Browser UI · public/</text>
  <text x="50" y="162" class="body">index.html · js/app.js · css/style.css</text>
  <text x="50" y="184" class="tiny">POS, order desk, customer ledger, reports</text>

  <rect x="378" y="114" width="294" height="92" rx="9" class="node"/>
  <text x="396" y="140" class="box-title">server.js · Express app</text>
  <text x="396" y="162" class="body">JSON body parser · static public/ · /api routers</text>
  <text x="396" y="184" class="tiny">GET /orders/:id/invoice → invoice.render()</text>

  <rect x="777" y="114" width="184" height="92" rx="9" class="node"/>
  <text x="795" y="140" class="box-title">config.js</text>
  <text x="795" y="162" class="body">shop · tax/HSN slabs</text>
  <text x="795" y="184" class="tiny">coupons · inventory · port</text>

  <rect x="1001" y="114" width="167" height="92" rx="9" class="node"/>
  <text x="1019" y="140" class="box-title">data/db.json</text>
  <text x="1019" y="162" class="body">products · orders</text>
  <text x="1019" y="184" class="tiny">customers · settlements · auditLog</text>

  <path d="M277 160 H378" class="line"/><text x="301" y="150" class="tiny">HTTP / JSON</text>
  <path d="M672 165 H1001" class="dashed"/><text x="796" y="154" class="tiny">lib/store.js read() / write()</text>
  <path d="M869 206 V224 H630" class="dashed"/>

  <text x="32" y="244" class="section">ROUTE MODULES · mounted under /api unless noted</text>
  <rect x="32" y="258" width="256" height="79" rx="8" class="node"/>
  <text x="48" y="281" class="box-title">routes/products.js</text>
  <text x="48" y="302" class="body">GET /products · GET /coupons</text>
  <text x="48" y="321" class="tiny">Catalog, stock, GST display</text>
  <rect x="310" y="258" width="256" height="79" rx="8" class="node"/>
  <text x="326" y="281" class="box-title">routes/orders.js</text>
  <text x="326" y="302" class="body">GET/POST /orders · cancel order</text>
  <text x="326" y="321" class="tiny">Create, list, fetch, cancel</text>
  <rect x="588" y="258" width="256" height="79" rx="8" class="node"/>
  <text x="604" y="281" class="box-title">routes/customers.js</text>
  <text x="604" y="302" class="body">GET /customers · POST settlement</text>
  <text x="604" y="321" class="tiny">Khata account activity</text>
  <rect x="866" y="258" width="302" height="79" rx="8" class="node"/>
  <text x="882" y="281" class="box-title">routes/reports.js</text>
  <text x="882" y="302" class="body">dashboard · GST reconciliation · pricing preview</text>
  <text x="882" y="321" class="tiny">admin export</text>
  <path d="M525 206 V235 H438 V258" class="line"/>
  <path d="M525 235 H716 V258" class="line"/>
  <path d="M525 235 H160 V258" class="line"/>
  <path d="M525 235 H1017 V258" class="line"/>

  <text x="32" y="374" class="section">NUMBERED ORDER PLACEMENT FLOW · POST /api/orders</text>
  <rect x="32" y="389" width="208" height="85" rx="9" fill="#eaf2ff" stroke="#6692d2" stroke-width="1.5"/>
  <circle cx="52" cy="409" r="13" fill="#2563eb"/><text x="48" y="414" class="num">1</text>
  <text x="73" y="414" class="flow">Browser submits cart</text>
  <text x="48" y="440" class="body">public/js/app.js</text><text x="48" y="459" class="tiny">POST items, customer, coupon</text>

  <rect x="272" y="389" width="208" height="85" rx="9" fill="#eaf2ff" stroke="#6692d2" stroke-width="1.5"/>
  <circle cx="292" cy="409" r="13" fill="#2563eb"/><text x="288" y="414" class="num">2</text>
  <text x="313" y="414" class="flow">Resolve &amp; validate</text>
  <text x="288" y="440" class="body">routes/orders.js handler</text><text x="288" y="459" class="tiny">inventory.find() · inventory.check()</text>

  <rect x="512" y="389" width="208" height="85" rx="9" fill="#eaf2ff" stroke="#6692d2" stroke-width="1.5"/>
  <circle cx="532" cy="409" r="13" fill="#2563eb"/><text x="528" y="414" class="num">3</text>
  <text x="553" y="414" class="flow">Calculate checkout</text>
  <text x="528" y="440" class="body">pricing.subtotal() → coupons.validate()</text><text x="528" y="459" class="tiny">pricing.computeTotals() → tax.js</text>

  <rect x="752" y="389" width="208" height="85" rx="9" fill="#eaf2ff" stroke="#6692d2" stroke-width="1.5"/>
  <circle cx="772" cy="409" r="13" fill="#2563eb"/><text x="768" y="414" class="num">4</text>
  <text x="793" y="414" class="flow">Apply business changes</text>
  <text x="768" y="440" class="body">ledger.chargeOrderToKhata()</text><text x="768" y="459" class="tiny">inventory.reserve() · orders.add()</text>

  <rect x="992" y="389" width="176" height="85" rx="9" fill="#eaf2ff" stroke="#6692d2" stroke-width="1.5"/>
  <circle cx="1012" cy="409" r="13" fill="#2563eb"/><text x="1008" y="414" class="num">5</text>
  <text x="1033" y="414" class="flow">Save order</text>
  <text x="1008" y="440" class="body">appendAudit() · write()</text><text x="1008" y="459" class="tiny">data/db.json</text>
  <path d="M240 432 H272" class="line"/><path d="M480 432 H512" class="line"/><path d="M720 432 H752" class="line"/><path d="M960 432 H992" class="line"/>

  <text x="32" y="513" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="32" y="527" width="220" height="96" rx="8" class="node"/>
  <text x="48" y="550" class="box-title">pricing.js</text><text x="48" y="572" class="body">subtotal() · discount()</text><text x="48" y="592" class="body">computeTotals()</text><text x="48" y="611" class="tiny">proportional discount · line GST</text>
  <rect x="267" y="527" width="220" height="96" rx="8" class="node"/>
  <text x="283" y="550" class="box-title">coupons.js</text><text x="283" y="572" class="body">normalizeCode() · validate()</text><text x="283" y="592" class="body">calculateDiscount() · listActive()</text><text x="283" y="611" class="tiny">rules loaded from config.js</text>
  <rect x="502" y="527" width="220" height="96" rx="8" class="node"/>
  <text x="518" y="550" class="box-title">tax.js</text><text x="518" y="572" class="body">getRateForItem() · getSlabPercent()</text><text x="518" y="592" class="body">splitCgstSgst()</text><text x="518" y="611" class="tiny">HSN slabs / fallback rate</text>
  <rect x="737" y="527" width="220" height="96" rx="8" class="node"/>
  <text x="753" y="550" class="box-title">inventory.js</text><text x="753" y="572" class="body">find() · check() · reserve()</text><text x="753" y="592" class="body">release() · summarize()</text><text x="753" y="611" class="tiny">product stock operations</text>
  <rect x="972" y="527" width="196" height="96" rx="8" class="node"/>
  <text x="988" y="550" class="box-title">ledger.js</text><text x="988" y="572" class="body">findCustomer()</text><text x="988" y="592" class="body">chargeOrderToKhata()</text><text x="988" y="611" class="tiny">settlements · reversals</text>

  <rect x="32" y="642" width="220" height="96" rx="8" class="node"/>
  <text x="48" y="665" class="box-title">orders.js</text><text x="48" y="687" class="body">add() · get() · cancel() · list()</text><text x="48" y="709" class="tiny">order lifecycle and queries</text>
  <rect x="267" y="642" width="220" height="96" rx="8" class="node"/>
  <text x="283" y="665" class="box-title">store.js</text><text x="283" y="687" class="body">read() · write() · appendAudit()</text><text x="283" y="709" class="tiny">reads / writes data/db.json</text>
  <rect x="502" y="642" width="220" height="96" rx="8" class="node"/>
  <text x="518" y="665" class="box-title">reports.js</text><text x="518" y="687" class="body">getDashboardSummary()</text><text x="518" y="709" class="tiny">getGstReconciliation()</text>
  <rect x="737" y="642" width="220" height="96" rx="8" class="node"/>
  <text x="753" y="665" class="box-title">dates.js</text><text x="753" y="687" class="body">today() · normalizeDateKey()</text><text x="753" y="709" class="tiny">getFiscalYear()</text>
  <rect x="972" y="642" width="196" height="96" rx="8" class="highlight"/>
  <text x="988" y="665" class="box-title">invoice.js · ticket focus</text><text x="988" y="687" class="body">computeInvoiceFigures()</text><text x="988" y="709" class="tiny">render() → printable HTML</text>

  <path d="M616 474 V500 H142 V527" class="dashed"/>
  <path d="M616 500 H377 V527" class="dashed"/>
  <path d="M616 500 H612 V527" class="dashed"/>
  <path d="M856 474 V500 H847 V527" class="dashed"/>
  <path d="M856 500 H1070 V527" class="dashed"/>
  <path d="M437 474 V632 H142 V642" class="dashed"/>
  <path d="M1080 206 V631 H377 V642" class="dashed"/>
  <path d="M1017 337 V630 H612 V642" class="dashed"/>
  <path d="M525 206 V630 H847 V642" class="dashed"/>
  <path d="M672 160 H1100 V630 H1070 V642" class="dashed"/>

  <rect x="32" y="758" width="18" height="18" rx="4" class="highlight"/>
  <text x="59" y="772" class="tiny">Ticket focus: lib/invoice.js</text>
  <rect x="276" y="758" width="18" height="18" rx="4" class="node"/>
  <text x="303" y="772" class="tiny">Other app module</text>
  <path d="M478 767 H526" class="line"/><text x="536" y="772" class="tiny">request / call / data flow (arrows are architectural, not an exact call graph)</text>
</svg>
