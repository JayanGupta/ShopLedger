<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger module architecture and order flow</title>
  <desc id="description">Every entry point, route and library module is shown separately. Orange highlights identify the Ticket 1 invoice and GST reconciliation path.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker>
    <marker id="hotArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#c2410c"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#526174}.g{font-size:16px;font-weight:700;fill:#334155}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.hot{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.data{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.t{font-size:15px;font-weight:700}.s{font-size:12px;fill:#526174}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.hotedge{stroke:#c2410c;stroke-width:3;fill:none;marker-end:url(#hotArrow)}.step{fill:#0f766e}.steptext{font-size:13px;font-weight:700;fill:#fff}</style>
  </defs>
  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="55" y="55" class="h">ShopLedger architecture · Ticket 1 highlighted</text><text x="55" y="82" class="sub">Node / Express POS, inventory, Khata ledger, GST pricing and printable invoices</text>
  <text x="70" y="135" class="g">Entry points &amp; configuration</text>
  <rect x="70" y="155" width="180" height="68" rx="8" class="box"/><text x="92" y="184" class="t">public/index.html</text><text x="92" y="205" class="s">Browser SPA</text>
  <rect x="315" y="155" width="155" height="68" rx="8" class="box"/><text x="343" y="184" class="t">server.js</text><text x="343" y="205" class="s">Express app</text>
  <rect x="535" y="155" width="155" height="68" rx="8" class="box"/><text x="563" y="184" class="t">config.js</text><text x="563" y="205" class="s">port, shop, slabs</text>
  <path d="M250 189H315" class="edge"/><path d="M470 175H535" class="edge"/>
  <text x="70" y="285" class="g">HTTP routes (each mounted under /api, except the printable invoice)</text>
  <rect x="70" y="310" width="185" height="75" rx="8" class="box"/><text x="92" y="341" class="t">routes/orders.js</text><text x="92" y="363" class="s">order API</text>
  <rect x="285" y="310" width="185" height="75" rx="8" class="box"/><text x="307" y="341" class="t">routes/products.js</text><text x="307" y="363" class="s">product API</text>
  <rect x="500" y="310" width="185" height="75" rx="8" class="box"/><text x="522" y="341" class="t">routes/customers.js</text><text x="522" y="363" class="s">Khata API</text>
  <rect x="715" y="310" width="185" height="75" rx="8" class="hot"/><text x="737" y="341" class="t">routes/reports.js</text><text x="737" y="363" class="s">GST reconciliation</text>
  <rect x="930" y="310" width="210" height="75" rx="8" class="hot"/><text x="952" y="341" class="t">GET /orders/:id/invoice</text><text x="952" y="363" class="s">defined in server.js</text>
  <path d="M393 223V310" class="edge"/><path d="M393 280H162V310" class="edge"/><path d="M393 280H377V310" class="edge"/><path d="M393 280H592V310" class="edge"/><path d="M393 280H807V310" class="hotedge"/><path d="M393 280H1035V310" class="hotedge"/>
  <text x="70" y="455" class="g">Domain modules (one box per module)</text>
  <rect x="70" y="480" width="150" height="68" rx="8" class="data"/><text x="92" y="509" class="t">lib/store.js</text><text x="92" y="530" class="s">read / write JSON</text>
  <rect x="255" y="480" width="150" height="68" rx="8" class="box"/><text x="277" y="509" class="t">lib/orders.js</text><text x="277" y="530" class="s">create / query</text>
  <rect x="440" y="480" width="150" height="68" rx="8" class="box"/><text x="462" y="509" class="t">lib/inventory.js</text><text x="462" y="530" class="s">check / reserve</text>
  <rect x="625" y="480" width="150" height="68" rx="8" class="box"/><text x="647" y="509" class="t">lib/ledger.js</text><text x="647" y="530" class="s">Khata charges</text>
  <rect x="810" y="480" width="150" height="68" rx="8" class="hot"/><text x="832" y="509" class="t">lib/pricing.js</text><text x="832" y="530" class="s">canonical totals</text>
  <rect x="995" y="480" width="150" height="68" rx="8" class="hot"/><text x="1017" y="509" class="t">lib/invoice.js</text><text x="1017" y="530" class="s">print figures</text>
  <rect x="1180" y="480" width="150" height="68" rx="8" class="hot"/><text x="1202" y="509" class="t">lib/reports.js</text><text x="1202" y="530" class="s">GST comparison</text>
  <rect x="810" y="585" width="150" height="58" rx="8" class="box"/><text x="832" y="611" class="t">lib/tax.js</text><text x="832" y="630" class="s">HSN rates</text>
  <rect x="995" y="585" width="150" height="58" rx="8" class="box"/><text x="1017" y="611" class="t">lib/coupons.js</text><text x="1017" y="630" class="s">discount rules</text>
  <rect x="1180" y="585" width="150" height="58" rx="8" class="box"/><text x="1202" y="611" class="t">lib/dates.js</text><text x="1202" y="630" class="s">date helpers</text>
  <path d="M162 385V480" class="edge"/><path d="M162 420H330V480" class="edge"/><path d="M162 420H515V480" class="edge"/><path d="M162 420H700V480" class="edge"/><path d="M162 420H885V480" class="hotedge"/><path d="M1035 385V480" class="hotedge"/><path d="M807 385V480" class="hotedge"/><path d="M885 548V585" class="hotedge"/><path d="M1065 548V585" class="hotedge"/><path d="M1070 548L1255 585" class="hotedge"/>
  <text x="70" y="710" class="g">Numbered new-order flow</text>
  <circle cx="100" cy="755" r="18" class="step"/><text x="96" y="760" class="steptext">1</text><text x="130" y="760" class="s">routes/orders validates request</text>
  <circle cx="410" cy="755" r="18" class="step"/><text x="406" y="760" class="steptext">2</text><text x="440" y="760" class="s">inventory.check</text>
  <circle cx="650" cy="755" r="18" class="step"/><text x="646" y="760" class="steptext">3</text><text x="680" y="760" class="s">pricing.computeTotals</text>
  <circle cx="955" cy="755" r="18" class="step"/><text x="951" y="760" class="steptext">4</text><text x="985" y="760" class="s">ledger.chargeOrderToKhata</text>
  <circle cx="100" cy="820" r="18" class="step"/><text x="96" y="825" class="steptext">5</text><text x="130" y="825" class="s">inventory.reserve</text>
  <circle cx="410" cy="820" r="18" class="step"/><text x="406" y="825" class="steptext">6</text><text x="440" y="825" class="s">orders.add</text>
  <circle cx="650" cy="820" r="18" class="step"/><text x="646" y="825" class="steptext">7</text><text x="680" y="825" class="s">store.write → data/db.json</text>
  <text x="70" y="890" class="g">Legend</text><rect x="70" y="908" width="25" height="18" class="box"/><text x="105" y="923" class="s">standard module or route</text><rect x="360" y="908" width="25" height="18" class="hot"/><text x="395" y="923" class="s">Ticket 1 / invoice-GST path</text><rect x="670" y="908" width="25" height="18" class="data"/><text x="705" y="923" class="s">persistent JSON data boundary</text>
</svg>
