<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement</title><desc id="desc">Verified source modules, HTTP routing, a numbered order flow, and the separate invoice calculation path. Purple marks the inventory ticket module.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#243449}.title{font-size:26px;font-weight:bold}.section{font-size:14px;font-weight:bold;fill:#52647a}.name{font-size:15px;font-weight:bold}.box{fill:#fff;stroke:#bdcbd9;stroke-width:1.2}.ticket{fill:#f3e8ff;stroke:#9333ea;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.muted{fill:#52647a}.purple{fill:#7e22ce}</style>
<rect width="1200" height="820" fill="#f5f8fc"/>
<text x="28" y="38" class="title">ShopLedger · architecture &amp; order placement</text>
<text x="28" y="62" class="muted">Source-verified map · numbers trace a successful POST /api/orders · paths are relative to the repository</text>
<rect x="28" y="84" width="330" height="92" rx="9" class="box"/>
<text x="40" y="107" class="name">public/ · browser UI</text>
<text x="40" y="129" class="">index.html · css/style.css · js/app.js</text>
<text x="40" y="147" class="">① Place button → getSelectedCartItems()</text>
<text x="40" y="165" class="">post() sends POST /api/orders</text>
<rect x="420" y="84" width="350" height="92" rx="9" class="box"/>
<text x="432" y="107" class="name">server.js · Express</text>
<text x="432" y="129" class="">Serves public/ · JSON request parsing</text>
<text x="432" y="147" class="">② Mounts all four routers at /api</text>
<text x="432" y="165" class="">GET /orders/:id/invoice → invoice.render()</text>
<rect x="830" y="84" width="342" height="92" rx="9" class="box"/>
<text x="842" y="107" class="name">config.js</text>
<text x="842" y="129" class="">Port · shop · admin key · inventory settings</text>
<text x="842" y="147" class="">GST defaultRate + hsnSlabs · coupons</text>
<text x="842" y="165" class="">Used by server, tax, coupons, invoice,</text>
<path d="M358 130 H420" class="edge"/>
<path d="M595 176 V207 H158 V226" class="edge"/>
<path d="M595 207 H453 V226" class="edge"/>
<path d="M595 207 H748 V226" class="edge"/>
<path d="M595 207 H1037 V226" class="edge"/>
<text x="28" y="202" class="section">HTTP ROUTERS · dependencies listed inside each router</text>
<rect x="28" y="226" width="260" height="114" rx="9" class="box"/>
<text x="40" y="249" class="name">routes/products.js</text>
<text x="40" y="271" class="">GET /products · GET /coupons</text>
<text x="40" y="289" class="">→ store, inventory, tax, coupons</text>
<rect x="308" y="226" width="280" height="124" rx="9" class="box"/>
<text x="320" y="249" class="name">routes/orders.js</text>
<text x="320" y="271" class="">③ store.read() · resolve item snapshots</text>
<text x="320" y="289" class="">GET /orders · GET /orders/:id</text>
<text x="320" y="307" class="">POST /orders · POST /orders/:id/cancel</text>
<text x="320" y="325" class="">→ store, inventory, pricing, coupons,</text>
<text x="320" y="343" class="">   orders, ledger</text>
<rect x="608" y="226" width="260" height="114" rx="9" class="box"/>
<text x="620" y="249" class="name">routes/customers.js</text>
<text x="620" y="271" class="">GET /customers</text>
<text x="620" y="289" class="">POST /customers/:id/settle</text>
<text x="620" y="307" class="">→ store, ledger</text>
<rect x="888" y="226" width="284" height="114" rx="9" class="box"/>
<text x="900" y="249" class="name">routes/reports.js</text>
<text x="900" y="271" class="">GET /reports/dashboard</text>
<text x="900" y="289" class="">GET /reports/gst-reconciliation</text>
<text x="900" y="307" class="">POST /pricing/preview · GET /admin/export</text>
<text x="900" y="325" class="">→ config, store, reports, pricing, coupons</text>
<text x="28" y="368" class="section">LIBRARY MODULES · calls and responsibilities</text>
<rect x="28" y="382" width="216" height="88" rx="9" class="ticket"/>
<text x="40" y="405" class="name">lib/inventory.js</text>
<text x="40" y="427" class="">④ find() → check()</text>
<text x="40" y="445" class="">⑧ reserve(): stock -= qty</text>
<text x="40" y="463" class="">release() · summarize()</text>
<rect x="260" y="382" width="216" height="88" rx="9" class="box"/>
<text x="272" y="405" class="name">lib/coupons.js</text>
<text x="272" y="427" class="">⑤ normalizeCode() → validate()</text>
<text x="272" y="445" class="">calculateDiscount() → config</text>
<text x="272" y="463" class="">Active / min spend / cap checks</text>
<rect x="492" y="382" width="216" height="88" rx="9" class="box"/>
<text x="504" y="405" class="name">lib/pricing.js</text>
<text x="504" y="427" class="">⑥ computeTotals()</text>
<text x="504" y="445" class="">→ coupons.calculateDiscount()</text>
<text x="504" y="463" class="">→ tax.getRateForItem()</text>
<rect x="724" y="382" width="216" height="88" rx="9" class="box"/>
<text x="736" y="405" class="name">lib/tax.js</text>
<text x="736" y="427" class="">getRateForItem() → config</text>
<text x="736" y="445" class="">Exact HSN match; fallback 18%</text>
<text x="736" y="463" class="">splitCgstSgst()</text>
<rect x="956" y="382" width="216" height="88" rx="9" class="box"/>
<text x="968" y="405" class="name">lib/ledger.js</text>
<text x="968" y="427" class="">⑦ chargeOrderToKhata()</text>
<text x="968" y="445" class="">findCustomer() · listCustomers()</text>
<text x="968" y="463" class="">recordSettlement() → dates</text>
<rect x="28" y="486" width="216" height="88" rx="9" class="box"/>
<text x="40" y="509" class="name">lib/orders.js</text>
<text x="40" y="531" class="">⑨ add(): ID, date, order snapshot</text>
<text x="40" y="549" class="">get() · list() · cancel()</text>
<text x="40" y="567" class="">→ dates, inventory, ledger</text>
<rect x="260" y="486" width="216" height="88" rx="9" class="box"/>
<text x="272" y="509" class="name">lib/dates.js</text>
<text x="272" y="531" class="">today()</text>
<text x="272" y="549" class="">normalizeDateKey()</text>
<text x="272" y="567" class="">getFiscalYear()</text>
<rect x="492" y="486" width="216" height="88" rx="9" class="box"/>
<text x="504" y="509" class="name">lib/store.js</text>
<text x="504" y="531" class="">③ read() · ⑩ write()</text>
<text x="504" y="549" class="">⑩ appendAudit()</text>
<text x="504" y="567" class="">Synchronous JSON file I/O</text>
<rect x="724" y="486" width="216" height="88" rx="9" class="box"/>
<text x="736" y="509" class="name">lib/reports.js</text>
<text x="736" y="531" class="">getDashboardSummary()</text>
<text x="736" y="549" class="">getGstReconciliation()</text>
<text x="736" y="567" class="">→ inventory, ledger, invoice</text>
<rect x="956" y="486" width="216" height="88" rx="9" class="box"/>
<text x="968" y="509" class="name">lib/invoice.js</text>
<text x="968" y="531" class="">render()</text>
<text x="968" y="549" class="">→ computeInvoiceFigures()</text>
<text x="968" y="567" class="">→ config (no tax.js call)</text>
<path d="M708 425 H724" class="edge"/>
<path d="M940 530 H956" class="edge"/>
<rect x="28" y="594" width="1144" height="94" rx="9" fill="#e9f2ff" stroke="#b6cfee"/>
<text x="42" y="616" class="section">ORDER FLOW · routes/orders.js orchestrates steps ③–⑩</text>
<text x="42" y="638" class="">① UI → ② server/router → ③ read DB + resolve items → ④ check stock → ⑤ validate coupon → ⑥ compute totals</text>
<text x="42" y="660" class="">⑦ Debit Khata only if selected → ⑧ deduct stock → ⑨ add order → ⑩ audit + write DB → HTTP 201 order to browser</text>
<text x="42" y="679" class="">Checkout: discount before per-HSN GST. Saved: items + subtotal / discount / tax / total; no per-line tax or coupon-rule snapshot.</text>
<rect x="28" y="708" width="448" height="87" rx="9" class="box"/>
<text x="40" y="731" class="name">data/db.json</text>
<text x="40" y="753" class="">Products · customers · orders · settlements · auditLog</text>
<text x="40" y="771" class="">ID counters · stock changes · conditional Khata balance</text>
<text x="40" y="789" class="">Only lib/store.js reads / writes this file</text>
<path d="M600 574 V584 H15 V752 H28" class="edge"/>
<text x="492" y="725" class="section">SEPARATE PRINT PATH</text>
<text x="492" y="746" class="">server.js: store.read() → orders.get() → invoice.render()</text>
<text x="492" y="765" class="purple">Invoice uses independent GST and coupon calculations.</text>
<rect x="492" y="780" width="14" height="14" rx="3" class="ticket"/>
<text x="514" y="792" class="">Ticket: inventory.js</text>
<rect x="699" y="780" width="14" height="14" rx="3" class="box"/>
<text x="721" y="792" class="">Supporting module</text>
<text x="890" y="792" class="">→ call / routing / file I/O</text>
</svg>
