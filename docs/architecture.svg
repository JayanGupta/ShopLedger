<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture</title>
<desc id="desc">Architecture map of ShopLedger modules and numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#475569}
    .head{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#475569}
    .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2}
    .band{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="800" fill="#f8fafc"/>
<text class="title" x="30" y="40">ShopLedger | Application architecture</text>
<text class="sub" x="30" y="64">Express POS, Khata ledger, inventory, GST pricing and printable invoice</text>

<!-- primary request path -->
<rect class="card" x="30" y="90" width="225" height="112" rx="10"/>
<text class="head" x="48" y="117">Browser UI | public/</text>
<text class="body" x="48" y="141">index.html · css/style.css</text>
<text class="body" x="48" y="161">js/app.js · post() · updateCartPreview()</text>
<text class="small" x="48" y="183">Static files + POS/API client</text>

<rect class="card" x="300" y="90" width="230" height="112" rx="10"/>
<text class="head" x="318" y="117">server.js</text>
<text class="body" x="318" y="141">Express app · JSON body parser</text>
<text class="body" x="318" y="161">static(public/) · mounts /api routes</text>
<text class="small" x="318" y="183">GET /orders/:id/invoice</text>
<path class="arrow" d="M255 145 H294"/>

<rect class="card" x="575" y="90" width="275" height="112" rx="10"/>
<text class="head" x="593" y="117">routes/ (mounted at /api)</text>
<text class="body" x="593" y="141">orders.js · POST /orders</text>
<text class="body" x="593" y="161">products.js · customers.js</text>
<text class="body" x="593" y="181">reports.js · pricing preview / reports</text>
<path class="arrow" d="M530 145 H569"/>

<rect class="card" x="895" y="90" width="275" height="112" rx="10"/>
<text class="head" x="913" y="117">config.js</text>
<text class="body" x="913" y="141">Shop details · GST defaults &amp; HSN slabs</text>
<text class="body" x="913" y="161">Coupons · inventory settings · port</text>
<text class="small" x="913" y="183">Read by pricing, tax, invoice and routes</text>
<path class="arrow" d="M895 174 C880 174 873 190 857 190"/>

<path class="arrow" d="M712 202 V222"/>
<text class="small" x="724" y="218">route calls into lib/</text>
<text class="head" x="30" y="244">lib/ modules</text>
<text class="small" x="135" y="244">Shared business logic and persistence</text>

<!-- lib grid -->
<rect class="card" x="30" y="260" width="215" height="82" rx="8"/>
<text class="head" x="44" y="284">orders.js</text><text class="body" x="44" y="305">add() · get() · cancel() · list()</text><text class="small" x="44" y="326">Order lifecycle</text>
<rect class="card" x="260" y="260" width="215" height="82" rx="8"/>
<text class="head" x="274" y="284">inventory.js</text><text class="body" x="274" y="305">find() · check() · reserve() · release()</text><text class="small" x="274" y="326">Stock operations</text>
<rect class="card" x="490" y="260" width="215" height="82" rx="8"/>
<text class="head" x="504" y="284">pricing.js</text><text class="body" x="504" y="305">subtotal() · computeTotals()</text><text class="small" x="504" y="326">Checkout totals</text>
<rect class="focus" x="720" y="260" width="215" height="82" rx="8"/>
<text class="head" x="734" y="284">invoice.js  [TICKET FOCUS]</text><text class="body" x="734" y="305">computeInvoiceFigures() · render()</text><text class="small" x="734" y="326">Printable HTML invoice</text>
<rect class="focus" x="950" y="260" width="220" height="82" rx="8"/>
<text class="head" x="964" y="284">tax.js  [TICKET FOCUS]</text><text class="body" x="964" y="305">getRateForItem() · splitCgstSgst()</text><text class="small" x="964" y="326">Used by pricing.js; invoice uses config default</text>

<rect class="card" x="30" y="355" width="215" height="82" rx="8"/>
<text class="head" x="44" y="379">coupons.js</text><text class="body" x="44" y="400">validate() · calculateDiscount()</text><text class="small" x="44" y="421">Coupon rules from config.js</text>
<rect class="card" x="260" y="355" width="215" height="82" rx="8"/>
<text class="head" x="274" y="379">ledger.js</text><text class="body" x="274" y="400">chargeOrderToKhata() · settlements</text><text class="small" x="274" y="421">Customer balances</text>
<rect class="card" x="490" y="355" width="215" height="82" rx="8"/>
<text class="head" x="504" y="379">store.js</text><text class="body" x="504" y="400">read() · write() · appendAudit()</text><text class="small" x="504" y="421">JSON persistence boundary</text>
<rect class="card" x="720" y="355" width="215" height="82" rx="8"/>
<text class="head" x="734" y="379">reports.js</text><text class="body" x="734" y="400">getDashboardSummary() · getGstReconciliation()</text><text class="small" x="734" y="421">Recomputes invoice figures</text>
<rect class="card" x="950" y="355" width="220" height="82" rx="8"/>
<text class="head" x="964" y="379">dates.js</text><text class="body" x="964" y="400">today() · normalizeDateKey()</text><text class="small" x="964" y="421">Date helpers</text>

<!-- storage connection -->
<path class="arrow" d="M600 437 V466 H350"/>
<rect class="card" x="75" y="465" width="310" height="67" rx="9"/>
<text class="head" x="94" y="491">data/db.json</text>
<text class="body" x="94" y="514">Products · orders · customers · settlements · auditLog</text>
<text class="small" x="408" y="487">lib/store.js reads/writes the full JSON document</text>

<!-- numbered order flow -->
<text class="head" x="30" y="570">Order placement | POST /api/orders</text>
<rect class="band" x="30" y="585" width="1140" height="166" rx="12"/>
<g>
  <circle cx="66" cy="620" r="16" fill="#2563eb"/><text x="61" y="625" fill="#fff" style="font-size:14px;font-weight:700">1</text>
  <text class="head" x="92" y="617">Collect cart</text><text class="body" x="92" y="639">public/js/app.js sends</text><text class="body" x="92" y="658">items, coupon, customer, mode</text>
  <path class="arrow" d="M275 630 H302"/>
  <circle cx="330" cy="620" r="16" fill="#2563eb"/><text x="325" y="625" fill="#fff" style="font-size:14px;font-weight:700">2</text>
  <text class="head" x="356" y="617">Resolve &amp; check</text><text class="body" x="356" y="639">routes/orders.js looks up products;</text><text class="body" x="356" y="658">inventory.check() checks stock</text>
  <path class="arrow" d="M555 630 H582"/>
  <circle cx="610" cy="620" r="16" fill="#2563eb"/><text x="605" y="625" fill="#fff" style="font-size:14px;font-weight:700">3</text>
  <text class="head" x="636" y="617">Price</text><text class="body" x="636" y="639">pricing.computeTotals() uses</text><text class="body" x="636" y="658">coupons.js + tax.js</text>
  <path class="arrow" d="M805 630 H832"/>
  <circle cx="860" cy="620" r="16" fill="#2563eb"/><text x="855" y="625" fill="#fff" style="font-size:14px;font-weight:700">4</text>
  <text class="head" x="886" y="617">Commit order</text><text class="body" x="886" y="639">ledger charge if Khata; reserve stock;</text><text class="body" x="886" y="658">orders.add() + audit log</text>
  <path class="arrow" d="M1075 630 H1092"/>
  <text class="head" x="1096" y="617">5</text><text class="body" x="1096" y="639">store.write()</text><text class="body" x="1096" y="658">db.json</text>
</g>
<text class="small" x="50" y="716">Invoice path: server.js GET /orders/:id/invoice → orders.get() → highlighted invoice.render() → highlighted invoice.computeInvoiceFigures().</text>
<rect x="885" y="766" width="14" height="14" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text class="small" x="906" y="778">Ticket focus</text>
<rect x="1012" y="766" width="14" height="14" rx="3" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="small" x="1033" y="778">Other module</text>
</svg>
