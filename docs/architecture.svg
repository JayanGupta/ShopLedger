<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Architecture overview of ShopLedger Node and Express app, its routers, libraries and JSON data store, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#526078}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.4;rx:9}
      .core{fill:#eaf2ff;stroke:#4f83cc;stroke-width:1.7;rx:9}.ticket{fill:#fff0df;stroke:#df8b31;stroke-width:2.4;rx:9}
      .head{font-size:15px;font-weight:700}.body{font-size:12px;fill:#334155}.tiny{font-size:12px;fill:#526078}
      .line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:5 5}.num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="36" y="42" class="title">ShopLedger · app architecture</text>
  <text x="36" y="65" class="sub">Node / Express POS, Khata ledger and GST invoicing · solid arrows show code/data relationships; blue numbered arrows trace order placement</text>

  <!-- Browser -->
  <rect x="30" y="100" width="185" height="226" class="group" rx="12"/>
  <text x="46" y="126" class="head">Browser UI · public/</text>
  <rect x="47" y="143" width="151" height="70" class="box"/>
  <text x="60" y="166" class="head">index.html</text><text x="60" y="188" class="body">POS, orders, Khata, audit</text>
  <rect x="47" y="228" width="151" height="78" class="box"/>
  <text x="60" y="251" class="head">js/app.js</text><text x="60" y="273" class="body">fetch /api/orders</text><text x="60" y="291" class="body">POST order payload</text>

  <!-- Server and route layers -->
  <rect x="245" y="100" width="230" height="226" class="group" rx="12"/>
  <text x="261" y="126" class="head">HTTP application</text>
  <rect x="262" y="146" width="196" height="86" class="core"/>
  <text x="278" y="171" class="head">server.js</text><text x="278" y="193" class="body">Express setup · static public/</text><text x="278" y="213" class="body">mounts routers · invoice route</text>
  <rect x="262" y="250" width="196" height="57" class="box"/>
  <text x="277" y="273" class="head">config.js</text><text x="277" y="293" class="body">shop, GST slabs, coupons, port</text>

  <rect x="505" y="100" width="258" height="226" class="group" rx="12"/>
  <text x="521" y="126" class="head">routes/ · mounted at /api</text>
  <rect x="522" y="143" width="224" height="39" class="box"/><text x="536" y="168" class="body">products.js · products, coupons</text>
  <rect x="522" y="190" width="224" height="39" class="core"/><text x="536" y="215" class="body">orders.js · create, list, cancel</text>
  <rect x="522" y="237" width="224" height="39" class="box"/><text x="536" y="262" class="body">customers.js · customers, settle</text>
  <rect x="522" y="284" width="224" height="29" class="box"/><text x="536" y="304" class="body">reports.js · preview, reporting, export</text>

  <!-- Libraries -->
  <rect x="795" y="100" width="375" height="418" class="group" rx="12"/>
  <text x="811" y="126" class="head">lib/ · application logic</text>
  <rect x="812" y="143" width="160" height="67" class="core"/><text x="826" y="166" class="head">pricing.js</text><text x="826" y="188" class="body">subtotal, computeTotals</text>
  <rect x="990" y="143" width="160" height="67" class="ticket"/><text x="1004" y="166" class="head">invoice.js ★</text><text x="1004" y="188" class="body">computeInvoiceFigures, render</text>
  <rect x="812" y="225" width="160" height="61" class="box"/><text x="826" y="248" class="head">tax.js</text><text x="826" y="269" class="body">HSN GST rate / CGST + SGST</text>
  <rect x="990" y="225" width="160" height="61" class="box"/><text x="1004" y="248" class="head">coupons.js</text><text x="1004" y="269" class="body">validate / calculateDiscount</text>
  <rect x="812" y="301" width="160" height="61" class="box"/><text x="826" y="324" class="head">inventory.js</text><text x="826" y="345" class="body">find, check, reserve, release</text>
  <rect x="990" y="301" width="160" height="61" class="box"/><text x="1004" y="324" class="head">orders.js</text><text x="1004" y="345" class="body">add, get, cancel, list</text>
  <rect x="812" y="377" width="160" height="61" class="box"/><text x="826" y="400" class="head">ledger.js</text><text x="826" y="421" class="body">Khata debit / settlement</text>
  <rect x="990" y="377" width="160" height="61" class="box"/><text x="1004" y="400" class="head">reports.js</text><text x="1004" y="421" class="body">dashboard / reconciliation</text>
  <rect x="812" y="453" width="160" height="48" class="box"/><text x="826" y="483" class="body">store.js · read / write / audit</text>
  <rect x="990" y="453" width="160" height="48" class="box"/><text x="1004" y="483" class="body">dates.js · dates / fiscal year</text>

  <!-- Persistent data -->
  <rect x="505" y="365" width="258" height="136" class="group" rx="12"/>
  <text x="521" y="391" class="head">Persistent data</text>
  <path d="M550 414 h166 v55 q-83 24 -166 0 z" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <ellipse cx="633" cy="414" rx="83" ry="13" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="588" y="443" class="head">data/db.json</text><text x="572" y="463" class="body">products · orders · customers</text><text x="590" y="482" class="body">settlements · auditLog</text>

  <!-- Architecture links -->
  <path d="M198 267 H262" class="flow"/>
  <path d="M458 190 H522" class="flow"/>
  <path d="M746 210 H812" class="flow"/>
  <path d="M892 210 V225" class="line"/><path d="M892 210 V301" class="line"/>
  <path d="M1070 210 V225" class="line"/><path d="M1070 210 V377" class="line"/>
  <path d="M746 210 C775 210 775 477 812 477" class="line"/>
  <path d="M746 257 C780 257 780 409 812 409" class="line"/>
  <path d="M746 210 C775 210 775 331 812 331" class="line"/>
  <path d="M972 407 H990" class="line"/>
  <path d="M990 176 C850 176 780 515 670 515 V469" class="line dash"/>
  <path d="M892 477 H763" class="line"/>
  <path d="M458 276 H495 V321 H495" class="line dash"/>
  <path d="M458 276 H480 V151 H522" class="line dash"/>

  <!-- Numbered transaction flow callouts -->
  <circle cx="226" cy="267" r="12" class="num"/><text x="226" y="267" class="numtext">1</text>
  <circle cx="490" cy="190" r="12" class="num"/><text x="490" y="190" class="numtext">2</text>
  <circle cx="780" cy="210" r="12" class="num"/><text x="780" y="210" class="numtext">3</text>
  <circle cx="780" cy="331" r="12" class="num"/><text x="780" y="331" class="numtext">4</text>
  <circle cx="780" cy="409" r="12" class="num"/><text x="780" y="409" class="numtext">5</text>
  <circle cx="780" cy="477" r="12" class="num"/><text x="780" y="477" class="numtext">6</text>

  <!-- Flow key -->
  <rect x="30" y="545" width="1140" height="218" class="group" rx="12"/>
  <text x="52" y="576" class="head">Order placement · POST /api/orders</text>
  <text x="52" y="603" class="body"><tspan font-weight="700">1</tspan><tspan dx="8">public/js/app.js place handler builds cart payload</tspan></text>
  <text x="52" y="629" class="body"><tspan font-weight="700">2</tspan><tspan dx="8">server.js dispatches to routes/orders.js</tspan></text>
  <text x="52" y="655" class="body"><tspan font-weight="700">3</tspan><tspan dx="8">store.read() loads db; inventory.find() resolves product rows</tspan></text>
  <text x="52" y="681" class="body"><tspan font-weight="700">4</tspan><tspan dx="8">inventory.check(); pricing.subtotal() + coupons.validate()</tspan></text>
  <text x="52" y="707" class="body"><tspan font-weight="700">5</tspan><tspan dx="8">pricing.computeTotals(); optional ledger.chargeOrderToKhata()</tspan></text>
  <text x="52" y="733" class="body"><tspan font-weight="700">6</tspan><tspan dx="8">inventory.reserve(); orders.add(); appendAudit(); store.write() → data/db.json</tspan></text>
  <path d="M570 595 H615" class="flow"/><text x="627" y="600" class="tiny">numbered blue badges = transaction sequence</text>
  <rect x="615" y="620" width="18" height="18" class="ticket"/><text x="644" y="634" class="body">Ticket focus: lib/invoice.js</text>
  <text x="615" y="665" class="tiny">lib/tax.js is shown as checkout pricing support; invoice.js does not import it.</text>
  <text x="615" y="692" class="tiny">Grey arrows show module/data relationships; dashed links indicate config usage.</text>
</svg>
