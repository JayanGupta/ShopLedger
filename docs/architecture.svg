<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture of the ShopLedger Node and Express application, including browser UI, server, routes, libraries, configuration, JSON data store, and the numbered order checkout flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 12px Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Arial, sans-serif; fill: #334155; }
      .file { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .label { font: 12px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .highlight { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#flowArrow); }
      .flowText { font: 700 12px Arial, sans-serif; fill: #6d28d9; }
      .num { fill: #7c3aed; }
      .numText { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="34" class="title">ShopLedger architecture</text>
  <text x="30" y="54" class="subtitle">Node/Express POS, Khata ledger, GST checkout, printable invoice</text>

  <rect x="899" y="19" width="270" height="39" rx="5" class="group"/>
  <rect x="914" y="31" width="15" height="15" rx="2" class="node"/>
  <text x="937" y="43" class="small">Application module</text>
  <rect x="1051" y="31" width="15" height="15" rx="2" class="highlight"/>
  <text x="1074" y="43" class="small">Ticket focus</text>

  <!-- Browser and server -->
  <text x="30" y="89" class="section">Client</text>
  <rect x="30" y="100" width="190" height="90" rx="6" class="node"/>
  <text x="46" y="124" class="file">Browser UI</text>
  <text x="46" y="146" class="label">public/index.html</text>
  <text x="46" y="164" class="label">public/js/app.js</text>
  <text x="46" y="182" class="label">public/css/style.css</text>

  <text x="263" y="89" class="section">HTTP application</text>
  <rect x="260" y="100" width="230" height="90" rx="6" class="node"/>
  <text x="278" y="124" class="file">server.js</text>
  <text x="278" y="146" class="label">Express + JSON middleware</text>
  <text x="278" y="164" class="label">static public/ + /api routes</text>
  <text x="278" y="182" class="label">GET /orders/:id/invoice</text>

  <text x="967" y="89" class="section">Configuration</text>
  <rect x="965" y="100" width="205" height="90" rx="6" class="node"/>
  <text x="982" y="124" class="file">config.js</text>
  <text x="982" y="146" class="label">shop + port</text>
  <text x="982" y="164" class="label">HSN GST slabs + coupons</text>
  <text x="982" y="182" class="label">inventory defaults + admin key</text>

  <path d="M220 145 H258" class="edge"/>
  <path d="M490 145 H720 V213" class="edge"/>

  <!-- Routers -->
  <rect x="30" y="215" width="520" height="192" rx="7" class="group"/>
  <text x="46" y="239" class="section">routes/ — mounted below /api</text>
  <rect x="45" y="253" width="235" height="57" rx="5" class="node"/>
  <text x="58" y="276" class="file">products.js</text>
  <text x="58" y="295" class="label">GET /products · GET /coupons</text>
  <rect x="296" y="253" width="239" height="57" rx="5" class="node"/>
  <text x="309" y="276" class="file">orders.js</text>
  <text x="309" y="295" class="label">POST /orders · cancel · lookup</text>
  <rect x="45" y="329" width="235" height="57" rx="5" class="node"/>
  <text x="58" y="352" class="file">customers.js</text>
  <text x="58" y="371" class="label">customers · Khata settlement</text>
  <rect x="296" y="329" width="239" height="57" rx="5" class="node"/>
  <text x="309" y="352" class="file">reports.js</text>
  <text x="309" y="371" class="label">dashboard · preview · reconciliation</text>

  <path d="M375 190 V251" class="edge"/>

  <!-- Modules -->
  <rect x="580" y="215" width="590" height="348" rx="7" class="group"/>
  <text x="596" y="239" class="section">lib/ — domain logic</text>

  <rect x="596" y="253" width="130" height="67" rx="5" class="node"/>
  <text x="608" y="276" class="file">store.js</text>
  <text x="608" y="296" class="label">read · write</text>
  <text x="608" y="313" class="label">appendAudit</text>
  <rect x="741" y="253" width="130" height="67" rx="5" class="node"/>
  <text x="753" y="276" class="file">inventory.js</text>
  <text x="753" y="296" class="label">find · check</text>
  <text x="753" y="313" class="label">reserve</text>
  <rect x="886" y="253" width="130" height="67" rx="5" class="node"/>
  <text x="898" y="276" class="file">pricing.js</text>
  <text x="898" y="296" class="label">subtotal</text>
  <text x="898" y="313" class="label">computeTotals</text>
  <rect x="1031" y="253" width="124" height="67" rx="5" class="node"/>
  <text x="1043" y="276" class="file">coupons.js</text>
  <text x="1043" y="296" class="label">normalizeCode</text>
  <text x="1043" y="313" class="label">validate</text>

  <rect x="596" y="337" width="130" height="67" rx="5" class="node"/>
  <text x="608" y="360" class="file">ledger.js</text>
  <text x="608" y="380" class="label">customer credit</text>
  <text x="608" y="397" class="label">Khata settlement</text>
  <rect x="741" y="337" width="130" height="67" rx="5" class="node"/>
  <text x="753" y="360" class="file">orders.js</text>
  <text x="753" y="380" class="label">add · get · cancel</text>
  <text x="753" y="397" class="label">order list/filter</text>
  <rect x="886" y="337" width="130" height="67" rx="5" class="highlight"/>
  <text x="898" y="360" class="file">tax.js</text>
  <text x="898" y="380" class="label">getRateForItem</text>
  <text x="898" y="397" class="label">CGST/SGST split</text>
  <rect x="1031" y="337" width="124" height="67" rx="5" class="highlight"/>
  <text x="1043" y="360" class="file">invoice.js</text>
  <text x="1043" y="380" class="label">compute figures</text>
  <text x="1043" y="397" class="label">render HTML invoice</text>

  <rect x="596" y="421" width="130" height="67" rx="5" class="node"/>
  <text x="608" y="444" class="file">dates.js</text>
  <text x="608" y="464" class="label">today + date keys</text>
  <rect x="741" y="421" width="130" height="67" rx="5" class="node"/>
  <text x="753" y="444" class="file">reports.js</text>
  <text x="753" y="464" class="label">dashboard + GST</text>
  <text x="753" y="481" class="label">reconciliation</text>

  <!-- Supporting dependencies -->
  <path d="M535 281 H594" class="edge"/>
  <path d="M535 281 H650 V335" class="edge"/>
  <path d="M535 281 H718 V251" class="edge"/>
  <path d="M535 281 H863 V251" class="edge"/>
  <path d="M535 281 H1008 V251" class="edge"/>
  <path d="M535 357 H594" class="edge"/>
  <path d="M535 357 H739" class="edge"/>
  <path d="M535 357 H1018 V445 H873" class="edge"/>
  <path d="M951 320 V335" class="edge"/>
  <path d="M1016 145 H1093 V335" class="edge"/>
  <path d="M965 190 V245" class="edge"/>
  <path d="M1093 320 V335" class="edge"/>
  <path d="M806 404 V419" class="edge"/>

  <!-- JSON data -->
  <text x="928" y="515" class="section">Persistence</text>
  <rect x="925" y="525" width="230" height="57" rx="5" class="node"/>
  <text x="941" y="549" class="file">data/db.json</text>
  <text x="941" y="569" class="label">products · orders · customers</text>
  <path d="M661 320 V553 H923" class="edge"/>

  <!-- Invoice endpoint -->
  <path d="M490 125 H1030 V337" class="edge"/>
  <text x="690" y="117" class="small">invoice endpoint → render()</text>

  <!-- Numbered main order flow -->
  <rect x="30" y="606" width="1140" height="163" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.4"/>
  <text x="46" y="631" class="section">Numbered flow — placing an order</text>
  <text x="46" y="650" class="small">Purple lines trace POST /api/orders; grey arrows above show supporting module relationships.</text>

  <circle cx="55" cy="682" r="12" class="num"/><text x="55" y="682" class="numText">1</text>
  <text x="75" y="677" class="flowText">Browser POST</text><text x="75" y="696" class="small">items + payment + coupon</text>
  <path d="M184 682 H213" class="flow"/>
  <circle cx="230" cy="682" r="12" class="num"/><text x="230" y="682" class="numText">2</text>
  <text x="250" y="677" class="flowText">server.js</text><text x="250" y="696" class="small">dispatches API route</text>
  <path d="M366 682 H395" class="flow"/>
  <circle cx="412" cy="682" r="12" class="num"/><text x="412" y="682" class="numText">3</text>
  <text x="432" y="677" class="flowText">routes/orders.js</text><text x="432" y="696" class="small">reads JSON store</text>
  <path d="M576 682 H605" class="flow"/>
  <circle cx="622" cy="682" r="12" class="num"/><text x="622" y="682" class="numText">4</text>
  <text x="642" y="677" class="flowText">inventory</text><text x="642" y="696" class="small">find + check stock</text>
  <path d="M758 682 H787" class="flow"/>
  <circle cx="804" cy="682" r="12" class="num"/><text x="804" y="682" class="numText">5</text>
  <text x="824" y="677" class="flowText">coupon + pricing</text><text x="824" y="696" class="small">subtotal + validate</text>
  <path d="M1015 682 H1044" class="flow"/>
  <circle cx="1061" cy="682" r="12" class="num"/><text x="1061" y="682" class="numText">6</text>
  <text x="1081" y="677" class="flowText">tax</text><text x="1081" y="696" class="small">HSN rate</text>

  <circle cx="55" cy="733" r="12" class="num"/><text x="55" y="733" class="numText">7</text>
  <text x="75" y="728" class="flowText">ledger</text><text x="75" y="747" class="small">charge Khata, if selected</text>
  <path d="M242 733 H271" class="flow"/>
  <circle cx="288" cy="733" r="12" class="num"/><text x="288" y="733" class="numText">8</text>
  <text x="308" y="728" class="flowText">inventory + orders</text><text x="308" y="747" class="small">reserve stock + add order</text>
  <path d="M530 733 H559" class="flow"/>
  <circle cx="576" cy="733" r="12" class="num"/><text x="576" y="733" class="numText">9</text>
  <text x="596" y="728" class="flowText">store</text><text x="596" y="747" class="small">append audit + write db.json</text>
  <path d="M823 733 H852" class="flow"/>
  <rect x="870" y="710" width="258" height="45" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="888" y="730" class="file">Saved result</text>
  <text x="888" y="748" class="label">order, stock, Khata, audit data</text>
</svg>
