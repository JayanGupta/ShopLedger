<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, library modules, configuration and JSON storage, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526078}
      .head{font-size:16px;font-weight:700}.label{font-size:12px;fill:#526078}
      .box{fill:#fff;stroke:#b8c4d6;stroke-width:1.4}.panel{fill:#f4f7fb;stroke:#d6deea;stroke-width:1.3}
      .normal{fill:#fff;stroke:#9aabc2;stroke-width:1.3}.ticket{fill:#fff2d9;stroke:#df9f32;stroke-width:2}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#718096;stroke-width:1.5;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}.num{fill:#2563eb;stroke:#fff;stroke-width:2}
      .numtxt{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#fbfcfe"/>
  <text x="32" y="38" class="title">ShopLedger · application architecture</text>
  <text x="32" y="62" class="sub">Express server · browser client · JSON file storage</text>

  <!-- Browser and server entry -->
  <rect x="30" y="82" width="255" height="174" rx="12" class="panel"/>
  <text x="48" y="108" class="head">Browser UI · public/</text>
  <rect x="48" y="121" width="219" height="36" rx="6" class="normal"/><text x="60" y="144">index.html</text>
  <rect x="48" y="165" width="219" height="36" rx="6" class="normal"/><text x="60" y="188">js/app.js</text>
  <rect x="48" y="209" width="219" height="30" rx="6" class="normal"/><text x="60" y="230">css/style.css</text>

  <rect x="333" y="82" width="324" height="174" rx="12" class="panel"/>
  <text x="351" y="108" class="head">server.js · Express app</text>
  <text x="351" y="134">express.static(public/)</text>
  <text x="351" y="157">bodyParser.json()</text>
  <text x="351" y="180">Mounts four routers at /api</text>
  <text x="351" y="203">GET /orders/:id/invoice</text>
  <text x="351" y="226">Uses config.port · starts app</text>
  <path d="M267 182 C295 182 303 182 333 182" class="link"/>

  <rect x="705" y="82" width="226" height="174" rx="12" class="panel"/>
  <text x="723" y="108" class="head">config.js</text>
  <text x="723" y="136">port</text><text x="723" y="159">shop details</text>
  <text x="723" y="182">tax · inventory</text><text x="723" y="205">coupons</text>
  <path d="M657 125 C677 125 684 125 705 125" class="link dash"/>

  <rect x="979" y="82" width="190" height="174" rx="12" class="panel"/>
  <text x="997" y="108" class="head">data/db.json</text>
  <text x="997" y="139">Products</text><text x="997" y="162">Orders</text>
  <text x="997" y="185">Customers · settlements</text>
  <text x="997" y="208">Audit log · ID counters</text>

  <!-- Routers -->
  <rect x="30" y="282" width="368" height="214" rx="12" class="panel"/>
  <text x="48" y="308" class="head">routes/ · mounted at /api</text>
  <rect x="48" y="322" width="332" height="34" rx="5" class="normal"/><text x="61" y="344">products.js · GET /products, /coupons</text>
  <rect x="48" y="363" width="332" height="34" rx="5" class="normal"/><text x="61" y="385">customers.js · GET /customers, settle</text>
  <rect x="48" y="404" width="332" height="34" rx="5" class="normal"/><text x="61" y="426">reports.js · dashboard, GST, pricing, export</text>
  <rect x="48" y="445" width="332" height="39" rx="5" class="normal"/><text x="61" y="470">orders.js · GET /orders · POST /orders</text>
  <path d="M492 256 C492 270 210 266 210 282" class="link"/>

  <!-- Libraries -->
  <rect x="430" y="282" width="501" height="214" rx="12" class="panel"/>
  <text x="448" y="308" class="head">lib/ · application modules</text>
  <rect x="448" y="322" width="145" height="38" rx="5" class="normal"/><text x="460" y="346">store.js</text>
  <rect x="605" y="322" width="145" height="38" rx="5" class="normal"/><text x="617" y="346">pricing.js</text>
  <rect x="762" y="322" width="151" height="38" rx="5" class="normal"/><text x="774" y="346">coupons.js</text>
  <rect x="448" y="370" width="145" height="38" rx="5" class="ticket"/><text x="460" y="394">inventory.js</text>
  <rect x="605" y="370" width="145" height="38" rx="5" class="normal"/><text x="617" y="394">orders.js</text>
  <rect x="617" y="412" width="82" height="22" rx="4" class="ticket"/><text x="625" y="428" class="label">cancel()</text>
  <rect x="762" y="370" width="151" height="38" rx="5" class="normal"/><text x="774" y="394">ledger.js</text>
  <rect x="448" y="438" width="145" height="38" rx="5" class="normal"/><text x="460" y="462">tax.js</text>
  <rect x="605" y="438" width="145" height="38" rx="5" class="normal"/><text x="617" y="462">dates.js</text>
  <rect x="762" y="438" width="151" height="38" rx="5" class="normal"/><text x="774" y="462">invoice.js · reports.js</text>
  <path d="M398 425 C412 425 416 425 430 425" class="link"/>
  <path d="M931 343 C956 343 958 210 979 210" class="link"/>
  <text x="941" y="328" class="label" transform="rotate(-75 941 328)">store.read / write</text>

  <!-- Numbered order placement flow -->
  <rect x="30" y="522" width="1139" height="280" rx="14" fill="#f7faff" stroke="#c8d7f0" stroke-width="1.4"/>
  <text x="50" y="551" class="head">Order placement · numbered request path</text>
  <text x="50" y="575" class="sub">Each step is an existing call or operation in the POST /api/orders handler.</text>
  <rect x="57" y="603" width="245" height="73" rx="9" class="normal"/>
  <circle cx="69" cy="614" r="13" class="num"/><text x="69" y="614" class="numtxt">1</text>
  <text x="87" y="628" font-weight="700">public/js/app.js</text><text x="72" y="652">post('/api/orders', payload)</text>
  <rect x="365" y="603" width="245" height="73" rx="9" class="normal"/>
  <circle cx="377" cy="614" r="13" class="num"/><text x="377" y="614" class="numtxt">2</text>
  <text x="395" y="628" font-weight="700">routes/orders.js</text><text x="380" y="652">POST /orders · validate items</text>
  <rect x="674" y="603" width="220" height="73" rx="9" class="ticket"/>
  <circle cx="686" cy="614" r="13" class="num"/><text x="686" y="614" class="numtxt">3</text>
  <text x="704" y="628" font-weight="700">inventory.js</text><text x="689" y="652">find() · check() stock</text>
  <rect x="956" y="603" width="187" height="73" rx="9" class="normal"/>
  <circle cx="968" cy="614" r="13" class="num"/><text x="968" y="614" class="numtxt">4</text>
  <text x="986" y="628" font-weight="700">pricing.js + coupons.js</text><text x="971" y="652">subtotal · validate · totals</text>
  <path d="M302 640 L365 640" class="flow"/><path d="M610 640 L674 640" class="flow"/><path d="M894 640 L956 640" class="flow"/>
  <rect x="135" y="706" width="260" height="66" rx="9" class="normal"/>
  <circle cx="147" cy="717" r="13" class="num"/><text x="147" y="717" class="numtxt">5</text>
  <text x="165" y="731" font-weight="700">inventory.reserve()</text><text x="150" y="754">reserve product quantities</text>
  <rect x="470" y="706" width="275" height="66" rx="9" class="normal"/>
  <circle cx="482" cy="717" r="13" class="num"/><text x="482" y="717" class="numtxt">6</text>
  <text x="500" y="731" font-weight="700">orders.add() · lib/orders.js</text><text x="485" y="754">create and append order</text>
  <rect x="820" y="706" width="300" height="66" rx="9" class="normal"/>
  <circle cx="832" cy="717" r="13" class="num"/><text x="832" y="717" class="numtxt">7</text>
  <text x="850" y="731" font-weight="700">store.appendAudit() · store.write()</text><text x="835" y="754">persist to data/db.json · return 201</text>
  <path d="M1045 676 C1045 692 266 685 266 706" class="flow"/>
  <path d="M395 739 L470 739" class="flow"/><path d="M745 739 L820 739" class="flow"/>

  <!-- Legend -->
  <rect x="844" y="522" width="299" height="53" rx="8" fill="#fff" stroke="#d6deea"/>
  <rect x="860" y="537" width="22" height="20" rx="3" class="ticket"/>
  <text x="892" y="552" class="label">Ticket modules: inventory.js;</text>
  <text x="892" y="568" class="label">orders.js cancel() only</text>
</svg>
