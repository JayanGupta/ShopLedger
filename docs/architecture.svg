<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server, routers, library modules, configuration and JSON store, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #475569; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; rx: 8; }
      .route { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.3; rx: 7; }
      .module { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 5; }
      .ticket { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 7; }
      .flow { fill: #fff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .line { stroke: #64748b; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .num { fill: #1d4ed8; }
      .numtext { fill: white; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text class="title" x="32" y="39">ShopLedger · application architecture</text>
  <text class="subtitle" x="32" y="61">Node / Express POS, Khata ledger, inventory and GST invoicing</text>
  <rect x="900" y="22" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="small" x="925" y="35">Ticket 1: invoice calculations</text>

  <rect class="box" x="32" y="92" width="160" height="127"/>
  <text class="head" x="47" y="116">Browser UI</text>
  <text class="body" x="47" y="141">public/index.html</text>
  <text class="body" x="47" y="162">public/js/app.js</text>
  <text class="body" x="47" y="183">public/css/style.css</text>
  <text class="small" x="47" y="204">POS · orders · GST audit</text>

  <rect class="box" x="222" y="92" width="160" height="127"/>
  <text class="head" x="237" y="116">Express app</text>
  <text class="body" x="237" y="141">server.js</text>
  <text class="small" x="237" y="162">serves public/</text>
  <text class="small" x="237" y="181">mounts /api routers</text>
  <text class="small" x="237" y="200">GET invoice HTML</text>

  <rect class="route" x="412" y="92" width="178" height="74"/>
  <text class="head" x="425" y="115">routes/orders.js</text>
  <text class="small" x="425" y="137">POST /api/orders · GET/cancel</text>
  <text class="small" x="425" y="155">GET /orders/:id/invoice in server.js</text>
  <rect class="route" x="412" y="177" width="178" height="49"/>
  <text class="body" x="425" y="198">routes/products.js</text>
  <text class="small" x="425" y="216">catalog · tax · coupons</text>
  <rect class="route" x="412" y="237" width="178" height="49"/>
  <text class="body" x="425" y="258">routes/customers.js</text>
  <text class="small" x="425" y="276">Khata customer actions</text>
  <rect class="route" x="412" y="297" width="178" height="49"/>
  <text class="body" x="425" y="318">routes/reports.js</text>
  <text class="small" x="425" y="336">dashboard · reconciliation</text>

  <text class="head" x="620" y="84">lib/ modules</text>
  <rect class="ticket" x="612" y="94" width="270" height="51"/>
  <text class="head" x="625" y="116">lib/invoice.js</text>
  <text class="small" x="625" y="135">computeInvoiceFigures → pricing.computeTotals</text>
  <rect class="module" x="612" y="151" width="270" height="37"/>
  <text class="body" x="625" y="175">lib/pricing.js — checkout totals</text>
  <rect class="module" x="612" y="194" width="270" height="37"/>
  <text class="body" x="625" y="218">lib/tax.js — HSN rates · CGST/SGST</text>
  <rect class="module" x="612" y="237" width="270" height="37"/>
  <text class="body" x="625" y="261">lib/coupons.js — validation · discounts</text>
  <rect class="module" x="612" y="280" width="270" height="37"/>
  <text class="body" x="625" y="304">lib/orders.js — add · get · cancel · list</text>
  <rect class="module" x="612" y="323" width="270" height="37"/>
  <text class="body" x="625" y="347">lib/inventory.js — stock checks · reserve</text>
  <rect class="module" x="612" y="366" width="270" height="37"/>
  <text class="body" x="625" y="390">lib/ledger.js — Khata · settlements</text>
  <rect class="module" x="612" y="409" width="270" height="37"/>
  <text class="body" x="625" y="433">lib/store.js — JSON read · write · audit</text>
  <rect class="module" x="612" y="452" width="270" height="37"/>
  <text class="body" x="625" y="476">lib/reports.js — dashboard · GST audit</text>
  <rect class="module" x="612" y="495" width="270" height="37"/>
  <text class="body" x="625" y="519">lib/dates.js — date keys · fiscal year</text>

  <rect class="box" x="922" y="103" width="244" height="112"/>
  <text class="head" x="938" y="128">config.js</text>
  <text class="small" x="938" y="151">port · shop details · fallback tax</text>
  <text class="small" x="938" y="172">HSN slabs · coupon definitions</text>
  <text class="small" x="938" y="193">inventory defaults · admin key</text>
  <rect class="box" x="922" y="236" width="244" height="124"/>
  <text class="head" x="938" y="261">data/db.json</text>
  <text class="small" x="938" y="284">products · orders · customers</text>
  <text class="small" x="938" y="305">settlements · auditLog · counters</text>
  <text class="small" x="938" y="334">read/write via lib/store.js</text>

  <path class="line" d="M192 155 H222"/>
  <path class="line" d="M382 155 H412"/>
  <path class="line" d="M590 129 H600 V169 H612"/>
  <path class="dash" d="M382 181 H397 V435 H612"/>
  <path class="dash" d="M882 427 H902 V298 H922"/>
  <path class="dash" d="M882 211 H902 V158 H922"/>
  <text class="small" x="401" y="369" transform="rotate(-90 401 369)">routes use lib modules</text>

  <text class="head" x="32" y="565">Order placement · numbered flow</text>
  <rect class="flow" x="32" y="588" width="166" height="111"/>
  <circle class="num" cx="50" cy="607" r="11"/><text class="numtext" x="50" y="611">1</text>
  <text class="head" x="68" y="612">Request</text>
  <text class="small" x="46" y="637">POST /api/orders</text>
  <text class="small" x="46" y="657">routes/orders.js reads</text>
  <text class="small" x="46" y="677">body.items + coupon</text>

  <rect class="flow" x="218" y="588" width="166" height="111"/>
  <circle class="num" cx="236" cy="607" r="11"/><text class="numtext" x="236" y="611">2</text>
  <text class="head" x="254" y="612">Validate stock</text>
  <text class="small" x="232" y="637">inventory.find()</text>
  <text class="small" x="232" y="657">inventory.check()</text>
  <text class="small" x="232" y="677">reject unknown/out of stock</text>

  <rect class="flow" x="404" y="588" width="166" height="111"/>
  <circle class="num" cx="422" cy="607" r="11"/><text class="numtext" x="422" y="611">3</text>
  <text class="head" x="440" y="612">Coupon check</text>
  <text class="small" x="418" y="637">pricing.subtotal()</text>
  <text class="small" x="418" y="657">coupons.normalizeCode()</text>
  <text class="small" x="418" y="677">coupons.validate()</text>

  <rect class="flow" x="590" y="588" width="166" height="111"/>
  <circle class="num" cx="608" cy="607" r="11"/><text class="numtext" x="608" y="611">4</text>
  <text class="head" x="626" y="612">Compute bill</text>
  <text class="small" x="604" y="637">pricing.computeTotals()</text>
  <text class="small" x="604" y="657">coupons + tax HSN slabs</text>
  <text class="small" x="604" y="677">subtotal · GST · total</text>

  <rect class="flow" x="776" y="588" width="166" height="111"/>
  <circle class="num" cx="794" cy="607" r="11"/><text class="numtext" x="794" y="611">5</text>
  <text class="head" x="812" y="612">Apply effects</text>
  <text class="small" x="790" y="637">Khata debit if selected</text>
  <text class="small" x="790" y="657">inventory.reserve()</text>
  <text class="small" x="790" y="677">orders.add()</text>

  <rect class="flow" x="962" y="588" width="204" height="111"/>
  <circle class="num" cx="980" cy="607" r="11"/><text class="numtext" x="980" y="611">6</text>
  <text class="head" x="998" y="612">Persist</text>
  <text class="small" x="976" y="637">appendAudit() · store.write()</text>
  <text class="small" x="976" y="657">saves db.json</text>
  <text class="small" x="976" y="677">returns order JSON</text>

  <path class="line" d="M198 643 H218"/><path class="line" d="M384 643 H404"/><path class="line" d="M570 643 H590"/>
  <path class="line" d="M756 643 H776"/><path class="line" d="M942 643 H962"/>
  <rect x="32" y="724" width="1134" height="48" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text class="body" x="49" y="746"><tspan font-weight="700">Invoice route:</tspan> GET /orders/:id/invoice → store.read() → orders.get() → invoice.render() → invoice.computeInvoiceFigures()</text>
  <text class="small" x="49" y="765">Ticket 1: invoice now reuses pricing.computeTotals for HSN slabs, coupon discount, GST and total; lib/invoice.js is highlighted.</text>
</svg>
