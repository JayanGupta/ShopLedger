<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four routers, ten library modules, configuration, JSON persistence, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="thinArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #526077; }
      .section { font-size: 14px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .browser { fill: #e8f2ff; stroke: #3b82f6; }
      .server { fill: #e9fbf4; stroke: #10b981; }
      .router { fill: #f4f0ff; stroke: #8b5cf6; }
      .lib { fill: #f8fafc; stroke: #94a3b8; }
      .focus { fill: #fff0df; stroke: #f97316; stroke-width: 2.5; }
      .storage { fill: #eef2f7; stroke: #475569; }
      .config { fill: #fff9d9; stroke: #ca8a04; }
      .name { font-size: 14px; font-weight: 700; }
      .detail { font-size: 12px; fill: #526077; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#thinArrow); }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .step { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .stepText { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .flowLabel { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="30" y="38" class="title">ShopLedger architecture</text>
  <text x="30" y="59" class="subtitle">Node / Express POS, Khata credit ledger and GST invoicing • numbered blue arrows trace POST /api/orders</text>

  <!-- Layer boundaries -->
  <rect x="20" y="78" width="235" height="604" class="group"/>
  <text x="34" y="101" class="section">BROWSER</text>
  <rect x="275" y="78" width="285" height="604" class="group"/>
  <text x="289" y="101" class="section">EXPRESS / ROUTES</text>
  <rect x="580" y="78" width="600" height="604" class="group"/>
  <text x="594" y="101" class="section">DOMAIN + PERSISTENCE</text>

  <!-- Browser -->
  <rect x="35" y="120" width="205" height="160" class="box browser"/>
  <text x="51" y="145" class="name">public/</text>
  <text x="51" y="169" class="detail">index.html</text>
  <text x="51" y="189" class="detail">css/style.css</text>
  <text x="51" y="209" class="detail">js/app.js</text>
  <text x="51" y="236" class="detail">get() • post()</text>
  <text x="51" y="256" class="detail">updateCartPreview()</text>

  <!-- Server -->
  <rect x="295" y="120" width="245" height="96" class="box server"/>
  <text x="311" y="145" class="name">server.js</text>
  <text x="311" y="168" class="detail">Express app • JSON body parser</text>
  <text x="311" y="188" class="detail">static public/ • mounts /api</text>
  <text x="311" y="208" class="detail">GET /orders/:id/invoice</text>

  <!-- Routers -->
  <rect x="295" y="244" width="245" height="90" class="box router"/>
  <text x="311" y="267" class="name">routes/products.js</text>
  <text x="311" y="290" class="detail">GET /products</text>
  <text x="311" y="310" class="detail">GET /coupons</text>

  <rect x="295" y="350" width="245" height="110" class="box router"/>
  <text x="311" y="373" class="name">routes/orders.js</text>
  <text x="311" y="396" class="detail">GET /orders • GET /orders/:id</text>
  <text x="311" y="416" class="detail">POST /orders</text>
  <text x="311" y="436" class="detail">POST /orders/:id/cancel</text>

  <rect x="295" y="476" width="245" height="88" class="box router"/>
  <text x="311" y="499" class="name">routes/customers.js</text>
  <text x="311" y="522" class="detail">GET /customers</text>
  <text x="311" y="542" class="detail">POST /customers/:id/settle</text>

  <rect x="295" y="580" width="245" height="88" class="box router"/>
  <text x="311" y="603" class="name">routes/reports.js</text>
  <text x="311" y="626" class="detail">GET reports/* • GET /admin/export</text>
  <text x="311" y="646" class="detail">POST /pricing/preview</text>

  <!-- Library modules, column 1 -->
  <rect x="600" y="120" width="172" height="76" class="box lib"/>
  <text x="614" y="143" class="name">lib/inventory.js</text>
  <text x="614" y="166" class="detail">find() • check()</text>
  <text x="614" y="184" class="detail">reserve() • release()</text>

  <rect x="600" y="214" width="172" height="76" class="box lib"/>
  <text x="614" y="237" class="name">lib/pricing.js</text>
  <text x="614" y="260" class="detail">subtotal() • discount()</text>
  <text x="614" y="278" class="detail">computeTotals()</text>

  <rect x="600" y="308" width="172" height="76" class="box lib"/>
  <text x="614" y="331" class="name">lib/coupons.js</text>
  <text x="614" y="354" class="detail">normalizeCode() • validate()</text>
  <text x="614" y="372" class="detail">calculateDiscount()</text>

  <rect x="600" y="402" width="172" height="76" class="box lib"/>
  <text x="614" y="425" class="name">lib/orders.js</text>
  <text x="614" y="448" class="detail">add() • get() • list()</text>
  <text x="614" y="466" class="detail">cancel()</text>

  <rect x="600" y="496" width="172" height="76" class="box lib"/>
  <text x="614" y="519" class="name">lib/ledger.js</text>
  <text x="614" y="542" class="detail">findCustomer()</text>
  <text x="614" y="560" class="detail">chargeOrderToKhata()</text>

  <!-- Library modules, column 2 -->
  <rect x="794" y="120" width="172" height="76" class="box focus"/>
  <text x="808" y="143" class="name">lib/tax.js</text>
  <text x="808" y="166" class="detail">getRateForItem()</text>
  <text x="808" y="184" class="detail">splitCgstSgst()</text>

  <rect x="794" y="214" width="172" height="76" class="box focus"/>
  <text x="808" y="237" class="name">lib/invoice.js</text>
  <text x="808" y="260" class="detail">computeInvoiceFigures()</text>
  <text x="808" y="278" class="detail">render()</text>

  <rect x="794" y="308" width="172" height="76" class="box lib"/>
  <text x="808" y="331" class="name">lib/reports.js</text>
  <text x="808" y="354" class="detail">getDashboardSummary()</text>
  <text x="808" y="372" class="detail">getGstReconciliation()</text>

  <rect x="794" y="402" width="172" height="76" class="box lib"/>
  <text x="808" y="425" class="name">lib/dates.js</text>
  <text x="808" y="448" class="detail">today() • normalizeDateKey()</text>
  <text x="808" y="466" class="detail">getFiscalYear()</text>

  <rect x="794" y="496" width="172" height="76" class="box lib"/>
  <text x="808" y="519" class="name">lib/store.js</text>
  <text x="808" y="542" class="detail">read() • write()</text>
  <text x="808" y="560" class="detail">appendAudit()</text>

  <!-- Configuration and persistence -->
  <rect x="988" y="120" width="172" height="170" class="box config"/>
  <text x="1002" y="143" class="name">config.js</text>
  <text x="1002" y="166" class="detail">port • adminKey • shop</text>
  <text x="1002" y="186" class="detail">tax.defaultRate</text>
  <text x="1002" y="206" class="detail">tax.hsnSlabs</text>
  <text x="1002" y="226" class="detail">inventory settings</text>
  <text x="1002" y="246" class="detail">coupon definitions</text>
  <text x="1002" y="273" class="detail">read by server + libs</text>

  <rect x="988" y="402" width="172" height="170" class="box storage"/>
  <text x="1002" y="425" class="name">data/db.json</text>
  <text x="1002" y="448" class="detail">products[] • orders[]</text>
  <text x="1002" y="468" class="detail">customers[]</text>
  <text x="1002" y="488" class="detail">settlements[]</text>
  <text x="1002" y="508" class="detail">auditLog[]</text>
  <text x="1002" y="528" class="detail">nextOrderId</text>
  <text x="1002" y="548" class="detail">nextSettlementId</text>

  <!-- Structural dependencies -->
  <path d="M240 152 H295" class="dependency"/>
  <path d="M417 216 V244" class="dependency"/>
  <path d="M417 216 V350" class="dependency"/>
  <path d="M417 216 V476" class="dependency"/>
  <path d="M417 216 V580" class="dependency"/>
  <path d="M772 252 H794" class="dependency"/>
  <path d="M880 214 V196" class="dependency"/>
  <path d="M966 158 H988" class="dependency"/>
  <path d="M966 252 H988 V290" class="dependency"/>
  <path d="M966 346 H1074 V290" class="dependency"/>
  <path d="M966 534 H988" class="dependency"/>
  <path d="M1074 402 V290" class="dependency"/>

  <!-- Numbered order placement flow -->
  <path d="M240 235 H268 V405 H295" class="flow"/>
  <circle cx="267" cy="335" r="11" class="step"/><text x="267" y="335" class="stepText">1</text>
  <text x="45" y="309" class="flowLabel">1  POST /api/orders</text>

  <path d="M540 388 H570 V158 H600" class="flow"/>
  <circle cx="570" cy="270" r="11" class="step"/><text x="570" y="270" class="stepText">2</text>
  <text x="577" y="112" class="flowLabel">2 resolve + check stock</text>

  <path d="M600 252 H575 V214 H600" class="flow"/>
  <circle cx="575" cy="233" r="11" class="step"/><text x="575" y="233" class="stepText">3</text>
  <text x="601" y="207" class="flowLabel">3 calculate totals</text>

  <path d="M686 214 V196 H880" class="flow"/>
  <circle cx="786" cy="196" r="11" class="step"/><text x="786" y="196" class="stepText">4</text>
  <text x="786" y="113" class="flowLabel">4 resolve HSN GST</text>

  <path d="M600 270 H575 V534 H600" class="flow"/>
  <circle cx="575" cy="534" r="11" class="step"/><text x="575" y="534" class="stepText">5</text>
  <text x="577" y="591" class="flowLabel">5 charge Khata if selected</text>

  <path d="M600 516 H580 V178 H600" class="flow"/>
  <circle cx="580" cy="452" r="11" class="step"/><text x="580" y="452" class="stepText">6</text>
  <text x="594" y="604" class="flowLabel">6 deduct inventory</text>

  <path d="M600 196 H586 V440 H600" class="flow"/>
  <circle cx="586" cy="385" r="11" class="step"/><text x="586" y="385" class="stepText">7</text>
  <text x="594" y="622" class="flowLabel">7 orders.add()</text>

  <path d="M772 440 H780 V534 H794" class="flow"/>
  <circle cx="780" cy="487" r="11" class="step"/><text x="780" y="487" class="stepText">8</text>
  <text x="794" y="604" class="flowLabel">8 audit + store.write()</text>

  <path d="M966 550 H976 V487 H988" class="flow"/>
  <circle cx="976" cy="519" r="11" class="step"/><text x="976" y="519" class="stepText">9</text>
  <text x="982" y="604" class="flowLabel">9 persist JSON</text>

  <!-- Legend -->
  <rect x="35" y="704" width="1125" height="70" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="51" y="730" class="section">LEGEND</text>
  <rect x="132" y="714" width="24" height="20" class="box focus"/>
  <text x="166" y="730" class="detail">Ticket focus: invoice calculation + required tax dependency</text>
  <line x1="527" y1="724" x2="577" y2="724" class="flow"/>
  <text x="588" y="730" class="detail">Numbered order-placement flow</text>
  <line x1="801" y1="724" x2="851" y2="724" class="dependency"/>
  <text x="862" y="730" class="detail">Other runtime dependency</text>
  <text x="51" y="756" class="detail">Printable invoice path: server.js → lib/orders.js.get() → lib/invoice.js.render(); invoice figures are recomputed separately from checkout totals.</text>
</svg>
