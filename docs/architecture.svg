<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="description">Source-verified browser, Express server, four routers, ten library modules, configuration, and JSON database. Purple highlights the invoice path. A nine-step sequence traces order placement. Arrows show selected connections; router cards list their local dependencies. Invoice calculations are independent of checkout pricing and do not call the tax module.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b45; font-size: 12px; }
      .title { font-size: 27px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 13px; fill: #52657e; }
      .section { font-size: 14px; font-weight: 700; }
      .filename { font-size: 15px; font-weight: 700; }
      .topname { font-size: 18px; font-weight: 700; }
      .detail { font-size: 12px; fill: #52657e; }
      .small { font-size: 12px; }
      .panel { fill: #eef3f9; stroke: #d7e0ec; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #b8c8db; stroke-width: 1.2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .ticket { fill: #f4edff; stroke: #7c3aed; stroke-width: 2; }
      .purple { fill: #6d28d9; }
      .number { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .flow-title { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="24" y="36" class="title">ShopLedger architecture</text>
  <text x="24" y="60" class="subtitle">Node / Express · POS · Khata · GST invoicing — file and function names verified from source</text>

  <!-- Legend. All type is at least 12px; fonts are local system fallbacks. -->
  <rect x="707" y="23" width="16" height="16" rx="4" class="ticket"/>
  <text x="731" y="36">Invoice path</text>
  <circle cx="851" cy="31" r="10" fill="#2563eb"/><text x="851" y="31" class="number">1</text>
  <text x="868" y="36">Order step</text>
  <path d="M 970 31 H 1000" class="edge"/>
  <text x="1009" y="36">Selected connection</text>

  <!-- Top-level entry points. -->
  <rect x="24" y="88" width="242" height="112" rx="10" class="card"/>
  <text x="40" y="114" class="topname">Browser UI · public/</text>
  <text x="40" y="137">index.html · js/app.js</text>
  <text x="40" y="156">css/style.css</text>
  <text x="40" y="181" class="detail">POS · order history · Khata · audit</text>

  <rect x="300" y="88" width="570" height="112" rx="10" fill="#eaf2ff" stroke="#93b8ee" stroke-width="1.2"/>
  <text x="316" y="114" class="topname">server.js</text>
  <text x="316" y="137">JSON middleware · serves public/ · mounts all four routers at /api</text>
  <text x="316" y="158">POST /api/orders → routes/orders.js</text>
  <text x="316" y="180" class="purple">GET /orders/:id/invoice → store.read() → orders.get() → invoice.render()</text>

  <path d="M 266 142 H 300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M 870 128 H 932" class="edge"/>
  <text x="877" y="116" class="detail">requires</text>

  <rect x="932" y="88" width="244" height="112" rx="10" fill="#fff8e7" stroke="#d9bd76" stroke-width="1.2"/>
  <text x="948" y="114" class="topname">config.js</text>
  <text x="948" y="137">Shop · port · admin key</text>
  <text x="948" y="157">HSN slabs · coupon definitions</text>
  <text x="948" y="181" class="detail">Inventory defaults</text>

  <rect x="24" y="230" width="260" height="356" rx="10" class="panel"/>
  <text x="40" y="251" class="section">routes/ · dependency names below</text>

  <rect x="40" y="264" width="228" height="72" rx="7" class="card"/>
  <text x="52" y="284" class="filename">products.js</text>
  <text x="52" y="303">GET /products · GET /coupons</text>
  <text x="52" y="324" class="detail">store · inventory · tax · coupons</text>

  <rect x="40" y="344" width="228" height="72" rx="7" class="card"/>
  <text x="52" y="364" class="filename">orders.js</text>
  <text x="52" y="383">POST /orders · GET /orders</text>
  <text x="52" y="398" class="detail">store · inventory · pricing</text>
  <text x="52" y="411" class="detail">coupons · orders · ledger</text>

  <rect x="40" y="424" width="228" height="72" rx="7" class="card"/>
  <text x="52" y="444" class="filename">customers.js</text>
  <text x="52" y="463">GET /customers</text>
  <text x="52" y="478">POST /customers/:id/settle</text>
  <text x="52" y="491" class="detail">store · ledger</text>

  <rect x="40" y="504" width="228" height="72" rx="7" class="card"/>
  <text x="52" y="524" class="filename">reports.js</text>
  <text x="52" y="543">POST /pricing/preview</text>
  <text x="52" y="558" class="detail">config · store · reports</text>
  <text x="52" y="571" class="detail">pricing · coupons</text>

  <!-- Library inventory. Function names are exported by the corresponding file. -->
  <rect x="316" y="230" width="582" height="356" rx="10" class="panel"/>
  <text x="332" y="251" class="section">lib/ · business rules, rendering &amp; persistence</text>

  <rect x="332" y="264" width="267" height="56" rx="7" class="card"/>
  <text x="344" y="283" class="filename">inventory.js</text>
  <text x="344" y="301">find() · check() · reserve() · release()</text>
  <text x="344" y="314" class="detail">getSellableStock() · summarize()</text>

  <rect x="332" y="328" width="267" height="56" rx="7" class="card"/>
  <text x="344" y="347" class="filename">coupons.js</text>
  <text x="344" y="365">normalizeCode() · validate()</text>
  <text x="344" y="378" class="detail">calculateDiscount() · listActive()</text>

  <rect x="332" y="392" width="267" height="56" rx="7" class="card"/>
  <text x="344" y="411" class="filename">pricing.js</text>
  <text x="344" y="429">subtotal() · discount() · computeTotals()</text>
  <text x="344" y="442" class="detail">Calls coupons + tax; discounts before GST</text>

  <rect x="332" y="456" width="267" height="56" rx="7" class="card"/>
  <text x="344" y="475" class="filename">ledger.js</text>
  <text x="344" y="493">findCustomer() · chargeOrderToKhata()</text>
  <text x="344" y="506" class="detail">recordSettlement() · reverseOrderDebit()</text>

  <rect x="332" y="520" width="267" height="56" rx="7" class="card"/>
  <text x="344" y="539" class="filename">orders.js</text>
  <text x="344" y="557">add() · get() · list() · cancel()</text>
  <text x="344" y="570" class="detail">Uses dates · inventory · ledger</text>

  <rect x="615" y="264" width="267" height="56" rx="7" class="card"/>
  <text x="627" y="283" class="filename">store.js</text>
  <text x="627" y="301">read() · appendAudit() · write()</text>
  <text x="627" y="314" class="detail">JSON-file read / write</text>

  <rect x="615" y="328" width="267" height="56" rx="7" class="card"/>
  <text x="627" y="347" class="filename">tax.js</text>
  <text x="627" y="365">getRateForItem() · getSlabPercent()</text>
  <text x="627" y="378" class="detail">splitCgstSgst() · uses config</text>

  <rect x="615" y="392" width="267" height="56" rx="7" class="card"/>
  <text x="627" y="411" class="filename">dates.js</text>
  <text x="627" y="429">today() · normalizeDateKey()</text>
  <text x="627" y="442" class="detail">getFiscalYear()</text>

  <rect x="615" y="456" width="267" height="56" rx="7" class="card"/>
  <text x="627" y="475" class="filename">reports.js</text>
  <text x="627" y="493">getDashboardSummary()</text>
  <text x="627" y="506" class="detail">getGstReconciliation() → invoice</text>

  <rect x="615" y="520" width="267" height="56" rx="7" class="ticket"/>
  <text x="627" y="539" class="filename purple">invoice.js</text>
  <rect x="810" y="527" width="60" height="18" rx="4" fill="#7c3aed"/>
  <text x="840" y="540" text-anchor="middle" style="fill:#ffffff;font-weight:700">INVOICE</text>
  <text x="627" y="557">render() → computeInvoiceFigures()</text>
  <text x="627" y="570" class="detail">Uses config; independent calculation</text>

  <!-- Selected real call connections, deliberately not a complete import graph. -->
  <path d="M 345 200 V 214 H 14 V 540" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 14 300 H 40" class="edge"/>
  <path d="M 14 380 H 40" class="edge"/>
  <path d="M 14 460 H 40" class="edge"/>
  <path d="M 14 540 H 40" class="edge"/>
  <path d="M 268 380 H 306 V 292 H 332" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue-arrow)"/>
  <path d="M 599 420 H 607 V 356 H 615" class="edge"/>
  <path d="M 748 512 V 520" class="edge"/>
  <path d="M 870 174 H 918 V 548 H 882" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#purple-arrow)"/>

  <rect x="932" y="234" width="244" height="118" rx="10" fill="#eaf7f1" stroke="#8abfa5" stroke-width="1.2"/>
  <text x="948" y="260" class="topname">data/db.json</text>
  <text x="948" y="282">Products · orders · next IDs</text>
  <text x="948" y="302">Customers · settlements · auditLog</text>
  <text x="948" y="333" class="detail">Synchronous whole-file persistence</text>
  <path d="M 882 292 H 932" class="edge"/>

  <rect x="932" y="392" width="244" height="194" rx="10" fill="#ffffff" stroke="#d7e0ec"/>
  <text x="948" y="418" class="section">Checkout ≠ printable invoice</text>
  <text x="948" y="443">pricing → coupons + tax</text>
  <text x="948" y="462" class="detail">Discount before HSN-based GST</text>
  <text x="948" y="489" class="purple">invoice → config only</text>
  <text x="948" y="508" class="detail">Gross GST, then coupon</text>
  <text x="948" y="527" class="detail">No tax.js call from invoice.js</text>
  <text x="948" y="554" class="detail">Order saves aggregate totals;</text>
  <text x="948" y="573" class="detail">invoice recalculates them.</text>

  <!-- Numbered happy path, read left to right across each row. -->
  <rect x="24" y="608" width="1152" height="168" rx="10" fill="#edf4ff" stroke="#b7cff3"/>
  <text x="40" y="631" class="section">PLACING AN ORDER · execution order 1–9 · read left to right across each row</text>
  <path d="M 405 644 V 766 M 784 644 V 766" stroke="#ccdaee" stroke-width="1"/>

  <circle cx="52" cy="656" r="11" fill="#2563eb"/><text x="52" y="656" class="number">1</text>
  <text x="72" y="653" class="flow-title">Browser → POST /api/orders</text>
  <text x="72" y="670" class="detail">server.js → routes/orders.js</text>

  <circle cx="431" cy="656" r="11" fill="#2563eb"/><text x="431" y="656" class="number">2</text>
  <text x="451" y="653" class="flow-title">store.read()</text>
  <text x="451" y="670" class="detail">Read + parse data/db.json</text>

  <circle cx="810" cy="656" r="11" fill="#2563eb"/><text x="810" y="656" class="number">3</text>
  <text x="830" y="653" class="flow-title">inventory.find() → check()</text>
  <text x="830" y="670" class="detail">Resolve catalog items; check stock</text>

  <circle cx="52" cy="702" r="11" fill="#2563eb"/><text x="52" y="702" class="number">4</text>
  <text x="72" y="699" class="flow-title">coupons.normalizeCode() → validate()</text>
  <text x="72" y="716" class="detail">pricing.subtotal() supplies cart value</text>

  <circle cx="431" cy="702" r="11" fill="#2563eb"/><text x="431" y="702" class="number">5</text>
  <text x="451" y="699" class="flow-title">pricing.computeTotals()</text>
  <text x="451" y="716" class="detail">Coupon → allocation → tax → CGST/SGST</text>

  <circle cx="810" cy="702" r="11" fill="#2563eb"/><text x="810" y="702" class="number">6</text>
  <text x="830" y="699" class="flow-title">ledger.chargeOrderToKhata()</text>
  <text x="830" y="716" class="detail">If Khata: check limit; update balance</text>

  <circle cx="52" cy="748" r="11" fill="#2563eb"/><text x="52" y="748" class="number">7</text>
  <text x="72" y="745" class="flow-title">inventory.reserve()</text>
  <text x="72" y="762" class="detail">Deduct physical stock</text>

  <circle cx="431" cy="748" r="11" fill="#2563eb"/><text x="431" y="748" class="number">8</text>
  <text x="451" y="745" class="flow-title">orders.add()</text>
  <text x="451" y="762" class="detail">Increment ID; append order snapshot</text>

  <circle cx="810" cy="748" r="11" fill="#2563eb"/><text x="810" y="748" class="number">9</text>
  <text x="830" y="745" class="flow-title">store.appendAudit() → write()</text>
  <text x="830" y="762" class="detail">Save JSON; return HTTP 201 with order</text>
</svg>
