<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser app, Express server, API routers, library modules and JSON database, with an ordered order-placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d97706"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .section{font-size:15px;font-weight:700}.name{font-size:14px;font-weight:700}.detail{font-size:12px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .ticket{fill:#e7f6f2;stroke:#138a72;stroke-width:1.6}.ticketText{fill:#075e50}.tag{font-size:11px;font-weight:700;fill:#075e50}
      .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flowLine{fill:none;stroke:#d97706;stroke-width:2;marker-end:url(#flowArrow)}
      .step{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.2}.stepNum{fill:#b45309;font-size:13px;font-weight:700}.stepText{font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text class="title" x="32" y="38">ShopLedger · application architecture</text>
  <text class="subtitle" x="33" y="61">Browser POS · Express API · JSON file storage</text>

  <!-- Legend -->
  <rect x="804" y="22" width="364" height="48" rx="9" class="card"/>
  <rect x="820" y="37" width="19" height="17" rx="3" class="ticket"/>
  <text class="detail" x="847" y="50">Ticket scope</text>
  <text class="detail" x="928" y="50">lib/orders.js: list() only · lib/dates.js ·</text>
  <text class="detail" x="928" y="65">lib/ledger.js · routes/customers.js</text>

  <!-- Main system layers -->
  <rect x="24" y="88" width="1152" height="446" rx="14" class="group"/>
  <text class="section" x="42" y="111">Application components</text>

  <!-- Browser -->
  <rect x="42" y="132" width="202" height="118" rx="10" class="card"/>
  <text class="name" x="58" y="158">Browser UI · public/</text>
  <text class="detail" x="58" y="181">index.html</text>
  <text class="detail" x="58" y="199">js/app.js · css/style.css</text>
  <text class="detail" x="58" y="227">POS, orders, Khata, reports</text>

  <!-- Server -->
  <rect x="284" y="132" width="205" height="118" rx="10" class="card"/>
  <text class="name" x="300" y="158">server.js</text>
  <text class="detail" x="300" y="181">Express app + JSON parser</text>
  <text class="detail" x="300" y="199">serves public/ static files</text>
  <text class="detail" x="300" y="227">mounts routers at /api</text>

  <!-- Config -->
  <rect x="570" y="132" width="220" height="118" rx="10" class="card"/>
  <text class="name" x="586" y="158">config.js</text>
  <text class="detail" x="586" y="181">shop · tax · inventory</text>
  <text class="detail" x="586" y="199">coupons · port · adminKey</text>
  <text class="detail" x="586" y="227">read by app modules</text>

  <!-- Database -->
  <rect x="924" y="132" width="224" height="118" rx="10" class="card"/>
  <text class="name" x="940" y="158">data/db.json</text>
  <text class="detail" x="940" y="181">products · orders · customers</text>
  <text class="detail" x="940" y="199">settlements · auditLog · IDs</text>
  <text class="detail" x="940" y="227">read/write via lib/store.js</text>

  <!-- API routes -->
  <rect x="284" y="278" width="864" height="234" rx="11" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text class="section" x="301" y="302">routes/ · API endpoints</text>
  <rect x="302" y="317" width="390" height="72" rx="8" class="card"/>
  <text class="name" x="317" y="339">routes/products.js</text>
  <text class="detail" x="317" y="361">GET /products · GET /coupons</text>
  <rect x="714" y="317" width="416" height="72" rx="8" class="card"/>
  <text class="name" x="729" y="339">routes/orders.js</text>
  <text class="detail" x="729" y="361">GET /orders · GET /orders/:id · POST /orders · POST /orders/:id/cancel</text>
  <rect x="302" y="405" width="390" height="82" rx="8" class="ticket"/>
  <text class="name ticketText" x="317" y="430">routes/customers.js</text>
  <text class="detail ticketText" x="317" y="452">GET /customers</text>
  <text class="detail ticketText" x="317" y="472">POST /customers/:id/settle</text>
  <text class="tag" x="619" y="430">TICKET</text>
  <rect x="714" y="405" width="416" height="82" rx="8" class="card"/>
  <text class="name" x="729" y="430">routes/reports.js</text>
  <text class="detail" x="729" y="452">GET /reports/dashboard · GET /reports/gst-reconciliation</text>
  <text class="detail" x="729" y="472">POST /pricing/preview · GET /admin/export</text>

  <!-- Library modules -->
  <rect x="42" y="278" width="218" height="234" rx="11" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="section" x="58" y="302">lib/ · modules</text>
  <rect x="55" y="314" width="190" height="34" rx="6" class="ticket"/>
  <text class="detail ticketText" x="65" y="336">orders.js · list() only</text>
  <text class="tag" x="205" y="336">T</text>
  <rect x="55" y="353" width="190" height="34" rx="6" class="ticket"/>
  <text class="detail ticketText" x="65" y="375">dates.js</text><text class="tag" x="205" y="375">T</text>
  <rect x="55" y="392" width="190" height="34" rx="6" class="ticket"/>
  <text class="detail ticketText" x="65" y="414">ledger.js</text><text class="tag" x="205" y="414">T</text>
  <text class="detail" x="58" y="450">store.js · inventory.js · pricing.js</text>
  <text class="detail" x="58" y="470">tax.js · coupons.js · invoice.js</text>
  <text class="detail" x="58" y="490">reports.js</text>

  <!-- Connections -->
  <path class="line" d="M244 191H284"/>
  <path class="line" d="M489 191H548V278"/>
  <path class="line" d="M489 210H510V431H284"/>
  <path class="line" d="M244 324H284"/>
  <path class="line" d="M244 432H284"/>
  <path class="line" d="M489 236H904V191H924"/>
  <path class="line" d="M790 191H850V278"/>

  <!-- Order placement flow -->
  <text class="section" x="32" y="567">Order placement · numbered request path</text>
  <text class="subtitle" x="32" y="588">POST /api/orders flows through the order route, business modules, and JSON persistence.</text>
  <path class="flowLine" d="M194 650H211"/><path class="flowLine" d="M371 650H388"/>
  <path class="flowLine" d="M548 650H565"/><path class="flowLine" d="M725 650H742"/>
  <path class="flowLine" d="M902 650H919"/><path class="flowLine" d="M1079 650H1096"/>

  <g transform="translate(32 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">1</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">public/js/app.js</tspan></text><text class="stepText" x="13" y="49">sends cart payload</text><text class="stepText" x="13" y="68">POST /api/orders</text>
  </g>
  <g transform="translate(209 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">2</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">server.js</tspan></text><text class="stepText" x="13" y="49">routes request to</text><text class="stepText" x="13" y="68">routes/orders.js</text>
  </g>
  <g transform="translate(386 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">3</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">orders.js route</tspan></text><text class="stepText" x="13" y="49">resolves products;</text><text class="stepText" x="13" y="68">checks stock/coupon</text>
  </g>
  <g transform="translate(563 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">4</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">pricing.js + tax.js</tspan></text><text class="stepText" x="13" y="49">compute subtotal,</text><text class="stepText" x="13" y="68">discount and GST</text>
  </g>
  <g transform="translate(740 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">5</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">ledger.js</tspan></text><text class="stepText" x="13" y="49">Khata only:</text><text class="stepText" x="13" y="68">chargeOrderToKhata()</text>
  </g>
  <g transform="translate(917 608)">
    <rect width="162" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">6</text>
    <text class="stepText" x="37" y="23"><tspan font-weight="700">inventory + orders</tspan></text><text class="stepText" x="13" y="49">reserve stock;</text><text class="stepText" x="13" y="68">orders.add(db, …)</text>
  </g>
  <g transform="translate(1094 608)">
    <rect width="80" height="88" rx="9" class="step"/><circle cx="18" cy="19" r="12" fill="#ffedd5" stroke="#f59e0b"/><text class="stepNum" x="14" y="24">7</text>
    <text class="stepText" x="10" y="49"><tspan font-weight="700">store</tspan></text><text class="stepText" x="10" y="68">write JSON</text>
  </g>
  <text class="detail" x="32" y="735">Conditional path: Khata billing updates the customer ledger. Successful request saves the order, inventory, customer totals (if applicable), and audit entry.</text>
  <text class="detail" x="32" y="760">Ticket highlight marks lib/orders.js list() only, lib/dates.js, lib/ledger.js, and routes/customers.js.</text>
</svg>
