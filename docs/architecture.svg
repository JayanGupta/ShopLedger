<rect x="30" y="690" width="1135" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="48" y="718" class="g">Legend</text><rect x="125" y="704" width="18" height="18" fill="#dbeafe" stroke="#2563eb"/><text x="151" y="718" class="s">request / standard module</text>
