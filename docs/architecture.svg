<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, library modules, configuration and JSON database, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#526176}
      .head{font-size:15px;font-weight:700}.boxTitle{font-size:13px;font-weight:700}.body{font-size:12px;fill:#475569}.tiny{font-size:12px;fill:#526176}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.route{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.2}.lib{fill:#fff;stroke:#94a3b8;stroke-width:1.1}.ticket{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.data{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.3}.flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}.dep{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}
      .badge{fill:#2563eb;stroke:#fff;stroke-width:2}.badgeText{font-size:12px;font-weight:700;fill:white;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="30" y="38" class="title">ShopLedger · Application architecture</text>
  <text x="30" y="61" class="sub">Browser POS, Express API, business modules, JSON persistence · order flow numbered 1–6</text>

  <!-- Main component lanes -->
  <rect x="24" y="86" width="210" height="628" rx="12" class="panel"/>
  <text x="42" y="112" class="head">Browser</text>
  <rect x="42" y="132" width="174" height="110" rx="8" class="box"/>
  <text x="56" y="157" class="boxTitle">public/</text>
  <text x="56" y="180" class="body">index.html · POS screen</text>
  <text x="56" y="199" class="body">js/app.js · browser logic</text>
  <text x="56" y="218" class="body">css/style.css · styles</text>
  <text x="42" y="274" class="tiny">Also calls customers, product,</text>
  <text x="42" y="292" class="tiny">report and preview endpoints.</text>
  <rect x="42" y="320" width="174" height="112" rx="8" class="box"/>
  <text x="56" y="345" class="boxTitle">Order action</text>
  <text x="56" y="368" class="body">getSelectedCartItems()</text>
  <text x="56" y="388" class="body">post('/api/orders', payload)</text>
  <text x="56" y="408" class="body">Shows total + invoice link</text>

  <rect x="266" y="86" width="170" height="628" rx="12" class="panel"/>
  <text x="284" y="112" class="head">HTTP layer</text>
  <rect x="284" y="132" width="134" height="100" rx="8" class="box"/>
  <text x="298" y="158" class="boxTitle">server.js</text>
  <text x="298" y="180" class="body">Express app</text>
  <text x="298" y="199" class="body">JSON + static UI</text>
  <text x="298" y="218" class="body">Invoice endpoint</text>
  <text x="284" y="260" class="tiny">Mounts routers under /api</text>
  <rect x="284" y="286" width="134" height="58" rx="7" class="route"/>
  <text x="297" y="310" class="boxTitle">routes/orders.js</text>
  <text x="297" y="330" class="body">POST /orders</text>
  <rect x="284" y="359" width="134" height="54" rx="7" class="route"/>
  <text x="297" y="382" class="boxTitle">routes/products.js</text>
  <text x="297" y="401" class="body">products, coupons</text>
  <rect x="284" y="428" width="134" height="54" rx="7" class="route"/>
  <text x="297" y="451" class="boxTitle">routes/customers.js</text>
  <text x="297" y="470" class="body">Khata, settlements</text>
  <rect x="284" y="497" width="134" height="64" rx="7" class="route"/>
  <text x="297" y="520" class="boxTitle">routes/reports.js</text>
  <text x="297" y="539" class="body">preview, dashboard,</text>
  <text x="297" y="555" class="body">GST reconciliation</text>
  <rect x="284" y="585" width="134" height="83" rx="7" class="ticket"/>
  <text x="297" y="610" class="boxTitle">GET /orders/:id/</text>
  <text x="297" y="628" class="boxTitle">invoice (server.js)</text>
  <text x="297" y="651" class="body">orders.get → render</text>

  <rect x="468" y="86" width="434" height="628" rx="12" class="panel"/>
  <text x="486" y="112" class="head">Business modules · lib/</text>
  <!-- modules shown individually -->
  <rect x="486" y="132" width="190" height="68" rx="7" class="lib"/>
  <text x="500" y="155" class="boxTitle">pricing.js</text><text x="500" y="177" class="body">subtotal · computeTotals</text>
  <rect x="694" y="132" width="190" height="68" rx="7" class="lib"/>
  <text x="708" y="155" class="boxTitle">tax.js</text><text x="708" y="177" class="body">HSN rates · CGST/SGST</text>
  <rect x="486" y="214" width="190" height="68" rx="7" class="lib"/>
  <text x="500" y="237" class="boxTitle">coupons.js</text><text x="500" y="259" class="body">normalize · validate · discount</text>
  <rect x="694" y="214" width="190" height="68" rx="7" class="lib"/>
  <text x="708" y="237" class="boxTitle">inventory.js</text><text x="708" y="259" class="body">find · check · reserve · release</text>
  <rect x="486" y="296" width="190" height="68" rx="7" class="lib"/>
  <text x="500" y="319" class="boxTitle">orders.js</text><text x="500" y="341" class="body">add · get · cancel · list</text>
  <rect x="694" y="296" width="190" height="68" rx="7" class="lib"/>
  <text x="708" y="319" class="boxTitle">ledger.js</text><text x="708" y="341" class="body">Khata · settlements</text>
  <rect x="486" y="378" width="190" height="68" rx="7" class="lib"/>
  <text x="500" y="401" class="boxTitle">store.js</text><text x="500" y="423" class="body">read · write · appendAudit</text>
  <rect x="694" y="378" width="190" height="68" rx="7" class="lib"/>
  <text x="708" y="401" class="boxTitle">dates.js</text><text x="708" y="423" class="body">today · date keys · fiscal year</text>
  <rect x="486" y="460" width="190" height="68" rx="7" class="lib"/>
  <text x="500" y="483" class="boxTitle">reports.js</text><text x="500" y="505" class="body">dashboard · reconciliation</text>
  <rect x="694" y="460" width="190" height="92" rx="7" class="ticket"/>
  <text x="708" y="484" class="boxTitle">invoice.js</text><text x="708" y="506" class="body">computeInvoiceFigures</text><text x="708" y="526" class="body">render printable HTML</text><text x="708" y="546" class="body">Ticket focus</text>
  <text x="486" y="584" class="tiny">pricing.js uses tax.js + coupons.js;</text>
  <text x="486" y="603" class="tiny">reports.js calls invoice.js reconciliation.</text>
  <text x="486" y="632" class="tiny">tax.js is checkout pricing support;</text>
  <text x="486" y="651" class="tiny">invoice.js does not call tax.js.</text>

  <rect x="932" y="86" width="244" height="628" rx="12" class="panel"/>
  <text x="950" y="112" class="head">Data &amp; settings</text>
  <rect x="950" y="142" width="208" height="112" rx="8" class="box"/>
  <text x="966" y="169" class="boxTitle">config.js</text>
  <text x="966" y="192" class="body">Shop / port / admin key</text>
  <text x="966" y="212" class="body">GST slabs / coupons</text>
  <text x="966" y="232" class="body">Inventory defaults</text>
  <rect x="950" y="340" width="208" height="124" rx="8" class="data"/>
  <text x="966" y="368" class="boxTitle">data/db.json</text>
  <text x="966" y="392" class="body">products · orders</text>
  <text x="966" y="412" class="body">customers · settlements</text>
  <text x="966" y="432" class="body">auditLog · ID counters</text>
  <text x="950" y="511" class="tiny">lib/store.js reads/writes</text>
  <text x="950" y="530" class="tiny">the JSON file synchronously.</text>

  <!-- Order flow numbered connections -->
  <path d="M216 374 H260 V181 H280" class="flow"/>
  <circle cx="244" cy="374" r="13" class="badge"/><text x="244" y="374" class="badgeText">1</text>
  <path d="M351 232 V280 H350 V282" class="flow"/>
  <circle cx="367" cy="274" r="13" class="badge"/><text x="367" y="274" class="badgeText">2</text>
  <path d="M580 200 V210" class="dep"/>
  <path d="M580 282 V292" class="dep"/>
  <path d="M676 330 H690" class="dep"/>
  <path d="M786 364 V374" class="dep"/>
  <circle cx="870" cy="282" r="13" class="badge"/><text x="870" y="282" class="badgeText">4</text>
  <circle cx="658" cy="360" r="13" class="badge"/><text x="658" y="360" class="badgeText">5</text>
  <path d="M418 315 H450 V166 H482" class="flow"/>
  <circle cx="454" cy="278" r="13" class="badge"/><text x="454" y="278" class="badgeText">3</text>
  <path d="M676 412 H914 V402 H946" class="flow"/>
  <circle cx="908" cy="402" r="13" class="badge"/><text x="908" y="402" class="badgeText">6</text>
  <path d="M418 626 H680 V506 H690" class="dep dash"/>

  <!-- Flow key, visually tied to lanes -->
  <rect x="24" y="731" width="1152" height="53" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="754" class="boxTitle">Order placement flow:</text>
  <text x="194" y="754" class="body">1 UI submits cart</text>
  <text x="324" y="754" class="body">2 POST /api/orders</text>
  <text x="482" y="754" class="body">3 validate stock + coupon, calculate totals</text>
  <text x="774" y="754" class="body">4 update Khata (if selected) + reserve stock</text>
  <text x="194" y="774" class="body">5 orders.add + audit entry</text>
  <text x="385" y="774" class="body">6 store.write → data/db.json → return order</text>
  <line x1="805" y1="771" x2="846" y2="771" stroke="#f59e0b" stroke-width="3"/>
  <text x="854" y="775" class="body">ticket focus</text>
  <line x1="961" y1="771" x2="1002" y2="771" stroke="#2563eb" stroke-width="3"/>
  <text x="1010" y="775" class="body">order flow</text>
</svg>
