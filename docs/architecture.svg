<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Verified source modules, their relationships, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#526174"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17212f;font-size:14px}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526174}
      .head{font-size:16px;font-weight:700}.small{font-size:12px}.tiny{font-size:12px;fill:#526174}
      .box{fill:#fff;stroke:#91a0b3;stroke-width:1.5}.group{fill:#f3f6fa;stroke:#c4cfdb;stroke-width:1.2}
      .focus{fill:#fff0dc;stroke:#d97706;stroke-width:2.5}.data{fill:#edf7f1;stroke:#55936c;stroke-width:1.5}
      .flow{fill:none;stroke:#526174;stroke-width:2;marker-end:url(#arrow)}
      .link{fill:none;stroke:#9aa8b7;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrow)}
      .step{fill:#243b5a;stroke:#fff;stroke-width:2}.stepnum{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="40" class="title">ShopLedger · application architecture</text>
  <text x="32" y="64" class="sub">Source-verified modules and order placement path</text>

  <!-- Browser UI -->
  <rect x="32" y="95" width="190" height="115" rx="10" class="box"/>
  <text x="50" y="122" class="head">Browser UI</text>
  <text x="50" y="147">public/</text>
  <text x="50" y="169" class="small">index.html · js/app.js · css/style.css</text>
  <text x="50" y="190" class="tiny">POS, order history, Khata, audit</text>

  <!-- Server -->
  <rect x="272" y="95" width="205" height="115" rx="10" class="box"/>
  <text x="292" y="122" class="head">Express application</text>
  <text x="292" y="148">server.js</text>
  <text x="292" y="170" class="small">static public · JSON body parser</text>
  <text x="292" y="190" class="tiny">mounts /api routers and invoice page</text>
  <path d="M222 150 H272" class="flow"/>

  <!-- Routers -->
  <rect x="525" y="83" width="258" height="250" rx="12" class="group"/>
  <text x="545" y="108" class="head">routes/ · mounted at /api</text>
  <rect x="545" y="122" width="218" height="39" rx="6" class="box"/>
  <text x="558" y="147">orders.js</text><text x="657" y="147" class="tiny">POST /orders</text>
  <rect x="545" y="171" width="218" height="39" rx="6" class="box"/>
  <text x="558" y="196">products.js</text><text x="657" y="196" class="tiny">products, coupons</text>
  <rect x="545" y="220" width="218" height="39" rx="6" class="box"/>
  <text x="558" y="245">customers.js</text><text x="657" y="245" class="tiny">Khata settlements</text>
  <rect x="545" y="269" width="218" height="48" rx="6" class="box"/>
  <text x="558" y="291">reports.js</text><text x="558" y="308" class="tiny">preview · dashboard · export</text>
  <path d="M477 151 H525" class="flow"/>

  <!-- lib modules -->
  <rect x="811" y="83" width="357" height="390" rx="12" class="group"/>
  <text x="831" y="108" class="head">lib/ · business logic</text>
  <rect x="831" y="122" width="145" height="47" rx="6" class="box"/>
  <text x="843" y="143">pricing.js</text><text x="843" y="160" class="tiny">computeTotals()</text>
  <rect x="992" y="122" width="156" height="47" rx="6" class="box"/>
  <text x="1004" y="143">coupons.js</text><text x="1004" y="160" class="tiny">validate · discount</text>
  <rect x="831" y="181" width="145" height="47" rx="6" class="box"/>
  <text x="843" y="202">tax.js</text><text x="843" y="219" class="tiny">HSN slab · split</text>
  <rect x="992" y="181" width="156" height="47" rx="6" class="box"/>
  <text x="1004" y="202">inventory.js</text><text x="1004" y="219" class="tiny">check · reserve</text>
  <rect x="831" y="240" width="145" height="47" rx="6" class="box"/>
  <text x="843" y="261">orders.js</text><text x="843" y="278" class="tiny">add · cancel · list</text>
  <rect x="992" y="240" width="156" height="47" rx="6" class="box"/>
  <text x="1004" y="261">ledger.js</text><text x="1004" y="278" class="tiny">Khata · settlement</text>
  <rect x="831" y="299" width="145" height="47" rx="6" class="box"/>
  <text x="843" y="320">store.js</text><text x="843" y="337" class="tiny">read · write JSON</text>
  <rect x="992" y="299" width="156" height="47" rx="6" class="box"/>
  <text x="1004" y="320">dates.js</text><text x="1004" y="337" class="tiny">date helpers</text>
  <rect x="831" y="358" width="317" height="47" rx="6" class="box"/>
  <text x="843" y="379">reports.js</text><text x="843" y="396" class="tiny">dashboard · GST reconciliation</text>
  <rect x="831" y="417" width="317" height="43" rx="6" class="focus"/>
  <text x="843" y="443" font-weight="700">invoice.js</text><text x="944" y="443" class="small">computeInvoiceFigures() · render()</text>
  <path d="M783 151 H811" class="flow"/>
  <path d="M976 145 H992" class="link"/>
  <path d="M903 169 V181" class="link"/>
  <path d="M1070 346 V358" class="link"/>

  <!-- config and DB -->
  <rect x="32" y="260" width="190" height="77" rx="10" class="box"/>
  <text x="50" y="289" class="head">config.js</text>
  <text x="50" y="313" class="small">shop · GST slabs · coupons</text>
  <rect x="272" y="260" width="205" height="77" rx="10" class="data"/>
  <text x="292" y="289" class="head">data/db.json</text>
  <text x="292" y="313" class="small">products · orders · customers</text>
  <path d="M477 299 H811" class="link"/>
  <text x="540" y="289" class="tiny">lib/store.js reads / writes</text>
  <path d="M222 298 H260" class="link"/>
  <text x="32" y="359" class="tiny">config.js is required by tax.js, coupons.js, invoice.js and routes/reports.js</text>

  <!-- Invoice route -->
  <rect x="525" y="356" width="258" height="72" rx="9" class="focus"/>
  <text x="545" y="382" class="head">Printable invoice route</text>
  <text x="545" y="405" class="small">server.js · GET /orders/:id/invoice</text>
  <path d="M477 178 C500 178 500 391 525 391" class="link"/>
  <path d="M783 391 C807 391 807 438 831 438" class="flow"/>

  <!-- Flow strip -->
  <text x="32" y="510" class="head">Order placement · numbered request and persistence flow</text>
  <rect x="32" y="532" width="1136" height="226" rx="12" class="group"/>

  <g>
    <circle cx="68" cy="574" r="14" class="step"/><text x="68" y="574" class="stepnum">1</text>
    <rect x="91" y="550" width="200" height="55" rx="7" class="box"/>
    <text x="105" y="573" font-weight="700">UI POST</text><text x="105" y="592" class="small">public/js/app.js → /api/orders</text>
    <path d="M291 578 H326" class="flow"/>

    <circle cx="346" cy="574" r="14" class="step"/><text x="346" y="574" class="stepnum">2</text>
    <rect x="369" y="550" width="196" height="55" rx="7" class="box"/>
    <text x="383" y="573" font-weight="700">Resolve cart</text><text x="383" y="592" class="small">routes/orders.js · find/check</text>
    <path d="M565 578 H600" class="flow"/>

    <circle cx="620" cy="574" r="14" class="step"/><text x="620" y="574" class="stepnum">3</text>
    <rect x="643" y="550" width="208" height="55" rx="7" class="box"/>
    <text x="657" y="573" font-weight="700">Compute totals</text><text x="657" y="592" class="small">pricing.js + coupons.js + tax.js</text>
    <path d="M851 578 H886" class="flow"/>

    <circle cx="906" cy="574" r="14" class="step"/><text x="906" y="574" class="stepnum">4</text>
    <rect x="929" y="550" width="207" height="55" rx="7" class="box"/>
    <text x="943" y="573" font-weight="700">Khata, if selected</text><text x="943" y="592" class="small">ledger.chargeOrderToKhata()</text>

    <path d="M1032 605 V643 H1008" class="flow"/>
    <circle cx="986" cy="643" r="14" class="step"/><text x="986" y="643" class="stepnum">5</text>
    <rect x="765" y="619" width="198" height="55" rx="7" class="box"/>
    <text x="779" y="642" font-weight="700">Reserve stock</text><text x="779" y="661" class="small">inventory.reserve()</text>
    <path d="M765 647 H728" class="flow"/>

    <circle cx="708" cy="647" r="14" class="step"/><text x="708" y="647" class="stepnum">6</text>
    <rect x="492" y="619" width="198" height="55" rx="7" class="box"/>
    <text x="506" y="642" font-weight="700">Create order + audit</text><text x="506" y="661" class="small">orders.add() · appendAudit()</text>
    <path d="M492 647 H455" class="flow"/>

    <circle cx="435" cy="647" r="14" class="step"/><text x="435" y="647" class="stepnum">7</text>
    <rect x="177" y="619" width="242" height="55" rx="7" class="data"/>
    <text x="191" y="642" font-weight="700">Persist database</text><text x="191" y="661" class="small">store.write() → data/db.json</text>
  </g>

  <!-- Legend -->
  <rect x="32" y="711" width="22" height="16" rx="3" class="focus"/>
  <text x="62" y="724" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="278" y="711" width="22" height="16" rx="3" class="box"/>
  <text x="308" y="724" class="small">Application module</text>
  <rect x="475" y="711" width="22" height="16" rx="3" class="data"/>
  <text x="505" y="724" class="small">Persistent data</text>
  <path d="M650 719 H700" class="flow"/><text x="710" y="724" class="small">Request / call flow</text>
  <path d="M867 719 H917" class="link"/><text x="927" y="724" class="small">Other dependency</text>
  <text x="32" y="772" class="tiny">Only lib/invoice.js is ticket-highlighted; tax.js is shown as checkout pricing logic.</text>
</svg>
