<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger server, browser, routers, libraries, configuration and JSON storage, with numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#60758a"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#087e8b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a;font-size:14px}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#526779}
      .section{font-size:15px;font-weight:700;fill:#385267}
      .box{fill:#fff;stroke:#a8b8c5;stroke-width:1.4}.group{fill:#f4f7fa;stroke:#c5d1db;stroke-width:1.2}
      .ticket{fill:#fff2d8;stroke:#d68b16;stroke-width:2.2}.small{font-size:12px;fill:#526779}
      .flow{fill:none;stroke:#087e8b;stroke-width:2.6;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#8194a4;stroke-width:1.5;marker-end:url(#arrow)}
      .num{fill:#087e8b;stroke:#fff;stroke-width:2}.numtext{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
      .filename{font-size:15px;font-weight:700}.detail{font-size:12px;fill:#526779}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="42" class="title">ShopLedger | application architecture</text>
  <text x="32" y="67" class="subtitle">Express POS, Khata ledger and GST invoicing · numbered teal path shows order placement</text>

  <!-- Browser and server entry points -->
  <rect x="30" y="100" width="205" height="118" rx="10" class="box"/>
  <text x="48" y="127" class="filename">Browser UI · public/</text>
  <text x="48" y="151" class="detail">index.html · js/app.js</text>
  <text x="48" y="172" class="detail">css/style.css</text>
  <text x="48" y="198" class="small">POST /api/orders</text>

  <rect x="285" y="100" width="200" height="118" rx="10" class="box"/>
  <text x="303" y="127" class="filename">server.js</text>
  <text x="303" y="151" class="detail">Express app, JSON body parser</text>
  <text x="303" y="172" class="detail">serves public/ and mounts routers</text>
  <text x="303" y="198" class="small">GET /orders/:id/invoice</text>
  <path d="M235 158 H285" class="flow"/>

  <!-- Routers -->
  <rect x="535" y="92" width="350" height="250" rx="12" class="group"/>
  <text x="555" y="119" class="section">routes/ · mounted at /api</text>
  <rect x="555" y="134" width="145" height="72" rx="8" class="box"/>
  <text x="569" y="158" class="filename">orders.js</text>
  <text x="569" y="181" class="detail">POST /orders</text>
  <rect x="720" y="134" width="145" height="72" rx="8" class="box"/>
  <text x="734" y="158" class="filename">products.js</text>
  <text x="734" y="181" class="detail">products, coupons</text>
  <rect x="555" y="224" width="145" height="72" rx="8" class="box"/>
  <text x="569" y="248" class="filename">customers.js</text>
  <text x="569" y="271" class="detail">settlements</text>
  <rect x="720" y="224" width="145" height="72" rx="8" class="box"/>
  <text x="734" y="248" class="filename">reports.js</text>
  <text x="734" y="271" class="detail">preview, dashboard</text>
  <path d="M485 158 H535" class="flow"/>

  <!-- Config and persistence -->
  <rect x="950" y="100" width="220" height="95" rx="10" class="box"/>
  <text x="970" y="128" class="filename">config.js</text>
  <text x="970" y="152" class="detail">shop settings, HSN slabs,</text>
  <text x="970" y="171" class="detail">default GST, coupon rules</text>
  <rect x="950" y="235" width="220" height="100" rx="10" class="box"/>
  <text x="970" y="264" class="filename">data/db.json</text>
  <text x="970" y="288" class="detail">products · orders · customers</text>
  <text x="970" y="309" class="detail">settlements · auditLog · IDs</text>
  <path d="M885 267 H950" class="link"/>

  <!-- Libraries -->
  <rect x="285" y="382" width="600" height="350" rx="12" class="group"/>
  <text x="305" y="410" class="section">lib/ · business logic and data access</text>
  <rect x="305" y="430" width="175" height="80" rx="8" class="ticket"/>
  <text x="321" y="456" class="filename">invoice.js</text>
  <text x="321" y="479" class="detail">computeInvoiceFigures()</text>
  <text x="321" y="497" class="detail">render()</text>

  <rect x="500" y="430" width="165" height="80" rx="8" class="box"/>
  <text x="516" y="456" class="filename">pricing.js</text>
  <text x="516" y="479" class="detail">subtotal() · computeTotals()</text>
  <text x="516" y="497" class="detail">order checkout totals</text>

  <rect x="685" y="430" width="175" height="80" rx="8" class="box"/>
  <text x="701" y="456" class="filename">tax.js</text>
  <text x="701" y="479" class="detail">getRateForItem()</text>
  <text x="701" y="497" class="detail">splitCgstSgst()</text>

  <rect x="305" y="530" width="175" height="72" rx="8" class="box"/>
  <text x="321" y="555" class="filename">coupons.js</text>
  <text x="321" y="578" class="detail">validate() · calculateDiscount()</text>
  <rect x="500" y="530" width="165" height="72" rx="8" class="box"/>
  <text x="516" y="555" class="filename">inventory.js</text>
  <text x="516" y="578" class="detail">find() · check() · reserve()</text>
  <rect x="685" y="530" width="175" height="72" rx="8" class="box"/>
  <text x="701" y="555" class="filename">orders.js</text>
  <text x="701" y="578" class="detail">add() · get() · cancel()</text>

  <rect x="305" y="622" width="175" height="72" rx="8" class="box"/>
  <text x="321" y="647" class="filename">ledger.js</text>
  <text x="321" y="670" class="detail">findCustomer() · chargeOrderToKhata()</text>
  <rect x="500" y="622" width="165" height="72" rx="8" class="box"/>
  <text x="516" y="647" class="filename">store.js</text>
  <text x="516" y="670" class="detail">read() · write() · appendAudit()</text>
  <rect x="685" y="622" width="175" height="72" rx="8" class="box"/>
  <text x="701" y="647" class="filename">reports.js</text>
  <text x="701" y="670" class="detail">dashboard · GST reconciliation</text>
  <text x="500" y="715" class="detail">Also: dates.js · date helpers</text>

  <!-- Connections: route dependencies, storage/config and invoice endpoint -->
  <path d="M625 342 V365 H435 V430" class="flow"/>
  <path d="M635 342 V430" class="link"/>
  <path d="M645 342 V375 H772 V430" class="link"/>
  <path d="M680 342 V380 H392 V530" class="link"/>
  <path d="M710 342 V390 H582 V530" class="link"/>
  <path d="M740 342 V400 H772 V530" class="link"/>
  <path d="M770 342 V608 H392 V622" class="link"/>
  <path d="M800 342 V612 H582 V622" class="link"/>
  <path d="M830 342 V616 H772 V622" class="link"/>
  <path d="M885 160 H920 V147 H950" class="link"/>
  <path d="M665 582 H900 V285 H950" class="link"/>
  <path d="M665 658 H920 V315 H950" class="link"/>
  <path d="M485 159 H510 V470 H480" class="link"/>
  <text x="492" y="456" class="small">invoice endpoint</text>
  <path d="M665 470 H685" class="link"/>
  <text x="667" y="457" class="small">checkout uses tax.js</text>
  <path d="M950 177 H910 V430 H860" class="link"/>
  <path d="M950 185 H920 V545 H860" class="link"/>

  <!-- Numbered order flow callouts -->
  <circle cx="249" cy="158" r="13" class="num"/><text x="249" y="163" class="numtext">1</text>
  <circle cx="516" cy="158" r="13" class="num"/><text x="516" y="163" class="numtext">2</text>
  <circle cx="490" cy="468" r="13" class="num"/><text x="490" y="473" class="numtext">3</text>
  <circle cx="490" cy="568" r="13" class="num"/><text x="490" y="573" class="numtext">4</text>
  <circle cx="675" cy="568" r="13" class="num"/><text x="675" y="573" class="numtext">5</text>
  <circle cx="675" cy="660" r="13" class="num"/><text x="675" y="665" class="numtext">6</text>
  <circle cx="930" cy="285" r="13" class="num"/><text x="930" y="290" class="numtext">7</text>

  <!-- Legend and flow explanation -->
  <rect x="910" y="405" width="260" height="285" rx="12" class="box"/>
  <text x="932" y="435" class="section">Order placement flow</text>
  <text x="932" y="467"><tspan font-weight="700">1</tspan><tspan dx="10">Browser POST /api/orders</tspan></text>
  <text x="932" y="496"><tspan font-weight="700">2</tspan><tspan dx="10">server.js routes request</tspan></text>
  <text x="932" y="525"><tspan font-weight="700">3</tspan><tspan dx="10">orders.js → pricing.js</tspan></text>
  <text x="932" y="554"><tspan font-weight="700">4</tspan><tspan dx="10">coupons.js validates discount</tspan></text>
  <text x="932" y="583"><tspan font-weight="700">5</tspan><tspan dx="10">inventory.js + orders.js update</tspan></text>
  <text x="954" y="603" class="detail">and ledger.js for Khata orders</text>
  <text x="932" y="632"><tspan font-weight="700">6</tspan><tspan dx="10">store.js writes database + audit</tspan></text>
  <text x="932" y="661"><tspan font-weight="700">7</tspan><tspan dx="10">data/db.json persists changes</tspan></text>
  <rect x="910" y="710" width="18" height="18" rx="3" class="ticket"/>
  <text x="937" y="724" class="small">Ticket focus · invoice.js</text>
  <rect x="1060" y="710" width="18" height="18" rx="3" class="box"/>
  <text x="1085" y="724" class="small">Other module</text>
</svg>
