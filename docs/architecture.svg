<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Browser UI, Express server, four API routers, ten library modules, configuration and JSON data store. Numbered arrows show the path for placing an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13px; fill: #526176; }
      .zone { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .zoneLabel { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 1px; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
      .router { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.25; }
      .module { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.1; }
      .ticket { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .data { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.25; }
      .nodeTitle { font-size: 14px; font-weight: 700; }
      .nodeText { font-size: 12px; fill: #526176; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 1.35; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.25; marker-end: url(#flowArrow); }
      .flowLabel { font-size: 12px; font-weight: 700; fill: #1d4ed8; }
      .legend { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger — Application Architecture</text>
  <text x="32" y="60" class="sub">Express application with a file-backed JSON store · numbered blue arrows trace placing an order</text>

  <!-- Browser and server -->
  <rect x="32" y="92" width="190" height="188" rx="10" class="zone"/>
  <text x="48" y="118" class="zoneLabel">BROWSER UI</text>
  <rect x="48" y="136" width="158" height="122" rx="7" class="node"/>
  <text x="62" y="160" class="nodeTitle">public/</text>
  <text x="62" y="181" class="nodeText">index.html</text>
  <text x="62" y="199" class="nodeText">js/app.js</text>
  <text x="62" y="217" class="nodeText">css/style.css</text>
  <text x="62" y="241" class="nodeText">Served as static files</text>

  <rect x="264" y="92" width="204" height="188" rx="10" class="zone"/>
  <text x="280" y="118" class="zoneLabel">APPLICATION</text>
  <rect x="280" y="136" width="172" height="122" rx="7" class="node"/>
  <text x="294" y="160" class="nodeTitle">server.js</text>
  <text x="294" y="181" class="nodeText">Express + bodyParser</text>
  <text x="294" y="199" class="nodeText">static public/</text>
  <text x="294" y="217" class="nodeText">mounts /api routers</text>
  <text x="294" y="241" class="nodeText">GET /orders/:id/invoice</text>

  <!-- Routers -->
  <rect x="510" y="92" width="318" height="188" rx="10" class="zone"/>
  <text x="526" y="118" class="zoneLabel">ROUTES/ (MOUNTED AT /API)</text>
  <rect x="526" y="136" width="134" height="51" rx="6" class="router"/>
  <text x="538" y="157" class="nodeTitle">products.js</text><text x="538" y="176" class="nodeText">GET /products, /coupons</text>
  <rect x="676" y="136" width="136" height="51" rx="6" class="router"/>
  <text x="688" y="157" class="nodeTitle">orders.js</text><text x="688" y="176" class="nodeText">POST /orders</text>
  <rect x="526" y="201" width="134" height="51" rx="6" class="router"/>
  <text x="538" y="222" class="nodeTitle">customers.js</text><text x="538" y="241" class="nodeText">GET /customers</text>
  <rect x="676" y="201" width="136" height="51" rx="6" class="router"/>
  <text x="688" y="222" class="nodeTitle">reports.js</text><text x="688" y="241" class="nodeText">reports, pricing preview</text>

  <!-- Config and persistence -->
  <rect x="870" y="92" width="298" height="188" rx="10" class="zone"/>
  <text x="886" y="118" class="zoneLabel">SETTINGS &amp; PERSISTENCE</text>
  <rect x="886" y="136" width="126" height="116" rx="7" class="node"/>
  <text x="900" y="160" class="nodeTitle">config.js</text>
  <text x="900" y="181" class="nodeText">shop, tax</text>
  <text x="900" y="199" class="nodeText">inventory, coupons</text>
  <rect x="1026" y="136" width="126" height="116" rx="7" class="data"/>
  <text x="1040" y="160" class="nodeTitle">data/db.json</text>
  <text x="1040" y="181" class="nodeText">products, customers</text>
  <text x="1040" y="199" class="nodeText">orders, settlements</text>
  <text x="1040" y="217" class="nodeText">auditLog</text>

  <!-- Libraries -->
  <rect x="32" y="322" width="1136" height="354" rx="10" class="zone"/>
  <text x="48" y="349" class="zoneLabel">LIB/ — DOMAIN AND SUPPORT MODULES</text>
  <rect x="48" y="370" width="194" height="76" rx="7" class="module"/>
  <text x="60" y="393" class="nodeTitle">store.js</text><text x="60" y="413" class="nodeText">read(), write()</text><text x="60" y="431" class="nodeText">appendAudit()</text>
  <rect x="260" y="370" width="194" height="76" rx="7" class="module"/>
  <text x="272" y="393" class="nodeTitle">inventory.js</text><text x="272" y="413" class="nodeText">find(), check()</text><text x="272" y="431" class="nodeText">reserve(), release()</text>
  <rect x="472" y="370" width="194" height="76" rx="7" class="module"/>
  <text x="484" y="393" class="nodeTitle">pricing.js</text><text x="484" y="413" class="nodeText">subtotal(), discount()</text><text x="484" y="431" class="nodeText">computeTotals()</text>
  <rect x="684" y="370" width="194" height="76" rx="7" class="module"/>
  <text x="696" y="393" class="nodeTitle">coupons.js</text><text x="696" y="413" class="nodeText">normalizeCode()</text><text x="696" y="431" class="nodeText">validate(), calculateDiscount()</text>
  <rect x="896" y="370" width="256" height="76" rx="7" class="module"/>
  <text x="908" y="393" class="nodeTitle">orders.js</text><text x="908" y="413" class="nodeText">add(), get(), cancel()</text><text x="908" y="431" class="nodeText">list()</text>

  <rect x="48" y="466" width="194" height="76" rx="7" class="module"/>
  <text x="60" y="489" class="nodeTitle">ledger.js</text><text x="60" y="509" class="nodeText">findCustomer()</text><text x="60" y="527" class="nodeText">chargeOrderToKhata()</text>
  <rect x="260" y="466" width="194" height="76" rx="7" class="module"/>
  <text x="272" y="489" class="nodeTitle">dates.js</text><text x="272" y="509" class="nodeText">today(), normalizeDateKey()</text><text x="272" y="527" class="nodeText">getFiscalYear()</text>
  <rect x="472" y="466" width="194" height="76" rx="7" class="module"/>
  <text x="484" y="489" class="nodeTitle">tax.js</text><text x="484" y="509" class="nodeText">getRateForItem()</text><text x="484" y="527" class="nodeText">splitCgstSgst()</text>
  <rect x="684" y="466" width="194" height="76" rx="7" class="ticket"/>
  <text x="696" y="489" class="nodeTitle">invoice.js</text><text x="696" y="509" class="nodeText">computeInvoiceFigures()</text><text x="696" y="527" class="nodeText">render()</text>
  <rect x="896" y="466" width="256" height="76" rx="7" class="module"/>
  <text x="908" y="489" class="nodeTitle">reports.js</text><text x="908" y="509" class="nodeText">getDashboardSummary()</text><text x="908" y="527" class="nodeText">getGstReconciliation()</text>

  <!-- Key component relationships -->
  <path d="M222 128 L280 128" class="edge"/>
  <path d="M452 128 L510 128" class="edge"/>

  <!-- Dedicated placing-order flow -->
  <rect x="20" y="696" width="1150" height="88" rx="10" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="34" y="718" class="nodeTitle">Placing an order — numbered flow</text>
  <rect x="670" y="704" width="16" height="16" rx="3" class="router"/><text x="693" y="717" class="legend">router</text>
  <rect x="760" y="704" width="16" height="16" rx="3" class="data"/><text x="783" y="717" class="legend">JSON data</text>
  <rect x="865" y="704" width="16" height="16" rx="3" class="ticket"/><text x="888" y="717" class="legend">ticket module</text>
  <rect x="28" y="730" width="142" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="40" y="748" class="flowLabel">1  public/js/app.js</text><text x="40" y="764" class="nodeText">POST /api/orders</text>
  <rect x="184" y="730" width="142" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="196" y="748" class="flowLabel">2  server.js</text><text x="196" y="764" class="nodeText">mounts /api</text>
  <rect x="340" y="730" width="142" height="42" rx="6" class="router"/>
  <text x="352" y="748" class="flowLabel">3  routes/orders.js</text><text x="352" y="764" class="nodeText">POST /orders</text>
  <rect x="496" y="730" width="142" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="508" y="748" class="flowLabel">4  inventory.js</text><text x="508" y="764" class="nodeText">find(), check()</text>
  <rect x="652" y="730" width="142" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="664" y="748" class="flowLabel">5  pricing.js</text><text x="664" y="764" class="nodeText">computeTotals()</text>
  <rect x="808" y="730" width="142" height="42" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="820" y="748" class="flowLabel">6  orders.add()</text><text x="820" y="764" class="nodeText">inventory.reserve()</text>
  <rect x="964" y="730" width="190" height="42" rx="6" class="data"/>
  <text x="976" y="748" class="flowLabel">7  store.js → data/db.json</text><text x="976" y="764" class="nodeText">appendAudit(), write()</text>
  <path d="M170 751 L184 751 M326 751 L340 751 M482 751 L496 751 M638 751 L652 751 M794 751 L808 751 M950 751 L964 751" class="flow"/>
</svg>
