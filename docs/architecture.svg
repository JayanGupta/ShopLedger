<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, library modules, configuration and JSON data store, with a numbered order placement path.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#526078}
      .group{font-size:15px;font-weight:700;letter-spacing:.5px;fill:#334155}
      .head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#526078}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.panel{fill:#f8fafc;stroke:#d7dee8;stroke-width:1.5}
      .route{fill:#fff;stroke:#94a3b8;stroke-width:1.3}.module{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .ticket{fill:#fff4db;stroke:#d97706;stroke-width:2}.ticketText{fill:#8a4b08}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .badge{fill:#2563eb;stroke:#fff;stroke-width:2}.badgeText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="28" y="38" class="title">ShopLedger | application architecture</text>
  <text x="28" y="62" class="subtitle">Express POS · Khata ledger · GST checkout and invoice · arrows show code connections</text>

  <!-- Connectors are behind the component cards. -->
  <path class="flow" d="M230 157 H280"/>
  <path class="flow" d="M500 157 H520 V318 H535"/>
  <path class="edge" d="M800 160 H835"/>
  <path class="edge" d="M800 375 H835"/>
  <path class="edge" d="M390 220 V293"/>
  <path class="edge" d="M390 392 V450"/>
  <path class="edge" d="M500 340 H830 V490 H850"/>
  <path class="edge" d="M500 505 H830 V490 H850"/>
  <path class="edge" d="M680 560 V630 H940 V615"/>
  <path class="edge" d="M790 560 V640 H1100 V615"/>
  <path class="edge" d="M1065 115 V82 H500 V120"/>
  <path class="flow" d="M230 195 V698 H1080 V610"/>

  <!-- Browser surface -->
  <rect x="25" y="85" width="205" height="170" rx="12" class="box"/>
  <text x="42" y="112" class="head">Browser UI</text>
  <text x="42" y="136" class="body">public/</text>
  <text x="42" y="158" class="small">index.html · css/style.css</text>
  <text x="42" y="178" class="small">js/app.js</text>
  <text x="42" y="210" class="small">Cart preview · orders · Khata</text>
  <text x="42" y="230" class="small">reports · printable invoice link</text>

  <!-- Server -->
  <rect x="280" y="85" width="220" height="135" rx="12" class="box"/>
  <text x="300" y="114" class="head">server.js</text>
  <text x="300" y="139" class="small">Express app · JSON body parser</text>
  <text x="300" y="159" class="small">serves public/ and mounts /api</text>
  <text x="300" y="184" class="small">GET /orders/:id/invoice</text>
  <text x="300" y="203" class="small">invoice.render(order)</text>

  <!-- Routers -->
  <rect x="535" y="85" width="265" height="465" rx="12" class="panel"/>
  <text x="555" y="112" class="group">ROUTES/ · mounted at /api</text>
  <rect x="555" y="130" width="225" height="82" rx="8" class="route"/>
  <text x="570" y="155" class="head">products.js</text>
  <text x="570" y="178" class="small">GET /products · GET /coupons</text>
  <text x="570" y="198" class="small">catalog and active promos</text>
  <rect x="555" y="225" width="225" height="105" rx="8" class="route"/>
  <text x="570" y="250" class="head">orders.js</text>
  <text x="570" y="273" class="small">POST /orders · GET /orders</text>
  <text x="570" y="293" class="small">GET /orders/:id · cancel</text>
  <text x="570" y="315" class="small">checkout orchestrator</text>
  <rect x="555" y="343" width="225" height="82" rx="8" class="route"/>
  <text x="570" y="368" class="head">customers.js</text>
  <text x="570" y="391" class="small">GET /customers · settle Khata</text>
  <text x="570" y="411" class="small">ledger account actions</text>
  <rect x="555" y="438" width="225" height="95" rx="8" class="route"/>
  <text x="570" y="463" class="head">reports.js</text>
  <text x="570" y="486" class="small">dashboard · GST reconciliation</text>
  <text x="570" y="506" class="small">pricing preview · admin export</text>
  <text x="570" y="525" class="small">(reset route is not present)</text>

  <!-- Library modules -->
  <rect x="835" y="85" width="340" height="530" rx="12" class="panel"/>
  <text x="855" y="112" class="group">LIB/ · business modules</text>
  <rect x="855" y="130" width="145" height="72" rx="8" class="module"/>
  <text x="868" y="155" class="head">pricing.js</text><text x="868" y="179" class="small">subtotal · totals</text>
  <rect x="1010" y="130" width="145" height="72" rx="8" class="ticket"/>
  <text x="1023" y="155" class="head ticketText">tax.js</text><text x="1023" y="179" class="small ticketText">HSN slabs · split</text>
  <rect x="855" y="215" width="145" height="72" rx="8" class="module"/>
  <text x="868" y="240" class="head">coupons.js</text><text x="868" y="264" class="small">validate · discount</text>
  <rect x="1010" y="215" width="145" height="72" rx="8" class="module"/>
  <text x="1023" y="240" class="head">orders.js</text><text x="1023" y="264" class="small">add · get · cancel</text>
  <rect x="855" y="300" width="145" height="72" rx="8" class="module"/>
  <text x="868" y="325" class="head">inventory.js</text><text x="868" y="349" class="small">check · reserve</text>
  <rect x="1010" y="300" width="145" height="72" rx="8" class="module"/>
  <text x="1023" y="325" class="head">ledger.js</text><text x="1023" y="349" class="small">Khata · settlement</text>
  <rect x="855" y="385" width="145" height="72" rx="8" class="module"/>
  <text x="868" y="410" class="head">store.js</text><text x="868" y="434" class="small">read · write · audit</text>
  <rect x="1010" y="385" width="145" height="72" rx="8" class="module"/>
  <text x="1023" y="410" class="head">reports.js</text><text x="1023" y="434" class="small">summary · reconcile</text>
  <rect x="855" y="470" width="145" height="72" rx="8" class="module"/>
  <text x="868" y="495" class="head">dates.js</text><text x="868" y="519" class="small">today · date keys</text>
  <rect x="1010" y="470" width="145" height="72" rx="8" class="ticket"/>
  <text x="1023" y="495" class="head ticketText">invoice.js</text><text x="1023" y="519" class="small ticketText">figures · HTML render</text>
  <text x="855" y="575" class="small">tax.js supports checkout GST; invoice.js recomputes invoice figures.</text>

  <!-- Persistence and configuration -->
  <rect x="280" y="293" width="220" height="99" rx="12" class="box"/>
  <text x="300" y="322" class="head">config.js</text>
  <text x="300" y="346" class="small">shop · GST/HSN rates</text>
  <text x="300" y="367" class="small">coupons · inventory defaults</text>
  <rect x="280" y="450" width="220" height="110" rx="12" class="box"/>
  <text x="300" y="480" class="head">data/db.json</text>
  <text x="300" y="505" class="small">products · orders · customers</text>
  <text x="300" y="526" class="small">settlements · audit log</text>
  <text x="300" y="546" class="small">lib/store.js persists this file</text>

  <!-- Legend and numbered order sequence -->
  <rect x="25" y="625" width="1150" height="145" rx="12" class="box"/>
  <text x="45" y="653" class="group">ORDER PLACEMENT · POST /api/orders</text>
  <circle cx="54" cy="683" r="12" class="badge"/><text x="54" y="683" class="badgeText">1</text>
  <text x="74" y="688" class="body">public UI sends cart</text>
  <circle cx="255" cy="683" r="12" class="badge"/><text x="255" y="683" class="badgeText">2</text>
  <text x="275" y="688" class="body">server.js routes request</text>
  <circle cx="493" cy="683" r="12" class="badge"/><text x="493" y="683" class="badgeText">3</text>
  <text x="513" y="688" class="body">routes/orders.js validates and prices</text>
  <circle cx="825" cy="683" r="12" class="badge"/><text x="825" y="683" class="badgeText">4</text>
  <text x="845" y="688" class="body">inventory + Khata updated in memory</text>
  <circle cx="54" cy="722" r="12" class="badge"/><text x="54" y="722" class="badgeText">5</text>
  <text x="74" y="727" class="body">orders.add() records order; store.write() saves db.json</text>
  <circle cx="493" cy="722" r="12" class="badge"/><text x="493" y="722" class="badgeText">6</text>
  <text x="513" y="727" class="body">server returns order to browser</text>
  <rect x="835" y="710" width="18" height="18" rx="3" class="ticket"/>
  <text x="863" y="725" class="body">Ticket focus: invoice.js and supporting tax.js</text>
  <text x="45" y="754" class="small">Invoice view: browser → server.js GET /orders/:id/invoice → orders.get() → invoice.render() → HTML response</text>
</svg>
