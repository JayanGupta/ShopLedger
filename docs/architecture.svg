<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser, Express server, routers, library modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1769aa"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172334}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#526174}
      .head{font-size:15px;font-weight:700}.node{font-size:13px;font-weight:600}.small{font-size:12px;fill:#526174}
      .box{fill:#fff;stroke:#aebbc9;stroke-width:1.4}.group{fill:#f5f8fb;stroke:#c8d2dd;stroke-width:1.2}
      .accent{fill:#fff0d9;stroke:#c77912;stroke-width:2}.accentText{fill:#713e00}
      .flow{fill:none;stroke:#1769aa;stroke-width:2;marker-end:url(#flowArrow)}
      .dep{fill:none;stroke:#758496;stroke-width:1.35;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}.step{fill:#1769aa;stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="40" class="title">ShopLedger | application architecture</text>
  <text x="29" y="63" class="subtitle">Express POS, order ledger, inventory, Khata accounts and printable GST invoice</text>

  <!-- Browser and server -->
  <rect x="25" y="96" width="230" height="106" rx="10" class="box"/>
  <text x="42" y="121" class="head">Browser UI</text>
  <text x="42" y="145" class="node">public/</text>
  <text x="42" y="166" class="small">index.html · js/app.js · css/</text>
  <text x="42" y="185" class="small">Cart, orders, Khata, audit views</text>

  <rect x="298" y="96" width="288" height="106" rx="10" class="box"/>
  <text x="316" y="121" class="head">Express application · server.js</text>
  <text x="316" y="145" class="small">Static UI + JSON body parser</text>
  <text x="316" y="166" class="small">Mounts routers at /api</text>
  <text x="316" y="185" class="small">GET /orders/:id/invoice → invoice.render()</text>

  <path d="M255 147 H298" class="dep"/>
  <text x="258" y="136" class="small">HTTP</text>

  <!-- Routers -->
  <rect x="25" y="235" width="561" height="178" rx="10" class="group"/>
  <text x="43" y="260" class="head">Route modules · mounted by server.js</text>
  <rect x="43" y="278" width="250" height="50" rx="7" class="box"/>
  <text x="57" y="300" class="node">routes/products.js</text><text x="57" y="318" class="small">GET /products · GET /coupons</text>
  <rect x="312" y="278" width="256" height="50" rx="7" class="box"/>
  <text x="326" y="300" class="node">routes/orders.js</text><text x="326" y="318" class="small">POST /orders · order list/get/cancel</text>
  <rect x="43" y="345" width="250" height="50" rx="7" class="box"/>
  <text x="57" y="367" class="node">routes/customers.js</text><text x="57" y="385" class="small">GET customers · POST settlement</text>
  <rect x="312" y="345" width="256" height="50" rx="7" class="box"/>
  <text x="326" y="367" class="node">routes/reports.js</text><text x="326" y="385" class="small">dashboard · preview · GST recon · export</text>
  <path d="M442 202 V221 H305 V235" class="dep"/>

  <!-- Libraries -->
  <rect x="615" y="96" width="558" height="517" rx="10" class="group"/>
  <text x="635" y="122" class="head">Business logic · lib/</text>
  <rect x="638" y="145" width="240" height="59" rx="7" class="box"/>
  <text x="653" y="169" class="node">lib/orders.js</text><text x="653" y="190" class="small">add · get · list · cancel</text>
  <rect x="910" y="145" width="238" height="59" rx="7" class="box"/>
  <text x="925" y="169" class="node">lib/inventory.js</text><text x="925" y="190" class="small">find · check · reserve · release</text>

  <rect x="638" y="224" width="240" height="68" rx="7" class="box"/>
  <text x="653" y="248" class="node">lib/pricing.js</text><text x="653" y="270" class="small">subtotal · discount · computeTotals</text>
  <rect x="910" y="224" width="238" height="68" rx="7" class="accent"/>
  <text x="925" y="248" class="node accentText">lib/tax.js · ticket focus</text><text x="925" y="270" class="small accentText">HSN rate · CGST/SGST split</text>

  <rect x="638" y="312" width="240" height="59" rx="7" class="box"/>
  <text x="653" y="336" class="node">lib/coupons.js</text><text x="653" y="357" class="small">normalize · validate · calculate</text>
  <rect x="910" y="312" width="238" height="59" rx="7" class="box"/>
  <text x="925" y="336" class="node">lib/ledger.js</text><text x="925" y="357" class="small">Khata charge · settlement · reversal</text>

  <rect x="638" y="391" width="240" height="59" rx="7" class="box"/>
  <text x="653" y="415" class="node">lib/store.js</text><text x="653" y="436" class="small">read · write · appendAudit</text>
  <rect x="910" y="391" width="238" height="59" rx="7" class="box"/>
  <text x="925" y="415" class="node">lib/reports.js</text><text x="925" y="436" class="small">dashboard · GST reconciliation</text>

  <rect x="638" y="470" width="240" height="66" rx="7" class="accent"/>
  <text x="653" y="495" class="node accentText">lib/invoice.js · ticket focus</text><text x="653" y="517" class="small accentText">computeInvoiceFigures · render</text>
  <rect x="910" y="470" width="238" height="66" rx="7" class="box"/>
  <text x="925" y="495" class="node">lib/dates.js</text><text x="925" y="517" class="small">today · date normalization · FY</text>

  <!-- Config and data -->
  <rect x="25" y="448" width="255" height="75" rx="9" class="box"/>
  <text x="43" y="475" class="head">config.js</text>
  <text x="43" y="498" class="small">shop · tax slabs · coupons · defaults</text>
  <rect x="315" y="448" width="271" height="75" rx="9" class="box"/>
  <text x="333" y="475" class="head">data/db.json</text>
  <text x="333" y="498" class="small">products · orders · customers · audit</text>
  <path d="M638 419 H600 V486 H586" class="dep"/>
  <text x="590" y="478" class="small">read/write</text>
  <path d="M780 391 V371" class="dep dash"/>
  <path d="M1030 224 V204" class="dep dash"/>
  <path d="M790 292 V312" class="dep dash"/>
  <path d="M910 501 H879" class="dep dash"/>
  <path d="M910 501 H891 V292 H910" class="dep dash"/>
  <path d="M1028 371 V391" class="dep dash"/>

  <!-- Numbered order flow -->
  <rect x="25" y="550" width="561" height="201" rx="10" class="group"/>
  <text x="43" y="576" class="head">Order placement · numbered request path</text>
  <circle cx="54" cy="610" r="12" class="step"/><text x="50" y="615" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="74" y="615" class="node">public/js/app.js → POST /api/orders</text>
  <circle cx="54" cy="641" r="12" class="step"/><text x="50" y="646" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="74" y="646" class="node">routes/orders.js resolves products + checks stock/coupon</text>
  <circle cx="54" cy="672" r="12" class="step"/><text x="50" y="677" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="74" y="677" class="node">pricing.computeTotals → coupons + tax slab calculations</text>
  <circle cx="54" cy="703" r="12" class="step"/><text x="50" y="708" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="74" y="708" class="node">Khata charge if selected; inventory.reserve; orders.add</text>
  <circle cx="54" cy="734" r="12" class="step"/><text x="50" y="739" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="74" y="739" class="node">store.appendAudit + store.write → data/db.json → response</text>

  <!-- Explicit highlighted print and reconciliation paths -->
  <path d="M586 147 H600 V503 H638" class="flow dash"/>
  <text x="594" y="307" class="small" transform="rotate(90 594 307)">invoice request</text>
  <path d="M878 501 H900 V423 H910" class="dep dash"/>

  <!-- legend -->
  <rect x="615" y="638" width="558" height="113" rx="10" class="group"/>
  <text x="635" y="665" class="head">Legend</text>
  <line x1="638" y1="691" x2="690" y2="691" class="flow"/><text x="702" y="696" class="small">Numbered checkout flow / request</text>
  <line x1="638" y1="720" x2="690" y2="720" class="dep"/><text x="702" y="725" class="small">Module dependency or data access</text>
  <rect x="938" y="681" width="20" height="20" rx="4" class="accent"/><text x="969" y="696" class="small">Ticket focus modules (invoice.js, tax.js)</text>
  <text x="938" y="727" class="small">Solid boxes = verified project files</text>
</svg>
