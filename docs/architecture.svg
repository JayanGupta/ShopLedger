<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map of ShopLedger's browser, Express server, routers, libraries, configuration, JSON database, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:14px}
      .title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#475569}
      .head{font-size:16px;font-weight:700}.small{font-size:12px}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:9}
      .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:12}.hl{fill:#fff4df;stroke:#d97706;stroke-width:2}
      .line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#flowArrow)}
      .dash{stroke-dasharray:5 5}.num{fill:#2563eb;stroke:#fff;stroke-width:2}
      .numtxt{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger | application architecture</text>
  <text x="32" y="62" class="sub">Order placement flow is numbered in blue; arrows show major calls and data access.</text>

  <!-- Browser and server -->
  <rect x="32" y="100" width="210" height="115" class="box"/>
  <text x="50" y="127" class="head">Browser UI</text>
  <text x="50" y="151">public/</text>
  <text x="50" y="174">index.html · js/app.js</text>
  <text x="50" y="196">css/style.css</text>

  <rect x="290" y="100" width="250" height="115" class="box"/>
  <text x="310" y="127" class="head">server.js · Express app</text>
  <text x="310" y="151">static public/ · JSON parser</text>
  <text x="310" y="174">mounts routers at /api</text>
  <text x="310" y="196">GET /orders/:id/invoice</text>

  <path d="M242 155 H290" class="line"/><text x="245" y="143" class="small">HTTP</text>

  <!-- Routers -->
  <rect x="590" y="88" width="578" height="175" class="group"/>
  <text x="608" y="113" class="head">routes/ (all mounted at /api)</text>
  <rect x="610" y="128" width="260" height="52" class="box"/>
  <text x="625" y="150" font-weight="700">products.js</text><text x="625" y="169">products · coupons</text>
  <rect x="890" y="128" width="258" height="52" class="box"/>
  <text x="905" y="150" font-weight="700">orders.js</text><text x="905" y="169">GET/POST orders · cancel</text>
  <rect x="610" y="194" width="260" height="52" class="box"/>
  <text x="625" y="216" font-weight="700">customers.js</text><text x="625" y="235">customers · settle</text>
  <rect x="890" y="194" width="258" height="52" class="box"/>
  <text x="905" y="216" font-weight="700">reports.js</text><text x="905" y="235">reports · pricing preview · export</text>
  <path d="M540 155 H590" class="line"/>

  <!-- Lib modules -->
  <rect x="32" y="300" width="840" height="325" class="group"/>
  <text x="50" y="328" class="head">lib/ modules</text>
  <rect x="52" y="348" width="190" height="74" class="box"/>
  <text x="68" y="373" font-weight="700">store.js</text><text x="68" y="396">read · write · appendAudit</text>
  <rect x="262" y="348" width="190" height="74" class="box"/>
  <text x="278" y="373" font-weight="700">orders.js</text><text x="278" y="396">add · get · cancel · list</text>
  <rect x="472" y="348" width="180" height="74" class="box"/>
  <text x="488" y="373" font-weight="700">inventory.js</text><text x="488" y="396">find · check · reserve</text>
  <rect x="672" y="348" width="180" height="74" class="box"/>
  <text x="688" y="373" font-weight="700">ledger.js</text><text x="688" y="396">findCustomer · chargeOrderToKhata</text>

  <rect x="52" y="444" width="190" height="74" class="box"/>
  <text x="68" y="469" font-weight="700">pricing.js</text><text x="68" y="492">subtotal · computeTotals</text>
  <rect x="262" y="444" width="190" height="74" class="box"/>
  <text x="278" y="469" font-weight="700">coupons.js</text><text x="278" y="492">validate · calculateDiscount</text>
  <rect x="472" y="444" width="180" height="74" class="box"/>
  <text x="488" y="469" font-weight="700">tax.js</text><text x="488" y="492">getRateForItem · splitCgstSgst</text>
  <rect x="672" y="444" width="180" height="74" class="box"/>
  <text x="688" y="469" font-weight="700">reports.js</text><text x="688" y="492">dashboard · reconciliation</text>

  <rect x="52" y="540" width="190" height="64" class="box"/>
  <text x="68" y="565" font-weight="700">dates.js</text><text x="68" y="587">today · normalizeDateKey</text>
  <rect x="262" y="540" width="390" height="64" class="box hl"/>
  <text x="278" y="565" font-weight="700">invoice.js  [ticket focus]</text><text x="278" y="587">computeInvoiceFigures · render</text>
  <path d="M415 215 V286 H147 V348" class="line"/>
  <path d="M1018 263 V286 H357 V348" class="line"/>
  <path d="M1018 263 V288 H562 V348" class="line"/>
  <path d="M1018 263 V294 H762 V348" class="line"/>
  <path d="M1018 263 V432 H147 V444" class="line"/>
  <path d="M1018 263 V426 H357 V444" class="line"/>
  <path d="M1018 263 V420 H562 V444" class="line"/>
  <path d="M1018 263 V414 H762 V444" class="line"/>
  <path d="M415 215 V532 H147 V540" class="line"/>
  <path d="M415 215 V526 H457 V540" class="line"/>

  <!-- Config and database -->
  <rect x="910" y="320" width="258" height="100" class="box"/>
  <text x="928" y="348" class="head">config.js</text>
  <text x="928" y="372">shop · GST/HSN slabs</text>
  <text x="928" y="394">coupons · inventory defaults</text>
  <rect x="910" y="475" width="258" height="104" class="box"/>
  <text x="928" y="503" class="head">data/db.json</text>
  <text x="928" y="527">products · orders · customers</text>
  <text x="928" y="550">settlements · audit log</text>
  <path d="M852 382 H910" class="line"/>
  <path d="M852 482 H910" class="line"/>
  <path d="M910 390 H888 V480 H910" class="line dash"/>
  <text x="891" y="438" class="small" transform="rotate(-90 891 438)">configuration</text>

  <!-- Invoice flow and file data -->
  <path d="M540 155 V278 H755 V540" class="line dash"/>
  <path d="M755 572 H910" class="line"/>
  <text x="775" y="564" class="small">order read via store</text>

  <!-- Numbered placement path -->
  <rect x="32" y="650" width="1136" height="120" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="12"/>
  <text x="50" y="678" class="head">Order placement · POST /api/orders</text>
  <circle cx="70" cy="718" r="14" class="num"/><text x="70" y="723" class="numtxt">1</text>
  <text x="92" y="723">UI submits items</text>
  <path d="M220 718 H257" class="flow"/>
  <circle cx="280" cy="718" r="14" class="num"/><text x="280" y="723" class="numtxt">2</text>
  <text x="302" y="723">orders route validates</text>
  <path d="M463 718 H500" class="flow"/>
  <circle cx="523" cy="718" r="14" class="num"/><text x="523" y="723" class="numtxt">3</text>
  <text x="545" y="723">stock + price/tax/coupon</text>
  <path d="M721 718 H758" class="flow"/>
  <circle cx="781" cy="718" r="14" class="num"/><text x="781" y="723" class="numtxt">4</text>
  <text x="803" y="723">Khata charge if applicable</text>
  <path d="M996 718 H1020" class="flow"/>
  <circle cx="1043" cy="718" r="14" class="num"/><text x="1043" y="723" class="numtxt">5</text>
  <text x="1065" y="723">write JSON</text>
  <text x="92" y="750" class="small">inventory.check → pricing.computeTotals → inventory.reserve → orders.add → store.appendAudit/write</text>

  <!-- Legend -->
  <rect x="925" y="600" width="243" height="34" fill="#fff" stroke="#cbd5e1" rx="7"/>
  <rect x="939" y="611" width="18" height="13" class="hl"/>
  <text x="964" y="623" class="small">Ticket focus: invoice.js</text>
  <line x1="32" y1="786" x2="72" y2="786" class="flow"/><text x="81" y="791" class="small">numbered order sequence</text>
</svg>
